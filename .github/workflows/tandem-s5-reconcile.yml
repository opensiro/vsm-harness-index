name: Reconcile Tandem S5 cohort

on:
  push:
    branches:
      - experiment/tandem-s5-reconciliation-621

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/tandem-s5-reconciliation-621
          fetch-depth: 0

      - name: Reconcile current canonical S5 cohort
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('experiments/functional-capability-depth')
          matched = root / 's5-system-benchmarks' / 'matched-cell'
          cohort_path = matched / 'full-canonical-cohort-review.json'
          closure_path = matched / 's5-primary-search-closure.json'
          validator_path = matched / 'validate_s5_primary_search_closure.py'

          cohort = json.loads(cohort_path.read_text(encoding='utf-8'))
          assert cohort['counts'] == {
              'canonical_s5_positive_systems': 23,
              'direct_canonical_observations': 1,
              'no_direct_public_result': 22,
              'unresolved': 0,
          }
          assert not any(row.get('canonical_harness_id') == 'tandem' for row in cohort['systems'])
          cohort['reviewed_at'] = '2026-09-27'
          cohort['index_revision_at_review'] = '9c8540f221561178d9c36889776d23f6c31470f4'
          cohort['counts'] = {
              'canonical_s5_positive_systems': 24,
              'direct_canonical_observations': 1,
              'no_direct_public_result': 23,
              'unresolved': 0,
          }
          cohort['systems'].append({
              'canonical_harness_id': 'tandem',
              'repository': 'https://github.com/frumu-ai/tandem',
              'canonical_review_revision': '3ee2d83d76497565680538ef00f1616f55650524',
              'canonical_s5_state': 'C(P)',
              'disposition': 'no-direct-public-result',
              'blocking_gate': 'owner-published-policy-amendment-subsequent-operation-result',
              'finding': 'Tandem publicly establishes owner/admin-governed versioned orchestration and GoalPolicy publication, immutable published versions, and a runtime that consumes published definitions for later long-running goals. The frozen repository does not expose a concrete immutable real-world amendment or ratification event tied to a subsequent operation demonstrably governed by that changed policy; implementation paths and proof/test fixtures are mechanism evidence rather than a direct S5 result.',
              'reopen_when': 'A public immutable Tandem runtime or repository-history record identifies a legitimate owner/admin orchestration or GoalPolicy amendment, the authoritative published version created by that decision, and a subsequent long-running goal or workflow operation explicitly executed under the changed version.',
          })
          cohort['conclusion'] = 'The full current 24-system canonical S5-positive cohort has been explicitly reconciled against public evidence. Ouroboros remains the only admitted canonical direct S5 observation; the other 23 systems expose qualifying S5 mechanisms/ownership but no reviewed public direct result satisfying the full authority/change/subsequent-operation chain. The S5 primary therefore remains an evidence-backed gap.'
          cohort_path.write_text(json.dumps(cohort, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          closure = json.loads(closure_path.read_text(encoding='utf-8'))
          assert closure['full_cohort_state'] == {
              'canonical_s5_positive_systems': 23,
              'direct_canonical_observations': 1,
              'no_direct_public_result': 22,
              'unresolved': 0,
          }
          closure['reviewed_at'] = '2026-09-27'
          closure['full_cohort_state'] = {
              'canonical_s5_positive_systems': 24,
              'direct_canonical_observations': 1,
              'no_direct_public_result': 23,
              'unresolved': 0,
          }
          tandem_note = ' Full-cohort reconciliation now also covers canonical Tandem; its owner/admin-governed versioned orchestration and GoalPolicy publication are strong mechanism evidence, but the frozen public repository exposes no immutable real-world policy-amendment-to-subsequent-operation chain.'
          assert 'canonical Tandem' not in closure['closure_claim']
          closure['closure_claim'] += tandem_note
          closure_path.write_text(json.dumps(closure, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          validator = validator_path.read_text(encoding='utf-8')
          needle = '    "chump": ("724c8ebe1911e986cc8af6883b6f05acd096d437", "P"),\n}'
          replacement = '    "chump": ("724c8ebe1911e986cc8af6883b6f05acd096d437", "P"),\n    "tandem": ("3ee2d83d76497565680538ef00f1616f55650524", "C(P)"),\n}'
          assert needle in validator
          validator = validator.replace(needle, replacement, 1)
          replacements = {
              'len(rows) == 23': 'len(rows) == 24',
              'exactly 23 current positive-S5 systems': 'exactly 24 current positive-S5 systems',
              '"canonical_s5_positive_systems": 23,': '"canonical_s5_positive_systems": 24,',
              '"no_direct_public_result": 22,': '"no_direct_public_result": 23,',
          }
          for old, new in replacements.items():
              assert old in validator, old
              validator = validator.replace(old, new)
          validator_path.write_text(validator, encoding='utf-8')
          PY

      - name: Render experimental projections
        run: |
          python experiments/functional-capability-depth/render_function_baselines.py
          python experiments/functional-capability-depth/render_evidence_frontier.py

      - name: Validate reconciliation
        run: |
          python scripts/check_index.py
          python experiments/functional-capability-depth/s5-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s5-system-benchmarks/matched-cell/validate_s5_primary_search_closure.py
          python experiments/functional-capability-depth/s5-system-benchmarks/matched-cell/validate_second_canonical_search.py
          python experiments/functional-capability-depth/validate_synthesis.py
          python -m unittest discover -s tests -v

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/tandem-s5-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/functional-capability-depth .github/workflows/tandem-s5-reconcile.yml
          git commit -m 'experiment: reconcile Tandem into S5 cohort'
          git push origin HEAD:experiment/tandem-s5-reconciliation-621
