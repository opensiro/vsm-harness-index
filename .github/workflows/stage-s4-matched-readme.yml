name: stage matched S4 README link
on:
  push:
    branches:
      - experiment/s4-matched-preflight-527
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link matched-cell preflight
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('experiments/functional-capability-depth/s4-system-benchmarks/README.md')
          text = path.read_text(encoding='utf-8')
          marker = 'That is an evidence state, not a zero score.\n\n## Representative canonical S4 cohort'
          replacement = '''That is an evidence state, not a zero score.\n\nThe first explicit matched-cell preflight is tracked in [`matched-cell/`](matched-cell/PROTOCOL.md). The current A-Evolve × Exo / SkillsBench / skills-only candidate is fail-closed at the exact common model/provider gate, so no execution result is admitted and the primary remains `gap`.\n\n## Representative canonical S4 cohort'''
          if marker in text:
              text = text.replace(marker, replacement, 1)
              path.write_text(text, encoding='utf-8')
          elif replacement.split('\n\n## Representative')[0] not in text:
              raise SystemExit('unexpected S4 README matched-cell insertion point')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/functional-capability-depth/s4-system-benchmarks/README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: link matched S4 preflight'
          git push
