name: admit Reigen render

on:
  push:
    branches:
      - admit-reigen-203

permissions:
  contents: write

jobs:
  render:
    if: ${{ !contains(github.event.head_commit.message, '[skip render]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Admit reviewed Reigen assessment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/reigen.md')
          text = assessment.read_text(encoding='utf-8')
          if 'status: included' not in text:
              if 'status: proposed' not in text:
                  raise SystemExit('Reigen assessment is neither proposed nor included')
              text = text.replace('status: proposed', 'status: included', 1)
              assessment.write_text(text, encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_row = '203|reigen|Reigen / Conductor|https://github.com/zachary-wilde/reigen|2026-07-30T23:40:54Z|index-addition|6236f47a1b2f3081a0f22bcba47705bcd1680720|2026-09-22'
          catalog_text = catalog.read_text(encoding='utf-8')
          if '|reigen|' not in catalog_text:
              catalog.write_text(catalog_text.rstrip() + '\n\n' + catalog_row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signature_row = '203|reigen|Reigen / Conductor runs autonomous external coding-agent S1 units, closes autonomous S2 through manager-selected multi-brief scope boundaries that prevent parallel edit collisions, and provides autonomous plus parent-governed whole-Ravel current control for S3; its independent worktree verification path is an S3* constructor whose audit criterion remains project-configured, with no material S4 or S5 closure.'
          signatures_text = signatures.read_text(encoding='utf-8')
          if '|reigen|' not in signatures_text:
              signatures.write_text(signatures_text.rstrip() + '\n\n' + signature_row + '\n', encoding='utf-8')
          PY

      - name: Render canonical derived artifacts
        shell: bash
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check

      - name: Commit rendered admission
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assessments/reigen.md data/catalog.psv data/signatures.psv METRICS.md RANKINGS.md README.md TLDR.md analytics/temporal.md data/metrics.json
          if git diff --cached --quiet; then
            echo 'No admission changes to commit'
            exit 0
          fi
          git commit -m 'admit: render Reigen canonical artifacts [skip render]'
          git push
