name: Assemble Ante review

on:
  push:
    branches:
      - assessment/ante-187

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment/ante-187
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate proposed-assessment projections
        run: |
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
      - name: Validate assembled tree
        run: |
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/check_index.py
          python -m unittest discover -s tests -v
      - name: Commit deterministic result and remove assembler
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/assemble-ante-review.yml
          git add assessments/ante.md METRICS.md data/metrics.json README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'assessment: assemble Ante review state'
            git push
          fi
