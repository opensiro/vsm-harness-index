name: tmp-nexent-contract-fields-934

on:
  push:
    branches:
      - assessment/nexent-review-934

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment/nexent-review-934
          fetch-depth: 0
      - name: Add required negative disturbance fields
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('assessments/nexent.md')
          text = p.read_text(encoding='utf-8')
          s2 = "- Function: no material function-specific inter-S1 coordination relation was established at the reviewed boundary.\n"
          s2_add = s2 + "- Disturbance / variety regulated: the candidate S2 disturbance would be oscillation, contention or destructive interference among distinct S1 operational units; no such function-specific disturbance was established with a first-party attenuation path at this boundary.\n"
          if s2 not in text:
              raise SystemExit('S2 insertion anchor not found')
          text = text.replace(s2, s2_add, 1)
          s3s = "- Function: no sufficiently independent complementary audit path was established beyond the ordinary production/verification path.\n"
          s3s_add = s3s + "- Disturbance / variety regulated: the candidate S3* disturbance would be uncertainty about whether ordinary operational reporting faithfully reflects actual execution; the reviewed verification/guardrail path reuses the same run evidence/model surface and does not independently regulate that uncertainty.\n"
          if s3s not in text:
              raise SystemExit('S3* insertion anchor not found')
          text = text.replace(s3s, s3s_add, 1)
          p.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/tmp-nexent-contract-fields-934.yml
          git diff --check
          git config user.name 'OpenSiro Automation'
          git config user.email 'founders@opensiro.com'
          git add -A
          git commit -m 'assessment: satisfy Nexent negative disturbance contract'
          git push origin HEAD:assessment/nexent-review-934
