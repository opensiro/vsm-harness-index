name: materialize-sandbase-admission-324

on:
  push:
    branches:
      - admission/sandbase-harness-324

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admission/sandbase-harness-324
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize exact admission
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          assessment = Path("assessments/sandbase-harness.md")
          text = assessment.read_text(encoding="utf-8")
          old = "status: proposed\n"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one proposed SandBase Harness status")
          assessment.write_text(text.replace(old, "status: included\n", 1), encoding="utf-8")

          catalog = Path("data/catalog.psv")
          catalog_row = "324|sandbase-harness|SandBase Harness|https://github.com/sandbaseai/sandbase-harness|2026-07-11T08:48:07Z|index-addition|f4534553352bc22baf226367ab987a611cc30eca|2026-09-20"
          catalog_text = catalog.read_text(encoding="utf-8")
          if "|sandbase-harness|" in catalog_text or catalog_row in catalog_text:
              raise SystemExit("SandBase Harness already present in catalog")
          if not catalog_text.endswith("\n"):
              catalog_text += "\n"
          catalog.write_text(catalog_text + catalog_row + "\n", encoding="utf-8")

          signatures = Path("data/signatures.psv")
          signature = (
              "SandBase Harness closes autonomous S1 through its model-backed session/tool/delegation loop; "
              "delegation handoff and isolation do not establish S2, session lifecycle/metrics/scheduling do not establish whole-system S3, "
              "post-hoc outcome evaluation and audit/replay do not establish complementary S3*, memory/skills/configuration do not establish S4, "
              "and no runtime S5 identity-policy closure is shown."
          )
          signature_row = "324|sandbase-harness|" + signature
          sig_text = signatures.read_text(encoding="utf-8")
          if "|sandbase-harness|" in sig_text or signature_row in sig_text:
              raise SystemExit("SandBase Harness already present in signatures")
          if not sig_text.endswith("\n"):
              sig_text += "\n"
          signatures.write_text(sig_text + signature_row + "\n", encoding="utf-8")
          PY

          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_analytics.py

          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/render_analytics.py --check
          python scripts/check_index.py
          python -m unittest discover -s tests -v
          python scripts/check_generation_provenance.py --base-ref 024e18b12aab630cc3c4d8e2f0f3b328786d3cd9
          git diff --check

          rm .github/workflows/materialize-sandbase-admission-324.yml

          git config user.name "OpenSiro admission materializer"
          git config user.email "41616537+xLagerFeuer@users.noreply.github.com"
          git add -A
          git commit -m "Index: admit SandBase Harness at catalog #324"
          git push origin HEAD:admission/sandbase-harness-324
