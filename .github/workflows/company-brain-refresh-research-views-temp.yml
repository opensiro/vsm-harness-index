name: Refresh Company Brain downstream research views (temporary)

on:
  push:
    branches:
      - assessment/company-brain

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment/company-brain
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate functional-capability projections
        run: |
          python experiments/functional-capability-depth/render_function_baselines.py
          python experiments/functional-capability-depth/render_evidence_frontier.py
          python experiments/functional-capability-depth/render_s1_baseline.py

      - name: Verify regenerated projections
        run: |
          python experiments/functional-capability-depth/render_function_baselines.py --check
          python experiments/functional-capability-depth/render_evidence_frontier.py --check
          python experiments/functional-capability-depth/render_s1_baseline.py --check

      - name: Commit refresh and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/company-brain-refresh-research-views-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'research: refresh Company Brain downstream projections'
          git push origin HEAD:assessment/company-brain
