name: render-zigent-proposal-metrics
on:
  push:
    branches:
      - assessment/zigent-review-1006
permissions:
  contents: write
jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment/zigent-review-1006
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render proposal metrics
        run: |
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
      - name: Verify review tree
        run: |
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_analytics.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v
      - name: Commit metrics and remove helper
        run: |
          rm .github/workflows/render-zigent-proposal-metrics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Metrics: render proposed Zigent count'
          git push origin HEAD:assessment/zigent-review-1006
