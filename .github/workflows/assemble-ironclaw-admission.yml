name: assemble IronClaw admission

on:
  push:
    branches:
      - admit-ironclaw-159

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admit-ironclaw-159
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Promote IronClaw and append canonical provenance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/ironclaw.md')
          text = assessment.read_text(encoding='utf-8')
          needle = 'assessment_procedure_version: 0.3.5\nstatus: proposed\n'
          replacement = 'assessment_procedure_version: 0.3.5\nassessment_changed_at: 2026-09-21\nstatus: included\n'
          if needle not in text:
              raise SystemExit('IronClaw assessment is not in expected proposed state')
          assessment.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_text = catalog.read_text(encoding='utf-8')
          if '|ironclaw|' in catalog_text:
              raise SystemExit('IronClaw already present in catalog')
          rows = [line for line in catalog_text.splitlines() if line.strip()]
          if not rows[-1].startswith('168|'):
              raise SystemExit(f'Expected catalog position 168 before admission, got: {rows[-1]}')
          catalog_row = '169|ironclaw|IronClaw|https://github.com/nearai/ironclaw|2026-02-03T06:57:10Z|index-addition|b0b999d96781516ee05e6ba961d6f3ead900da96|2026-09-21'
          catalog.write_text(catalog_text.rstrip('\n') + '\n' + catalog_row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          sig_text = signatures.read_text(encoding='utf-8')
          if '|ironclaw|' in sig_text:
              raise SystemExit('IronClaw already present in signatures')
          signature = ('169|ironclaw|IronClaw closes autonomous operational and whole-job current-control loops, while deterministic concurrency limits provide constructor-owned S2. Independent runtime audit closure is absent; recurring-pattern adaptation is parent-governed through explicit user confirmation, and no S5 identity/ultimate-policy loop is established.')
          signatures.write_text(sig_text.rstrip('\n') + '\n' + signature + '\n', encoding='utf-8')
          PY

      - name: Regenerate canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Validate assembled admission
        run: |
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v

      - name: Commit canonical admission
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/ironclaw.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md FULL_A.md METRICS.md data/metrics.json README.md
          git commit -m 'admit: assemble IronClaw canonical artifacts'
          git push origin HEAD:admit-ironclaw-159

      - name: Remove temporary assembler
        run: |
          rm .github/workflows/assemble-ironclaw-admission.yml
          git add .github/workflows/assemble-ironclaw-admission.yml
          git commit -m 'chore: remove IronClaw admission assembler'
          git push origin HEAD:admit-ironclaw-159
