name: Assemble MLR-Agent same-ref correction

on:
  push:
    branches:
      - assessment/mlr-agent-canonical-s4-correction

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment/mlr-agent-canonical-s4-correction
          fetch-depth: 0

      - name: Apply same-ref semantic correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/mlr-agent.md')
          text = assessment.read_text(encoding='utf-8')
          assert text.count('autonomy_s4: A') == 1
          text = text.replace('autonomy_s4: A', 'autonomy_s4: —', 1)

          old_arch = "The literature/proposal path is functionally distinct from ordinary current experiment execution. It looks outward to scientific prior work, identifies challenges, generates a prospective research methodology/experimental design and then passes that adaptation option into the experiment runner. The downstream coding agent is explicitly instructed to implement and test the proposal. That establishes an outside-and-then S4 closure back into current research capability/action, rather than mere retrieval for answering the current prompt."
          new_arch = "Literature search is externally oriented, but at this declared recursion it is part of the research product itself: the same S1 operation is tasked with discovering prior work, choosing a methodology, testing it and writing the paper. `proposal.md` changes the current research task that S1 executes; it does not redesign MLR-Agent's durable models, tools, strategy or capability for later independent runs. The assessment also finds no qualifying S3 whole-system current-control function with which a distinct S4 environmental model enters the Profile's required current/future conversation."
          assert old_arch in text
          text = text.replace(old_arch, new_arch, 1)

          start = text.index('## S4 — Outside-and-then intelligence')
          end = text.index('\n## S5 — Policy and identity', start)
          s4_lines = [
              '## S4 — Outside-and-then intelligence',
              '',
              '- State: —',
              '- Function: no separate external-and-prospective organizational adaptation function is established at the MLR-Agent harness recursion.',
              '- Disturbance / variety regulated: changing scientific knowledge, related work and future experimental possibilities are investigated for the current research product, not to redesign the durable capability or posture of MLR-Agent itself.',
              '- Decisive decision or feedback right: none established for a persistent adaptation option affecting the harness future operational capability.',
              '- Decision owner: none established for qualifying S4.',
              '- Supporting / enforcement mechanisms: literature search, idea generation, proposal formulation and experiment-result analysis provide research intelligence for S1; they do not persist an organizational adaptation of the harness.',
              '- Closure path: no material S4-specific external/future distinction -> adaptation option -> present-capability change path is established.',
              '- Why this is / is not agent-owned: the runtime is externally informed, but that information is consumed directly as subject-matter evidence inside the current research task. It does not enter a separate S4/S3 homeostatic conversation that changes MLR-Agent future capabilities.',
              '- Evidence: [`mlrbench/agent/lit_review.py`](https://github.com/chchenhui/mlrbench/blob/f728d571a992d71c8b526eeb4d9ab6bb5c8cc824/mlrbench/agent/lit_review.py); [`mlrbench/agent/proposal_generator.py`](https://github.com/chchenhui/mlrbench/blob/f728d571a992d71c8b526eeb4d9ab6bb5c8cc824/mlrbench/agent/proposal_generator.py); [`mlrbench/agent/experiment_runner.py`](https://github.com/chchenhui/mlrbench/blob/f728d571a992d71c8b526eeb4d9ab6bb5c8cc824/mlrbench/agent/experiment_runner.py); [`run_mlr_agent.py`](https://github.com/chchenhui/mlrbench/blob/f728d571a992d71c8b526eeb4d9ab6bb5c8cc824/run_mlr_agent.py).',
              '- Basis: explicit + structural absence.',
              '- Confidence: high.',
              '- Caveats: future-oriented scientific research is the product of this S1. A different system-in-focus could classify functions differently, but at the harness/task-run recursion subject-matter research is not organizational S4 merely because it studies external or future possibilities.',
              '',
              '### Absence scope',
              '',
              '- Surfaces inspected: idea generation, literature search, proposal generation, experiment design/results analysis, paper future-work synthesis, repeated task execution and evaluator surfaces.',
              '- Plausible first-party paths checked: external scientific-literature sensing; proposal-driven experiment planning; experiment-derived learning; generated future-work suggestions; repeated task-folder execution; benchmark/evaluation feedback.',
              '- Why no material first-party path remains: no first-party runtime path turns prospective distinctions into a durable change of MLR-Agent installed models, tools, strategy or capabilities for later independent operations, and no qualifying S3-S4 current/future conversation is present.',
              '',
          ]
          new_s4 = '\n'.join(s4_lines)
          text = text[:start] + new_s4 + text[end:]

          old_variety = "MLR-Agent attenuates research variety by progressively materializing idea, literature, proposal, experiment and paper artifacts in one task workspace. External scientific uncertainty is handled prospectively through the literature/proposal S4 path before experiment execution. Implementation/runtime uncertainty is handled inside the coding-agent S1 stage. Stage failures are bounded by scripted retries/errors. No separate whole-system S3 or identity-level S5 escalation owner is established."
          new_variety = "MLR-Agent attenuates research variety by progressively materializing idea, literature, proposal, experiment and paper artifacts in one task workspace. External scientific uncertainty is absorbed as part of the current S1 research product through literature/proposal work; it is not a separate organizational S4 loop at this recursion. Implementation/runtime uncertainty is likewise handled inside S1. Stage failures are bounded by scripted retries/errors. No separate whole-system S3, prospective S4 or identity-level S5 escalation owner is established."
          assert old_variety in text
          text = text.replace(old_variety, new_variety, 1)
          assessment.write_text(text, encoding='utf-8')

          signatures = Path('data/signatures.psv')
          lines = signatures.read_text(encoding='utf-8').splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith('277|mlr-agent|')]
          assert len(matches) == 1
          signature = 'MLR-Agent closes autonomous S1 through end-to-end model-driven research from idea and literature through real experiments and paper writing. Literature/proposal work belongs to the current research operation rather than a distinct S4 adaptation loop; deterministic routing is not S3, MLR-Judge stays adjacent evaluation, and no S2, S3*, S4 or S5 closure is established.'
          assert len(signature) <= 360
          lines[matches[0]] = '277|mlr-agent|' + signature
          signatures.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Validate corrected canonical state
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/mlr-agent-canonical-s4-correction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/mlr-agent.md data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md FULL_A.md METRICS.md data/metrics.json README.md .github/workflows/mlr-agent-canonical-s4-correction.yml
          git commit -m 'assessment: apply MLR-Agent same-ref S4 correction'
          git push origin HEAD:assessment/mlr-agent-canonical-s4-correction