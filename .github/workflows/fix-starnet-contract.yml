name: fix StarNet assessment contract wording

on:
  push:
    branches: [assessment-starnet-pinned]
    paths:
      - '.github/workflows/fix-starnet-contract.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment-starnet-pinned
          fetch-depth: 0
      - name: Apply literal contract wording fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assessments/starnet.md')
          s = p.read_text(encoding='utf-8')
          old = '- Why specifically S2: the relation regulates interference/oscillation created by interaction among sibling operational units; it is not merely routing, delegation, persistence or whole-system managerial allocation.'
          new = '- Why this is S2-specific rather than generic communication / routing / sequencing / shared state / delegation: the relation regulates interference/oscillation created by interaction among sibling operational units; it is not merely routing, delegation, persistence or whole-system managerial allocation.'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one old label, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fix and workflow cleanup
        run: |
          rm .github/workflows/fix-starnet-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/starnet.md .github/workflows/fix-starnet-contract.yml
          git commit -m 'assessment: align StarNet S2 contract wording [skip contract fix]'
          git push origin HEAD:assessment-starnet-pinned
