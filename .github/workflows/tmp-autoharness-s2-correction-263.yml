name: tmp autoharness S2 correction 263

on:
  push:
    branches:
      - assessment/autoharness-s2-correction-263

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply reassessment provenance and signature
        run: |
          python - <<'PY'
          from pathlib import Path

          history = Path("data/reassessment-history.psv")
          text = history.read_text(encoding="utf-8")
          row = "R3|autoharness|3561e468f9ca9f9bf282512e695bd32e4e90fef4|3561e468f9ca9f9bf282512e695bd32e4e90fef4|3561e468f9ca9f9bf282512e695bd32e4e90fef4|2026-09-28|0.2.4|0.3.6|same-ref-correction|S2|https://github.com/aiming-lab/AutoHarness/blob/3561e468f9ca9f9bf282512e695bd32e4e90fef4/autoharness/agents/swarm.py ; https://github.com/aiming-lab/AutoHarness/blob/3561e468f9ca9f9bf282512e695bd32e4e90fef4/autoharness/agents/builtin.py ; https://github.com/aiming-lab/AutoHarness/blob/3561e468f9ca9f9bf282512e695bd32e4e90fef4/docs/guides/multi-agent.md"
          if "|autoharness|3561e468f9ca9f9bf282512e695bd32e4e90fef4|3561e468f9ca9f9bf282512e695bd32e4e90fef4|3561e468f9ca9f9bf282512e695bd32e4e90fef4|2026-09-28|" in text:
              raise SystemExit("autoharness R3 row already present")
          history.write_text(text.rstrip("\n") + "\n" + row + "\n", encoding="utf-8")

          signatures = Path("data/signatures.psv")
          text = signatures.read_text(encoding="utf-8")
          old = "95|autoharness|Mailbox/swarm protocols expose composable S2 and a built-in adversarial Verification agent exposes composable S3*; constitution, audit logs and coordinator primitives do not close higher functions by themselves."
          new = "95|autoharness|AutoHarness ships autonomous AgentLoop operation and a constructor-owned adversarial verification path for complementary audit; mailbox/swarm transport remains below S2 without a concrete disturbance-specific attenuation loop."
          if text.count(old) != 1:
              raise SystemExit(f"expected one old autoharness signature, found {text.count(old)}")
          signatures.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Regenerate derived views
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
      - name: Validate
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v
      - name: Remove assembler workflow
        run: rm .github/workflows/tmp-autoharness-s2-correction-263.yml
      - name: Commit assembled correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "assessment: assemble AutoHarness S2 correction"
          git push origin HEAD:assessment/autoharness-s2-correction-263
