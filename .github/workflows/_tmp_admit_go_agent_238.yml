name: tmp-admit-go-agent-238

on:
  push:
    branches:
      - admit-go-agent-238

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit go-agent and regenerate canonical projections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/go-agent.md')
          text = assessment.read_text(encoding='utf-8')
          old = 'status: proposed\n'
          if old in text:
              text = text.replace(old, 'status: included\n', 1)
              assessment.write_text(text, encoding='utf-8')
          elif 'status: included\n' not in text:
              raise SystemExit('unexpected go-agent assessment status')

          catalog = Path('data/catalog.psv')
          catalog_row = '238|go-agent|go-agent|https://github.com/Protocol-Lattice/go-agent|2025-10-13T08:28:36Z|index-addition|ddfec8630783306b4ecb5ffd37519595384f8d15|2026-09-25'
          catalog_text = catalog.read_text(encoding='utf-8').rstrip('\n')
          if '|go-agent|' not in catalog_text:
              catalog.write_text(catalog_text + '\n' + catalog_row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signature_row = '238|go-agent|go-agent closes autonomous S1 through its model-planned multi-step tool loop; sub-agent/swarm/shared-memory and deterministic workflow composition do not establish S2/S3, Arena/guardrails do not establish complementary S3*, skill/workspace primitives do not close S4, and prompts/policies do not establish S5.'
          signature_text = signatures.read_text(encoding='utf-8').rstrip('\n')
          if '|go-agent|' not in signature_text:
              signatures.write_text(signature_text + '\n' + signature_row + '\n', encoding='utf-8')
          PY

          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/check_index.py

          if git diff --quiet; then
            echo 'No admission changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/go-agent.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md METRICS.md data/metrics.json README.md
          git commit -m 'index: admit go-agent at catalog position 238'
          git push
