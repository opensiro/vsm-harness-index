name: Assemble WebThinker admission

on:
  push:
    branches:
      - index/webthinker-admission

permissions:
  contents: write

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: index/webthinker-admission
          fetch-depth: 0

      - name: Canonicalize assessment sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/webthinker.md')
          text = assessment.read_text(encoding='utf-8')
          assert text.count('status: proposed') == 1
          assessment.write_text(text.replace('status: proposed', 'status: included', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_text = catalog.read_text(encoding='utf-8')
          assert '|webthinker|' not in catalog_text
          rows = [line for line in catalog_text.splitlines() if line.strip()]
          assert rows[-1].startswith('274|cedar|'), f'unexpected catalog tail: {rows[-1]}'
          row = '275|webthinker|WebThinker|https://github.com/RUC-NLPIR/WebThinker|2025-03-28T04:34:22Z|index-addition|db387eb3261de9b5e2db7d2d7fb20af2aceb7882|2026-09-26'
          catalog.write_text(catalog_text.rstrip('\n') + '\n' + row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signatures_text = signatures.read_text(encoding='utf-8')
          assert '|webthinker|' not in signatures_text
          signature = 'WebThinker closes autonomous S1 through model-directed search, nested web exploration, evidence reinjection and report write/edit loops. Its article check and auxiliary editors remain in-band production rather than S3*, web sensing is current-task work rather than S4, and no qualifying S2, superior S3 or runtime S5 closure is established.'
          assert len(signature) <= 360
          signatures.write_text(signatures_text.rstrip('\n') + '\n275|webthinker|' + signature + '\n', encoding='utf-8')
          PY

      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Validate canonical state
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/webthinker-admit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/webthinker.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md FULL_A.md METRICS.md data/metrics.json README.md .github/workflows/webthinker-admit.yml
          git commit -m 'index: canonicalize WebThinker admission'
          git push origin HEAD:index/webthinker-admission