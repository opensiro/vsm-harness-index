name: render Temporal Agent Harness admission

on:
  push:
    branches: [admit-temporal-agent-harness-209]
    paths:
      - '.github/workflows/admit-temporal-agent-harness-render.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admit-temporal-agent-harness-209
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit Temporal Agent Harness canonical row
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/temporal-agent-harness.md')
          text = assessment.read_text(encoding='utf-8')
          old = 'status: proposed'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one proposed status, found {text.count(old)}')
          assessment.write_text(text.replace(old, 'status: included', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_row = '209|temporal-agent-harness|Temporal Agent Harness|https://github.com/temporal-community/temporal-agent-harness|2026-06-18T22:43:11Z|index-addition|d54bef90153a5201aff680cfa36b921bea7cc2e4|2026-09-23'
          catalog_text = catalog.read_text(encoding='utf-8').rstrip('\n')
          if '|temporal-agent-harness|' in catalog_text:
              raise SystemExit('Temporal Agent Harness already exists in catalog')
          if not catalog_text.splitlines()[-1].startswith('208|starnet|'):
              raise SystemExit('catalog slot 209 is no longer safely appendable')
          catalog.write_text(catalog_text + '\n' + catalog_row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signature_row = '209|temporal-agent-harness|Temporal Agent Harness runs autonomous durable model/tool S1 workflows and exposes constructor plus parent-governed whole-current session control through its packaged session manager, API and UI; subagent composition, replayable events and approval gates do not establish installation-level S2 or independent S3*, while no material first-party S4 adaptation or S5 identity closure is established.'
          signatures_text = signatures.read_text(encoding='utf-8').rstrip('\n')
          if '|temporal-agent-harness|' in signatures_text:
              raise SystemExit('Temporal Agent Harness already exists in signatures')
          if not signatures_text.splitlines()[-1].startswith('208|starnet|'):
              raise SystemExit('signature slot 209 is no longer safely appendable')
          signatures.write_text(signatures_text + '\n' + signature_row + '\n', encoding='utf-8')
          PY
      - name: Render and validate canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python experiments/functional-capability-depth/render_function_baselines.py --check
          python experiments/functional-capability-depth/render_s1_baseline.py --check
      - name: Commit rendered admission
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/temporal-agent-harness.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md METRICS.md README.md analytics/temporal.md data/metrics.json
          git commit -m 'admit: render Temporal Agent Harness canonical inclusion'
          git push origin HEAD:admit-temporal-agent-harness-209
