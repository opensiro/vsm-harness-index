name: admission-materialize-agent-os

on:
  push:
    branches:
      - admission/agent-os-1009

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical Agent OS admission sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/agent-os.md')
          text = assessment.read_text(encoding='utf-8')
          expected = 'status: proposed\n'
          if text.count(expected) != 1:
              raise SystemExit('expected exactly one proposed Agent OS status')
          if 'review_ref: 9f45e60058b51bc69ea746876b798f995d8bebc2\n' not in text:
              raise SystemExit('unexpected Agent OS review ref')
          assessment.write_text(text.replace(expected, 'status: included\n', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          rows = catalog.read_text(encoding='utf-8').splitlines()
          if any('|agent-os|' in row or 'https://github.com/andrewgolovanov/agent-os' in row for row in rows[1:]):
              raise SystemExit('Agent OS already present in catalog')
          positions = [int(row.split('|', 1)[0]) for row in rows[1:] if row.strip()]
          next_position = max(positions) + 1
          if next_position != 340:
              raise SystemExit(f'unexpected next catalog position: {next_position}')
          rows.append('340|agent-os|Agent OS|https://github.com/andrewgolovanov/agent-os|2026-08-15T12:23:51Z|index-addition|9f45e60058b51bc69ea746876b798f995d8bebc2|2026-09-20')
          catalog.write_text('\n'.join(rows) + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          sig_rows = signatures.read_text(encoding='utf-8').splitlines()
          if any('|agent-os|' in row for row in sig_rows[1:]):
              raise SystemExit('Agent OS signature already present')
          signature = (
              'Agent OS closes autonomous S1 through supported Codex work cells running its first-party plugin and Task Bridge continuity envelope, '
              'while parent-human Focus/Board portfolio control closes S3=P. Shared outcome state does not establish S2, self-checkpoints and contextual evidence do not establish S3*, '
              'recurring monitor/synchronization paths do not close prospective S4, and project identity, trust and consent surfaces do not close S5.'
          )
          sig_rows.append(f'340|agent-os|{signature}')
          signatures.write_text('\n'.join(sig_rows) + '\n', encoding='utf-8')
          PY
      - name: Render canonical projections
        shell: bash
        run: |
          python scripts/render_tldr.py
          python scripts/render_analytics.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
      - name: Verify generated tree
        shell: bash
        run: |
          python scripts/check_index.py
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_analytics.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/render_full_a.py --check
          python -m unittest discover -s tests -v
      - name: Commit materialized admission and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/admission-materialize-agent-os.yml
          git add assessments/agent-os.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics METRICS.md data/metrics.json README.md FULL_A.md 2>/dev/null || true
          git diff --cached --check
          git commit -m 'Index: admit Agent OS at catalog #340'
          git push origin HEAD:admission/agent-os-1009
