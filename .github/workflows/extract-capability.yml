name: extract capability from Index

on:
  push:
    branches:
      - chore/extract-functional-capability

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/extract-functional-capability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Replace active experiment with migration pointer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf experiments/functional-capability-depth
          mkdir -p experiments/functional-capability-depth
          cat > experiments/functional-capability-depth/README.md <<'EOF'
          # Functional capability depth — migrated

          Status: **migrated / historical pointer**

          The active experimental capability corpus has moved to [`opensiro/vsm-harness-capability`](https://github.com/opensiro/vsm-harness-capability).

          This path is retained only as a stable migration pointer. It is no longer an active evidence registry, benchmark/VSM interpretation surface, baseline source of truth, or CI-owned experiment in the VSM Harness Index.

          ## Migration boundary

          The extraction was bootstrapped from this repository at pinned revision:

          ```text
          3446fe77e031878dc8ad4edfb857b608a7a6b26f
          ```

          The Capability repository preserves:

          - the neutral public system-observation corpus;
          - derived VSM-function projections;
          - general-capability baselines and evidence frontier;
          - predecessor checksums and source-ref provenance;
          - predecessor experiment-specific tests as historical artifacts;
          - Batch 01, Batch 02, LoopX and the frozen predecessor synthesis as historical artifacts.

          The migrated corpus preserved **53 unique raw observation IDs** at extraction.

          ## Source-of-truth split

          - VSM semantics → [`opensiro/vsm-harness-profile`](https://github.com/opensiro/vsm-harness-profile)
          - assessment procedure → [`opensiro/vsm-harness-skills`](https://github.com/opensiro/vsm-harness-skills)
          - canonical repository-relative assessments → this Index
          - experimental general functional capability → [`opensiro/vsm-harness-capability`](https://github.com/opensiro/vsm-harness-capability)

          Canonical Index assessments, catalog state, TLDR, rankings and autonomy states were not migrated and remain owned by this repository.

          Capability remains **experimental and non-normative**. Its existence does not by itself change the bounded `vsm-oss-organization` system boundary.
          EOF

      - name: Remove Capability-owned CI and tests from Index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/validate.yml')
          lines = workflow.read_text().splitlines()
          lines = [line for line in lines if 'experiments/functional-capability-depth/' not in line]
          workflow.write_text('\n'.join(lines) + '\n')

          result = subprocess.run(
              ['git', 'grep', '-l', 'functional-capability-depth', '--', 'tests/*.py'],
              text=True, capture_output=True,
          )
          for rel in result.stdout.splitlines():
              path = Path(rel.strip())
              if path.is_file():
                  path.unlink()

          grit = Path('assessments/grit.md')
          text = grit.read_text()
          old = "OpenSiro's separate `functional-capability-depth` experiment already records public first-party Grit evidence for a direct non-canonical S2 coordination relation."
          new = "The separate experimental [`opensiro/vsm-harness-capability`](https://github.com/opensiro/vsm-harness-capability) corpus records public first-party Grit evidence for a direct non-canonical S2 coordination relation."
          if old not in text:
              raise SystemExit('expected Grit capability cross-reference not found')
          grit.write_text(text.replace(old, new))
          PY

      - name: Check for stale active references
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n 'functional-capability-depth' -- . \
            ':(exclude)experiments/functional-capability-depth/README.md' \
            ':(exclude).github/workflows/extract-capability.yml'; then
            echo 'stale functional-capability-depth references remain outside the migration pointer' >&2
            exit 1
          fi

      - name: Validate canonical Index remains independent
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v
          git diff --check

      - name: Commit extraction and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/extract-capability.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: extract functional capability experiment'
          git push origin HEAD:chore/extract-functional-capability
