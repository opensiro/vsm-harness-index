name: Regenerate deep-review views

on:
  push:
    branches:
      - deep-review-071-080
    paths:
      - 'assessments/**'
      - 'data/signatures.psv'
      - '.github/workflows/regenerate-deep-review.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deep-review-071-080
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render generated views
        run: python scripts/render_tldr.py
      - name: Commit generated views
        shell: bash
        run: |
          if git diff --quiet -- TLDR.md RANKINGS.md; then
            echo "Generated views already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TLDR.md RANKINGS.md
          git commit -m "Regenerate deep-review views 71-80"
          git push origin HEAD:deep-review-071-080
