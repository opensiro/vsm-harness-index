name: regenerate-deep-review

on:
  push:
    branches:
      - deep-review-006-010

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deep-review-006-010
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate derived views
        run: |
          python scripts/render_tldr.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TLDR.md RANKINGS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate deep-review views"
          git push origin HEAD:deep-review-006-010
