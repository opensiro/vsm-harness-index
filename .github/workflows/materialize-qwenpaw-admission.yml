name: Materialize QwenPaw admission

on:
  push:
    branches:
      - admit-qwenpaw-194

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize canonical admission
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/qwenpaw.md')
          text = assessment.read_text(encoding='utf-8')
          assert 'status: proposed' in text
          assessment.write_text(text.replace('status: proposed', 'status: included', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_text = catalog.read_text(encoding='utf-8')
          assert '|qwenpaw|' not in catalog_text
          if not catalog_text.endswith('\n'):
              catalog_text += '\n'
          catalog_text += '194|qwenpaw|QwenPaw|https://github.com/agentscope-ai/QwenPaw|2026-02-24T03:42:56Z|index-addition|8af8b6e31a837a0e19ee6c9fffaf1c6b44b5f9ec|2026-09-22\n'
          catalog.write_text(catalog_text, encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signatures_text = signatures.read_text(encoding='utf-8')
          assert '|qwenpaw|' not in signatures_text
          if not signatures_text.endswith('\n'):
              signatures_text += '\n'
          signatures_text += '194|qwenpaw|QwenPaw closes autonomous S1 through first-party scheduled workspace execution, exposes constructor S2 through Hub shared-quota attenuation, retains whole-installation S3 under parent operator control, supplies constructor S3* through the read-only doctor diagnostic plane, autonomously anticipates future needs through its proactive responder, and keeps durable identity S5 under parent persona governance.\n'
          signatures.write_text(signatures_text, encoding='utf-8')
          PY

          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/check_index.py
          python -m unittest discover -s tests -v

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'admit: materialize QwenPaw canonical views'
          git push origin HEAD
