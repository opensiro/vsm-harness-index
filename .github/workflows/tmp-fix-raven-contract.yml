name: tmp-fix-raven-contract

on:
  push:
    branches:
      - assess-raven-315

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assess-raven-315
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize Methodology 0.3.6 contract labels
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('assessments/raven.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('- Claim audited:', '- Claim being audited:', 1)
          text = text.replace('- Ultimate authority in this mode:', '- Ultimate authority in each claimed mode:', 1)

          replacement = '''### Mode matrix

| Mode | Decisive owner | Trigger | Closure | Evidence |
| --- | --- | --- | --- | --- |
| Base (`A`) | Host Agent | Current DAG/node status, exception, output or task evidence requires intervention | Host chooses continue/replan/abandon/cancel and the runtime applies the changed commitment to subsequent delegated execution | [`docs-site/docs/orchestration.md`](https://github.com/EverMind-AI/Raven/blob/e6c0344cb7ce00db25d554e4bb671ec1909a8f9f/docs-site/docs/orchestration.md) |
| Parent (`P`) | Authorized user/control client | Parent observes an active delegated task/instance that requires correction | A direct instance turn or supported `subagents.instance.steer` intervention is returned into the active child path | [`docs-site/docs/agent-collaboration.md`](https://github.com/EverMind-AI/Raven/blob/e6c0344cb7ce00db25d554e4bb671ec1909a8f9f/docs-site/docs/agent-collaboration.md) |
'''
          text, n = re.subn(r'### Mode matrix\n.*?(?=\n## S3\* — Audit)', replacement.rstrip(), text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('could not replace S3 mode matrix')
          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/tmp-fix-raven-contract.yml
          git diff --check
          git config user.name 'OpenSiro Automation'
          git config user.email 'founders@opensiro.com'
          git add -A
          git commit -m 'assessment: satisfy Methodology 0.3.6 contract for Raven'
          git push origin HEAD:assess-raven-315
