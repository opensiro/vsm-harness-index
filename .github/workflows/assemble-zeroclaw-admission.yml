name: assemble ZeroClaw admission

on:
  push:
    branches:
      - admit-zeroclaw-159

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admit-zeroclaw-159
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Promote ZeroClaw and add canonical provenance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/zeroclaw.md')
          text = assessment.read_text(encoding='utf-8')
          old = 'status: proposed'
          if old in text:
              text = text.replace(old, 'status: included', 1)
              assessment.write_text(text, encoding='utf-8')
          elif 'status: included' not in text:
              raise SystemExit('unexpected ZeroClaw assessment status')

          catalog = Path('data/catalog.psv')
          catalog_text = catalog.read_text(encoding='utf-8')
          catalog_row = '170|zeroclaw|ZeroClaw|https://github.com/zeroclaw-labs/zeroclaw|2026-02-13T08:56:04Z|index-addition|757db6c356c61861256a87222e30c7c92e8f166f|2026-09-21'
          if '|zeroclaw|' not in catalog_text:
              catalog.write_text(catalog_text.rstrip('\n') + '\n' + catalog_row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          sig_text = signatures.read_text(encoding='utf-8')
          signature = (
              'ZeroClaw ships autonomous model/tool operations and caller-owned current control over background delegated tasks; '
              'delegation does not establish S2, logging/enforcement do not close S3*, its no-human-in-loop skill reviewer '
              'persists operational lessons into future skills for autonomous S4, and escalation/approval do not close S5.'
          )
          if len(signature) > 360:
              raise SystemExit(f'signature too long: {len(signature)}')
          sig_row = '170|zeroclaw|' + signature
          if '|zeroclaw|' not in sig_text:
              signatures.write_text(sig_text.rstrip('\n') + '\n' + sig_row + '\n', encoding='utf-8')
          PY

      - name: Regenerate deterministic views
        shell: bash
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Validate assembled branch
        shell: bash
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v

      - name: Commit assembled artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/zeroclaw.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md METRICS.md data/metrics.json README.md FULL_A.md
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'admit: assemble ZeroClaw canonical artifacts'
            git push origin HEAD:admit-zeroclaw-159
          fi
