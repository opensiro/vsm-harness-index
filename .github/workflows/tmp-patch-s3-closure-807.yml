name: tmp patch S3 closure 807

on:
  push:
    branches:
      - experiment/s3-neutral-registry-807

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch downstream closure consumer
        run: python scripts/tmp_patch_s3_closure_807.py
      - name: Validate S3 closure and full experiment
        run: |
          python experiments/functional-capability-depth/s3-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s3-system-benchmarks/matched-cell/validate_s3_primary_search_closure.py
          python experiments/functional-capability-depth/s3-system-benchmarks/matched-cell/validate_s3_matched_canonical_search.py
          python experiments/functional-capability-depth/validate_synthesis.py
          python -m unittest discover -s tests -v
      - name: Remove patch artifacts
        run: |
          rm scripts/tmp_patch_s3_closure_807.py
          rm .github/workflows/tmp-patch-s3-closure-807.yml
      - name: Commit patched transaction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "experiment: hydrate S3 closure from neutral evidence"
          git push origin HEAD:experiment/s3-neutral-registry-807
