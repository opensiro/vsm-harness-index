name: tmp-admit-holt

on:
  push:
    branches:
      - admit-holt-89

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admit-holt-89
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply admission source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/holt.md')
          text = assessment.read_text()
          assert text.count('status: proposed') == 1, 'expected one proposed status'
          assessment.write_text(text.replace('status: proposed', 'status: included', 1))

          catalog = Path('data/catalog.psv')
          ctext = catalog.read_text().rstrip('\n')
          assert '|holt|' not in ctext, 'holt already in catalog'
          positions = [int(line.split('|', 1)[0]) for line in ctext.splitlines() if line and line.split('|', 1)[0].isdigit()]
          next_position = max(positions) + 1
          assert next_position == 193, f'expected catalog 193, got {next_position}'
          row = '193|holt|Holt|https://github.com/holt-os/holt|2026-07-02T06:02:28Z|index-addition|3a88451f980678f5dd62d72d9b159c125c48ae05|2026-09-22'
          catalog.write_text(ctext + '\n' + row + '\n')

          signatures = Path('data/signatures.psv')
          stext = signatures.read_text().rstrip('\n')
          assert '|holt|' not in stext, 'holt already in signatures'
          signature = 'Holt closes autonomous S1 through its direct-API runner and scheduled/routine paths, retains installation-wide S3 under local operator control, exposes a constructor S3* setup audit, and autonomously adapts future writing through a durable model-synthesized voice profile; no material S2 or S5 path is established.'
          assert len(signature) <= 360, len(signature)
          signatures.write_text(stext + '\n193|holt|' + signature + '\n')
          PY

      - name: Render canonical views
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Validate generated state
        run: |
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/check_index.py
          python -m unittest discover -s tests -v

      - name: Commit generated admission
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/holt.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md METRICS.md data/metrics.json README.md analytics || true
          git diff --cached --quiet && exit 1
          git commit -m 'admit: generate Holt canonical views'
          git push origin HEAD:admit-holt-89
