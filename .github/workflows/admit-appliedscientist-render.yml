name: admit AppliedScientist render
on:
  push:
    branches: [admit-appliedscientist-221]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit and render
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('assessments/appliedscientist.md')
          s = p.read_text()
          if 'status: proposed' not in s:
              raise SystemExit('assessment is not proposed')
          p.write_text(s.replace('status: proposed', 'status: included', 1))

          cat = Path('data/catalog.psv')
          text = cat.read_text()
          row = '221|appliedscientist|TheAppliedScientist|https://github.com/TheAppliedScientist/TheAppliedScientist|2026-09-02T14:33:15Z|index-addition|762824fd41598370e75588861b48991b0a9fd784|2026-09-24'
          if row not in text:
              cat.write_text(text.rstrip() + '\n' + row + '\n')

          sig = Path('data/signatures.psv')
          text = sig.read_text()
          row = '221|appliedscientist|TheAppliedScientist runs autonomous scientific-revision S1, closes autonomous complementary S3* through a default separate Reviewer service whose independent literature/methodology audit returns findings into Scientist correction and fresh re-review, and closes autonomous S4 through external literature inquiry that generates prospective experiment/analysis/framing options and returns them into the active research artifact; no material S2, whole-current S3, or S5 identity closure is established.'
          if row not in text:
              sig.write_text(text.rstrip() + '\n' + row + '\n')
          PY
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/appliedscientist.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md METRICS.md README.md analytics/temporal.md data/metrics.json
          git commit -m 'admit: render AppliedScientist canonical inclusion'
          git push
