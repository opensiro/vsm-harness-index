name: materialize-frontieragent-admission

on:
  push:
    branches:
      - admission/frontieragent-323

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admission/frontieragent-323
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize exact admission
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          assessment = Path("assessments/frontieragent.md")
          text = assessment.read_text(encoding="utf-8")
          old = "status: proposed\n"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one proposed FrontierAgent status")
          assessment.write_text(text.replace(old, "status: included\n", 1), encoding="utf-8")

          catalog = Path("data/catalog.psv")
          catalog_row = "323|frontieragent|FrontierAgent|https://github.com/ApodexAI/FrontierAgent|2026-08-22T05:07:35Z|index-addition|9e533db6f6c34d16037ee5ec964c479d0eb51cde|2026-09-20"
          catalog_text = catalog.read_text(encoding="utf-8")
          if "|frontieragent|" in catalog_text or catalog_row in catalog_text:
              raise SystemExit("FrontierAgent already present in catalog")
          if not catalog_text.endswith("\n"):
              catalog_text += "\n"
          catalog.write_text(catalog_text + catalog_row + "\n", encoding="utf-8")

          signatures = Path("data/signatures.psv")
          signature = (
              "FrontierAgent closes autonomous S1 through model-backed specialist sub-agents, "
              "S2 through verifier-mediated evidence conflict and exclusive publisher ownership, "
              "S3 through coordinator-owned live task/agent commitment regulation, and S3* through "
              "a separate non-publishing final verifier; retained sessions, skills and benchmark "
              "feedback do not establish S4, and no S5 identity-policy closure is shown."
          )
          signature_row = "323|frontieragent|" + signature
          sig_text = signatures.read_text(encoding="utf-8")
          if "|frontieragent|" in sig_text or signature_row in sig_text:
              raise SystemExit("FrontierAgent already present in signatures")
          if not sig_text.endswith("\n"):
              sig_text += "\n"
          signatures.write_text(sig_text + signature_row + "\n", encoding="utf-8")
          PY

          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_analytics.py

          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/render_analytics.py --check
          python scripts/check_index.py
          python -m unittest discover -s tests -v
          python scripts/check_generation_provenance.py --base-ref b6b85030d0c179a15cbaaabea1913c99117622f5
          git diff --check

          rm .github/workflows/materialize-frontieragent-admission.yml

          git config user.name "OpenSiro admission materializer"
          git config user.email "41616537+xLagerFeuer@users.noreply.github.com"
          git add -A
          git commit -m "Index: admit FrontierAgent at catalog #323"
          git push origin HEAD:admission/frontieragent-323
