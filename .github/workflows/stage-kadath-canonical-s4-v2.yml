name: stage KADATH canonical S4 v2
on:
  push:
    branches:
      - experiment/kadath-canonical-s4-520
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reapply staged mutation
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/stage-kadath-canonical-s4.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          code = dedent('\n'.join(workflow[start:end]))
          exec(compile(code, '<staged-kadath-mutation>', 'exec'), {})
          PY
      - name: Patch canonical coverage invariant
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('experiments/functional-capability-depth/s4-system-benchmarks/validate.py')
          text = path.read_text(encoding='utf-8')
          old = '''        if case.get("admitted_to_canonical_registry") is not False:\n            fail(f"{case_id}: coverage case must remain non-admitted")\n'''
          new = '''        if coverage_class == "canonical-native-direct":\n            if case.get("admitted_to_canonical_registry") is not True:\n                fail(f"{case_id}: canonical-native-direct case must be admitted")\n        elif case.get("admitted_to_canonical_registry") is not False:\n            fail(f"{case_id}: non-canonical coverage case must remain non-admitted")\n'''
          if old not in text:
              raise SystemExit('legacy non-admitted coverage invariant not found')
          text = text.replace(old, new, 1)

          anchor = '''        if coverage_class == "candidate-native-no-direct-results":\n            if fields is None or fields.get("autonomy_s4") in {None, "—", "?"}:\n                fail(f"{case_id}: native-no-results candidate must currently establish S4")\n            if case.get("system_compatibility") != "native-system":\n                fail(f"{case_id}: native-no-results candidate must be native-system")\n            if case.get("benchmark_fit") != "candidate-direct":\n                fail(f"{case_id}: native-no-results candidate fit drift")\n\n'''
          addition = '''        if coverage_class == "canonical-native-direct":\n            if case_id != "kadath-native-s4-no-standardized-results":\n                fail(f"{case_id}: unreviewed canonical-native-direct case")\n            if fields is None or fields.get("autonomy_s4") != "A":\n                fail(f"{case_id}: canonical-native-direct case must currently establish S4=A")\n            if case.get("system_compatibility") != "native-system":\n                fail(f"{case_id}: canonical-native-direct case must be native-system")\n            if case.get("benchmark_fit") != "direct":\n                fail(f"{case_id}: canonical-native-direct benchmark_fit drift")\n            if case.get("canonical_observation_id") != "kadath-ten-epoch-native-evolution-2026":\n                fail(f"{case_id}: canonical observation linkage drift")\n\n'''
          if anchor not in text:
              raise SystemExit('candidate-native validation anchor not found')
          text = text.replace(anchor, anchor + addition, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Regenerate and validate
        run: |
          python experiments/functional-capability-depth/render_function_baselines.py
          python experiments/functional-capability-depth/s4-system-benchmarks/validate.py
          python experiments/functional-capability-depth/render_function_baselines.py --check
          python experiments/functional-capability-depth/render_s1_baseline.py --check
          python experiments/functional-capability-depth/s2-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s3-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s3star-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s5-system-benchmarks/validate.py
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v
      - name: Commit experiment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/functional-capability-depth/primary-baselines.json experiments/functional-capability-depth/FUNCTION-BASELINES.md experiments/functional-capability-depth/s4-system-benchmarks
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'experiment: admit KADATH canonical direct S4 observation'
          git push
