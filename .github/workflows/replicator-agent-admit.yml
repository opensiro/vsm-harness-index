name: Assemble ReplicatorAgent admission

on:
  push:
    branches:
      - index/replicator-agent-admission

permissions:
  contents: write

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: index/replicator-agent-admission
          fetch-depth: 0

      - name: Canonicalize assessment sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/replicator-agent.md')
          text = assessment.read_text(encoding='utf-8')
          assert text.count('status: proposed') == 1
          assessment.write_text(text.replace('status: proposed', 'status: included', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_text = catalog.read_text(encoding='utf-8')
          assert '|replicator-agent|' not in catalog_text
          rows = [line for line in catalog_text.splitlines() if line.strip()]
          assert rows[-1].startswith('277|mlr-agent|'), f'unexpected catalog tail: {rows[-1]}'
          row = '278|replicator-agent|ReplicatorAgent|https://github.com/CenterForOpenScience/llm-benchmarking|2025-06-16T20:34:45Z|index-addition|fb6a804fd710764f3ad3c8b84e1323c2804c4776|2026-09-27'
          catalog.write_text(catalog_text.rstrip('\n') + '\n' + row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signatures_text = signatures.read_text(encoding='utf-8')
          assert '|replicator-agent|' not in signatures_text
          signature = 'ReplicatorAgent closes S1 through model-driven replication design, sandboxed execution/debugging and result interpretation; the human execute approval is a bounded authorization gate, while separate validator and web-search modes do not close S3* or S4. No material S2, S3 or S5 path is established.'
          assert len(signature) <= 360
          signatures.write_text(signatures_text.rstrip('\n') + '\n278|replicator-agent|' + signature + '\n', encoding='utf-8')
          PY

      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Validate canonical state
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/replicator-agent-admit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/replicator-agent.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md FULL_A.md METRICS.md data/metrics.json README.md .github/workflows/replicator-agent-admit.yml
          git commit -m 'index: canonicalize ReplicatorAgent admission'
          git push origin HEAD:index/replicator-agent-admission
