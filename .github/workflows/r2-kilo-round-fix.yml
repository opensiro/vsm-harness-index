name: R2 Kilo round record fix

on:
  push:
    branches:
      - r2-kilo-code-deep-102

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[r2-kilo-round-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move Kilo row into progress table
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          round_path = Path('reassessments/R2-2026-09-16.md')
          text = round_path.read_text(encoding='utf-8')
          lines = text.splitlines()
          matches = [line for line in lines if line.startswith('| `kilo-code` |')]
          assert len(matches) == 1, f'expected one Kilo row, found {len(matches)}'
          row = matches[0].replace('S2, S3, S3*', 'S2,S3,S3*')
          lines = [line for line in lines if not line.startswith('| `kilo-code` |')]
          marker = lines.index('## Completion')
          # Preserve exactly one blank line before Completion; put Kilo with the other progress rows.
          while marker > 0 and lines[marker - 1] == '':
              lines.pop(marker - 1)
              marker -= 1
          lines.insert(marker, row)
          lines.insert(marker + 1, '')
          round_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          history_path = Path('data/reassessment-history.psv')
          history = history_path.read_text(encoding='utf-8')
          old = '|reassessed-changed|S2, S3, S3*|https://github.com/Kilo-Org/kilocode/'
          new = '|reassessed-changed|S2,S3,S3*|https://github.com/Kilo-Org/kilocode/'
          assert history.count(old) == 1, 'unexpected Kilo changed_functions formatting'
          history_path.write_text(history.replace(old, new), encoding='utf-8')
          PY
          python scripts/render_tldr.py --check
          python scripts/check_index.py
          python scripts/check_generation_provenance.py --base-ref origin/main
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reassessment-history.psv reassessments/R2-2026-09-16.md
          git commit -m "[r2-kilo-round-fix] Place Kilo R2 row in progress table"
          git push origin HEAD:r2-kilo-code-deep-102
