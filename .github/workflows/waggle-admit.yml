name: Assemble Waggle admission

on:
  push:
    branches:
      - index/waggle-admission

permissions:
  contents: write

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: index/waggle-admission
          fetch-depth: 0

      - name: Canonicalize assessment sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/waggle.md')
          text = assessment.read_text(encoding='utf-8')
          assert text.count('status: proposed') == 1
          assessment.write_text(text.replace('status: proposed', 'status: included', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_text = catalog.read_text(encoding='utf-8')
          assert '|waggle|' not in catalog_text
          rows = [line for line in catalog_text.splitlines() if line.strip()]
          assert rows[-1].startswith('280|boundflow|'), f'unexpected catalog tail: {rows[-1]}'
          row = '281|waggle|Waggle|https://github.com/CrewBeeLab/Waggle|2026-05-13T14:26:58Z|index-addition|db9e3d3aed66714d665fd1c5c40d66534bf44ed7|2026-09-27'
          catalog.write_text(catalog_text.rstrip('\n') + '\n' + row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signatures_text = signatures.read_text(encoding='utf-8')
          assert '|waggle|' not in signatures_text
          signature = 'Waggle closes S1 through a first-party governed AgentRun: its production Pi adapter constructs model/context/tools, routes model-selected actions through Waggle permission/tool execution, and returns observations to the loop. Strong per-run policy, confirmations, evidence and package lifecycle do not close S2, S3, S3*, S4 or S5.'
          assert len(signature) <= 360
          signatures.write_text(signatures_text.rstrip('\n') + '\n281|waggle|' + signature + '\n', encoding='utf-8')
          PY

      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Validate canonical state
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/waggle-admit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/waggle.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md FULL_A.md METRICS.md data/metrics.json README.md .github/workflows/waggle-admit.yml
          git commit -m 'index: canonicalize Waggle admission'
          git push origin HEAD:index/waggle-admission
