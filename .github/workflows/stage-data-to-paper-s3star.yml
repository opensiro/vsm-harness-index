name: stage data-to-paper canonical S3star observation
on:
  push:
    branches:
      - experiment/data-to-paper-s3star-509
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage experiment files
        run: python .github/scripts/stage_data_to_paper_s3star.py
      - name: Validate and render
        run: |
          python experiments/functional-capability-depth/s3star-system-benchmarks/validate.py
          python experiments/functional-capability-depth/render_function_baselines.py
          python experiments/functional-capability-depth/render_function_baselines.py --check
          python scripts/check_index.py
      - name: Commit staged experiment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/functional-capability-depth/vsm-benchmark-family-map/map.json
          git add experiments/functional-capability-depth/s3star-system-benchmarks/canonical_observations.json
          git add experiments/functional-capability-depth/s3star-system-benchmarks/coverage.json
          git add experiments/functional-capability-depth/s3star-system-benchmarks/validate.py
          git add experiments/functional-capability-depth/primary-baselines.json
          git add experiments/functional-capability-depth/FUNCTION-BASELINES.md
          git commit -m 'experiment: admit data-to-paper canonical S3star observation'
          git push
