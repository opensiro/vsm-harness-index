name: Agentlas admission materializer

on:
  push:
    branches:
      - admission/agentlas-os-325

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated admission patch
        env:
          PATCH_GZ_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, os, pathlib
          data = gzip.decompress(base64.b64decode(os.environ['PATCH_GZ_B64']))
          pathlib.Path('/tmp/agentlas-admission.patch').write_bytes(data)
          PY
          git apply /tmp/agentlas-admission.patch
          rm .github/workflows/materialize-agentlas-admission-325.yml
      - name: Validate materialized admission
        run: |
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/render_analytics.py --check
          python scripts/check_index.py
          python -m unittest discover -s tests
          git diff --check
      - name: Commit admission
        run: |
          git config user.name "xLagerFeuer"
          git config user.email "41616537+xLagerFeuer@users.noreply.github.com"
          git add -A
          git commit -m "Index: admit Agentlas OS at catalog #325"
          git push origin HEAD
