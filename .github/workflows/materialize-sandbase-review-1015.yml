name: materialize-sandbase-review-1015
on:
  push:
    branches:
      - assessment/sandbase-harness-review-1015
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated review patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/review.patch
          echo 'db608f7db11eef1ef3390cc5ee656d1bd30c8c23221943b36bedc629efd050b0  /tmp/review.patch' | sha256sum -c -
          git apply --index /tmp/review.patch
      - name: Validate review
        shell: bash
        run: |
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/render_analytics.py --check
          python scripts/check_index.py
          python -m unittest discover -s tests -v
          git diff --cached --check
      - name: Replace staging commit with review commit
        shell: bash
        run: |
          git rm .github/workflows/materialize-sandbase-review-1015.yml
          git add assessments/sandbase-harness.md METRICS.md data/metrics.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Index: add proposed SandBase Harness assessment'
          git push
