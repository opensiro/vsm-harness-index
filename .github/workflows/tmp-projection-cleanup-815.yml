name: tmp direct projection neutral cleanup 815

on:
  push:
    branches:
      - experiment/direct-projection-neutral-ownership-815

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply neutral ownership cleanup
        run: |
          python .github/tmp_apply_neutral_projection_cleanup_815.py
          python .github/tmp_patch_s2_closure_815.py
          python .github/tmp_patch_s2_matched_closure_815.py
          python .github/tmp_patch_s3_mao_hydration_815.py
          python .github/tmp_patch_s3_matched_closure_815.py
          python .github/tmp_patch_tests_815.py
      - name: Validate neutral registry
        run: |
          python experiments/functional-capability-depth/system-observations/validate.py
          python experiments/functional-capability-depth/system-observations/render_registry.py --check
      - name: Validate S2
        run: |
          python experiments/functional-capability-depth/s2-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s2-system-benchmarks/matched-cell/validate_s2_primary_search_closure.py
          python experiments/functional-capability-depth/s2-system-benchmarks/matched-cell/validate_s2_matched_canonical_search.py
      - name: Validate S3
        run: |
          python experiments/functional-capability-depth/s3-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s3-system-benchmarks/matched-cell/validate_s3_primary_search_closure.py
          python experiments/functional-capability-depth/s3-system-benchmarks/matched-cell/validate_s3_matched_canonical_search.py
      - name: Validate synthesis and index
        run: |
          python experiments/functional-capability-depth/render_function_baselines.py --check
          python experiments/functional-capability-depth/render_evidence_frontier.py --check
          python experiments/functional-capability-depth/validate_synthesis.py
          python scripts/check_index.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Remove assembler artifacts
        run: |
          rm .github/tmp_audit_neutral_vsm_leaks_815.py
          rm .github/workflows/tmp-audit-neutral-vsm-leaks-815.yml
          rm .github/tmp_apply_neutral_projection_cleanup_815.py
          rm .github/tmp_patch_s2_closure_815.py
          rm .github/tmp_patch_s2_matched_closure_815.py
          rm .github/tmp_patch_s3_mao_hydration_815.py
          rm .github/tmp_patch_s3_matched_closure_815.py
          rm .github/tmp_patch_tests_815.py
          rm .github/workflows/tmp-projection-cleanup-815.yml
      - name: Commit assembled transaction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No assembled changes"
            exit 1
          fi
          git commit -m "experiment: enforce neutral evidence ownership"
          git push
