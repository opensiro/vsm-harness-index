name: Assemble neutral registry numeric dedup

on:
  push:
    branches:
      - experiment/neutral-registry-dedup-793

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/neutral-registry-dedup-793
          fetch-depth: 0

      - name: Deduplicate function-specific numeric payloads
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          ROOT = Path('.')
          EXP = ROOT / 'experiments' / 'functional-capability-depth'

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def dump(path, value):
              path.write_text(json.dumps(value, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          def row_by_id(rows, observation_id):
              matches = [row for row in rows if row.get('observation_id') == observation_id]
              assert len(matches) == 1, (observation_id, len(matches))
              return matches[0]

          # S3 historical/derived projection: retain interpretation, move result metrics to raw registry.
          s3_path = EXP / 's3-system-benchmarks' / 'observations.json'
          s3 = load(s3_path)
          mao_id = 'multi-agent-orchestration-supervisor-ablation-2026-08'
          mao = row_by_id(s3, mao_id)
          mao['raw_observation_ref'] = '../system-observations/multi-agent-orchestration.json#' + mao_id
          for key in (
              'baseline_arm',
              'supervisor_arm',
              'reported_completion_gain_percentage_points',
              'reported_routing_accuracy_gain_percentage_points',
          ):
              assert key in mao, f'MAO historical payload already missing {key}'
              del mao[key]
          dump(s3_path, s3)

          # S4 historical/derived projections: retain VSM interpretation, move quantitative payloads to raw registry.
          s4_path = EXP / 's4-system-benchmarks' / 'canonical_observations.json'
          s4 = load(s4_path)
          a_id = 'a-evolve-harness-updating-2026'
          a = row_by_id(s4, a_id)
          a['raw_observation_ref'] = '../system-observations/a-evolve.json#' + a_id
          assert 'reported_harness_updating_metrics' in a
          del a['reported_harness_updating_metrics']

          k_id = 'kadath-ten-epoch-native-evolution-2026'
          k = row_by_id(s4, k_id)
          k['raw_observation_ref'] = '../system-observations/kadath.json#' + k_id
          assert 'reported_population_metrics' in k
          del k['reported_population_metrics']
          dump(s4_path, s4)

          # S3 validator: hydrate the quantitative result from the neutral raw observation.
          s3v_path = EXP / 's3-system-benchmarks' / 'validate.py'
          text = s3v_path.read_text(encoding='utf-8')
          marker = 'OMNIGENT_DELTA = HERE / "post-closure-deltas" / "omnigent-post-assessment-recovery.json"\n'
          assert marker in text
          text = text.replace(marker, marker + 'RAW_OBSERVATIONS = HERE.parent / "system-observations"\n', 1)

          helper_marker = '\ndef validate_mao_observation(observation: dict) -> None:\n'
          assert helper_marker in text
          helper = '''\ndef load_raw_observation(filename: str, observation_id: str) -> dict:\n    record = json.loads((RAW_OBSERVATIONS / filename).read_text(encoding="utf-8"))\n    matches = [row for row in record.get("observations", []) if row.get("observation_id") == observation_id]\n    if len(matches) != 1:\n        fail(f"neutral raw observation lookup drift for {observation_id}: {len(matches)} matches")\n    return matches[0]\n\n\ndef validate_mao_observation(observation: dict) -> None:\n'''
          text = text.replace(helper_marker, helper, 1)

          comparison_block = '''    if observation.get("comparison_class") != "within-system-controlled-ablation":\n        fail("Multi-Agent Orchestration comparison class drift")\n\n    require_canonical_s3(MAO_HARNESS, MAO_REVIEW_REF)\n'''
          assert comparison_block in text
          replacement = '''    if observation.get("comparison_class") != "within-system-controlled-ablation":\n        fail("Multi-Agent Orchestration comparison class drift")\n\n    expected_raw_ref = "../system-observations/multi-agent-orchestration.json#" + MAO_OBSERVATION_ID\n    if observation.get("raw_observation_ref") != expected_raw_ref:\n        fail("Multi-Agent Orchestration raw observation linkage drift")\n    for key in (\n        "baseline_arm",\n        "supervisor_arm",\n        "reported_completion_gain_percentage_points",\n        "reported_routing_accuracy_gain_percentage_points",\n    ):\n        if key in observation:\n            fail(f"Multi-Agent Orchestration derived record duplicates neutral numeric payload: {key}")\n    raw = load_raw_observation("multi-agent-orchestration.json", MAO_OBSERVATION_ID)\n\n    require_canonical_s3(MAO_HARNESS, MAO_REVIEW_REF)\n'''
          text = text.replace(comparison_block, replacement, 1)

          assert '    baseline = observation.get("baseline_arm")\n    supervisor = observation.get("supervisor_arm")\n' in text
          text = text.replace(
              '    baseline = observation.get("baseline_arm")\n    supervisor = observation.get("supervisor_arm")\n',
              '    baseline = raw.get("baseline_arm")\n    supervisor = raw.get("supervisor_arm")\n',
              1,
          )
          text = text.replace(
              '    if observation.get("reported_completion_gain_percentage_points") != 68.5:\n',
              '    if raw.get("reported_completion_gain_percentage_points") != 68.5:\n',
              1,
          )
          text = text.replace(
              '    if observation.get("reported_routing_accuracy_gain_percentage_points") != 43.3333:\n',
              '    if raw.get("reported_routing_accuracy_gain_percentage_points") != 43.3333:\n',
              1,
          )
          s3v_path.write_text(text, encoding='utf-8')

          # S4 validator: hydrate A-Evolve and KADATH result metrics from neutral raw observations.
          s4v_path = EXP / 's4-system-benchmarks' / 'validate.py'
          text = s4v_path.read_text(encoding='utf-8')
          marker = 'PROXY_OBSERVATIONS = HERE / "proxy_observations.json"\n'
          assert marker in text
          text = text.replace(marker, marker + 'RAW_OBSERVATIONS = HERE.parent / "system-observations"\n', 1)

          main_marker = '\ndef main() -> None:\n'
          assert main_marker in text
          helper = '''\ndef load_raw_observation(filename: str, observation_id: str) -> dict:\n    record = json.loads((RAW_OBSERVATIONS / filename).read_text(encoding="utf-8"))\n    matches = [row for row in record.get("observations", []) if row.get("observation_id") == observation_id]\n    if len(matches) != 1:\n        fail(f"neutral raw observation lookup drift for {observation_id}: {len(matches)} matches")\n    return matches[0]\n\n\ndef main() -> None:\n'''
          text = text.replace(main_marker, helper, 1)

          a_block = '''    if canonical_obs.get("comparison_class") != "controlled-within-system-evolver-study":\n        fail("canonical A-Evolve comparison class drift")\n    if canonical_obs.get("benchmarks") != ["SWE-bench Verified", "MCP-Atlas", "SkillsBench"]:\n'''
          assert a_block in text
          a_replacement = '''    if canonical_obs.get("comparison_class") != "controlled-within-system-evolver-study":\n        fail("canonical A-Evolve comparison class drift")\n    expected_a_raw_ref = "../system-observations/a-evolve.json#a-evolve-harness-updating-2026"\n    if canonical_obs.get("raw_observation_ref") != expected_a_raw_ref:\n        fail("canonical A-Evolve raw observation linkage drift")\n    if "reported_harness_updating_metrics" in canonical_obs:\n        fail("canonical A-Evolve derived record duplicates neutral numeric payload")\n    a_evolve_raw = load_raw_observation("a-evolve.json", "a-evolve-harness-updating-2026")\n    if canonical_obs.get("benchmarks") != ["SWE-bench Verified", "MCP-Atlas", "SkillsBench"]:\n'''
          text = text.replace(a_block, a_replacement, 1)
          text = text.replace(
              '    metrics = canonical_obs.get("reported_harness_updating_metrics")\n',
              '    metrics = a_evolve_raw.get("reported_harness_updating_metrics")\n',
              1,
          )

          k_block = '''    if kadath_obs.get("comparison_class") != "within-system-longitudinal-population-evolution":\n        fail("KADATH comparison class drift")\n    if kadath_obs.get("epochs") != 10:\n'''
          assert k_block in text
          k_replacement = '''    if kadath_obs.get("comparison_class") != "within-system-longitudinal-population-evolution":\n        fail("KADATH comparison class drift")\n    expected_k_raw_ref = "../system-observations/kadath.json#kadath-ten-epoch-native-evolution-2026"\n    if kadath_obs.get("raw_observation_ref") != expected_k_raw_ref:\n        fail("KADATH raw observation linkage drift")\n    if "reported_population_metrics" in kadath_obs:\n        fail("KADATH derived record duplicates neutral numeric payload")\n    kadath_raw = load_raw_observation("kadath.json", "kadath-ten-epoch-native-evolution-2026")\n    if kadath_obs.get("epochs") != 10:\n'''
          text = text.replace(k_block, k_replacement, 1)
          text = text.replace(
              '    if kadath_obs.get("reported_population_metrics") != expected_kadath_metrics:\n',
              '    if kadath_raw.get("reported_population_metrics") != expected_kadath_metrics:\n',
              1,
          )
          s4v_path.write_text(text, encoding='utf-8')

          # Replace bootstrap compatibility test: neutral records are now authoritative numeric sources.
          test_path = ROOT / 'tests' / 'test_neutral_registry_bootstrap_790.py'
          test_path.write_text(r'''from __future__ import annotations

import json
import unittest
from pathlib import Path


ROOT = Path(__file__).resolve().parents[1]
EXPERIMENT = ROOT / "experiments" / "functional-capability-depth"
RAW = EXPERIMENT / "system-observations"


def load(path: Path):
    return json.loads(path.read_text(encoding="utf-8"))


def by_id(rows: list[dict], observation_id: str) -> dict:
    for row in rows:
        if row.get("observation_id") == observation_id:
            return row
    raise AssertionError(f"missing observation {observation_id}")


def raw_observation(filename: str, observation_id: str) -> tuple[dict, dict]:
    record = load(RAW / filename)
    return record, by_id(record["observations"], observation_id)


class NeutralRegistryBootstrap790Tests(unittest.TestCase):
    def test_multi_agent_orchestration_neutral_record_owns_numeric_payload(self) -> None:
        historical = load(EXPERIMENT / "s3-system-benchmarks" / "observations.json")
        derived = by_id(historical, "multi-agent-orchestration-supervisor-ablation-2026-08")
        record, raw = raw_observation(
            "multi-agent-orchestration.json",
            "multi-agent-orchestration-supervisor-ablation-2026-08",
        )

        self.assertEqual(
            derived["raw_observation_ref"],
            "../system-observations/multi-agent-orchestration.json#multi-agent-orchestration-supervisor-ablation-2026-08",
        )
        for key in (
            "baseline_arm",
            "supervisor_arm",
            "reported_completion_gain_percentage_points",
            "reported_routing_accuracy_gain_percentage_points",
        ):
            self.assertNotIn(key, derived)
        self.assertEqual(raw["baseline_arm"]["scenarios_passed"], 11)
        self.assertEqual(raw["supervisor_arm"]["scenarios_passed"], 48)
        self.assertEqual(raw["reported_completion_gain_percentage_points"], 68.5)
        self.assertEqual(raw["reported_routing_accuracy_gain_percentage_points"], 43.3333)
        self.assertEqual(record["canonical_review_ref"], derived["canonical_review_revision"])

    def test_a_evolve_neutral_record_owns_numeric_payload(self) -> None:
        historical = load(EXPERIMENT / "s4-system-benchmarks" / "canonical_observations.json")
        derived = by_id(historical, "a-evolve-harness-updating-2026")
        record, raw = raw_observation("a-evolve.json", "a-evolve-harness-updating-2026")

        self.assertEqual(
            derived["raw_observation_ref"],
            "../system-observations/a-evolve.json#a-evolve-harness-updating-2026",
        )
        self.assertNotIn("reported_harness_updating_metrics", derived)
        self.assertEqual(
            raw["reported_harness_updating_metrics"],
            {
                "maximum_best_vs_worst_evolver_spread_pp": 3.1,
                "qwen3_235b_swe_gain_pp": 8.2,
                "qwen3_235b_mcp_gain_pp": 0.6,
                "qwen3_5_9b_skillsbench_gain_pp": 3.8,
                "opus_4_6_skillsbench_gain_pp": 2.3,
                "qwen3_235b_skillsbench_gain_pp": 1.5,
            },
        )
        self.assertEqual(record["canonical_review_ref"], derived["canonical_review_revision"])

    def test_kadath_neutral_record_owns_numeric_payload(self) -> None:
        historical = load(EXPERIMENT / "s4-system-benchmarks" / "canonical_observations.json")
        derived = by_id(historical, "kadath-ten-epoch-native-evolution-2026")
        record, raw = raw_observation("kadath.json", "kadath-ten-epoch-native-evolution-2026")

        self.assertEqual(
            derived["raw_observation_ref"],
            "../system-observations/kadath.json#kadath-ten-epoch-native-evolution-2026",
        )
        self.assertNotIn("reported_population_metrics", derived)
        self.assertEqual(
            raw["reported_population_metrics"],
            {
                "best_fitness_epoch_1": 18,
                "best_fitness_epoch_10": 91,
                "best_fitness_improvement": 73,
                "top5_median_epoch_1": 8,
                "top5_median_epoch_10": 77,
                "top5_median_improvement": 69,
                "top5_floor_epoch_1": 1,
                "top5_floor_epoch_10": 71,
                "top5_floor_improvement": 70,
            },
        )
        self.assertEqual(record["canonical_review_ref"], derived["canonical_review_revision"])

    def test_bootstrap_raw_records_do_not_encode_function_attribution(self) -> None:
        for filename, observation_id in (
            ("multi-agent-orchestration.json", "multi-agent-orchestration-supervisor-ablation-2026-08"),
            ("a-evolve.json", "a-evolve-harness-updating-2026"),
            ("kadath.json", "kadath-ten-epoch-native-evolution-2026"),
        ):
            record, observation = raw_observation(filename, observation_id)
            self.assertNotIn("function", record)
            self.assertNotIn("benchmark_fit", record)
            self.assertNotIn("vsm_interpretation", record)
            self.assertNotIn("function", observation)
            self.assertNotIn("benchmark_fit", observation)
            self.assertNotIn("vsm_interpretation", observation)


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')
          PY

      - name: Validate source-of-truth transition
        run: |
          python experiments/functional-capability-depth/system-observations/validate.py
          python experiments/functional-capability-depth/system-observations/render_registry.py --check
          python experiments/functional-capability-depth/s3-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s3-system-benchmarks/matched-cell/validate_s3_primary_search_closure.py
          python experiments/functional-capability-depth/s3-system-benchmarks/matched-cell/validate_s3_matched_canonical_search.py
          python experiments/functional-capability-depth/s4-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s4-system-benchmarks/matched-cell/validate.py
          python experiments/functional-capability-depth/s4-system-benchmarks/matched-cell/validate_s4_primary_search_closure.py
          python experiments/functional-capability-depth/validate_synthesis.py
          python scripts/check_index.py
          python -m unittest discover -s tests -v

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/neutral-registry-dedup-793.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            experiments/functional-capability-depth/s3-system-benchmarks/observations.json \
            experiments/functional-capability-depth/s3-system-benchmarks/validate.py \
            experiments/functional-capability-depth/s4-system-benchmarks/canonical_observations.json \
            experiments/functional-capability-depth/s4-system-benchmarks/validate.py \
            tests/test_neutral_registry_bootstrap_790.py \
            .github/workflows/neutral-registry-dedup-793.yml
          git commit -m 'experiment: deduplicate S3/S4 numeric payloads onto neutral registry'
          git push origin HEAD:experiment/neutral-registry-dedup-793
