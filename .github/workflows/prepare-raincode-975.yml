name: Prepare RainCode admission
on:
  push:
    branches: [admission/raincode-975]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admission/raincode-975
          fetch-depth: 0
      - name: Apply admission
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          a=Path("assessments/raincode.md")
          t=a.read_text(encoding="utf-8"); assert "status: proposed" in t
          a.write_text(t.replace("status: proposed","status: included",1),encoding="utf-8")
          cpath=Path("data/catalog.psv"); c=cpath.read_text(encoding="utf-8").rstrip("\n")
          assert "|raincode|" not in c
          rows=c.splitlines()
          p=max(int(r.split("|",1)[0]) for r in rows[1:] if r.split("|",1)[0].isdigit())+1
          cpath.write_text(c+"\n"+f"{p}|raincode|RainCode|https://github.com/Rainmemery/RainCode|2026-09-29T01:08:15Z|index-addition|1fc73183d396e4935dd96dbeaf288be87a0d6f66|2026-09-29"+"\n",encoding="utf-8")
          sp=Path("data/signatures.psv"); s=sp.read_text(encoding="utf-8").rstrip("\n"); assert "|raincode|" not in s
          sig="RainCode closes autonomous S1 through its shared model/tool coding loop; concurrent subagents and per-batch write serialization do not establish cross-S1 S2, control-plane lifecycle operations do not close whole-current S3, generic reviewer profiles do not establish complementary S3*, memory/research do not close prospective S4, and permission/approval policy does not establish S5."
          sp.write_text(s+"\n"+f"{p}|raincode|{sig}"+"\n",encoding="utf-8")
          PY
          python scripts/render_tldr.py
          python scripts/render_analytics.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
          rm .github/workflows/prepare-raincode-975.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "RainCode admission"
          git push origin HEAD:admission/raincode-975
