name: admit-harness-kit-render

on:
  push:
    branches:
      - admit-harness-kit-196

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admit-harness-kit-196
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit Harness Kit and regenerate canonical views
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^status: proposed$/status: included/' assessments/harness-kit.md
          if ! grep -q '^196|harness-kit|' data/catalog.psv; then
            printf '\n196|harness-kit|Harness Kit|https://github.com/deepklarity/harness-kit|2026-03-01T16:53:11Z|index-addition|87305cd35cba8e75194a50d6dd301c6dd52a69c9|2026-09-22\n' >> data/catalog.psv
          fi
          if ! grep -q '^196|harness-kit|' data/signatures.psv; then
            printf '\n196|harness-kit|Harness Kit runs autonomous coding S1 units, uses planner-owned dependency judgments to attenuate shared-file interference for S2, and supports autonomous planning with staged parent override for S3 plus independent read-only reflection for S3*; its external-repository adaptation loop remains parent-governed S4, with no material S5 closure.\n' >> data/signatures.psv
          fi
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/harness-kit.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md FULL_A.md METRICS.md data/metrics.json README.md
          if ! git diff --cached --quiet; then
            git commit -m 'admit: add Harness Kit from reviewed standalone assessment'
            git push origin HEAD:admit-harness-kit-196
          fi
