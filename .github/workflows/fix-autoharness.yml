name: fix-autoharness

on:
  push:
    branches:
      - evidence-hardening-v1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence-hardening-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update signature and regenerate views
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('data/signatures.psv')
          text = path.read_text()
          old = '80|autoharness|A deterministic multi-stage governance pipeline wraps the agent loop with risk checks, permissions, sanitization, audit, budgets, and constitutions rather than autonomous metasystem actors.'
          new = '80|autoharness|Mailbox-based swarm protocols expose composable cross-agent coordination, while a built-in adversarial Verification agent provides a complementary audit path; both still require composed closure.'
          if old not in text:
              raise SystemExit('expected AutoHarness signature not found')
          path.write_text(text.replace(old, new))
          PY
          python scripts/render_tldr.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signatures.psv TLDR.md RANKINGS.md
          git commit -m "Regenerate AutoHarness classification views"
          git push origin HEAD:evidence-hardening-v1
