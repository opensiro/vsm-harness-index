name: Admit Company Brain (temporary)

on:
  push:
    branches:
      - assessment/company-brain

permissions:
  contents: write

jobs:
  admit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment/company-brain
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add canonical source rows
        shell: bash
        run: |
          set -euo pipefail
          catalog='261|company-brain|Company Brain|https://github.com/supermemoryai/company-brain|2026-09-25T22:48:14Z|index-addition|0071d6164991ce5dccddbd645bcac631ee477572|2026-09-26'
          signature='261|company-brain|Company Brain closes autonomous S1 through its per-organization model/tool/memory loop and parent-governed S5 through admin-owned persistent workspace policy returned into subsequent turns; its single-agent orchestration, approvals, observability, onboarding research, automations and proactivity do not establish installation-level S2, S3, independent S3*, or prospective S4 closure.'
          grep -Fqx "$catalog" data/catalog.psv || printf '%s\n' "$catalog" >> data/catalog.psv
          grep -Fqx "$signature" data/signatures.psv || printf '%s\n' "$signature" >> data/signatures.psv

      - name: Regenerate derived views
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Validate assessment and index
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v0.3.6 https://github.com/opensiro/vsm-harness-skills.git /tmp/vsm-harness-skills
          python /tmp/vsm-harness-skills/scripts/check_assessment_contract.py assessments/company-brain.md
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v

      - name: Commit canonical admission and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/company-brain-admit-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'index: admit Company Brain'
          git push origin HEAD:assessment/company-brain
