name: tmp-squad-s2-644

on:
  push:
    branches:
      - experiment/squad-canonical-s2-644

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/squad-canonical-s2-644
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply reviewed Squad S2 evidence
        run: python scripts/.tmp_apply_squad_s2_644.py
      - name: Render derived capability views
        run: |
          python experiments/functional-capability-depth/render_function_baselines.py
          python experiments/functional-capability-depth/render_evidence_frontier.py
      - name: Validate focused evidence state
        run: |
          python experiments/functional-capability-depth/s2-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s2-system-benchmarks/matched-cell/validate_s2_primary_search_closure.py
          python experiments/functional-capability-depth/render_function_baselines.py --check
          python experiments/functional-capability-depth/render_evidence_frontier.py --check
          python experiments/functional-capability-depth/validate_synthesis.py
          python -m unittest discover -s tests -v
      - name: Commit migrated branch state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/functional-capability-depth tests/test_s2_post_closure_shep_axocoatl.py
          if git diff --cached --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git commit -m "experiment: admit Squad canonical direct S2 evidence"
          git push origin HEAD:experiment/squad-canonical-s2-644
