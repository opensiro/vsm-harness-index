name: one-shot admission 113

on:
  push:
    branches:
      - admission-proposed-01

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admission-proposed-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Synchronize canonical admission data
        run: |
          python - <<'PY'
          from pathlib import Path

          refs = {
              "gemini-cli": "6a466a7e2fe2b1255752c1e74f69b31f0216084d",
              "crush": "ef7bae117905a3927b177ed6923f36e811737d53",
              "qwen-code": "3ac6fe65e81c84897c02d22abd3dc91d1e567d5f",
              "deepagents": "f86b4e9abef7620b63a7258bc9fab0ccd83de8a4",
              "oh-my-pi": "dbf3afad4894bde827d90f965e77b3fe1c5a95e5",
          }

          catalog = Path("data/catalog.psv")
          out = []
          seen = set()
          for raw in catalog.read_text().splitlines():
              if raw.startswith("catalog_position|"):
                  out.append(raw)
                  continue
              parts = raw.split("|")
              if len(parts) >= 8 and parts[1] in refs:
                  parts[6] = refs[parts[1]]
                  parts[7] = "2026-09-17"
                  seen.add(parts[1])
                  raw = "|".join(parts)
              out.append(raw)
          missing = set(refs) - seen
          if missing:
              raise SystemExit(f"catalog harness ids not found: {sorted(missing)}")
          catalog.write_text("\n".join(out) + "\n")

          signatures = {
              53: ("gemini-cli", "Local-agent execution uses isolated registries and an event-driven per-agent tool scheduler; bounded delegation and tool confirmation remain S1 support rather than S2-S5 closure."),
              59: ("crush", "Parallel task-agent delegation plus a serialized per-tool permission service constrain operational execution, but do not establish inter-S1 coordination, whole-system control, or ultimate-policy closure."),
              63: ("qwen-code", "TeamManager closes agent-owned S2 through shared task ownership and bounded message backpressure, while the team leader owns teammate lifecycle/current commitments with a distinct parent-confirmed S3 mode."),
              65: ("deepagents", "The main agent can inspect, redirect and cancel its live async-subagent commitments as autonomous S3, while a separate rubric grader independently gathers read-only evidence and loops failed criteria back as autonomous S3*."),
              72: ("oh-my-pi", "Agent-selected isolated worktrees attenuate sibling merge conflicts; model-facing Hub and human Agent Hub provide autonomous plus parent-governed S3, while Advisor independently inspects the workspace and steers the primary loop."),
          }

          sig_path = Path("data/signatures.psv")
          lines = sig_path.read_text().splitlines()
          header = lines[0]
          rows = {}
          for raw in lines[1:]:
              if not raw.strip():
                  continue
              pos, hid, text = raw.split("|", 2)
              rows[int(pos)] = (hid, text)
          for pos, row in signatures.items():
              rows[pos] = row
          sig_path.write_text(
              header + "\n" + "\n".join(f"{pos}|{rows[pos][0]}|{rows[pos][1]}" for pos in sorted(rows)) + "\n"
          )
          PY

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Regenerate derived views
        run: python scripts/render_tldr.py

      - name: Validate index
        run: python scripts/check_index.py

      - name: Commit generated admission state and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md
          git rm .github/workflows/one-shot-admission-113.yml
          git commit -m "admission: finalize proposed canonical batch 01"
          git push origin HEAD:admission-proposed-01
