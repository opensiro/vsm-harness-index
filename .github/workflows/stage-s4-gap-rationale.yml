name: stage S4 gap rationale
on:
  push:
    branches:
      - experiment/a-evolve-canonical-s4-517
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update S4 baseline rationale
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('experiments/functional-capability-depth/primary-baselines.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          s4 = data['functions']['S4']
          old = 'Current direct families evaluate benchmark-defined or composed adaptation loops rather than matched native S4 implementations across canonical harnesses.'
          if s4.get('blocking_reason') != old:
              raise SystemExit(f'unexpected S4 blocking_reason: {s4.get("blocking_reason")!r}')
          s4['blocking_reason'] = ('Direct S4 evidence now includes one canonical native A-Evolve harness-updating observation, but public evidence still does not provide a matched comparison of native S4 implementations across multiple canonical harnesses under one common benchmark/model/configuration cell.')
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          python experiments/functional-capability-depth/render_function_baselines.py
      - name: Validate
        run: |
          python experiments/functional-capability-depth/s4-system-benchmarks/validate.py
          python experiments/functional-capability-depth/render_function_baselines.py --check
          python experiments/functional-capability-depth/render_s1_baseline.py --check
          python experiments/functional-capability-depth/s2-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s3-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s3star-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s5-system-benchmarks/validate.py
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v
      - name: Commit rationale
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/functional-capability-depth/primary-baselines.json experiments/functional-capability-depth/FUNCTION-BASELINES.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'experiment: update S4 gap rationale after canonical observation'
          git push
