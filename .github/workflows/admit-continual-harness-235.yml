name: admit-continual-harness-235

on:
  push:
    branches:
      - admit-continual-harness-235
    paths:
      - .github/workflows/admit-continual-harness-235.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admit-continual-harness-235
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply canonical inclusion sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/continual-harness.md')
          text = assessment.read_text(encoding='utf-8')
          old = 'status: proposed\n'
          new = 'status: included\n'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one proposed status in continual-harness assessment')
          assessment.write_text(text.replace(old, new, 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          ctext = catalog.read_text(encoding='utf-8')
          row = '235|continual-harness|Continual Harness|https://github.com/sethkarten/continual-harness|2025-07-08T00:55:50Z|index-addition|bbab97ad73e460b7cd7c08527d10ced30cc03fbe|2026-09-24'
          if '|continual-harness|' in ctext:
              raise SystemExit('continual-harness already present in catalog')
          nonempty = [line for line in ctext.splitlines() if line.strip()]
          if not nonempty[-1].startswith('234|wasp|'):
              raise SystemExit('catalog tail moved; refusing slot 235')
          catalog.write_text(ctext.rstrip('\n') + '\n' + row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          stext = signatures.read_text(encoding='utf-8')
          sig = ('235|continual-harness|Continual Harness closes autonomous S1 through its continuing PokeAgent model/tool loop '
                 'and autonomous S4 through reset-free model-driven persistent prompt, subagent, skill and memory evolution from accumulated trajectories; '
                 'no material S2, S3, S3* or S5 closure is established in the reviewed continualharness scaffold.')
          if '|continual-harness|' in stext:
              raise SystemExit('continual-harness already present in signatures')
          signatures.write_text(stext.rstrip('\n') + '\n' + sig + '\n', encoding='utf-8')
          PY
      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
      - name: Validate generated state
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/render_full_a.py --check
      - name: Commit rendered admission
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assessments/continual-harness.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md METRICS.md data/metrics.json README.md FULL_A.md
          git diff --cached --quiet && { echo 'No admission changes produced'; exit 1; }
          git commit -s -m "admit: render Continual Harness inclusion"
          git push origin HEAD:admit-continual-harness-235
