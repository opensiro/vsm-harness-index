name: assemble OpenFang admission

on:
  push:
    branches:
      - admit-openfang-140

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admit-openfang-140
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Promote OpenFang and append canonical provenance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/openfang.md')
          text = assessment.read_text(encoding='utf-8')
          needle = 'assessment_procedure_version: 0.3.5\nstatus: proposed\n'
          replacement = 'assessment_procedure_version: 0.3.5\nassessment_changed_at: 2026-09-20\nstatus: included\n'
          if needle not in text:
              raise SystemExit('OpenFang assessment is not in expected proposed state')
          assessment.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_text = catalog.read_text(encoding='utf-8')
          if '|openfang|' in catalog_text:
              raise SystemExit('OpenFang already present in catalog')
          rows = [line for line in catalog_text.splitlines() if line.strip()]
          if not rows[-1].startswith('165|'):
              raise SystemExit(f'Expected catalog position 165 before admission, got: {rows[-1]}')
          catalog_row = '166|openfang|OpenFang|https://github.com/RightNow-AI/openfang|2026-02-24T23:12:38Z|index-addition|acf2587e46be174c10200489c9a2d23a39a98aeb|2026-09-20'
          catalog.write_text(catalog_text.rstrip('\n') + '\n' + catalog_row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          sig_text = signatures.read_text(encoding='utf-8')
          if '|openfang|' in sig_text:
              raise SystemExit('OpenFang already present in signatures')
          signature = ('166|openfang|OpenFang ships autonomous first-party agent and Hand loops plus a bundled Orchestrator that owns current fleet allocation through live agent state and send/spawn/kill decisions; delegation/workflows do not establish S2, audit/reporting paths do not close corrective S3*, prospective sensing/memory do not promote future capability as S4, and configuration/security policy does not close S5.')
          signatures.write_text(sig_text.rstrip('\n') + '\n' + signature + '\n', encoding='utf-8')
          PY

      - name: Regenerate canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Validate assembled admission
        run: |
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v

      - name: Commit canonical admission
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/openfang.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md FULL_A.md METRICS.md data/metrics.json README.md
          git commit -m 'admit: assemble OpenFang canonical artifacts'
          git push origin HEAD:admit-openfang-140

      - name: Remove temporary assembler
        run: |
          rm .github/workflows/assemble-openfang-admission.yml
          git add .github/workflows/assemble-openfang-admission.yml
          git commit -m 'chore: remove OpenFang admission assembler'
          git push origin HEAD:admit-openfang-140
