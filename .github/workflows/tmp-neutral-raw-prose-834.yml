name: tmp neutral raw prose 834

on:
  push:
    branches:
      - experiment/neutral-raw-prose-values-834

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact neutral raw prose rewrites
        run: |
          python .github/tmp_apply_neutral_raw_prose_834.py
          python .github/tmp_patch_neutral_prose_consumers_834.py
          python .github/tmp_patch_prose_regressions_834.py
      - name: Validate neutral registry
        run: |
          python experiments/functional-capability-depth/system-observations/validate.py
          python experiments/functional-capability-depth/system-observations/render_registry.py --check
      - name: Validate S2
        run: |
          python experiments/functional-capability-depth/s2-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s2-system-benchmarks/matched-cell/validate_s2_primary_search_closure.py
          python experiments/functional-capability-depth/s2-system-benchmarks/matched-cell/validate_s2_matched_canonical_search.py
      - name: Validate S3
        run: |
          python experiments/functional-capability-depth/s3-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s3-system-benchmarks/matched-cell/validate_s3_primary_search_closure.py
          python experiments/functional-capability-depth/s3-system-benchmarks/matched-cell/validate_s3_matched_canonical_search.py
      - name: Validate S3 star
        run: |
          python experiments/functional-capability-depth/s3star-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s3star-system-benchmarks/matched-cell/validate_s3star_primary_search_closure.py
      - name: Validate S4
        run: |
          python experiments/functional-capability-depth/s4-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s4-system-benchmarks/matched-cell/validate.py
          python experiments/functional-capability-depth/s4-system-benchmarks/matched-cell/validate_public_polybench.py
          python experiments/functional-capability-depth/s4-system-benchmarks/matched-cell/validate_public_polybench_paper_controls.py
          python experiments/functional-capability-depth/s4-system-benchmarks/matched-cell/validate_public_polybench_continual_linkage.py
          python experiments/functional-capability-depth/s4-system-benchmarks/matched-cell/validate_public_polybench_gepa_linkage.py
          python experiments/functional-capability-depth/s4-system-benchmarks/matched-cell/validate_public_polybench_meta_harness_linkage.py
          python experiments/functional-capability-depth/s4-system-benchmarks/matched-cell/validate_public_polybench_skillos_linkage.py
          python experiments/functional-capability-depth/s4-system-benchmarks/matched-cell/validate_s4_primary_search_closure.py
      - name: Validate S5
        run: |
          python experiments/functional-capability-depth/s5-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s5-system-benchmarks/matched-cell/validate_s5_primary_search_closure.py
          python experiments/functional-capability-depth/s5-system-benchmarks/matched-cell/validate_second_canonical_search.py
      - name: Validate synthesis and Index
        run: |
          python experiments/functional-capability-depth/validate_synthesis.py
          python scripts/check_index.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Remove assembler artifacts
        run: |
          rm .github/tmp_apply_neutral_raw_prose_834.py
          rm .github/tmp_patch_neutral_prose_consumers_834.py
          rm .github/tmp_patch_prose_regressions_834.py
          rm .github/workflows/tmp-neutral-raw-prose-834.yml
      - name: Commit assembled transaction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "experiment: neutralize remaining raw evidence prose"
          git push origin HEAD:experiment/neutral-raw-prose-values-834
