name: Validate ReplicatorAgent review

on:
  push:
    branches:
      - assessment/replicator-agent-review

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment/replicator-agent-review
          fetch-depth: 0

      - name: Render review metrics
        run: python scripts/render_metrics.py

      - name: Validate review state
        run: |
          python scripts/check_index.py
          python scripts/render_metrics.py --check
          python -m unittest discover -s tests -v

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/replicator-agent-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/replicator-agent.md METRICS.md data/metrics.json .github/workflows/replicator-agent-review.yml
          git commit -m 'assessment: validate ReplicatorAgent review'
          git push origin HEAD:assessment/replicator-agent-review
