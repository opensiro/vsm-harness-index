name: r2-batch6-metadata

on:
  push:
    branches:
      - r2-batch-6-s2-constructor-revalidation

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize R2 batch 6 records
        run: |
          python - <<'PY'
          from pathlib import Path

          checked = {
              'autoharness': '3561e468f9ca9f9bf282512e695bd32e4e90fef4',
              'claw-code-agent': '167571da895b2a1a9e36ecfae2876984cef65e0d',
              'strands-agents': 'e7fd22b63f3988997a12fb962144a9663a27d071',
              'agent-squad': '31eccfeb0d546262d1d0ec2e2e5239186f8d2954',
              'chatdev': '4fb2db0ea90375ce1059f44fe03ffbd191a7a169',
          }
          for harness, checked_ref in checked.items():
              path = Path(f'assessments/{harness}.md')
              text = path.read_text()
              frontmatter = text.split('---', 2)[1]
              if 'profile_version:' not in frontmatter:
                  marker = 'reviewed_at: 2026-09-15\n'
                  block = (
                      marker
                      + 'profile_version: 0.2.1\n'
                      + 'assessment_procedure_version: 0.3.1\n'
                      + f'last_checked_ref: {checked_ref}\n'
                      + 'last_checked_at: 2026-09-17\n'
                      + 'assessment_changed_at: 2026-09-15\n'
                      + 'last_reassessment_round: R2\n'
                  )
                  text = text.replace(marker, block, 1)
                  path.write_text(text)

          history = Path('data/reassessment-history.psv')
          rows = [
              'R2|autoharness|3561e468f9ca9f9bf282512e695bd32e4e90fef4|3561e468f9ca9f9bf282512e695bd32e4e90fef4|3561e468f9ca9f9bf282512e695bd32e4e90fef4|2026-09-17|0.2.1|0.3.1|no-upstream-change|—|https://github.com/aiming-lab/AutoHarness/blob/3561e468f9ca9f9bf282512e695bd32e4e90fef4/autoharness/agents/swarm.py ; https://github.com/aiming-lab/AutoHarness/blob/3561e468f9ca9f9bf282512e695bd32e4e90fef4/docs/concepts/agents.md',
              'R2|claw-code-agent|167571da895b2a1a9e36ecfae2876984cef65e0d|167571da895b2a1a9e36ecfae2876984cef65e0d|167571da895b2a1a9e36ecfae2876984cef65e0d|2026-09-17|0.2.1|0.3.1|no-upstream-change|—|https://github.com/HarnessLab/claw-code-agent/blob/167571da895b2a1a9e36ecfae2876984cef65e0d/README.md ; https://github.com/HarnessLab/claw-code-agent/blob/167571da895b2a1a9e36ecfae2876984cef65e0d/PARITY_CHECKLIST.md',
              'R2|strands-agents|08ed4cfd3eb42ae9f668595e675d5f196eee7e44|e7fd22b63f3988997a12fb962144a9663a27d071|08ed4cfd3eb42ae9f668595e675d5f196eee7e44|2026-09-17|0.2.1|0.3.1|no-material-change|—|https://github.com/strands-agents/harness-sdk/compare/08ed4cfd3eb42ae9f668595e675d5f196eee7e44...e7fd22b63f3988997a12fb962144a9663a27d071 ; https://github.com/strands-agents/harness-sdk/blob/e7fd22b63f3988997a12fb962144a9663a27d071/strands-ts/src/multiagent/swarm.ts',
              'R2|agent-squad|31eccfeb0d546262d1d0ec2e2e5239186f8d2954|31eccfeb0d546262d1d0ec2e2e5239186f8d2954|31eccfeb0d546262d1d0ec2e2e5239186f8d2954|2026-09-17|0.2.1|0.3.1|no-upstream-change|—|https://github.com/2FastLabs/agent-squad/blob/31eccfeb0d546262d1d0ec2e2e5239186f8d2954/python/src/agent_squad/agents/supervisor_agent.py',
              'R2|chatdev|4fb2db0ea90375ce1059f44fe03ffbd191a7a169|4fb2db0ea90375ce1059f44fe03ffbd191a7a169|4fb2db0ea90375ce1059f44fe03ffbd191a7a169|2026-09-17|0.2.1|0.3.1|no-upstream-change|—|https://github.com/OpenBMB/ChatDev/blob/4fb2db0ea90375ce1059f44fe03ffbd191a7a169/workflow/runtime/execution_strategy.py ; https://github.com/OpenBMB/ChatDev/blob/4fb2db0ea90375ce1059f44fe03ffbd191a7a169/workflow/graph.py',
          ]
          text = history.read_text()
          for row in rows:
              key = '|'.join(row.split('|')[:2]) + '|'
              if key not in text:
                  text = text.rstrip('\n') + '\n' + row + '\n'
          history.write_text(text)

          round_file = Path('reassessments/R2-2026-09-16.md')
          text = round_file.read_text()
          table_rows = [
              '| `autoharness` | `3561e468f9ca9f9bf282512e695bd32e4e90fef4` | `3561e468f9ca9f9bf282512e695bd32e4e90fef4` | 2026-09-17 | 0.2.1 | 0.3.1 | no-upstream-change | — | [swarm coordination](https://github.com/aiming-lab/AutoHarness/blob/3561e468f9ca9f9bf282512e695bd32e4e90fef4/autoharness/agents/swarm.py) |',
              '| `claw-code-agent` | `167571da895b2a1a9e36ecfae2876984cef65e0d` | `167571da895b2a1a9e36ecfae2876984cef65e0d` | 2026-09-17 | 0.2.1 | 0.3.1 | no-upstream-change | — | [team/dependency runtime](https://github.com/HarnessLab/claw-code-agent/blob/167571da895b2a1a9e36ecfae2876984cef65e0d/README.md) |',
              '| `strands-agents` | `08ed4cfd3eb42ae9f668595e675d5f196eee7e44` | `e7fd22b63f3988997a12fb962144a9663a27d071` | 2026-09-17 | 0.2.1 | 0.3.1 | no-material-change | — | [upstream delta](https://github.com/strands-agents/harness-sdk/compare/08ed4cfd3eb42ae9f668595e675d5f196eee7e44...e7fd22b63f3988997a12fb962144a9663a27d071), [repetitive-handoff regulation](https://github.com/strands-agents/harness-sdk/blob/e7fd22b63f3988997a12fb962144a9663a27d071/strands-ts/src/multiagent/swarm.ts) |',
              '| `agent-squad` | `31eccfeb0d546262d1d0ec2e2e5239186f8d2954` | `31eccfeb0d546262d1d0ec2e2e5239186f8d2954` | 2026-09-17 | 0.2.1 | 0.3.1 | no-upstream-change | — | [SupervisorAgent intermediary](https://github.com/2FastLabs/agent-squad/blob/31eccfeb0d546262d1d0ec2e2e5239186f8d2954/python/src/agent_squad/agents/supervisor_agent.py) |',
              '| `chatdev` | `4fb2db0ea90375ce1059f44fe03ffbd191a7a169` | `4fb2db0ea90375ce1059f44fe03ffbd191a7a169` | 2026-09-17 | 0.2.1 | 0.3.1 | no-upstream-change | — | [majority-vote strategy](https://github.com/OpenBMB/ChatDev/blob/4fb2db0ea90375ce1059f44fe03ffbd191a7a169/workflow/runtime/execution_strategy.py) |',
          ]
          if '| `autoharness` |' not in text:
              marker = '\n## Completion\n'
              text = text.replace(marker, '\n' + '\n'.join(table_rows) + '\n' + marker, 1)
              round_file.write_text(text)
          PY
      - name: Commit metadata
        run: |
          if git diff --quiet -- assessments data/reassessment-history.psv reassessments/R2-2026-09-16.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assessments data/reassessment-history.psv reassessments/R2-2026-09-16.md
          git commit -m "Record R2 batch 6 reassessment outcomes"
          git push origin HEAD:r2-batch-6-s2-constructor-revalidation
