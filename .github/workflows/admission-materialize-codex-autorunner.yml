name: admission-materialize-codex-autorunner

on:
  push:
    branches:
      - admission/codex-autorunner-1009

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical CAR admission sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/codex-autorunner.md')
          text = assessment.read_text(encoding='utf-8')
          expected = 'status: proposed\n'
          if text.count(expected) != 1:
              raise SystemExit('expected exactly one proposed CAR status')
          if 'review_ref: 065f435d6120f95135425d8cc2df52760872a2d3\n' not in text:
              raise SystemExit('unexpected CAR review ref')
          assessment.write_text(text.replace(expected, 'status: included\n', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          rows = catalog.read_text(encoding='utf-8').splitlines()
          if any('|codex-autorunner|' in row or 'https://github.com/Git-on-my-level/codex-autorunner' in row for row in rows[1:]):
              raise SystemExit('CAR already present in catalog')
          positions = [int(row.split('|', 1)[0]) for row in rows[1:] if row.strip()]
          next_position = max(positions) + 1
          if next_position != 332:
              raise SystemExit(f'unexpected next catalog position: {next_position}')
          rows.append('332|codex-autorunner|codex-autorunner (CAR)|https://github.com/Git-on-my-level/codex-autorunner|2025-12-09T15:57:56Z|index-addition|065f435d6120f95135425d8cc2df52760872a2d3|2026-09-20')
          catalog.write_text('\n'.join(rows) + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          sig_rows = signatures.read_text(encoding='utf-8').splitlines()
          if any('|codex-autorunner|' in row for row in sig_rows[1:]):
              raise SystemExit('CAR signature already present')
          signature = (
              'codex-autorunner closes autonomous S1 through supported coding-agent work cells, constructor-owned S2 through isolated worktree/resource bindings, '
              'and parent-capable autonomous S3 through PMA hub-level current-control decisions; no qualifying S3* complementary audit, prospective S4 adaptation, or S5 identity/ultimate-policy closure is established.'
          )
          sig_rows.append(f'332|codex-autorunner|{signature}')
          signatures.write_text('\n'.join(sig_rows) + '\n', encoding='utf-8')
          PY
      - name: Render canonical projections
        shell: bash
        run: |
          python scripts/render_tldr.py
          python scripts/render_analytics.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
      - name: Verify generated tree
        shell: bash
        run: |
          python scripts/check_index.py
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_analytics.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/render_full_a.py --check
          python -m unittest discover -s tests -v
      - name: Commit materialized admission and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/admission-materialize-codex-autorunner.yml
          git add assessments/codex-autorunner.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics METRICS.md data/metrics.json README.md FULL_A.md 2>/dev/null || true
          git diff --cached --check
          git commit -m 'Index: admit codex-autorunner at catalog #332'
          git push origin HEAD:admission/codex-autorunner-1009
