name: tmp-generate-yylo

on:
  push:
    branches:
      - admit-yylo-37

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admit-yylo-37
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add canonical corpus rows and render projections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          rows = {
              "data/catalog.psv": "107|yylo|YYLO|https://github.com/yylo-dev/yylo|2026-01-06T18:57:23Z|index-addition|93abebf1a787bd1d6c14677d0766e64361bda1ae|2026-09-16",
              "data/signatures.psv": "107|yylo|Parallel task worktrees plus native Git conflict/target-movement handling provide constructor-owned S2, while a fresh exact-tip read-only reviewer with structured findings exposes composable S3*; no S3/S4/S5 closure is established.",
          }
          for filename, row in rows.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if text and not text.endswith("\n"):
                  text += "\n"
              if row not in text.splitlines():
                  text += row + "\n"
              path.write_text(text, encoding="utf-8")
          PY
          python scripts/render_tldr.py
          python scripts/check_index.py
          python -m unittest discover -s tests -v
      - name: Commit generated corpus changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Generate YYLO corpus projections'
          git push origin HEAD:admit-yylo-37
