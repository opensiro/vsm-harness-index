name: admission-materialize-minagent

on:
  push:
    branches:
      - admission/minagent-1011

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical MinAgent admission sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/minagent.md')
          text = assessment.read_text(encoding='utf-8')
          expected = 'status: proposed\n'
          if text.count(expected) != 1:
              raise SystemExit('expected exactly one proposed minagent status')
          if 'review_ref: 02880e3c981ba57cd95d2266d6c0ea07b1abe44c\n' not in text:
              raise SystemExit('unexpected MinAgent review ref')
          assessment.write_text(text.replace(expected, 'status: included\n', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          rows = catalog.read_text(encoding='utf-8').splitlines()
          if any('|minagent|' in row or 'https://github.com/Nichonauta/MinAgent' in row for row in rows[1:]):
              raise SystemExit('MinAgent already present in catalog')
          positions = [int(row.split('|', 1)[0]) for row in rows[1:] if row.strip()]
          next_position = max(positions) + 1
          if next_position != 341:
              raise SystemExit(f'unexpected next catalog position: {next_position}')
          rows.append('341|minagent|MinAgent|https://github.com/Nichonauta/MinAgent|2026-09-24T23:08:17Z|index-addition|02880e3c981ba57cd95d2266d6c0ea07b1abe44c|2026-09-28')
          catalog.write_text('\n'.join(rows) + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          sig_rows = signatures.read_text(encoding='utf-8').splitlines()
          if any('|minagent|' in row for row in sig_rows[1:]):
              raise SystemExit('MinAgent signature already present')
          signature = (
              'MinAgent closes an autonomous coding model/tool loop (S1=A) and a documented autonomous project-adaptation loop through /init: '
              'workspace evidence is synthesized into persistent AGENTS.md guidance reloaded into later operation (S4=A). '
              'No qualifying S2, S3, S3* or S5 closure is established.'
          )
          sig_rows.append(f'341|minagent|{signature}')
          signatures.write_text('\n'.join(sig_rows) + '\n', encoding='utf-8')
          PY
      - name: Render canonical projections
        shell: bash
        run: |
          python scripts/render_tldr.py
          python scripts/render_analytics.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
      - name: Verify generated tree
        shell: bash
        run: |
          python scripts/check_index.py
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_analytics.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/render_full_a.py --check
          python -m unittest discover -s tests -v
      - name: Commit materialized admission and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/admission-materialize-minagent.yml
          git add assessments/minagent.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics METRICS.md data/metrics.json README.md FULL_A.md 2>/dev/null || true
          git diff --cached --check
          git commit -m 'Index: admit MinAgent at catalog #341'
          git push origin HEAD:admission/minagent-1011
