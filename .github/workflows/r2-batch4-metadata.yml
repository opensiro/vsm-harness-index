name: r2-batch4-metadata

on:
  push:
    branches:
      - r2-batch-4-metasystem-unknowns

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize R2 batch 4 records
        run: |
          python - <<'PY'
          from pathlib import Path

          checked = {
              'autogpt': ('98381ab27f733468bfe1f9c4f4942b4b416d9a8b', '2026-09-15'),
              'semantic-kernel': ('ca40aa7226531d28a721d0ca0e451d0aaf86dafc', '2026-09-15'),
              'langflow': ('5621dcfd84e11108e4cc1ecb0c51f41053c4211c', '2026-09-15'),
              'llama-index': ('fd4a517ad6490f0c8464a13fdf133760b696434a', '2026-09-15'),
              'langchain': ('5c1f28271295bb13034f4cf8964f74c117357d40', '2026-09-15'),
          }
          for harness, (checked_ref, changed_at) in checked.items():
              path = Path(f'assessments/{harness}.md')
              text = path.read_text()
              if 'profile_version:' not in text.split('---', 2)[1]:
                  marker = 'reviewed_at: 2026-09-15\n'
                  block = (
                      marker
                      + 'profile_version: 0.2.1\n'
                      + 'assessment_procedure_version: 0.3.1\n'
                      + f'last_checked_ref: {checked_ref}\n'
                      + 'last_checked_at: 2026-09-17\n'
                      + f'assessment_changed_at: {changed_at}\n'
                      + 'last_reassessment_round: R2\n'
                  )
                  text = text.replace(marker, block, 1)
                  path.write_text(text)

          history = Path('data/reassessment-history.psv')
          rows = [
              'R2|autogpt|98381ab27f733468bfe1f9c4f4942b4b416d9a8b|98381ab27f733468bfe1f9c4f4942b4b416d9a8b|98381ab27f733468bfe1f9c4f4942b4b416d9a8b|2026-09-17|0.2.1|0.3.1|no-upstream-change|—|https://github.com/Significant-Gravitas/AutoGPT/commit/98381ab27f733468bfe1f9c4f4942b4b416d9a8b',
              'R2|semantic-kernel|ca40aa7226531d28a721d0ca0e451d0aaf86dafc|ca40aa7226531d28a721d0ca0e451d0aaf86dafc|ca40aa7226531d28a721d0ca0e451d0aaf86dafc|2026-09-17|0.2.1|0.3.1|no-upstream-change|—|https://github.com/microsoft/semantic-kernel/blob/ca40aa7226531d28a721d0ca0e451d0aaf86dafc/python/semantic_kernel/agents/orchestration/group_chat.py',
              'R2|langflow|595cd72a2b2021f2375fa31109af02d20bb17648|5621dcfd84e11108e4cc1ecb0c51f41053c4211c|595cd72a2b2021f2375fa31109af02d20bb17648|2026-09-17|0.2.1|0.3.1|no-material-change|—|https://github.com/langflow-ai/langflow/compare/595cd72a2b2021f2375fa31109af02d20bb17648...5621dcfd84e11108e4cc1ecb0c51f41053c4211c ; https://github.com/langflow-ai/langflow/blob/5621dcfd84e11108e4cc1ecb0c51f41053c4211c/src/lfx/src/lfx/components/llm_operations/guardrails_v2.py',
              'R2|llama-index|7169bcd0dca2e16aecc8e0247f34e50079d9c0d5|fd4a517ad6490f0c8464a13fdf133760b696434a|7169bcd0dca2e16aecc8e0247f34e50079d9c0d5|2026-09-17|0.2.1|0.3.1|no-material-change|—|https://github.com/run-llama/llama_index/compare/7169bcd0dca2e16aecc8e0247f34e50079d9c0d5...fd4a517ad6490f0c8464a13fdf133760b696434a ; https://github.com/run-llama/llama_index/blob/7169bcd0dca2e16aecc8e0247f34e50079d9c0d5/docs/src/content/docs/framework/understanding/agent/multi_agent.md',
              'R2|langchain|348c9dc572599947d2d7d33d6a5b8b936e92a1d4|5c1f28271295bb13034f4cf8964f74c117357d40|348c9dc572599947d2d7d33d6a5b8b936e92a1d4|2026-09-17|0.2.1|0.3.1|no-material-change|—|https://github.com/langchain-ai/langchain/compare/348c9dc572599947d2d7d33d6a5b8b936e92a1d4...5c1f28271295bb13034f4cf8964f74c117357d40 ; https://github.com/langchain-ai/langchain/blob/348c9dc572599947d2d7d33d6a5b8b936e92a1d4/libs/langchain/langchain_classic/evaluation/agents/trajectory_eval_chain.py',
          ]
          text = history.read_text()
          for row in rows:
              key = '|'.join(row.split('|')[:2]) + '|'
              if key not in text:
                  text = text.rstrip('\n') + '\n' + row + '\n'
          history.write_text(text)

          round_file = Path('reassessments/R2-2026-09-16.md')
          text = round_file.read_text()
          table_rows = [
              '| `autogpt` | `98381ab27f733468bfe1f9c4f4942b4b416d9a8b` | `98381ab27f733468bfe1f9c4f4942b4b416d9a8b` | 2026-09-17 | 0.2.1 | 0.3.1 | no-upstream-change | — | [accepted/current ref](https://github.com/Significant-Gravitas/AutoGPT/commit/98381ab27f733468bfe1f9c4f4942b4b416d9a8b) |',
              '| `semantic-kernel` | `ca40aa7226531d28a721d0ca0e451d0aaf86dafc` | `ca40aa7226531d28a721d0ca0e451d0aaf86dafc` | 2026-09-17 | 0.2.1 | 0.3.1 | no-upstream-change | — | [group-chat manager](https://github.com/microsoft/semantic-kernel/blob/ca40aa7226531d28a721d0ca0e451d0aaf86dafc/python/semantic_kernel/agents/orchestration/group_chat.py) |',
              '| `langflow` | `595cd72a2b2021f2375fa31109af02d20bb17648` | `5621dcfd84e11108e4cc1ecb0c51f41053c4211c` | 2026-09-17 | 0.2.1 | 0.3.1 | no-material-change | — | [upstream delta](https://github.com/langflow-ai/langflow/compare/595cd72a2b2021f2375fa31109af02d20bb17648...5621dcfd84e11108e4cc1ecb0c51f41053c4211c), [Guardrails v2](https://github.com/langflow-ai/langflow/blob/5621dcfd84e11108e4cc1ecb0c51f41053c4211c/src/lfx/src/lfx/components/llm_operations/guardrails_v2.py) |',
              '| `llama-index` | `7169bcd0dca2e16aecc8e0247f34e50079d9c0d5` | `fd4a517ad6490f0c8464a13fdf133760b696434a` | 2026-09-17 | 0.2.1 | 0.3.1 | no-material-change | — | [upstream delta](https://github.com/run-llama/llama_index/compare/7169bcd0dca2e16aecc8e0247f34e50079d9c0d5...fd4a517ad6490f0c8464a13fdf133760b696434a) |',
              '| `langchain` | `348c9dc572599947d2d7d33d6a5b8b936e92a1d4` | `5c1f28271295bb13034f4cf8964f74c117357d40` | 2026-09-17 | 0.2.1 | 0.3.1 | no-material-change | — | [upstream delta](https://github.com/langchain-ai/langchain/compare/348c9dc572599947d2d7d33d6a5b8b936e92a1d4...5c1f28271295bb13034f4cf8964f74c117357d40), [trajectory evaluator boundary](https://github.com/langchain-ai/langchain/blob/348c9dc572599947d2d7d33d6a5b8b936e92a1d4/libs/langchain/langchain_classic/evaluation/agents/trajectory_eval_chain.py) |',
          ]
          if '| `autogpt` |' not in text:
              marker = '\n## Completion\n'
              text = text.replace(marker, '\n' + '\n'.join(table_rows) + '\n' + marker, 1)
              round_file.write_text(text)
          PY
      - name: Commit metadata
        run: |
          if git diff --quiet -- assessments data/reassessment-history.psv reassessments/R2-2026-09-16.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assessments data/reassessment-history.psv reassessments/R2-2026-09-16.md
          git commit -m "Record R2 batch 4 reassessment outcomes"
          git push origin HEAD:r2-batch-4-metasystem-unknowns
