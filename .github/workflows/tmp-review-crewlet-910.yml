name: tmp-review-crewlet-910

on:
  push:
    branches:
      - assessment/crewlet-review-910

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment/crewlet-review-910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render and validate proposed review
        shell: bash
        run: |
          set -euo pipefail
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python -m unittest discover -s tests -v
          git diff --check
          rm .github/workflows/tmp-review-crewlet-910.yml
          git config user.name 'OpenSiro Automation'
          git config user.email 'founders@opensiro.com'
          git add -A
          git commit -m 'metrics: render proposed Crewlet review'
          git push origin HEAD:assessment/crewlet-review-910
