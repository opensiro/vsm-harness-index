name: temporary Axocoatl admission provenance correction

on:
  push:
    branches:
      - admit-axocoatl-246

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct canonical repository provenance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/axocoatl.md')
          text = assessment.read_text(encoding='utf-8')
          if '\nstatus: included\n' not in text:
              raise SystemExit('Axocoatl is not in included admission state')

          catalog = Path('data/catalog.psv')
          catalog_text = catalog.read_text(encoding='utf-8')
          old = '246|axocoatl|Axocoatl|https://github.com/axocoatl/axocoatl|2026-07-25T00:32:40Z|index-addition|edfe5031463686dc782cf3539e5aabae4e8eb9ab|2026-09-25'
          new = '246|axocoatl|Axocoatl|https://github.com/axocoatl/axocoatl|2026-06-04T05:24:13Z|index-addition|edfe5031463686dc782cf3539e5aabae4e8eb9ab|2026-09-25'
          if old not in catalog_text:
              raise SystemExit('Axocoatl catalog row with incorrect created_at not found')
          catalog.write_text(catalog_text.replace(old, new, 1), encoding='utf-8')

          signatures = Path('data/signatures.psv').read_text(encoding='utf-8')
          if '|axocoatl|' not in signatures:
              raise SystemExit('Axocoatl signature missing from generated admission')
          PY
      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
      - name: Validate generated state
        run: |
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/check_index.py
          python -m unittest discover -s tests -v
      - name: Commit corrected admission
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.psv TLDR.md RANKINGS.md analytics/temporal.md FULL_A.md METRICS.md data/metrics.json README.md
          git commit -m 'index: correct Axocoatl repository provenance [admission-generated]'
          git push
