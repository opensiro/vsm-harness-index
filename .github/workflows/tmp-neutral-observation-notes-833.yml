name: tmp neutral observation notes 833

on:
  push:
    branches:
      - experiment/neutral-observation-notes-833

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch current main
        run: git fetch origin main
      - name: Patch remaining notes wording variant
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/tmp_apply_neutral_observation_notes_833.py')
          s = p.read_text(encoding='utf-8')
          anchor = '''    (
              "No S2-S5, ownership, or self-organizing S inference",
              "No other organizational-function, ownership, or self-organizing behavior inference",
          ),
          '''
          insert = anchor + '''    (
              "No S2-S5 or self-organizing S inference",
              "No other organizational-function or self-organizing behavior inference",
          ),
          '''
          if s.count(anchor) != 1 or '"No S2-S5 or self-organizing S inference"' in s:
              raise SystemExit('notes mapping anchor drift')
          p.write_text(s.replace(anchor, insert, 1), encoding='utf-8')
          PY
      - name: Apply #833 transaction
        run: python .github/tmp_apply_neutral_observation_notes_833.py
      - name: Validate transaction
        run: |
          python -m unittest discover -s tests -q
          python scripts/check_index.py
          python experiments/functional-capability-depth/render_function_baselines.py --check
          python experiments/functional-capability-depth/render_evidence_frontier.py --check
          python experiments/functional-capability-depth/render_s1_baseline.py --check
          python experiments/functional-capability-depth/system-observations/validate.py
          python experiments/functional-capability-depth/system-observations/render_registry.py --check
          python experiments/functional-capability-depth/s2-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s2-system-benchmarks/matched-cell/validate_s2_matched_canonical_search.py
          python experiments/functional-capability-depth/s2-system-benchmarks/matched-cell/validate_s2_primary_search_closure.py
          python experiments/functional-capability-depth/s3-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s3-system-benchmarks/matched-cell/validate_s3_matched_canonical_search.py
          python experiments/functional-capability-depth/s3-system-benchmarks/matched-cell/validate_s3_primary_search_closure.py
          python experiments/functional-capability-depth/s3star-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s3star-system-benchmarks/matched-cell/validate_s3star_primary_search_closure.py
          python experiments/functional-capability-depth/s4-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s4-system-benchmarks/matched-cell/validate.py
          python experiments/functional-capability-depth/s4-system-benchmarks/matched-cell/validate_s4_primary_search_closure.py
          python experiments/functional-capability-depth/s5-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s5-system-benchmarks/matched-cell/validate_s5_primary_search_closure.py
          python experiments/functional-capability-depth/validate_synthesis.py
          python scripts/check_generation_provenance.py --base-ref 8fb9de2275d7b2f2df57d7a0785fd466f710d5dc
          git diff --check
      - name: Remove assembler artifacts
        run: |
          rm .github/tmp_apply_neutral_observation_notes_833.py
          rm .github/workflows/tmp-neutral-observation-notes-833.yml
      - name: Commit assembled transaction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "experiment: neutralize function vocabulary in raw notes"
          git push origin HEAD:experiment/neutral-observation-notes-833
