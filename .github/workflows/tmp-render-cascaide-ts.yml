name: temporary cascaide-ts admission renderer

on:
  push:
    branches:
      - admit-cascaide-ts-232

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply canonical admission inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path("assessments/cascaide-ts.md")
          text = assessment.read_text(encoding="utf-8")
          old = "status: proposed\n"
          new = "status: included\n"
          if old in text:
              assessment.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("cascaide-ts assessment has neither proposed nor included status")

          catalog = Path("data/catalog.psv")
          catalog_text = catalog.read_text(encoding="utf-8")
          catalog_row = "232|cascaide-ts|cascaide-ts|https://github.com/Airavat-Research/cascaide-ts|2026-05-15T12:46:57Z|index-addition|08fc10fcd58ecf729b9b0c5c1f0c135f7bb723f7|2026-09-24"
          if "|cascaide-ts|" not in catalog_text:
              catalog.write_text(catalog_text.rstrip("\n") + "\n" + catalog_row + "\n", encoding="utf-8")

          signatures = Path("data/signatures.psv")
          signatures_text = signatures.read_text(encoding="utf-8")
          signature_row = "232|cascaide-ts|cascaide-ts closes autonomous S1 through its packaged model/tool/delegation loop on the durable graph executor; recursive/Supervisor delegation, generic cascade controls, persistence/replay and UI/HITL extension points remain execution or observability mechanisms without standalone S2-S5 closure."
          if "|cascaide-ts|" not in signatures_text:
              signatures.write_text(signatures_text.rstrip("\n") + "\n" + signature_row + "\n", encoding="utf-8")
          PY

      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py

      - name: Validate rendered state
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/render_full_a.py --check
          python -m unittest discover -s tests -v

      - name: Commit rendered admission
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No render changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assessments/cascaide-ts.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md METRICS.md data/metrics.json README.md
          git commit -m "admit: render cascaide-ts canonical inclusion"
          git push origin HEAD:${GITHUB_REF_NAME}
