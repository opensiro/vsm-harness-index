name: Admit Caelis (temporary)

on:
  push:
    branches:
      - assessment/caelis

permissions:
  contents: write

jobs:
  admit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment/caelis
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Promote assessment and add canonical source rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('assessments/caelis.md')
          text = p.read_text()
          old = 'status: proposed\n'
          if old not in text:
              raise SystemExit('expected proposed Caelis assessment')
          p.write_text(text.replace(old, 'status: included\n', 1))
          PY
          catalog='262|caelis|Caelis|https://github.com/caelis-labs/caelis|2026-08-14T12:09:51Z|index-addition|5aebbc6a750b8b2d472a0987fbf2e0942062c6d9|2026-09-26'
          signature='262|caelis|Caelis closes autonomous S1 through its model/tool Runtime, S2 through controller-owned independent-work scoping and steering over concurrent participants, and S3 through controller-exclusive start/read/wait and integration; it exposes a separate Reviewer as S3*=C, while no material S4 or S5 closure is established.'
          grep -Fqx "$catalog" data/catalog.psv || printf '%s\n' "$catalog" >> data/catalog.psv
          grep -Fqx "$signature" data/signatures.psv || printf '%s\n' "$signature" >> data/signatures.psv

      - name: Regenerate derived views
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Validate assessment and index
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v0.3.6 https://github.com/opensiro/vsm-harness-skills.git /tmp/vsm-harness-skills
          python /tmp/vsm-harness-skills/scripts/check_assessment_contract.py assessments/caelis.md
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v

      - name: Commit canonical admission and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/caelis-admit-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'index: admit Caelis'
          git push origin HEAD:assessment/caelis
