name: Assemble BoundFlow admission

on:
  push:
    branches:
      - index/boundflow-admission

permissions:
  contents: write

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: index/boundflow-admission
          fetch-depth: 0

      - name: Canonicalize assessment sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/boundflow.md')
          text = assessment.read_text(encoding='utf-8')
          assert text.count('status: proposed') == 1
          assessment.write_text(text.replace('status: proposed', 'status: included', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_text = catalog.read_text(encoding='utf-8')
          assert '|boundflow|' not in catalog_text
          rows = [line for line in catalog_text.splitlines() if line.strip()]
          assert rows[-1].startswith('279|toolgen|'), f'unexpected catalog tail: {rows[-1]}'
          row = '280|boundflow|BoundFlow|https://github.com/boundflow/boundflow|2026-03-22T05:02:02Z|index-addition|15c0b20a3a98d3413956cab7fba2fd77c1fa32e2|2026-09-27'
          catalog.write_text(catalog_text.rstrip('\n') + '\n' + row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signatures_text = signatures.read_text(encoding='utf-8')
          assert '|boundflow|' not in signatures_text
          signature = 'BoundFlow closes S1 through a first-party model→tool→observation loop. S3 is parent-governed: operator-authored metric rules change model/resource caps or pause, cool down and roll back subsequent workflow operation. Generic sequencing, audit logs, internal lifecycle metrics and configuration do not close S2, S3*, S4 or S5.'
          assert len(signature) <= 360
          signatures.write_text(signatures_text.rstrip('\n') + '\n280|boundflow|' + signature + '\n', encoding='utf-8')
          PY

      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Validate canonical state
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/boundflow-admit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/boundflow.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md FULL_A.md METRICS.md data/metrics.json README.md .github/workflows/boundflow-admit.yml
          git commit -m 'index: canonicalize BoundFlow admission'
          git push origin HEAD:index/boundflow-admission
