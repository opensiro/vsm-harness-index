name: fix-suisuicode-review
on:
  push:
    branches:
      - assessment/suisuicode-review-1006
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment/suisuicode-review-1006
      - name: Add required S3 boundary reachability field
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assessments/suisuicode.md')
          s = p.read_text()
          needle = "- Current-control decision scope: the main model can create operational commitments through `Agent`, terminate an active commitment through `TaskStop`, inspect completion/failure, and assign follow-up work through `SendMessage`; these decisions alter which S1 work remains active and what retained agents do next.\n"
          insert = needle + "- Boundary reachability: `cli.py` registers the `Agent`, `TaskList`, `TaskGet`, `TaskStop` and `SendMessage` tools in the ordinary shipped main-agent registry, and `AgentTool`/TaskManager instantiate and track the same first-party child Agent loops; no Team-mode path or application-authored supervisor is required.\n"
          if needle not in s:
              raise SystemExit('expected S3 insertion anchor not found')
          if '- Boundary reachability: `cli.py` registers the `Agent`' not in s:
              s = s.replace(needle, insert, 1)
          p.write_text(s)
          PY
      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/fix-suisuicode-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/suisuicode.md .github/workflows/fix-suisuicode-review.yml
          git commit -m 'Assessment: complete SuisuiCode S3 closure fields'
          git push origin HEAD:assessment/suisuicode-review-1006
