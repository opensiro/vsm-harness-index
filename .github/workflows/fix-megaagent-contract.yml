name: fix MegaAgent assessment contract labels

on:
  push:
    branches:
      - assessment-megaagent-140

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment-megaagent-140
          fetch-depth: 0

      - name: Normalize Methodology 0.3.5 witness labels
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('assessments/megaagent.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '- Whole-system view:': '- Whole-system current view:',
              '- Decision scope:': '- Current-control decision scope:',
              '- Operational claim under audit:': '- Claim being audited:',
              '- Complementary evidence path:': '- Complementary access path:',
              '- Finding publication / return path:': '- Who acts on findings:',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected label: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit label fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/megaagent.md
          git commit -m 'assessment: normalize MegaAgent witness labels'
          git push origin HEAD:assessment-megaagent-140

      - name: Remove temporary fixer
        run: |
          rm .github/workflows/fix-megaagent-contract.yml
          git add .github/workflows/fix-megaagent-contract.yml
          git commit -m 'chore: remove MegaAgent contract fixer'
          git push origin HEAD:assessment-megaagent-140
