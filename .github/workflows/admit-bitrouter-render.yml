name: admit BitRouter render

on:
  push:
    branches:
      - admit-bitrouter-207

permissions:
  contents: write

jobs:
  render:
    if: ${{ !contains(github.event.head_commit.message, '[skip render]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Admit reviewed BitRouter assessment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/bitrouter.md')
          text = assessment.read_text(encoding='utf-8')
          if 'status: included' not in text:
              if 'status: proposed' not in text:
                  raise SystemExit('BitRouter assessment is neither proposed nor included')
              text = text.replace('status: proposed', 'status: included', 1)
              assessment.write_text(text, encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_row = '207|bitrouter|BitRouter|https://github.com/bitrouter/bitrouter|2026-03-06T20:04:01Z|index-addition|e2a8c644e8ece5a2f152d2516269497d23aeef5d|2026-09-23'
          catalog_text = catalog.read_text(encoding='utf-8')
          if '|bitrouter|' not in catalog_text:
              catalog.write_text(catalog_text.rstrip() + '\n\n' + catalog_row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signature_row = '207|bitrouter|BitRouter runs autonomous ACP coding-agent S1 units and exposes constructor plus parent-governed whole-current session control and evidence-driven policy adaptation; its deterministic optimizer/compiler does not itself own autonomous-agent S4 judgment, while no material installation-level S2, S3*, or S5 closure is established.'
          signatures_text = signatures.read_text(encoding='utf-8')
          if '|bitrouter|' not in signatures_text:
              signatures.write_text(signatures_text.rstrip() + '\n\n' + signature_row + '\n', encoding='utf-8')
          PY

      - name: Render canonical derived artifacts
        shell: bash
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check

      - name: Commit rendered admission
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assessments/bitrouter.md data/catalog.psv data/signatures.psv METRICS.md RANKINGS.md README.md TLDR.md analytics/temporal.md data/metrics.json
          if git diff --cached --quiet; then
            echo 'No admission changes to commit'
            exit 0
          fi
          git commit -m 'admit: render BitRouter canonical artifacts [skip render]'
          git push
