name: render-masters-of-ai-review

on:
  push:
    branches:
      - assessment-masters-of-ai-harness-pinned

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment-masters-of-ai-harness-pinned
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render proposal metrics
        shell: bash
        run: |
          set -euo pipefail
          python scripts/render_metrics.py
          python scripts/render_metrics.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add METRICS.md data/metrics.json
          if ! git diff --cached --quiet; then
            git commit -m 'metrics: record Masters of AI proposed assessment'
            git push origin HEAD:assessment-masters-of-ai-harness-pinned
          fi
