name: render Agent Harness admission

on:
  push:
    branches:
      - admit-haorui-agent-harness-259

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Admit assessment and append provenance
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/haorui-agent-harness.md')
          text = assessment.read_text(encoding='utf-8')
          if 'status: proposed' in text:
              text = text.replace('status: proposed', 'status: included', 1)
              assessment.write_text(text, encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_row = '259|haorui-agent-harness|Agent Harness|https://github.com/haorui-harry/agent-harness|2026-04-01T03:36:49Z|index-addition|109dde248cb44227a9ed3a204790432a6da843da|2026-09-26'
          catalog_text = catalog.read_text(encoding='utf-8').rstrip('\n')
          if catalog_row not in catalog_text.splitlines():
              catalog.write_text(catalog_text + '\n' + catalog_row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signature_row = '259|haorui-agent-harness|Agent Harness closes autonomous S1 through live thread-first graph selection and S3 through model-owned current-state replanning that can add tool/workspace/subagent commitments. Parallel/static tracks and post-hoc skill conflict handling do not establish S2; in-band critique/dissent are not complementary S3*, and no S4 or S5 closure is established.'
          signatures_text = signatures.read_text(encoding='utf-8').rstrip('\n')
          if signature_row not in signatures_text.splitlines():
              signatures.write_text(signatures_text + '\n' + signature_row + '\n', encoding='utf-8')
          PY
      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
      - name: Commit canonical admission
        run: |
          rm .github/workflows/admit-haorui-agent-harness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "assessment: admit Agent Harness"
          git push
