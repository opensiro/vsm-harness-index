name: Prepare Mindweave admission

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'admission/mindweave-975'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply canonical admission and render projections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path("assessments/mindweave.md")
          text = assessment.read_text(encoding="utf-8")
          assert "status: proposed" in text
          assessment.write_text(text.replace("status: proposed", "status: included", 1), encoding="utf-8")

          catalog = Path("data/catalog.psv")
          c = catalog.read_text(encoding="utf-8").rstrip("\n")
          row = "381|mindweave|Mindweave|https://github.com/mindweave-cli/mindweave|2026-09-16T20:07:43Z|index-addition|7a108f043dbfca273dd420d193803f41040a64b7|2026-09-29"
          assert "|mindweave|" not in c
          catalog.write_text(c + "\n" + row + "\n", encoding="utf-8")

          signatures = Path("data/signatures.psv")
          s = signatures.read_text(encoding="utf-8").rstrip("\n")
          signature = "381|mindweave|Mindweave closes agent-owned S1, constructor-owned S2 through serialization of mutating child agents, parent-governed S3 through persisted user-approved plan commitments with fail-closed replanning, and agent-owned S3* through a separate adversarial read-only verifier; memory/governor features do not by themselves establish S4 or S5."
          assert "|mindweave|" not in s
          signatures.write_text(s + "\n" + signature + "\n", encoding="utf-8")
          PY

          python scripts/render_tldr.py
          python scripts/render_analytics.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_analytics.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v

          rm .github/workflows/prepare-mindweave-admission.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mindweave admission"
          git push origin HEAD:admission/mindweave-975
