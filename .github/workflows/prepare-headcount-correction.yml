name: prepare-headcount-correction

on:
  push:
    branches:
      - fix-headcount-s3star-boundary

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update Headcount cohort signature
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('data/signatures.psv')
          prefix = '121|headcount|'
          replacement = "121|headcount|Headcount's specialist skills establish autonomous operations, write-surface coordination, executive current control, external/future strategy and internal identity/policy closure; its reviewer-class skills and agent-hierarchy method expose S3* as a constructor path because the pinned installed-plugin boundary does not wire a distinct autonomous reviewer."
          lines = path.read_text(encoding='utf-8').splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one Headcount signature row, found {len(matches)}')
          lines[matches[0]] = replacement
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Regenerate derived views
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
      - name: Validate correction
        run: |
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python -m unittest discover -s tests -v
      - name: Remove preparation workflow and commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-headcount-correction.yml
          git add assessments/headcount.md data/signatures.psv TLDR.md RANKINGS.md FULL_A.md
          git commit -m 'Regenerate views after Headcount correction'
          git push
