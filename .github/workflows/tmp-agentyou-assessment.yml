name: temporary AgentYou assessment renderer

on:
  push:
    branches:
      - assessment/agentyou-20260922

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render proposed metrics
        run: python scripts/render_metrics.py
      - name: Structural assessment check
        run: python scripts/check_assessment_contract.py assessments/agentyou.md
      - name: Validate index state
        run: |
          python scripts/check_index.py
          python scripts/render_metrics.py --check
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v
      - name: Commit generated metrics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add METRICS.md data/metrics.json
          if git diff --cached --quiet; then
            echo 'No generated metric changes'
          else
            git commit -m 'chore: render AgentYou proposed metrics'
            git push origin HEAD:assessment/agentyou-20260922
          fi
