name: admit-rsih

on:
  push:
    branches:
      - assessment/rsih-admit

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit assessment and render canonical views
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          assessment = Path('assessments/rsih.md')
          text = assessment.read_text(encoding='utf-8')
          if 'status: proposed' not in text:
              raise SystemExit('RSIH assessment is not proposed')
          assessment.write_text(text.replace('status: proposed', 'status: included', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          with catalog.open(encoding='utf-8', newline='') as handle:
              rows = list(csv.DictReader(handle, delimiter='|'))
          if any(row['harness_id'] == 'rsih' for row in rows):
              raise SystemExit('catalog row already exists')
          position = len(rows) + 1
          with catalog.open('a', encoding='utf-8', newline='') as handle:
              handle.write(f"{position}|rsih|RSIH|https://github.com/CosmosMind-ai/RSI-Harness|2026-09-03T08:45:37Z|index-addition|737bf1f5a5a56f0c49bbd5180e71d651113038ac|2026-09-26\n")

          signatures = Path('data/signatures.psv')
          with signatures.open(encoding='utf-8', newline='') as handle:
              signature_rows = list(csv.DictReader(handle, delimiter='|'))
          if any(row['harness_id'] == 'rsih' for row in signature_rows):
              raise SystemExit('signature row already exists')
          signature = "RSIH closes autonomous S1 through its packaged Pi model/tool runtime. Its shipped GEE/harness-rsi path analyzes prior work and future intent to construct validated downstream Genome capability (S4=C) and identity/policy bundles (S5=C); process supervision, configuration validation, and sessions do not establish S2, S3, or S3*."
          if len(signature) > 360:
              raise SystemExit(f'signature too long: {len(signature)}')
          with signatures.open('a', encoding='utf-8', newline='') as handle:
              handle.write(f"{position}|rsih|{signature}\n")
          PY
          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
          rm .github/workflows/admit-rsih.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'assessment: admit RSIH'
          git push origin HEAD
