name: stage multi-agent-orchestration S3 direct evidence
on:
  push:
    branches: [experiment/multi-agent-orchestration-s3-direct-483]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage structured S3 evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('experiments/functional-capability-depth')
          benchmark_id = 'multi-agent-orchestration-supervisor-ablation'
          observation_id = 'multi-agent-orchestration-supervisor-ablation-2026-08'

          # Benchmark-family map.
          path = root / 'vsm-benchmark-family-map' / 'map.json'
          data = json.loads(path.read_text())
          if not any(e.get('benchmark_id') == benchmark_id for e in data['entries']):
              insert_at = next(i for i, e in enumerate(data['entries']) if e.get('function') == 'S3*')
              data['entries'].insert(insert_at, {
                  'function': 'S3',
                  'benchmark_id': benchmark_id,
                  'benchmark_name': 'Multi-Agent Orchestration native supervisor ablation',
                  'fit': 'direct',
                  'primary_source': 'https://github.com/Vinay-veeragani/Multi-Agent-Orchestration/blob/e6c34462af045d7e53d383103346362351c96353/docs/evaluation-benchmark.md',
                  'evaluated_object': 'canonical Multi-Agent Orchestration Engine with its first-party live-state supervisor enabled versus the same engine using only deterministic HeuristicRouter current-control, with retry and parallelism disabled in both clean comparison arms',
                  'evaluation_mode': 'execution-grounded-deterministic',
                  'system_linkage': 'native-canonical-observation',
                  'non_claim': 'The within-system ablation directly exercises native S3 current-control capability for canonical multi-agent-orchestration; it is not a matched cross-harness S3 primary, and retry-only recovery is not credited to the supervisor-only S3 effect.'
              })
          path.write_text(json.dumps(data, indent=2) + '\n')

          # Primary-baseline reviewed-family metadata must track the map.
          path = root / 'primary-baselines.json'
          data = json.loads(path.read_text())
          reviewed = data['functions']['S3']['reviewed_direct_families']
          if not any(e.get('benchmark_id') == benchmark_id for e in reviewed):
              reviewed.append({
                  'benchmark_id': benchmark_id,
                  'benchmark_name': 'Multi-Agent Orchestration native supervisor ablation',
                  'primary_source': 'https://github.com/Vinay-veeragani/Multi-Agent-Orchestration/blob/e6c34462af045d7e53d383103346362351c96353/docs/evaluation-benchmark.md'
              })
          data['functions']['S3']['blocking_reason'] = 'Reviewed direct S3 families now include a canonical native within-system current-control ablation, but public evidence still does not provide a matched comparison of native S3 implementations across multiple canonical harnesses under one common benchmark/model/configuration cell.'
          path.write_text(json.dumps(data, indent=2) + '\n')

          # First canonical direct S3 observation.
          path = root / 's3-system-benchmarks' / 'observations.json'
          observations = json.loads(path.read_text())
          if not any(o.get('observation_id') == observation_id for o in observations):
              observations.append({
                  'observation_id': observation_id,
                  'function': 'S3',
                  'benchmark_id': benchmark_id,
                  'benchmark_fit': 'direct',
                  'evidence_source_class': 'first-party-reported',
                  'boundary_class': 'canonical-native-system',
                  'canonical_harness_id': 'multi-agent-orchestration',
                  'canonical_system_eligible': True,
                  'system_compatibility': 'native-system',
                  'canonical_review_revision': 'e6c34462af045d7e53d383103346362351c96353',
                  'benchmark_artifact_revision': 'e6c34462af045d7e53d383103346362351c96353',
                  'result_artifact': 'benchmarks/results/eval_c760d1ff9d464cbfa89e.json',
                  'result_id': 'eval_c760d1ff9d464cbfa89e',
                  'result_started_at': '2026-08-28T05:32:26.508755Z',
                  'embedded_run_git_sha': 'aed23ddd56c9ff6978a72140160634ced31ecf74',
                  'embedded_run_git_sha_publicly_resolvable_at_review': False,
                  'provenance_limitation': 'The committed result JSON reports embedded run git_sha aed23ddd56c9ff6978a72140160634ced31ecf74, but that SHA no longer resolves in the current public repository history. The observation is therefore preserved as first-party-reported from the immutable result artifact committed at the canonical review revision, not relabeled as an independently reproduced run of that revision.',
                  'scenario_count': 54,
                  'provider': 'MockProvider',
                  'provider_configuration': 'scripted deterministic scenario replies and scripted retry failures; zero synthetic provider latency',
                  'comparison_class': 'within-system-controlled-ablation',
                  'held_constant': [
                      'same 54 scenarios',
                      'same scripted model replies/failures',
                      'same engine and evaluator',
                      'retry disabled in baseline and supervisor arms',
                      'max_concurrent_nodes=1 in baseline and supervisor arms'
                  ],
                  'treatment': 'enable first-party autonomous supervisor current-control path instead of deterministic HeuristicRouter-only floor',
                  'baseline_arm': {
                      'uses_supervisor': False,
                      'retry_enabled': False,
                      'parallelism_enabled': False,
                      'scenarios_passed': 11,
                      'scenarios_run': 54,
                      'completion_rate': 0.204,
                      'routing_accuracy': 0.566667,
                      'total_tokens': 14669
                  },
                  'supervisor_arm': {
                      'uses_supervisor': True,
                      'retry_enabled': False,
                      'parallelism_enabled': False,
                      'scenarios_passed': 48,
                      'scenarios_run': 54,
                      'completion_rate': 0.889,
                      'routing_accuracy': 1.0,
                      'total_tokens': 23784
                  },
                  'reported_completion_gain_percentage_points': 68.5,
                  'reported_routing_accuracy_gain_percentage_points': 43.3333,
                  'scope_note': 'The supervisor arm fails exactly the six retry scenarios; those require node-level retry and are not credited to the supervisor-only S3 effect.',
                  'vsm_interpretation': 'The canonical assessment independently establishes S3=A for the first-party supervisor. This benchmark ablates that native live-state current-control path inside the same harness while holding retry and parallelism disabled, so the published supervisor-versus-baseline result is direct native S3 capability evidence. One within-system result does not form a matched cross-harness primary baseline.',
                  'primary_sources': [
                      'https://github.com/Vinay-veeragani/Multi-Agent-Orchestration/blob/e6c34462af045d7e53d383103346362351c96353/docs/evaluation-benchmark.md',
                      'https://github.com/Vinay-veeragani/Multi-Agent-Orchestration/blob/e6c34462af045d7e53d383103346362351c96353/src/orchestration/evaluation/arms.py',
                      'https://github.com/Vinay-veeragani/Multi-Agent-Orchestration/blob/e6c34462af045d7e53d383103346362351c96353/benchmarks/results/eval_c760d1ff9d464cbfa89e.json'
                  ]
              })
          path.write_text(json.dumps(observations, indent=2) + '\n')

          # Resolve the prior candidate case into canonical direct evidence.
          path = root / 's3-system-benchmarks' / 'coverage.json'
          data = json.loads(path.read_text())
          if 'direct-native' not in data['coverage_classes']:
              data['coverage_classes'].insert(1, 'direct-native')
          data['direct_benchmark_family_count'] = 3
          data['direct_observation_count'] = 1
          for i, case in enumerate(data['cases']):
              if case.get('case_id') == 'multi-agent-orchestration-native-s3-candidate':
                  data['cases'][i] = {
                      'case_id': 'multi-agent-orchestration-native-s3-direct',
                      'benchmark': 'Multi-Agent Orchestration native supervisor ablation',
                      'benchmark_fit': 'direct',
                      'coverage_class': 'direct-native',
                      'system_compatibility': 'native-system',
                      'canonical_harness_id': 'multi-agent-orchestration',
                      'observation_ref': 'observations.json#' + observation_id,
                      'primary_sources': [
                          'https://github.com/Vinay-veeragani/Multi-Agent-Orchestration/blob/e6c34462af045d7e53d383103346362351c96353/docs/evaluation-benchmark.md',
                          'https://github.com/Vinay-veeragani/Multi-Agent-Orchestration/blob/e6c34462af045d7e53d383103346362351c96353/src/orchestration/evaluation/arms.py',
                          'https://github.com/Vinay-veeragani/Multi-Agent-Orchestration/blob/e6c34462af045d7e53d383103346362351c96353/benchmarks/results/eval_c760d1ff9d464cbfa89e.json'
                      ],
                      'finding': 'Canonical Multi-Agent Orchestration establishes S3=A from its standard live-state supervisor. Its first-party deterministic benchmark directly ablates that native supervisor path against the same engine using only HeuristicRouter while retry and parallelism remain disabled in both clean comparison arms. Published results move from 11/54 passed and 56.7% routing accuracy to 48/54 passed and 100% routing accuracy. This is admitted direct native S3 evidence; the separately retry-enabled recovery arm is outside the clean supervisor-only attribution, and the embedded historical run SHA is no longer publicly resolvable.',
                      'admitted': True
                  }
                  break
          else:
              if not any(c.get('case_id') == 'multi-agent-orchestration-native-s3-direct' for c in data['cases']):
                  raise SystemExit('Multi-Agent Orchestration candidate case missing')
          if 'multi-agent-orchestration' not in data['representative_canonical_s3_systems_inspected']:
              data['representative_canonical_s3_systems_inspected'].append('multi-agent-orchestration')
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          python experiments/functional-capability-depth/render_function_baselines.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/functional-capability-depth/vsm-benchmark-family-map/map.json \
                  experiments/functional-capability-depth/primary-baselines.json \
                  experiments/functional-capability-depth/s3-system-benchmarks/observations.json \
                  experiments/functional-capability-depth/s3-system-benchmarks/coverage.json \
                  experiments/functional-capability-depth/FUNCTION-BASELINES.md
          if ! git diff --cached --quiet; then
            git commit -m 'experiment: stage canonical direct S3 observation'
            git push
          fi
