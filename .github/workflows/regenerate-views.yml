name: regenerate-views

on:
  push:
    branches:
      - evidence-hardening-v1

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence-hardening-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate public views
        run: |
          python scripts/render_tldr.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TLDR.md RANKINGS.md
          if git diff --cached --quiet; then
            echo "Views already current"
            exit 0
          fi
          git commit -m "Regenerate public views"
          git push origin HEAD:evidence-hardening-v1
