name: tmp-admit-super-agent

on:
  push:
    branches:
      - admit-super-agent-89

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admit-super-agent-89
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply admission source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/super-agent.md')
          text = assessment.read_text()
          assert text.count('status: proposed') == 1, 'expected one proposed status'
          assessment.write_text(text.replace('status: proposed', 'status: included', 1))

          catalog = Path('data/catalog.psv')
          ctext = catalog.read_text().rstrip('\n')
          assert '|super-agent|' not in ctext, 'super-agent already in catalog'
          positions = [int(line.split('|', 1)[0]) for line in ctext.splitlines() if line and line.split('|', 1)[0].isdigit()]
          next_position = max(positions) + 1
          assert next_position == 192, f'expected catalog 192, got {next_position}'
          row = '192|super-agent|super-agent|https://github.com/FedericoCasarella/super-agent|2026-05-25T13:53:35Z|index-addition|afa4850f4cf698db8ce868525c6dad3215a13a6d|2026-09-22'
          catalog.write_text(ctext + '\n' + row + '\n')

          signatures = Path('data/signatures.psv')
          stext = signatures.read_text().rstrip('\n')
          assert '|super-agent|' not in stext, 'super-agent already in signatures'
          signature = 'super-agent closes autonomous S1 through scheduled/internal loops, exposes constructor S2 through a host-saturation concurrency queue, retains whole-installation S3 under parent user control, and autonomously adapts future interaction style through Tone Mirror S4; logs/snapshots do not establish S3*, and roadmap/approvals do not close S5 identity.'
          assert len(signature) <= 360, len(signature)
          signatures.write_text(stext + '\n192|super-agent|' + signature + '\n')
          PY

      - name: Render canonical views
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Validate generated state
        run: |
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/check_index.py
          python -m unittest discover -s tests -v

      - name: Commit generated admission
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/super-agent.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md METRICS.md data/metrics.json README.md analytics || true
          git diff --cached --quiet && exit 1
          git commit -m 'admit: generate super-agent canonical views'
          git push origin HEAD:admit-super-agent-89
