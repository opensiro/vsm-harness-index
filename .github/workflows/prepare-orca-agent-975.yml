name: Prepare Orca Agent admission

on:
  push:
    branches:
      - admission/orca-agent-975

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admission/orca-agent-975
          fetch-depth: 0
      - name: Apply canonical admission and render projections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path("assessments/orca-agent.md")
          text = assessment.read_text(encoding="utf-8")
          assert "status: proposed" in text
          assessment.write_text(text.replace("status: proposed", "status: included", 1), encoding="utf-8")

          catalog = Path("data/catalog.psv")
          c = catalog.read_text(encoding="utf-8").rstrip("\n")
          rows = c.splitlines()
          position = max(int(row.split("|", 1)[0]) for row in rows[1:]) + 1
          assert "|orca-agent|" not in c
          catalog_row = f"{position}|orca-agent|Orca Agent|https://github.com/echoVic/orca-agent|2026-06-05T07:19:56Z|index-addition|5838259b5f9622021db04d6fdda4d80963f17de3|2026-09-29"
          catalog.write_text(c + "\n" + catalog_row + "\n", encoding="utf-8")

          signatures = Path("data/signatures.psv")
          s = signatures.read_text(encoding="utf-8").rstrip("\n")
          assert "|orca-agent|" not in s
          signature = (
              "Orca Agent closes autonomous S1 through its first-party coding loop, "
              "autonomous S2 through model-selected non-overlapping delegation plus optional detached-worktree isolation for concurrent coding S1s, "
              "autonomous S3 through model-visible task-list/stop/steer controls over the live task tree, "
              "and autonomous S3* through a separate tool-free Goal terminal verifier whose judgment can return the mission to work; "
              "memory/reuse do not close prospective S4 and runtime approval/trust controls do not establish S5."
          )
          signatures.write_text(s + "\n" + f"{position}|orca-agent|{signature}" + "\n", encoding="utf-8")
          PY

          python scripts/render_tldr.py
          python scripts/render_analytics.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
          rm .github/workflows/prepare-orca-agent-975.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Orca Agent admission"
          git push origin HEAD:admission/orca-agent-975
