name: admit OnIt render
on:
  push:
    branches: [admit-onit-213]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit and render
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assessments/onit.md')
          p.write_text(p.read_text().replace('status: proposed','status: included',1))
          cat=Path('data/catalog.psv'); text=cat.read_text()
          row='213|onit|OnIt|https://github.com/sibyl-oracles/onit|2026-02-03T02:43:57Z|index-addition|88f562d1c4e62a3a8599ac5d0bdfa6423a6e1fc0|2026-09-23'
          if row not in text: cat.write_text(text.rstrip()+"\n"+row+"\n")
          sig=Path('data/signatures.psv'); text=sig.read_text()
          row='213|onit|OnIt closes autonomous S1 through its standard model/tool feedback loop. No sibling S2 or metasystemic S3 path is established. Its default post-answer fact-check and revision pipeline exposes an S3* constructor path, but reuses the same serving model for audit judgment; learning remains observe-only with adapt/extend/evolve not yet built, and no S5 identity closure is established.'
          if row not in text: sig.write_text(text.rstrip()+"\n"+row+"\n")
          PY
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/onit.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md METRICS.md README.md analytics/temporal.md data/metrics.json
          git commit -m 'admit: render OnIt canonical inclusion'
          git push
