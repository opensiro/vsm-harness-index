name: Pipecat admission one-shot

on:
  push:
    branches:
      - admission/pipecat-319

permissions:
  contents: write

jobs:
  generate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: admission/pipecat-319

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen admission base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "94ee8cb264d3a20797ba27eae27091f90cc03d70"
          grep -qx 'status: proposed' <(grep '^status:' assessments/pipecat.md)
          tail -n 1 data/catalog.psv | grep -qx '318|metaharness|MetaHarness|https://github.com/ruvnet/metaharness|2026-06-13T18:29:11Z|index-addition|d5833dc6512ac1adeeef91a331c29055cd8a4dbb|2026-09-29'
          ! grep -q '^319|pipecat|' data/catalog.psv
          ! grep -q '^319|pipecat|' data/signatures.psv

      - name: Apply admission source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          assessment = Path('assessments/pipecat.md')
          text = assessment.read_text(encoding='utf-8')
          assert text.count('status: proposed\n') == 1
          assessment.write_text(text.replace('status: proposed\n', 'status: included\n', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          text = catalog.read_text(encoding='utf-8').rstrip('\n')
          text += '\n319|pipecat|Pipecat|https://github.com/pipecat-ai/pipecat|2023-12-27T12:59:00Z|index-addition|dbdf21a017f86624fb7768e35730417169524e0d|2026-09-29\n'
          catalog.write_text(text, encoding='utf-8')

          signatures = Path('data/signatures.psv')
          text = signatures.read_text(encoding='utf-8').rstrip('\n')
          text += '\n319|pipecat|Pipecat closes autonomous S1 through model/tool operation, S2 through model-selected handoff that prevents interleaved worker output, and S3 through model-facing inspection/update/cancellation of a live subordinate job; eval/judge, memory and instruction surfaces do not close S3*, S4 or S5.\n'
          signatures.write_text(text, encoding='utf-8')
          PY

      - name: Render deterministic views
        shell: bash
        run: |
          set -euo pipefail
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_analytics.py

      - name: Validate generated admission
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/render_analytics.py --check
          python scripts/check_index.py
          python -m unittest discover -s tests -v
          python scripts/check_generation_provenance.py --base-ref origin/main
          git diff --check

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pipecat-admission-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add METRICS.md RANKINGS.md README.md TLDR.md analytics/cooccurrence.md analytics/organizational-forms.md analytics/ownership.md analytics/temporal.md assessments/pipecat.md data/catalog.psv data/metrics.json data/signatures.psv .github/workflows/pipecat-admission-once.yml
          git commit -m 'index: admit Pipecat at catalog #319'
          git push origin HEAD:admission/pipecat-319
