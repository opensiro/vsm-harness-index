name: r2-batch5-metadata

on:
  push:
    branches:
      - r2-batch-5-s3star-revalidation

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize R2 batch 5 records
        run: |
          python - <<'PY'
          from pathlib import Path

          checked = {
              'letta': '5bcdd177d70fa2b31a754cfcd801e77b2e1ab16a',
              'open-interpreter': '5db50b2e93224dda720462f02fc2858cbd112eb5',
              'swe-agent': '3ea751c087f32b16e039a2233dd6eefecef325d5',
              'r2r': '9c5a94d151f90876bd7eb860f300a8fd662dc481',
              'agentsilex': 'cd529f2838151fd8a4f0d6b7054a45d829b3f78d',
          }
          for harness, checked_ref in checked.items():
              path = Path(f'assessments/{harness}.md')
              text = path.read_text()
              frontmatter = text.split('---', 2)[1]
              if 'profile_version:' not in frontmatter:
                  marker = 'reviewed_at: 2026-09-15\n'
                  block = (
                      marker
                      + 'profile_version: 0.2.1\n'
                      + 'assessment_procedure_version: 0.3.1\n'
                      + f'last_checked_ref: {checked_ref}\n'
                      + 'last_checked_at: 2026-09-17\n'
                      + 'assessment_changed_at: 2026-09-15\n'
                      + 'last_reassessment_round: R2\n'
                  )
                  text = text.replace(marker, block, 1)
                  path.write_text(text)

          history = Path('data/reassessment-history.psv')
          rows = [
              'R2|letta|5bcdd177d70fa2b31a754cfcd801e77b2e1ab16a|5bcdd177d70fa2b31a754cfcd801e77b2e1ab16a|5bcdd177d70fa2b31a754cfcd801e77b2e1ab16a|2026-09-17|0.2.1|0.3.1|no-material-change|—|https://github.com/letta-ai/letta/commit/5bcdd177d70fa2b31a754cfcd801e77b2e1ab16a ; https://github.com/letta-ai/letta-code/compare/5bc853fd6fd69f00c115e320316fa4c0654a3dfb...9f2ae92ac01a8bd12249d694d7156c2c6e591dca ; https://github.com/letta-ai/letta-code/blob/9f2ae92ac01a8bd12249d694d7156c2c6e591dca/src/agent/subagents/builtin/reflection.md ; https://github.com/letta-ai/letta-code/blob/9f2ae92ac01a8bd12249d694d7156c2c6e591dca/src/cli/helpers/memory-reminder.ts',
              'R2|open-interpreter|f110a7a85f43efc343f936f5bc504e01eb262550|5db50b2e93224dda720462f02fc2858cbd112eb5|f110a7a85f43efc343f936f5bc504e01eb262550|2026-09-17|0.2.1|0.3.1|no-material-change|—|https://github.com/openinterpreter/openinterpreter/compare/f110a7a85f43efc343f936f5bc504e01eb262550...5db50b2e93224dda720462f02fc2858cbd112eb5 ; https://github.com/openinterpreter/openinterpreter/blob/5db50b2e93224dda720462f02fc2858cbd112eb5/codex-rs/core/src/guardian/review.rs ; https://github.com/openinterpreter/openinterpreter/blob/5db50b2e93224dda720462f02fc2858cbd112eb5/codex-rs/features/src/lib.rs',
              'R2|swe-agent|3ea751c087f32b16e039a2233dd6eefecef325d5|3ea751c087f32b16e039a2233dd6eefecef325d5|3ea751c087f32b16e039a2233dd6eefecef325d5|2026-09-17|0.2.1|0.3.1|no-upstream-change|—|https://github.com/SWE-agent/SWE-agent/blob/3ea751c087f32b16e039a2233dd6eefecef325d5/sweagent/agent/reviewer.py',
              'R2|r2r|9c5a94d151f90876bd7eb860f300a8fd662dc481|9c5a94d151f90876bd7eb860f300a8fd662dc481|9c5a94d151f90876bd7eb860f300a8fd662dc481|2026-09-17|0.2.1|0.3.1|no-upstream-change|—|https://github.com/SciPhi-AI/R2R/blob/9c5a94d151f90876bd7eb860f300a8fd662dc481/py/core/agent/research.py',
              'R2|agentsilex|cd529f2838151fd8a4f0d6b7054a45d829b3f78d|cd529f2838151fd8a4f0d6b7054a45d829b3f78d|cd529f2838151fd8a4f0d6b7054a45d829b3f78d|2026-09-17|0.2.1|0.3.1|no-upstream-change|—|https://github.com/howl-anderson/agentsilex/blob/cd529f2838151fd8a4f0d6b7054a45d829b3f78d/src/agentsilex/evaluation/agent_evaluator.py',
          ]
          text = history.read_text()
          for row in rows:
              key = '|'.join(row.split('|')[:2]) + '|'
              if key not in text:
                  text = text.rstrip('\n') + '\n' + row + '\n'
          history.write_text(text)

          round_file = Path('reassessments/R2-2026-09-16.md')
          text = round_file.read_text()
          table_rows = [
              '| `letta` | `5bcdd177d70fa2b31a754cfcd801e77b2e1ab16a` | `5bcdd177d70fa2b31a754cfcd801e77b2e1ab16a` | 2026-09-17 | 0.2.1 | 0.3.1 | no-material-change | — | [catalog ref](https://github.com/letta-ai/letta/commit/5bcdd177d70fa2b31a754cfcd801e77b2e1ab16a), [runtime delta](https://github.com/letta-ai/letta-code/compare/5bc853fd6fd69f00c115e320316fa4c0654a3dfb...9f2ae92ac01a8bd12249d694d7156c2c6e591dca), [reflection agent](https://github.com/letta-ai/letta-code/blob/9f2ae92ac01a8bd12249d694d7156c2c6e591dca/src/agent/subagents/builtin/reflection.md) |',
              '| `open-interpreter` | `f110a7a85f43efc343f936f5bc504e01eb262550` | `5db50b2e93224dda720462f02fc2858cbd112eb5` | 2026-09-17 | 0.2.1 | 0.3.1 | no-material-change | — | [upstream delta](https://github.com/openinterpreter/openinterpreter/compare/f110a7a85f43efc343f936f5bc504e01eb262550...5db50b2e93224dda720462f02fc2858cbd112eb5), [Guardian review](https://github.com/openinterpreter/openinterpreter/blob/5db50b2e93224dda720462f02fc2858cbd112eb5/codex-rs/core/src/guardian/review.rs) |',
              '| `swe-agent` | `3ea751c087f32b16e039a2233dd6eefecef325d5` | `3ea751c087f32b16e039a2233dd6eefecef325d5` | 2026-09-17 | 0.2.1 | 0.3.1 | no-upstream-change | — | [reviewer implementation](https://github.com/SWE-agent/SWE-agent/blob/3ea751c087f32b16e039a2233dd6eefecef325d5/sweagent/agent/reviewer.py) |',
              '| `r2r` | `9c5a94d151f90876bd7eb860f300a8fd662dc481` | `9c5a94d151f90876bd7eb860f300a8fd662dc481` | 2026-09-17 | 0.2.1 | 0.3.1 | no-upstream-change | — | [research critique path](https://github.com/SciPhi-AI/R2R/blob/9c5a94d151f90876bd7eb860f300a8fd662dc481/py/core/agent/research.py) |',
              '| `agentsilex` | `cd529f2838151fd8a4f0d6b7054a45d829b3f78d` | `cd529f2838151fd8a4f0d6b7054a45d829b3f78d` | 2026-09-17 | 0.2.1 | 0.3.1 | no-upstream-change | — | [evaluator implementation](https://github.com/howl-anderson/agentsilex/blob/cd529f2838151fd8a4f0d6b7054a45d829b3f78d/src/agentsilex/evaluation/agent_evaluator.py) |',
          ]
          if '| `letta` |' not in text:
              marker = '\n## Completion\n'
              text = text.replace(marker, '\n' + '\n'.join(table_rows) + '\n' + marker, 1)
              round_file.write_text(text)
          PY
      - name: Commit metadata
        run: |
          if git diff --quiet -- assessments data/reassessment-history.psv reassessments/R2-2026-09-16.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assessments data/reassessment-history.psv reassessments/R2-2026-09-16.md
          git commit -m "Record R2 batch 5 reassessment outcomes"
          git push origin HEAD:r2-batch-5-s3star-revalidation
