name: admit atlias render

on:
  push:
    branches:
      - admit-atlias-206

permissions:
  contents: write

jobs:
  render:
    if: ${{ !contains(github.event.head_commit.message, '[skip render]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Admit reviewed atlias assessment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/atlias.md')
          text = assessment.read_text(encoding='utf-8')
          if 'status: included' not in text:
              if 'status: proposed' not in text:
                  raise SystemExit('atlias assessment is neither proposed nor included')
              text = text.replace('status: proposed', 'status: included', 1)
              assessment.write_text(text, encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_row = '206|atlias|atlias|https://github.com/ridelink0/atlias|2026-09-22T11:01:53Z|index-addition|270eb980b32bc05278183aaf10af85ef35de2bc3|2026-09-23'
          catalog_text = catalog.read_text(encoding='utf-8')
          if '|atlias|' not in catalog_text:
              catalog.write_text(catalog_text.rstrip() + '\n\n' + catalog_row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signature_row = '206|atlias|atlias exposes an autonomous standalone local-model operational loop and a function-specific S3* constructor gate that independently inspects changed state and returns blocking findings, while no material first-party installation-level S2, S3, S4, or S5 closure is established.'
          signatures_text = signatures.read_text(encoding='utf-8')
          if '|atlias|' not in signatures_text:
              signatures.write_text(signatures_text.rstrip() + '\n\n' + signature_row + '\n', encoding='utf-8')
          PY

      - name: Render canonical derived artifacts
        shell: bash
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check

      - name: Commit rendered admission
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assessments/atlias.md data/catalog.psv data/signatures.psv METRICS.md RANKINGS.md README.md TLDR.md analytics/temporal.md data/metrics.json
          if git diff --cached --quiet; then
            echo 'No admission changes to commit'
            exit 0
          fi
          git commit -m 'admit: render atlias canonical artifacts [skip render]'
          git push
