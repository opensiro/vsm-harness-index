name: admit redteam render
on:
  push:
    branches: [admit-redteam-216]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit and render
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assessments/redteam.md')
          s = p.read_text()
          if 'status: proposed' not in s:
              raise SystemExit('assessment is not proposed')
          p.write_text(s.replace('status: proposed', 'status: included', 1))
          cat = Path('data/catalog.psv')
          text = cat.read_text()
          row = '217|redteam|redteam|https://github.com/AscendyProject/redteam|2026-06-08T10:59:19Z|index-addition|c2bedf14aca43cc03330503f35e60e12b72f37ee|2026-09-24'
          if row not in text:
              cat.write_text(text.rstrip() + '\n' + row + '\n')
          sig = Path('data/signatures.psv')
          text = sig.read_text()
          row = '217|redteam|redteam runs autonomous coding S1 and closes autonomous complementary S3* through a default cross-provider adversarial reviewer that independently inspects the committed branch diff and returns requested changes into a fresh implementation/re-review loop; goal dependencies and deterministic lifecycle/rescue machinery do not establish S2/S3, while no operating S4 or S5 closure is established.'
          if row not in text:
              sig.write_text(text.rstrip() + '\n' + row + '\n')
          PY
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/redteam.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md METRICS.md README.md analytics/temporal.md data/metrics.json
          git commit -m 'admit: render redteam canonical inclusion at 217'
          git push
