name: Assemble ToolGen admission

on:
  push:
    branches:
      - index/toolgen-admission

permissions:
  contents: write

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: index/toolgen-admission
          fetch-depth: 0

      - name: Canonicalize assessment sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/toolgen.md')
          text = assessment.read_text(encoding='utf-8')
          assert text.count('status: proposed') == 1
          assessment.write_text(text.replace('status: proposed', 'status: included', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_text = catalog.read_text(encoding='utf-8')
          assert '|toolgen|' not in catalog_text
          rows = [line for line in catalog_text.splitlines() if line.strip()]
          assert rows[-1].startswith('278|replicator-agent|'), f'unexpected catalog tail: {rows[-1]}'
          row = '279|toolgen|ToolGen|https://github.com/Reason-Wang/ToolGen|2024-10-04T13:10:23Z|index-addition|6839374a255810efe69deea4056eec5c55e25802|2026-09-27'
          catalog.write_text(catalog_text.rstrip('\n') + '\n' + row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signatures_text = signatures.read_text(encoding='utf-8')
          assert '|toolgen|' not in signatures_text
          signature = 'ToolGen closes S1 through a model-owned action-token/tool → execution → observation → next-action loop. Large tool retrieval remains current-task operation; offline training/evaluation does not close S4/S3*, and no distinct S2, superior S3 or runtime S5 path is established.'
          assert len(signature) <= 360
          signatures.write_text(signatures_text.rstrip('\n') + '\n279|toolgen|' + signature + '\n', encoding='utf-8')
          PY

      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Validate canonical state
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/toolgen-admit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/toolgen.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md FULL_A.md METRICS.md data/metrics.json README.md .github/workflows/toolgen-admit.yml
          git commit -m 'index: canonicalize ToolGen admission'
          git push origin HEAD:index/toolgen-admission
