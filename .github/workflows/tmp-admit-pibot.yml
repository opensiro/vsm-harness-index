name: temporary pibot admission renderer

on:
  push:
    branches:
      - admit/pibot-20260922

permissions:
  contents: write

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Promote pibot sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/pibot.md')
          text = assessment.read_text(encoding='utf-8')
          old = 'status: proposed\n'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one proposed pibot status')
          assessment.write_text(text.replace(old, 'status: included\n', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          ctext = catalog.read_text(encoding='utf-8').rstrip('\n')
          if '|pibot|' in ctext:
              raise SystemExit('pibot already exists in catalog')
          ctext += '\n190|pibot|pibot|https://github.com/glebis/pibot|2026-08-27T22:51:54Z|index-addition|350bf2c8263f31bcda33789c819329bb56f14c00|2026-09-22\n'
          catalog.write_text(ctext, encoding='utf-8')

          signatures = Path('data/signatures.psv')
          stext = signatures.read_text(encoding='utf-8').rstrip('\n')
          if '|pibot|' in stext:
              raise SystemExit('pibot already exists in signatures')
          signature = ('pibot closes autonomous proactive S1 through its heartbeat protocol, retains installation-wide S3 and companion-identity S5 under owner governance, exposes a narrow constructor S3* raw-filesystem audit of maintenance claims, and supports autonomous plus parent-reviewed S4 skill evolution; sibling messaging alone does not establish S2.')
          stext += f'\n190|pibot|{signature}\n'
          signatures.write_text(stext, encoding='utf-8')
          PY
      - name: Regenerate deterministic views
        shell: bash
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
      - name: Validate generated state
        shell: bash
        run: |
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/check_index.py
          python -m unittest discover -s tests -v
      - name: Commit admission
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/pibot.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md FULL_A.md METRICS.md data/metrics.json README.md
          git commit -m 'admit: add pibot from reviewed standalone assessment'
          git push origin HEAD:admit/pibot-20260922
