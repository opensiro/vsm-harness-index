name: temporary swe-mux admission renderer

on:
  push:
    branches:
      - admit-swe-mux-225

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply canonical admission inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path("assessments/swe-mux.md")
          text = assessment.read_text(encoding="utf-8")
          old = "status: proposed\n"
          new = "status: included\n"
          if old in text:
              text = text.replace(old, new, 1)
              assessment.write_text(text, encoding="utf-8")
          elif new not in text:
              raise SystemExit("swe-mux assessment has neither proposed nor included status")

          catalog = Path("data/catalog.psv")
          catalog_text = catalog.read_text(encoding="utf-8")
          catalog_row = "225|swe-mux|swe-mux|https://github.com/jatoran/swe-mux|2026-08-16T21:33:26Z|index-addition|c14351b48a5424d2941b8a2e0e63b56f7033d2a0|2026-09-24"
          if "|swe-mux|" not in catalog_text:
              catalog.write_text(catalog_text.rstrip("\n") + "\n" + catalog_row + "\n", encoding="utf-8")

          signatures = Path("data/signatures.psv")
          signatures_text = signatures.read_text(encoding="utf-8")
          signature_row = "225|swe-mux|swe-mux runs a first-party Mux assistant loop, supplies constructor branch coordination and complementary audit, supports autonomous-plus-parent current fleet control, and closes parent-governed release adaptation; permissions and trust controls do not establish S5."
          if "|swe-mux|" not in signatures_text:
              signatures.write_text(signatures_text.rstrip("\n") + "\n" + signature_row + "\n", encoding="utf-8")
          PY

      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py

      - name: Validate rendered state
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/render_full_a.py --check
          python -m unittest discover -s tests -v

      - name: Commit rendered admission
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No render changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assessments/swe-mux.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md METRICS.md data/metrics.json README.md
          git commit -m "admit: render swe-mux canonical inclusion"
          git push origin HEAD:${GITHUB_REF_NAME}
