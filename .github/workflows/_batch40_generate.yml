name: Batch 40 one-shot corpus regeneration

on:
  push:
    branches:
      - admit-batch-40-remaining-five

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[batch40-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admit-batch-40-remaining-five
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and validate
        run: python scripts/_batch40_admit.py
      - name: Remove one-shot helper
        run: rm scripts/_batch40_admit.py .github/workflows/_batch40_generate.yml
      - name: Commit generated corpus
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Regenerate batch 40 corpus [batch40-generated]'
          git push origin HEAD:admit-batch-40-remaining-five
