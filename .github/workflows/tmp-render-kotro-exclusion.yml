name: temporary Kotro exclusion renderer

on:
  push:
    branches:
      - exclude-kotro-227

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply canonical exclusion inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path("assessments/kotro.md")
          text = assessment.read_text(encoding="utf-8")
          old = "status: proposed\n"
          new = "status: excluded-no-agentic-vsm\n"
          if old in text:
              text = text.replace(old, new, 1)
              assessment.write_text(text, encoding="utf-8")
          elif new not in text:
              raise SystemExit("Kotro assessment has neither proposed nor excluded status")

          catalog = Path("data/catalog.psv")
          catalog_text = catalog.read_text(encoding="utf-8")
          catalog_row = "227|kotro|Kotro|https://github.com/kotro-labs/kotro-proxy-engine|2026-06-29T06:00:27Z|index-addition|3b07c55ba31af68f3b58f78de2492189b07b23fb|2026-09-24"
          if "|kotro|" not in catalog_text:
              catalog.write_text(catalog_text.rstrip("\n") + "\n" + catalog_row + "\n", encoding="utf-8")
          PY

      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py

      - name: Validate rendered state
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/render_full_a.py --check
          python -m unittest discover -s tests -v

      - name: Commit rendered exclusion
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No render changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assessments/kotro.md data/catalog.psv TLDR.md RANKINGS.md analytics/temporal.md METRICS.md data/metrics.json README.md
          git commit -m "exclude: render Kotro canonical disposition"
          git push origin HEAD:${GITHUB_REF_NAME}
