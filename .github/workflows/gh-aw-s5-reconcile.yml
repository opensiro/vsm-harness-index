name: Reconcile GitHub Agentic Workflows S5 cohort

on:
  push:
    branches:
      - index/gh-aw-admission-2

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: index/gh-aw-admission-2
          fetch-depth: 0

      - name: Reconcile current canonical S5 cohort
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('experiments/functional-capability-depth')
          matched = root / 's5-system-benchmarks' / 'matched-cell'
          cohort_path = matched / 'full-canonical-cohort-review.json'
          closure_path = matched / 's5-primary-search-closure.json'
          validator_path = matched / 'validate_s5_primary_search_closure.py'

          cohort = json.loads(cohort_path.read_text(encoding='utf-8'))
          assert cohort['counts'] == {
              'canonical_s5_positive_systems': 24,
              'direct_canonical_observations': 1,
              'no_direct_public_result': 23,
              'unresolved': 0,
          }
          assert not any(row.get('canonical_harness_id') == 'gh-aw' for row in cohort['systems'])
          cohort['reviewed_at'] = '2026-09-27'
          cohort['index_revision_at_review'] = 'ba863eaf455fd9a272f15cfff80e840aa8a6de07'
          cohort['counts'] = {
              'canonical_s5_positive_systems': 25,
              'direct_canonical_observations': 1,
              'no_direct_public_result': 24,
              'unresolved': 0,
          }
          cohort['systems'].append({
              'canonical_harness_id': 'gh-aw',
              'repository': 'https://github.com/github/gh-aw',
              'canonical_review_revision': 'ff2eccd10a30d6a7bfaf0da449194e907a206555',
              'canonical_s5_state': 'P',
              'disposition': 'no-direct-public-result',
              'blocking_gate': 'repository-owner-instruction-amendment-subsequent-operation-result',
              'finding': 'GitHub Agentic Workflows publicly establishes repository-owner authority over the authoritative Markdown workflow instructions and loads that body at runtime so later runs can consume amended purpose or policy. The frozen public repository does not publish an immutable real-world record binding a legitimate owner instruction amendment to a subsequent agentic workflow run demonstrably governed by the changed instructions; documentation, examples and tests remain mechanism evidence rather than a direct S5 result.',
              'reopen_when': 'A public immutable GitHub Agentic Workflows repository or run history identifies a legitimate repository-owner purpose or instruction amendment, the authoritative workflow source produced by that decision, and a subsequent agentic workflow run explicitly shown executing under the changed instructions.',
          })
          cohort['conclusion'] = 'The full current 25-system canonical S5-positive cohort has been explicitly reconciled against public evidence. Ouroboros remains the only admitted canonical direct S5 observation; the other 24 systems expose qualifying S5 mechanisms/ownership but no reviewed public direct result satisfying the full authority/change/subsequent-operation chain. The S5 primary therefore remains an evidence-backed gap.'
          cohort_path.write_text(json.dumps(cohort, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          closure = json.loads(closure_path.read_text(encoding='utf-8'))
          assert closure['full_cohort_state'] == {
              'canonical_s5_positive_systems': 24,
              'direct_canonical_observations': 1,
              'no_direct_public_result': 23,
              'unresolved': 0,
          }
          closure['reviewed_at'] = '2026-09-27'
          closure['full_cohort_state'] = {
              'canonical_s5_positive_systems': 25,
              'direct_canonical_observations': 1,
              'no_direct_public_result': 24,
              'unresolved': 0,
          }
          gh_aw_note = ' Full-cohort reconciliation now also covers canonical GitHub Agentic Workflows; repository-owner runtime-loaded workflow instructions establish a strong parent-governed S5 mechanism, but the frozen public repository exposes no immutable owner-amendment-to-subsequent-run result chain.'
          assert 'canonical GitHub Agentic Workflows' not in closure['closure_claim']
          closure['closure_claim'] += gh_aw_note
          closure_path.write_text(json.dumps(closure, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          validator = validator_path.read_text(encoding='utf-8')
          needle = '    "tandem": ("3ee2d83d76497565680538ef00f1616f55650524", "C(P)"),\n}'
          replacement = '    "tandem": ("3ee2d83d76497565680538ef00f1616f55650524", "C(P)"),\n    "gh-aw": ("ff2eccd10a30d6a7bfaf0da449194e907a206555", "P"),\n}'
          assert needle in validator
          validator = validator.replace(needle, replacement, 1)
          replacements = {
              'len(rows) == 24': 'len(rows) == 25',
              'exactly 24 current positive-S5 systems': 'exactly 25 current positive-S5 systems',
              '"canonical_s5_positive_systems": 24,': '"canonical_s5_positive_systems": 25,',
              '"no_direct_public_result": 23,': '"no_direct_public_result": 24,',
              '"24-system canonical S5-positive cohort"': '"25-system canonical S5-positive cohort"',
              'full current 24-system canonical S5 cohort reconciled': 'full current 25-system canonical S5 cohort reconciled',
          }
          for old, new in replacements.items():
              assert old in validator, old
              validator = validator.replace(old, new)
          validator_path.write_text(validator, encoding='utf-8')
          PY

      - name: Render experimental projections
        run: |
          python experiments/functional-capability-depth/render_function_baselines.py
          python experiments/functional-capability-depth/render_evidence_frontier.py

      - name: Validate reconciliation
        run: |
          python scripts/check_index.py
          python experiments/functional-capability-depth/s5-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s5-system-benchmarks/matched-cell/validate_s5_primary_search_closure.py
          python experiments/functional-capability-depth/s5-system-benchmarks/matched-cell/validate_second_canonical_search.py
          python experiments/functional-capability-depth/validate_synthesis.py
          python -m unittest discover -s tests -v

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/gh-aw-s5-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/functional-capability-depth .github/workflows/gh-aw-s5-reconcile.yml
          git commit -m 'experiment: reconcile GitHub Agentic Workflows into S5 cohort'
          git push origin HEAD:index/gh-aw-admission-2
