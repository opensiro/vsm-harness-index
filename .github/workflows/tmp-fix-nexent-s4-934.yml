name: tmp-fix-nexent-s4-934

on:
  push:
    branches:
      - assessment/nexent-review-934

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment/nexent-review-934
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct Nexent S4 and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('assessments/nexent.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('autonomy_s4: —', 'autonomy_s4: C(P)', 1)
          start = text.index('## S4 — Outside-and-then intelligence')
          end = text.index('## S5 — Policy and identity')
          s4 = Path('.tmp/nexent-s4.md').read_text(encoding='utf-8')
          text = text[:start] + s4 + text[end:]
          text = text.replace('S4=— / S5=—', 'S4=C(P) / S5=—')
          p.write_text(text, encoding='utf-8')
          PY
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python -m unittest discover -s tests -v
          git diff --check
          rm -rf .tmp .github/workflows/tmp-fix-nexent-s4-934.yml
          git config user.name 'OpenSiro Automation'
          git config user.email 'founders@opensiro.com'
          git add -A
          git commit -m 'assessment: correct Nexent S4 to C(P)'
          git push origin HEAD:assessment/nexent-review-934
