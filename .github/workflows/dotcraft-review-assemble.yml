name: assemble-dotcraft-review

on:
  push:
    branches:
      - assessment/dotcraft-review
    paths:
      - .github/workflows/dotcraft-review-assemble.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment/dotcraft-review
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate proposed metrics and validate
        run: |
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python -m unittest discover -s tests -v
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/dotcraft-review-assemble.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "assessment: finalize DotCraft review"
          git push origin HEAD:assessment/dotcraft-review
