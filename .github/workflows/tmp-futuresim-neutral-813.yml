name: tmp FutureSim neutral migration 813

on:
  push:
    branches:
      - experiment/s4-futuresim-neutral-registry-813

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Migrate FutureSim raw evidence
        run: python .github/tmp_migrate_futuresim_813.py
      - name: Regenerate neutral registry
        run: python experiments/functional-capability-depth/system-observations/render_registry.py
      - name: Validate neutral registry
        run: |
          python experiments/functional-capability-depth/system-observations/validate.py
          python experiments/functional-capability-depth/system-observations/render_registry.py --check
      - name: Validate S4 projection
        run: |
          python experiments/functional-capability-depth/s4-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s4-system-benchmarks/matched-cell/validate.py
          python experiments/functional-capability-depth/s4-system-benchmarks/matched-cell/validate_s4_primary_search_closure.py
      - name: Validate synthesis and index
        run: |
          python experiments/functional-capability-depth/render_function_baselines.py --check
          python experiments/functional-capability-depth/render_evidence_frontier.py --check
          python experiments/functional-capability-depth/validate_synthesis.py
          python scripts/check_index.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Remove assembler artifacts
        run: rm .github/tmp_migrate_futuresim_813.py .github/workflows/tmp-futuresim-neutral-813.yml
      - name: Commit assembled transaction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No assembled changes"
            exit 1
          fi
          git commit -m "experiment: move FutureSim S4 proxy evidence to neutral registry"
          git push
