name: admit-taixu

on:
  push:
    branches:
      - admit-taixu-260

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admit-taixu-260
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Admit TaiXu and render canonical outputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/taixu.md')
          text = assessment.read_text(encoding='utf-8')
          if 'status: proposed' in text:
              text = text.replace('status: proposed', 'status: included', 1)
              assessment.write_text(text, encoding='utf-8')

          catalog = Path('data/catalog.psv')
          row = '260|taixu|TaiXu|https://github.com/wkbin/taixu|2026-08-20T09:49:57Z|index-addition|037880a898ad503128dee7b2991dd6d351ad8cb3|2026-09-26'
          catalog_text = catalog.read_text(encoding='utf-8')
          if '|taixu|' not in catalog_text:
              catalog.write_text(catalog_text.rstrip('\n') + '\n' + row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signature = ('260|taixu|TaiXu closes autonomous S1 through its persistent model/tool loop, S2 through model-declared write leases plus write-clean wave coordination, and S3 through main-agent whole-batch regulation of child commitments. Host-side receipt adjudication provides S3*=C, while post-run skill-evolution proposals with first-party human apply close S4=P; no S5 identity-policy closure is established.')
          signatures_text = signatures.read_text(encoding='utf-8')
          if '|taixu|' not in signatures_text:
              signatures.write_text(signatures_text.rstrip('\n') + '\n' + signature + '\n', encoding='utf-8')
          PY
          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
      - name: Commit canonical admission
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/admit-taixu.yml
          git add assessments/taixu.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md METRICS.md data/metrics.json README.md FULL_A.md
          git commit -m "assessment: admit TaiXu" || exit 0
          git push origin HEAD:admit-taixu-260
