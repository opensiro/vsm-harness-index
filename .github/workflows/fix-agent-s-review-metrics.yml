name: fix Agent S review metrics

on:
  push:
    branches:
      - assess-agent-s-126-20260919

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate all metric outputs
        run: |
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
      - name: Validate review tree
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v
      - name: Commit regenerated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add METRICS.md data/metrics.json README.md
          git diff --cached --quiet || git commit -m 'chore: refresh Agent S metric outputs'
          git push
      - name: Remove temporary fixer
        run: |
          git rm .github/workflows/fix-agent-s-review-metrics.yml
          git commit -m 'chore: remove Agent S metric fixer'
          git push
