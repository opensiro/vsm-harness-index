name: admit multi-agent-orchestration render
on:
  push:
    branches: [admit-multi-agent-orchestration-214]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit and render
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('assessments/multi-agent-orchestration.md')
          s = p.read_text()
          if 'status: proposed' not in s:
              raise SystemExit('assessment is not proposed')
          s = s.replace('status: proposed', 'status: included', 1)
          p.write_text(s)

          cat = Path('data/catalog.psv')
          text = cat.read_text()
          row = '214|multi-agent-orchestration|Multi-Agent Orchestration Engine|https://github.com/Vinay-veeragani/Multi-Agent-Orchestration|2026-08-31T12:56:17Z|index-addition|e6c34462af045d7e53d383103346362351c96353|2026-09-24'
          if row not in text:
              cat.write_text(text.rstrip() + '\n' + row + '\n')

          sig = Path('data/signatures.psv')
          text = sig.read_text()
          row = '214|multi-agent-orchestration|Multi-Agent Orchestration Engine runs autonomous model/tool S1 units and closes autonomous whole-execution S3 through a live-state supervisor that owns delegation, fan-out, retry, replan and finalization decisions; generic DAG scheduling, joins, locks and semaphores do not establish S2, inline validation does not form independent S3*, current-run retry/replan/checkpoint recovery does not close S4, and configured budgets, policies and action approvals do not establish S5 identity/ultimate-policy closure.'
          if row not in text:
              sig.write_text(text.rstrip() + '\n' + row + '\n')
          PY
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/multi-agent-orchestration.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md METRICS.md README.md analytics/temporal.md data/metrics.json
          git commit -m 'admit: render multi-agent-orchestration canonical inclusion'
          git push
