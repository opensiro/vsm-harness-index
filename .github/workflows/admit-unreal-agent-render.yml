name: admit Unreal Agent render

on:
  push:
    branches:
      - admit-unreal-agent-205

permissions:
  contents: write

jobs:
  render:
    if: ${{ !contains(github.event.head_commit.message, '[skip render]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Admit reviewed Unreal Agent assessment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/unreal-agent.md')
          text = assessment.read_text(encoding='utf-8')
          if 'status: included' not in text:
              if 'status: proposed' not in text:
                  raise SystemExit('Unreal Agent assessment is neither proposed nor included')
              text = text.replace('status: proposed', 'status: included', 1)
              assessment.write_text(text, encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_row = '205|unreal-agent|Unreal Agent|https://github.com/unreallabsai/unreal-agent|2026-09-21T23:14:02Z|index-addition|b7c9bf1c5c2fa4127255c07727a7c8413e23944a|2026-09-22'
          catalog_text = catalog.read_text(encoding='utf-8')
          if '|unreal-agent|' not in catalog_text:
              catalog.write_text(catalog_text.rstrip() + '\n\n' + catalog_row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signature_row = '205|unreal-agent|Unreal Agent runs an autonomous model-driven operational loop through its shipped persisted coordinator/tool runtime; concurrent operations remain subordinate to one S1, while no material first-party installation-level S2, S3, S3*, S4 or S5 closure is established.'
          signatures_text = signatures.read_text(encoding='utf-8')
          if '|unreal-agent|' not in signatures_text:
              signatures.write_text(signatures_text.rstrip() + '\n\n' + signature_row + '\n', encoding='utf-8')
          PY

      - name: Render canonical derived artifacts
        shell: bash
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check

      - name: Commit rendered admission
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assessments/unreal-agent.md data/catalog.psv data/signatures.psv METRICS.md RANKINGS.md README.md TLDR.md analytics/temporal.md data/metrics.json
          if git diff --cached --quiet; then
            echo 'No admission changes to commit'
            exit 0
          fi
          git commit -m 'admit: render Unreal Agent canonical artifacts [skip render]'
          git push
