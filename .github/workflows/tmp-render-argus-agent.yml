name: temporary Argus admission renderer

on:
  push:
    branches:
      - admit-argus-agent-236

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply canonical admission inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path("assessments/argus-agent.md")
          text = assessment.read_text(encoding="utf-8")
          old = "status: proposed\n"
          new = "status: included\n"
          if old in text:
              assessment.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("Argus assessment has neither proposed nor included status")

          catalog = Path("data/catalog.psv")
          catalog_text = catalog.read_text(encoding="utf-8")
          catalog_row = "236|argus-agent|Argus|https://github.com/microsoft/ArgusAgent|2026-08-05T02:20:20Z|index-addition|746f76b7a74a1217507c9ee348eecd3b782f7c92|2026-09-24"
          if "|argus-agent|" not in catalog_text:
              catalog.write_text(catalog_text.rstrip("\n") + "\n" + catalog_row + "\n", encoding="utf-8")

          signatures = Path("data/signatures.psv")
          signatures_text = signatures.read_text(encoding="utf-8")
          signature_row = "236|argus-agent|Argus closes autonomous S1 through its Engineer mission loop, S3 through Manager-owned project-stage control, S3* through independent read-only Reviewer judgment, and S4 through post-mission role-Skill evolution; TEAM missions are serialized rather than coordinated as sibling S1s, while operator-owned identity and reserved authority close S5=P."
          if "|argus-agent|" not in signatures_text:
              signatures.write_text(signatures_text.rstrip("\n") + "\n" + signature_row + "\n", encoding="utf-8")
          PY

      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py

      - name: Validate rendered state
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/render_full_a.py --check
          python -m unittest discover -s tests -v

      - name: Commit rendered admission
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No render changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assessments/argus-agent.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md METRICS.md data/metrics.json README.md
          git commit -m "admit: render Argus canonical inclusion"
          git push origin HEAD:${GITHUB_REF_NAME}
