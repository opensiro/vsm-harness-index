name: Assemble CUGA admission

on:
  push:
    branches:
      - admit-cuga-159

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote CUGA and add provenance
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/cuga.md')
          text = assessment.read_text(encoding='utf-8')
          if 'status: proposed' not in text:
              raise SystemExit('CUGA assessment is not proposed')
          assessment.write_text(text.replace('status: proposed', 'status: included', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_text = catalog.read_text(encoding='utf-8').rstrip('\n')
          if '|cuga|' in catalog_text:
              raise SystemExit('CUGA already exists in catalog')
          positions = [int(line.split('|', 1)[0]) for line in catalog_text.splitlines()[1:] if line.strip()]
          position = max(positions) + 1
          row = f'{position}|cuga|CUGA|https://github.com/cuga-project/cuga-agent|2025-09-11T11:58:55Z|index-addition|b3bdcaee74aaf7a53d3fb621b781d305fb714f5d|2026-09-21'
          catalog.write_text(catalog_text + '\n' + row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signatures_text = signatures.read_text(encoding='utf-8').rstrip('\n')
          if '|cuga|' in signatures_text:
              raise SystemExit('CUGA already exists in signatures')
          signature = (f'{position}|cuga|CUGA closes autonomous first-party model/tool operations and, in CugaSupervisor mode, autonomous whole-team current control by conditioning subsequent specialist commitments on accumulated subordinate results and shared variables. Delegation/sequencing do not establish S2; VERIFY/reflection remain routine production checks rather than independent S3*; optional Evolve delegates adaptation judgment to an external service, and policy/HITL do not close S5.')
          signatures.write_text(signatures_text + '\n' + signature + '\n', encoding='utf-8')
          PY
      - name: Regenerate canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
      - name: Commit admission
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/cuga.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md METRICS.md data/metrics.json README.md FULL_A.md
          git commit -m 'admit: add CUGA from reviewed standalone assessment'
          git push
