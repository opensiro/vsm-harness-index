name: assemble admission 191

on:
  push:
    branches:
      - admit-research-batch-191

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Promote proposed assessments and extend corpus ledgers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          import io
          import json
          import os
          import urllib.request
          from urllib.parse import urlparse

          repo = Path('.')
          order = [
              'ai-scientist.md',
              'ai-scientist-v2.md',
              'agent-laboratory.md',
              'data-to-paper.md',
              'xcientist.md',
              'kadath.md',
              'omniscientist.md',
              'cais.md',
              'openags.md',
              'veritas.md',
          ]
          signatures = {
              'ai-scientist.md': 'The AI Scientist combines autonomous executable experiment work with external-literature novelty sensing and, in improvement mode, a separate paper review that returns findings into manuscript/code revision; whole-run progression remains scripted rather than agent-owned S3.',
              'ai-scientist-v2.md': 'The AI Scientist-v2 combines autonomous progressive experiment search with an AgentManager that makes model-driven whole-stage completion and next-focus decisions plus literature-grounded prospective ideation; its final paper review remains post-hoc rather than S3*.',
              'agent-laboratory.md': 'Agent Laboratory combines autonomous multi-role research execution with literature-grounded adaptation and an optional Co-Pilot parent-review mode that returns phase feedback into later research planning; reviewer challenge exists, but autonomous S3* closure remains insufficiently evidenced at the pinned revision.',
              'data-to-paper.md': 'data-to-paper closes autonomous scientific analysis, a separate reviewer-revisee corrective audit loop, and literature/novelty-driven adaptation; its Copilot mode adds a distinct parent-governed S4 path by returning human scientific feedback into the same refinement cycle.',
              'xcientist.md': 'Xcientist combines autonomous executable experiment work with read-only prefinish reviewers that return blocking fixes and a Survey-to-Idea external-literature path that selects future experiments; deterministic master gating remains lifecycle enforcement rather than S3.',
              'kadath.md': 'KADATH combines autonomous organism execution, constructor-owned whole-population current control, an independent frozen-evidence Grader audit, autonomous evolutionary capability adaptation, and parent ownership of the locked run-level fitness policy.',
              'omniscientist.md': 'OmniScientist closes an autonomous research/tool loop and a literature-grounded ideation path that changes later experimentation; deterministic provenance and exit gates remain enforcement rather than S3 or S3*, and no ultimate-policy loop is established.',
              'cais.md': 'CAIS closes an autonomous model-assisted causal-analysis operation, while staged helpers, IV critics and currently unintegrated method-validation surfaces remain inside current-task production rather than establishing separate S2, S3, S3*, S4 or S5 ownership.',
              'openags.md': 'OpenAGS uses its first-party builtin Agent engine for autonomous specialist research, a root coordinator for whole-project current control, a separate reviewer whose findings drive reruns, and an external-literature path that shapes later research; no S2 interference or S5 identity loop is established.',
              'veritas.md': 'Veritas combines autonomous best-first experiment execution with model-driven AgentManager current control and Semantic-Scholar-backed prospective ideation; parallel candidates do not establish S2, while the final automated paper review remains post-hoc rather than a closed S3* loop.',
          }

          def frontmatter(path: Path) -> dict[str, str]:
              text = path.read_text(encoding='utf-8')
              if not text.startswith('---\n'):
                  raise SystemExit(f'{path}: missing frontmatter')
              raw = text.split('---\n', 2)[1]
              out = {}
              for line in raw.splitlines():
                  if ':' in line:
                      key, value = line.split(':', 1)
                      out[key.strip()] = value.strip()
              return out

          # Promote exactly the frozen reviewed artifacts already staged on main.
          meta = []
          for filename in order:
              path = repo / 'assessments' / filename
              text = path.read_text(encoding='utf-8')
              marker = 'status: proposed\n'
              if text.count(marker) != 1:
                  raise SystemExit(f'{path}: expected exactly one proposed status')
              path.write_text(text.replace(marker, 'status: included\n', 1), encoding='utf-8')
              fm = frontmatter(path)
              if fm.get('profile_version') != '0.2.3' or fm.get('assessment_procedure_version') != '0.3.5':
                  raise SystemExit(f'{path}: active semantic contract changed unexpectedly')
              if len(fm.get('review_ref', '')) != 40:
                  raise SystemExit(f'{path}: invalid review_ref')
              meta.append((filename, fm))

          catalog_path = repo / 'data' / 'catalog.psv'
          catalog_text = catalog_path.read_text(encoding='utf-8')
          catalog_rows = list(csv.DictReader(io.StringIO(catalog_text), delimiter='|'))
          positions = [int(row['catalog_position']) for row in catalog_rows]
          if positions != list(range(1, len(catalog_rows) + 1)):
              raise SystemExit('catalog positions are not contiguous')
          if len(catalog_rows) != 145:
              raise SystemExit(f'expected frozen admission base of 145 catalog rows, got {len(catalog_rows)}')
          existing_ids = {row['harness_id'] for row in catalog_rows}
          existing_repos = {row['repository'].lower().rstrip('/') for row in catalog_rows}

          sig_path = repo / 'data' / 'signatures.psv'
          sig_text = sig_path.read_text(encoding='utf-8')
          sig_rows = list(csv.DictReader(io.StringIO(sig_text), delimiter='|'))
          existing_sig_ids = {row['harness_id'] for row in sig_rows}

          token = os.environ['GITHUB_TOKEN']
          new_catalog = []
          new_signatures = []
          next_pos = len(catalog_rows) + 1

          for offset, (filename, fm) in enumerate(meta):
              harness_id = fm['harness_id']
              repository = fm['repository'].rstrip('/')
              if harness_id in existing_ids:
                  raise SystemExit(f'duplicate catalog harness_id: {harness_id}')
              if repository.lower() in existing_repos:
                  raise SystemExit(f'duplicate catalog repository: {repository}')
              if harness_id in existing_sig_ids:
                  raise SystemExit(f'duplicate signature harness_id: {harness_id}')

              parsed = urlparse(repository)
              parts = parsed.path.strip('/').split('/')
              if parsed.netloc.lower() != 'github.com' or len(parts) != 2:
                  raise SystemExit(f'unsupported repository URL: {repository}')
              api_url = f'https://api.github.com/repos/{parts[0]}/{parts[1]}'
              req = urllib.request.Request(
                  api_url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'opensiro-vsm-harness-index-admission',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  repo_info = json.load(response)
              created_at = repo_info['created_at']

              position = next_pos + offset
              fields = [
                  str(position), harness_id, fm['project_name'], repository,
                  created_at, 'index-addition', fm['review_ref'], '2026-09-20',
              ]
              if any('|' in value or '\n' in value for value in fields):
                  raise SystemExit(f'PSV-unsafe catalog value for {harness_id}')
              new_catalog.append('|'.join(fields))

              signature = signatures[filename]
              if '|' in signature or '\n' in signature:
                  raise SystemExit(f'PSV-unsafe signature for {harness_id}')
              new_signatures.append(f'{position}|{harness_id}|{signature}')

          catalog_path.write_text(catalog_text.rstrip('\n') + '\n' + '\n'.join(new_catalog) + '\n', encoding='utf-8')
          sig_path.write_text(sig_text.rstrip('\n') + '\n' + '\n'.join(new_signatures) + '\n', encoding='utf-8')
          PY

      - name: Regenerate deterministic projections
        shell: bash
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Validate assembled admission
        shell: bash
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v

      - name: Commit admission and remove helper
        shell: bash
        run: |
          rm .github/workflows/assemble-admission-191.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assessments data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md FULL_A.md METRICS.md data/metrics.json README.md .github/workflows/assemble-admission-191.yml
          git commit -m "admit: research task-specific batch 191"
          git push origin HEAD:admit-research-batch-191
