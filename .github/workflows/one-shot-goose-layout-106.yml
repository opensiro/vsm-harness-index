name: one-shot goose layout 106

on:
  push:
    branches:
      - r2-goose-s3-correction-106

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fix R2 table layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("reassessments/R2-2026-09-16.md")
          text = p.read_text()
          needle = "\n\n| `goose` |"
          if text.count(needle) != 1:
              raise SystemExit(f"expected exactly one detached Goose row, found {text.count(needle)}")
          p.write_text(text.replace(needle, "\n| `goose` |", 1))
          PY
          python scripts/check_index.py
      - name: Commit final layout and remove helper
        shell: bash
        run: |
          rm .github/workflows/one-shot-goose-layout-106.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R2: keep Goose row in progress table"
          git push
