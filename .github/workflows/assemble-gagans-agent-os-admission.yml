name: assemble gagans23 agent-os admission

on:
  push:
    branches:
      - admit-gagans-agent-os

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote gagans23 agent-os and append canonical provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assessments/gagans-agent-os.md')
          text = p.read_text()
          needle = 'assessment_procedure_version: 0.3.5\nstatus: proposed\n'
          repl = 'assessment_procedure_version: 0.3.5\nassessment_changed_at: 2026-09-21\nstatus: included\n'
          if needle not in text:
              raise SystemExit('unexpected gagans23 agent-os frontmatter state')
          p.write_text(text.replace(needle, repl, 1))

          catalog = Path('data/catalog.psv')
          c = catalog.read_text()
          expected = '181|exo|Exo|https://github.com/exoharness/exo|2026-05-20T06:21:50Z|index-addition|6164288895a5851b2118492c880fb37b543e2ac6|2026-09-21'
          if not c.rstrip().endswith(expected):
              raise SystemExit('catalog tail changed; rebuild on current main')
          catalog.write_text(c.rstrip('\n') + '\n182|gagans-agent-os|agent-os|https://github.com/gagans23/agent-os|2026-05-21T17:40:37Z|index-addition|d318787db1fce4163e470ac1c94f5a74d667303f|2026-09-21\n')

          sig = Path('data/signatures.psv')
          s = sig.read_text()
          if '\n182|gagans-agent-os|' in s or s.startswith('182|gagans-agent-os|'):
              raise SystemExit('gagans23 agent-os signature already present')
          sig.write_text(s.rstrip('\n') + '\n182|gagans-agent-os|gagans23 agent-os closes autonomous S1 and constructor S2 through pre-fanout attenuation of a concrete shared-SQLite initialization collision; reusable skill synthesis is parent-governed S4 through explicit approval, while no standalone S3, independent S3*, or identity-policy S5 closure is established.\n')
          PY
      - name: Regenerate canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
      - name: Validate assembled admission
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v
      - name: Commit canonical admission
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'admit: add gagans23 agent-os from reviewed standalone assessment'
          git push
      - name: Remove temporary assembler
        run: |
          git rm .github/workflows/assemble-gagans-agent-os-admission.yml
          git commit -m 'chore: remove gagans23 agent-os admission assembler'
          git push
