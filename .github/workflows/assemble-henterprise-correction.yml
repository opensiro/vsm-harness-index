name: assemble Henterprise correction

on:
  push:
    branches:
      - assessment/henterprise-same-ref-correction

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment/henterprise-same-ref-correction
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update Henterprise cohort signature
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/henterprise.md').read_text(encoding='utf-8')
          expected = [
              'autonomy_s1: A',
              'autonomy_s2: C',
              'autonomy_s3: A',
              'autonomy_s3_star: C',
              'autonomy_s4: A',
              'autonomy_s5: A',
          ]
          if not all(item in assessment for item in expected):
              raise SystemExit('Henterprise corrected vector is not present')

          path = Path('data/signatures.psv')
          lines = path.read_text(encoding='utf-8').splitlines()
          replacement = "129|henterprise|Henterprise's supported single-profile mode lets one autonomous Hermes actor close portfolio/current control, external/future adaptation and executive identity/policy across the full skill tree; dependency coordination and independent reviewer audit remain constructor paths because they require distinct departmental/reviewer actors and cross-profile closure."
          matches = [i for i, line in enumerate(lines) if line.startswith('129|henterprise|')]
          if len(matches) != 1:
              raise SystemExit(f'Expected one Henterprise signature row, got {len(matches)}')
          lines[matches[0]] = replacement
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Regenerate canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Validate corrected state
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v

      - name: Commit corrected projections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md FULL_A.md METRICS.md data/metrics.json README.md
          git commit -m 'assessment: regenerate Henterprise correction'
          git push origin HEAD:assessment/henterprise-same-ref-correction

      - name: Remove temporary assembler
        run: |
          rm .github/workflows/assemble-henterprise-correction.yml
          git add .github/workflows/assemble-henterprise-correction.yml
          git commit -m 'chore: remove Henterprise correction assembler'
          git push origin HEAD:assessment/henterprise-same-ref-correction
