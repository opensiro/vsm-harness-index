name: Assemble Tandem admission

on:
  push:
    branches:
      - index/tandem-admission

permissions:
  contents: write

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: index/tandem-admission
          fetch-depth: 0

      - name: Canonicalize assessment sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/tandem.md')
          text = assessment.read_text(encoding='utf-8')
          assert text.count('status: proposed') == 1
          assessment.write_text(text.replace('status: proposed', 'status: included', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_text = catalog.read_text(encoding='utf-8')
          assert '|tandem|' not in catalog_text
          rows = [line for line in catalog_text.splitlines() if line.strip()]
          assert rows[-1].startswith('283|chump|'), f'unexpected catalog tail: {rows[-1]}'
          row = '284|tandem|Tandem|https://github.com/frumu-ai/tandem|2026-01-17T16:27:57Z|index-addition|3ee2d83d76497565680538ef00f1616f55650524|2026-09-27'
          catalog.write_text(catalog_text.rstrip('\n') + '\n' + row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signatures_text = signatures.read_text(encoding='utf-8')
          assert '|tandem|' not in signatures_text
          signature = 'Tandem closes autonomous S1 through its native model/tool loop; constructor S2 through workspace lock/queue feedback; constructor-plus-parent S3 through whole-run control and operator pause/resume; and constructor S3* through complementary lifecycle evidence/review. No S4 closes; versioned orchestration and goal-policy publication give S5=C(P).'
          assert len(signature) <= 360
          signatures.write_text(signatures_text.rstrip('\n') + '\n284|tandem|' + signature + '\n', encoding='utf-8')
          PY

      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Validate canonical state
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/tandem-admit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/tandem.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md FULL_A.md METRICS.md data/metrics.json README.md .github/workflows/tandem-admit.yml
          git commit -m 'index: canonicalize Tandem admission'
          git push origin HEAD:index/tandem-admission
