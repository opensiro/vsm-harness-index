name: stage-railwarden-admission

on:
  push:
    branches:
      - admission/railwarden-1009

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admission/railwarden-1009
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fail-closed source admission
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assessments/railwarden.md')
          text=p.read_text(encoding='utf-8')
          required={
            'harness_id':'railwarden',
            'project_name':'RailWarden',
            'repository':'https://github.com/advaith-1212/railwarden',
            'review_ref':'9e63f75baced5b1e246ed2470d59bc092905c1ad',
            'status':'proposed',
            'autonomy_s1':'A',
            'autonomy_s2':'C',
            'autonomy_s3':'C(P)',
            'autonomy_s3_star':'—',
            'autonomy_s4':'—',
            'autonomy_s5':'—',
          }
          for k,v in required.items():
            needle=f'{k}: {v}'
            if needle not in text:
              raise SystemExit(f'assessment gate failed: missing {needle!r}')
          if text.count('status: proposed') != 1:
            raise SystemExit('assessment gate failed: expected exactly one proposed status')
          p.write_text(text.replace('status: proposed','status: included',1),encoding='utf-8')

          cp=Path('data/catalog.psv'); catalog=cp.read_text(encoding='utf-8')
          rows=[x for x in catalog.splitlines() if x.strip()]
          if any('|railwarden|' in x for x in rows[1:]):
            raise SystemExit('catalog gate failed: railwarden already present')
          tail=int(rows[-1].split('|',1)[0])
          if tail != 349:
            raise SystemExit(f'catalog gate failed: expected tail 349, found {tail}')
          cp.write_text(catalog.rstrip('\n')+'\n'+'350|railwarden|RailWarden|https://github.com/advaith-1212/railwarden|2026-06-27T10:36:14Z|index-addition|9e63f75baced5b1e246ed2470d59bc092905c1ad|2026-09-20\n',encoding='utf-8')

          sp=Path('data/signatures.psv'); sigs=sp.read_text(encoding='utf-8')
          if any('|railwarden|' in x for x in sigs.splitlines()[1:]):
            raise SystemExit('signature gate failed: railwarden already present')
          signature=('350|railwarden|RailWarden closes autonomous S1 through model-backed coding workers, constructor S2 through worktree/path/DAG/integration anti-interference controls, '
                     'and S3 as C(P) through deterministic fleet control plus a supported operator current-control loop; independent audit, prospective adaptation, and ultimate-policy closure are not established.')
          sp.write_text(sigs.rstrip('\n')+'\n'+signature+'\n',encoding='utf-8')
          PY
      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_analytics.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
      - name: Verify rendered tree
        run: |
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_analytics.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/check_index.py
          python -m unittest discover -s tests -v
      - name: Commit staged admission
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && { echo 'expected admission changes but tree is clean'; exit 1; } || true
          git commit -m 'Index: stage RailWarden admission at #350'
          git push origin HEAD:admission/railwarden-1009
