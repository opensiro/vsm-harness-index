name: tmp-admit-raven-315

on:
  push:
    branches:
      - assess-raven-315

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assess-raven-315
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical admission and render
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/raven.md')
          text = assessment.read_text(encoding='utf-8')
          if 'status: included' not in text:
              raise SystemExit('unexpected Raven status')

          catalog = Path('data/catalog.psv')
          row = '315|raven|Raven|https://github.com/EverMind-AI/Raven|2026-05-21T08:45:07Z|index-addition|e6c0344cb7ce00db25d554e4bb671ec1909a8f9f|2026-09-29'
          rows = catalog.read_text(encoding='utf-8').splitlines()
          if not any(line.startswith('315|') or '|raven|' in line for line in rows):
              rows.append(row)
              catalog.write_text('\n'.join(rows) + '\n', encoding='utf-8')
          elif row not in rows:
              raise SystemExit('catalog #315 or raven already present with different data')

          signatures = Path('data/signatures.psv')
          sig = '315|raven|Raven combines autonomous Host Agent operation with constructor-owned stale-edit coordination and machine-read Git audit, while the Host Agent supplies autonomous current-control plus a supported parent steering mode; runtime S4 is absent and operator-owned identity/permission policy supplies S5.'
          sigrows = signatures.read_text(encoding='utf-8').splitlines()
          if not any(line.startswith('315|') or '|raven|' in line for line in sigrows):
              sigrows.append(sig)
              signatures.write_text('\n'.join(sigrows) + '\n', encoding='utf-8')
          elif sig not in sigrows:
              raise SystemExit('signature for raven/#315 already present with different data')
          PY

          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
          python scripts/check_index.py
          python scripts/validate_tldr.py
          python -m unittest discover -s tests -v
          git diff --check

          rm .github/workflows/tmp-admit-raven-315.yml
          git config user.name 'OpenSiro Automation'
          git config user.email 'founders@opensiro.com'
          git add -A
          git commit -m 'index: admit Raven at catalog #315'
          git push origin HEAD:assess-raven-315
