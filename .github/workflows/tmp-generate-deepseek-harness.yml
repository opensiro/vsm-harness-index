name: tmp-generate-deepseek-harness

on:
  push:
    branches:
      - admit-deepseek-harness-37

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admit-deepseek-harness-37
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add DeepSeek Harness corpus rows and render projections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          rows = {
              Path("data/catalog.psv"): "109|deepseek-harness|DeepSeek Harness|https://github.com/deepseek-ai/deepseek-harness|2026-08-13T11:56:32Z|adapted-source|ddefc45fbc7f8e46dd73185e68295696d1297887|2026-09-17",
              Path("data/signatures.psv"): "109|deepseek-harness|The base Agent loop owns autonomous S1; the published opt-in Agent Teams mode closes agent-owned S2 through durable shared commitments and model-Lead S3 through roster/task intervention, while the Team Web task board adds parent-governed S3; no S3*/S4/S5 closure is established.",
          }
          for path, row in rows.items():
              text = path.read_text(encoding="utf-8")
              lines = text.splitlines()
              if row not in lines:
                  lines.append(row)
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          python scripts/render_tldr.py
          python scripts/check_index.py
          python -m unittest discover -s tests -v
      - name: Commit generated corpus changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Generate DeepSeek Harness corpus projections'
          git push origin HEAD:admit-deepseek-harness-37
