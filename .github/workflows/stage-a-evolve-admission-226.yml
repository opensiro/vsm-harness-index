name: stage A-Evolve admission 226
on:
  push:
    branches:
      - admission/a-evolve-226
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical admission
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/a-evolve.md')
          text = assessment.read_text(encoding='utf-8')
          if text.count('status: proposed') != 1:
              raise SystemExit('expected exactly one proposed status in A-Evolve assessment')
          assessment.write_text(text.replace('status: proposed', 'status: included', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          ctext = catalog.read_text(encoding='utf-8')
          if '|a-evolve|' in ctext or 'https://github.com/A-EVO-Lab/a-evolve' in ctext:
              raise SystemExit('A-Evolve already exists in catalog')
          positions = [int(line.split('|', 1)[0]) for line in ctext.splitlines()[1:] if line.strip()]
          if max(positions) != 225:
              raise SystemExit(f'expected current catalog max 225, got {max(positions)}')
          if not ctext.endswith('\n'):
              ctext += '\n'
          ctext += '226|a-evolve|A-Evolve|https://github.com/A-EVO-Lab/a-evolve|2026-02-20T04:52:59Z|index-addition|18ba996dac9843f2759b2cdf8a94022f58fbfeb9|2026-09-24\n'
          catalog.write_text(ctext, encoding='utf-8')

          signatures = Path('data/signatures.psv')
          stext = signatures.read_text(encoding='utf-8')
          if '|a-evolve|' in stext:
              raise SystemExit('A-Evolve signature already exists')
          if not stext.endswith('\n'):
              stext += '\n'
          stext += '226|a-evolve|A-Evolve runs a bundled autonomous S1 agent inside a persistent evolution loop, exposes complementary benchmark-ground-truth audit as an S3* constructor path, and closes autonomous S4 by having the default evolver turn observed task/environment evidence into persistent prompt, skill and memory changes reloaded into later operation; no material S2, whole-current S3 or S5 identity closure is established.\n'
          signatures.write_text(stext, encoding='utf-8')
          PY
      - name: Regenerate canonical views
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
      - name: Validate admission
        run: |
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/check_index.py
          python experiments/functional-capability-depth/render_function_baselines.py --check
          python experiments/functional-capability-depth/render_s1_baseline.py --check
          python experiments/functional-capability-depth/s2-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s3-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s3star-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s4-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s5-system-benchmarks/validate.py
          python -m unittest discover -s tests -v
      - name: Commit admission
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/a-evolve.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md FULL_A.md analytics/temporal.md METRICS.md data/metrics.json README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'admission: admit A-Evolve at catalog position 226'
          git push
