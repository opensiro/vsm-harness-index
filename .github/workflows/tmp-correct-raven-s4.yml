name: tmp-correct-raven-s4

on:
  push:
    branches:
      - assess-raven-315

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assess-raven-315
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct Raven assessment
        run: python .github/tmp_correct_raven_s4.py
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
          python scripts/check_index.py
          python scripts/validate_tldr.py
          python -m unittest discover -s tests -v
          git diff --check
      - name: Commit corrected assessment
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-correct-raven-s4.yml .github/tmp_correct_raven_s4.py
          git config user.name 'OpenSiro Automation'
          git config user.email 'founders@opensiro.com'
          git add -A
          git commit -m 'assessment: credit Raven source-mode RSI as S4=A'
          git push origin HEAD:assess-raven-315
