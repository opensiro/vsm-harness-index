name: Assemble Ante admission

on:
  push:
    branches:
      - admit/ante-187

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admit/ante-187
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit Ante canonical source state
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('assessments/ante.md')
          text = p.read_text()
          old = 'status: proposed'
          new = 'status: included'
          if old not in text:
              raise SystemExit('expected proposed status not found')
          p.write_text(text.replace(old, new, 1))

          catalog = Path('data/catalog.psv')
          catalog_line = '187|ante|Ante|https://github.com/AntigmaLabs/ante|2025-12-23T23:42:44Z|index-addition|74ce24554341fb0c6cc3521baa5da5b94cedf881|2026-09-21'
          ctext = catalog.read_text().rstrip('\n')
          if '|ante|Ante|' in ctext:
              raise SystemExit('Ante already present in catalog')
          catalog.write_text(ctext + '\n' + catalog_line + '\n')

          signatures = Path('data/signatures.psv')
          signature_line = '187|ante|Ante closes autonomous S1, model-evaluator S3 goal control, and persistent auto-memory S4; bounded subagent concurrency and curated independent review remain constructor S2/S3*, while configuration and permissions do not close S5.'
          stext = signatures.read_text().rstrip('\n')
          if '|ante|' in stext:
              raise SystemExit('Ante already present in signatures')
          signatures.write_text(stext + '\n' + signature_line + '\n')
          PY
      - name: Regenerate canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
      - name: Validate assembled tree
        run: |
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/check_index.py
          python -m unittest discover -s tests -v
      - name: Commit deterministic result and remove assembler
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/assemble-ante-admission.yml
          git add -A
          git commit -m 'admit: assemble Ante canonical state'
          git push
