name: admit-lobstah-140

on:
  push:
    branches:
      - admit-lobstah-140

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply lobstah admission and regenerate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/lobstah.md')
          text = assessment.read_text(encoding='utf-8')
          text = text.replace(
              'assessment_procedure_version: 0.3.5\nstatus: proposed\n',
              'assessment_procedure_version: 0.3.5\nassessment_changed_at: 2026-09-20\nstatus: included\n',
              1,
          )
          assessment.write_text(text, encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_line = '160|lobstah|lobstah|https://github.com/aequitas-labs/lobstah|2026-09-02T21:00:35Z|index-addition|6aa75e2212fa8f22fa8dde7790070463c0021f8c|2026-09-20'
          lines = catalog.read_text(encoding='utf-8').rstrip('\n').split('\n')
          assert not any('|lobstah|' in line for line in lines), 'lobstah already exists in catalog'
          assert lines[-1].startswith('159|trueforge|'), 'unexpected catalog tail'
          catalog.write_text('\n'.join(lines + [catalog_line]) + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signature = ('160|lobstah|Lobstah runs autonomous coding workers in collision-isolated worktrees as constructor-owned S2 and exposes a whole-fleet S3 constructor with a shipped parent-governed lobsterman mode; deterministic daemon recovery remains enforcement, while review/watch and configuration surfaces do not close S3*, S4 or S5.')
          sig_lines = signatures.read_text(encoding='utf-8').rstrip('\n').split('\n')
          assert not any('|lobstah|' in line for line in sig_lines), 'lobstah already exists in signatures'
          assert sig_lines[-1].startswith('159|trueforge|'), 'unexpected signatures tail'
          signatures.write_text('\n'.join(sig_lines + [signature]) + '\n', encoding='utf-8')
          PY

          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          rm .github/workflows/admit-lobstah-140.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/lobstah.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md METRICS.md data/metrics.json README.md .github/workflows/admit-lobstah-140.yml
          git commit -m 'assessment: prepare lobstah admission [admission-generated]'
          git push origin HEAD:admit-lobstah-140
