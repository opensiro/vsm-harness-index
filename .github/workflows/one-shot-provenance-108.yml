name: one-shot provenance 108

on:
  push:
    branches:
      - provenance-same-ref-freshness-108

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch provenance contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          check = Path("scripts/check_index.py")
          text = check.read_text()
          old = '''        elif outcome == "same-ref-correction":
              if row["checked_ref"] != row["previous_review_ref"] or row["accepted_review_ref"] != row["previous_review_ref"]:
                  raise SystemExit(
                      f"{round_id}/{harness_id}: same-ref correction must keep the review boundary"
                  )
          '''
          new = '''        elif outcome == "same-ref-correction":
              # The semantic correction must stay on the previously accepted boundary,
              # but a reassessment round may also inspect a newer upstream ref and
              # record that successful freshness check in checked_ref/last_checked_ref.
              if row["accepted_review_ref"] != row["previous_review_ref"]:
                  raise SystemExit(
                      f"{round_id}/{harness_id}: same-ref correction cannot advance accepted_review_ref"
                  )
          '''
          if old not in text:
              raise SystemExit("expected same-ref validator block not found")
          check.write_text(text.replace(old, new))

          contributing = Path("CONTRIBUTING.md")
          text = contributing.read_text()
          old = '''1. **Same-ref correction.** Re-evaluate the existing assessment at the same `review_ref`. This is appropriate when the evidence was missed or interpreted incorrectly. `data/catalog.psv` does not change.
          2. **New-ref reassessment.** Re-evaluate a newer upstream commit because relevant architecture or runtime behavior changed. Update the catalog `review_ref` and `pinned_at` only after the new assessment boundary is accepted; the assessment's own `reviewed_at` records when the reassessment was performed.
          '''
          new = '''1. **Same-ref correction.** Re-evaluate the existing assessment at the same `review_ref`. This is appropriate when the evidence was missed or interpreted incorrectly. `data/catalog.psv` does not change. Inside a reassessment round, the reviewer may also inspect a newer upstream `checked_ref`; when that newer ref does not materially change the corrected assessment, keep `accepted_review_ref` / canonical `review_ref` on the old boundary while allowing `last_checked_ref` to record the newer successful freshness check.
          2. **New-ref reassessment.** Re-evaluate a newer upstream commit because relevant architecture or runtime behavior changed. Update the catalog `review_ref` and `pinned_at` only after the new assessment boundary is accepted; the assessment's own `reviewed_at` records when the reassessment was performed.
          '''
          if old not in text:
              raise SystemExit("expected CONTRIBUTING re-review block not found")
          text = text.replace(old, new)
          old = '''A round check is useful even when the assessment does not change. In that case `last_checked_ref` and `last_checked_at` advance while the accepted `review_ref` can remain unchanged.
          '''
          new = '''A round check is useful even when the assessment does not change. In that case `last_checked_ref` and `last_checked_at` advance while the accepted `review_ref` can remain unchanged. The same freshness rule applies when a semantic error is corrected at the old accepted ref: `same-ref-correction` describes where the corrected classification is evidenced, while a newer `checked_ref` may separately record that later upstream was inspected and did not require a new accepted boundary.
          '''
          if old not in text:
              raise SystemExit("expected CONTRIBUTING freshness paragraph not found")
          contributing.write_text(text.replace(old, new))

          Path("tests/test_reassessment_provenance.py").write_text(r'''import sys
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          sys.path.insert(0, str(ROOT / "scripts"))

          from check_index import validate_reassessment_history


          class ReassessmentProvenanceTests(unittest.TestCase):
              def base(self):
                  previous = "1" * 40
                  newer = "2" * 40
                  catalog = {"demo": {"harness_id": "demo"}}
                  assessment = {
                      "harness_id": "demo",
                      "status": "included",
                      "review_ref": previous,
                      "last_checked_ref": newer,
                      "last_checked_at": "2026-09-17",
                      "last_reassessment_round": "R2",
                      "profile_version": "0.2.1",
                      "assessment_procedure_version": "0.3.1",
                  }
                  row = {
                      "round_id": "R2",
                      "harness_id": "demo",
                      "previous_review_ref": previous,
                      "checked_ref": newer,
                      "accepted_review_ref": previous,
                      "checked_at": "2026-09-17",
                      "profile_version": "0.2.1",
                      "assessment_procedure_version": "0.3.1",
                      "outcome": "same-ref-correction",
                      "changed_functions": "S3",
                      "evidence": "https://example.invalid/evidence",
                  }
                  return previous, newer, catalog, assessment, row

              def test_same_ref_correction_can_advance_freshness_only(self):
                  _, _, catalog, assessment, row = self.base()
                  validate_reassessment_history([row], catalog, {"demo": assessment})

              def test_same_ref_correction_cannot_advance_accepted_boundary(self):
                  _, newer, catalog, assessment, row = self.base()
                  row["accepted_review_ref"] = newer
                  assessment["review_ref"] = newer
                  with self.assertRaisesRegex(SystemExit, "cannot advance accepted_review_ref"):
                      validate_reassessment_history([row], catalog, {"demo": assessment})


          if __name__ == "__main__":
              unittest.main()
          ''')
          PY
      - name: Validate
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_index.py
      - name: Commit final patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-provenance-108.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix same-ref correction freshness provenance"
          git push
