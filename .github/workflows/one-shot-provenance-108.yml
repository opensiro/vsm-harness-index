name: one-shot provenance 108

on:
  push:
    branches:
      - provenance-same-ref-freshness-108

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch provenance contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          check = Path("scripts/check_index.py")
          lines = check.read_text().splitlines()
          target = '        elif outcome == "same-ref-correction":'
          try:
              i = lines.index(target)
          except ValueError:
              raise SystemExit("same-ref validator block not found")
          expected = [
              target,
              '            if row["checked_ref"] != row["previous_review_ref"] or row["accepted_review_ref"] != row["previous_review_ref"]:',
              '                raise SystemExit(',
              '                    f"{round_id}/{harness_id}: same-ref correction must keep the review boundary"',
              '                )',
          ]
          if lines[i:i + len(expected)] != expected:
              raise SystemExit("same-ref validator block has unexpected shape")
          replacement = [
              target,
              '            # A same-ref correction fixes semantics at the previously accepted',
              '            # boundary. A round may still inspect a newer ref for freshness.',
              '            if row["accepted_review_ref"] != row["previous_review_ref"]:',
              '                raise SystemExit(',
              '                    f"{round_id}/{harness_id}: same-ref correction cannot advance accepted_review_ref"',
              '                )',
          ]
          lines[i:i + len(expected)] = replacement
          check.write_text("\n".join(lines) + "\n")

          contributing = Path("CONTRIBUTING.md")
          text = contributing.read_text()
          marker = "1. **Same-ref correction.** Re-evaluate the existing assessment at the same `review_ref`. This is appropriate when the evidence was missed or interpreted incorrectly. `data/catalog.psv` does not change."
          expanded = marker + " Inside a reassessment round, the reviewer may also inspect a newer upstream `checked_ref`; when that newer ref does not materially change the corrected assessment, keep `accepted_review_ref` / canonical `review_ref` on the old boundary while allowing `last_checked_ref` to record the newer successful freshness check."
          if marker not in text:
              raise SystemExit("same-ref documentation marker not found")
          text = text.replace(marker, expanded, 1)
          marker = "A round check is useful even when the assessment does not change. In that case `last_checked_ref` and `last_checked_at` advance while the accepted `review_ref` can remain unchanged."
          expanded = marker + " The same freshness rule applies when a semantic error is corrected at the old accepted ref: `same-ref-correction` records where the corrected classification is evidenced, while a newer `checked_ref` may separately record that later upstream was inspected and did not require a new accepted boundary."
          if marker not in text:
              raise SystemExit("freshness documentation marker not found")
          contributing.write_text(text.replace(marker, expanded, 1))

          test = textwrap.dedent('''\
          import sys
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          sys.path.insert(0, str(ROOT / "scripts"))

          from check_index import validate_reassessment_history


          class ReassessmentProvenanceTests(unittest.TestCase):
              def base(self):
                  previous = "1" * 40
                  newer = "2" * 40
                  catalog = {"demo": {"harness_id": "demo"}}
                  assessment = {
                      "harness_id": "demo",
                      "status": "included",
                      "review_ref": previous,
                      "last_checked_ref": newer,
                      "last_checked_at": "2026-09-17",
                      "last_reassessment_round": "R2",
                      "profile_version": "0.2.1",
                      "assessment_procedure_version": "0.3.1",
                  }
                  row = {
                      "round_id": "R2",
                      "harness_id": "demo",
                      "previous_review_ref": previous,
                      "checked_ref": newer,
                      "accepted_review_ref": previous,
                      "checked_at": "2026-09-17",
                      "profile_version": "0.2.1",
                      "assessment_procedure_version": "0.3.1",
                      "outcome": "same-ref-correction",
                      "changed_functions": "S3",
                      "evidence": "https://example.invalid/evidence",
                  }
                  return previous, newer, catalog, assessment, row

              def test_same_ref_correction_can_advance_freshness_only(self):
                  _, _, catalog, assessment, row = self.base()
                  validate_reassessment_history([row], catalog, {"demo": assessment})

              def test_same_ref_correction_cannot_advance_accepted_boundary(self):
                  _, newer, catalog, assessment, row = self.base()
                  row["accepted_review_ref"] = newer
                  assessment["review_ref"] = newer
                  with self.assertRaisesRegex(SystemExit, "cannot advance accepted_review_ref"):
                      validate_reassessment_history([row], catalog, {"demo": assessment})


          if __name__ == "__main__":
              unittest.main()
          ''')
          Path("tests/test_reassessment_provenance.py").write_text(test)
          PY
      - name: Validate
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_index.py
      - name: Commit final patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-provenance-108.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix same-ref correction freshness provenance"
          git push
