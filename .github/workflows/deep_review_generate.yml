name: deep-review-generate

on:
  push:
    branches:
      - deep-review-011-015

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render generated views
        run: python scripts/render_tldr.py
      - name: Commit generated views
        run: |
          if git diff --quiet -- TLDR.md RANKINGS.md; then
            echo "Generated views already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TLDR.md RANKINGS.md
          git commit -m "Regenerate cohort views for deep-review 11-15"
          git push
