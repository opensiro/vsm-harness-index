name: deep-review-001-005-generate

on:
  push:
    branches:
      - deep-review-001-005

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deep-review-001-005
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update signatures and generated views
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('data/signatures.psv')
          lines = p.read_text(encoding='utf-8').splitlines()
          replacements = {
            'rasa': '1|rasa|A single dialogue S1 selects actions through a deterministic policy ensemble; ticket locks, fallbacks and handoff paths constrain that operation without supplying an autonomous metasystem.',
            'botpress': '2|botpress|One code-generating LLMz loop can orchestrate many typed tools, while sandboxing, traces and lifecycle hooks remain parent/runtime support rather than agent-owned metasystem functions.',
            'n8n': '3|n8n|An AI Agent can delegate to Agent Tool children, use fallback models and pass configured Guardrails, but these remain task decomposition and deterministic support around S1.',
            'khoj': '4|khoj|A configured personal agent combines conversation memory, private knowledge, web information and tools; its persona and capabilities remain one S1 with parent-authored identity.',
            'agno': '5|agno|Tasks mode gives an autonomous team leader a shared task board with ownership, dependencies, status, retry and reassignment controls, establishing agent-owned S2 coordination and S3 current regulation.',
          }
          out=[]
          for line in lines:
              if '|' not in line or line.startswith('catalog_position|'):
                  out.append(line); continue
              parts=line.split('|',2)
              hid=parts[1]
              out.append(replacements.get(hid,line))
          p.write_text('\n'.join(out)+'\n', encoding='utf-8')
          PY
          python scripts/render_tldr.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signatures.psv TLDR.md RANKINGS.md
          git commit -m "Regenerate deep-review batch 1-5 views"
          git push origin HEAD:deep-review-001-005
