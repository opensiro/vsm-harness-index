name: Reconcile Surogates S5 cohort delta

on:
  push:
    branches:
      - experiment/s5-surogates-reconcile-621

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/s5-surogates-reconcile-621
          fetch-depth: 0

      - name: Reconcile full canonical S5 cohort
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('experiments/functional-capability-depth')
          matched = root / 's5-system-benchmarks/matched-cell'
          cohort_path = matched / 'full-canonical-cohort-review.json'
          closure_path = matched / 's5-primary-search-closure.json'
          coverage_path = root / 's5-system-benchmarks/coverage.json'
          validator_path = matched / 'validate_s5_primary_search_closure.py'

          cohort = json.loads(cohort_path.read_text(encoding='utf-8'))
          assert cohort['counts'] == {
              'canonical_s5_positive_systems': 21,
              'direct_canonical_observations': 1,
              'no_direct_public_result': 20,
              'unresolved': 0,
          }
          assert not any(row.get('canonical_harness_id') == 'surogates' for row in cohort['systems'])
          cohort['reviewed_at'] = '2026-09-27'
          cohort['index_revision_at_review'] = '3df9772776a2975b431bc84c35f6dad364104eef'
          cohort['counts'] = {
              'canonical_s5_positive_systems': 22,
              'direct_canonical_observations': 1,
              'no_direct_public_result': 21,
              'unresolved': 0,
          }
          cohort['systems'].append({
              'canonical_harness_id': 'surogates',
              'repository': 'https://github.com/invergent-ai/surogates',
              'canonical_review_revision': '4069e5ad736f1b21584543f734c9481193bcde65',
              'canonical_s5_state': 'P',
              'disposition': 'no-direct-public-result',
              'blocking_gate': 'parent-rubric-amendment-runtime-result',
              'finding': "Surogates structurally separates judge-authored rubric refinement from parent-only accept/reject and returns an accepted rubric into the resumed Mission, but reviewed public first-party surfaces publish the mechanism rather than an immutable Mission execution showing a real parent enactment and subsequent operation under the amended rubric.",
              'reopen_when': 'A public immutable Surogates Mission trace records a judge-proposed rubric replacement, authenticated parent accept/reject authority, persisted amended rubric, and subsequent coordinator/worker/evaluator operation governed by the enacted policy.',
          })
          conclusion = cohort.get('conclusion', '')
          assert '21-system canonical S5-positive cohort' in conclusion
          cohort['conclusion'] = conclusion.replace('21-system canonical S5-positive cohort', '22-system canonical S5-positive cohort')
          cohort_path.write_text(json.dumps(cohort, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          closure = json.loads(closure_path.read_text(encoding='utf-8'))
          assert closure['full_cohort_state'] == {
              'canonical_s5_positive_systems': 21,
              'direct_canonical_observations': 1,
              'no_direct_public_result': 20,
              'unresolved': 0,
          }
          closure['reviewed_at'] = '2026-09-27'
          closure['full_cohort_state'] = dict(cohort['counts'])
          closure['closure_claim'] += ' Full-cohort reconciliation now also covers canonical Surogates; its parent-governed rubric-refinement path remains mechanism evidence only because no immutable public Mission execution records an enacted amendment and subsequent operation under it.'
          closure_path.write_text(json.dumps(closure, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          coverage = json.loads(coverage_path.read_text(encoding='utf-8'))
          assert coverage['reviewed_at'] == '2026-09-26'
          coverage['reviewed_at'] = '2026-09-27'
          coverage_path.write_text(json.dumps(coverage, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          validator = validator_path.read_text(encoding='utf-8')
          needle = '    "company-brain": ("0071d6164991ce5dccddbd645bcac631ee477572", "P"),\n}'
          assert needle in validator
          validator = validator.replace(
              needle,
              '    "company-brain": ("0071d6164991ce5dccddbd645bcac631ee477572", "P"),\n'
              '    "surogates": ("4069e5ad736f1b21584543f734c9481193bcde65", "P"),\n}'
          )
          validator = validator.replace('len(rows) == 21', 'len(rows) == 22')
          validator = validator.replace('exactly 21 current positive-S5 systems', 'exactly 22 current positive-S5 systems')
          validator = validator.replace('"canonical_s5_positive_systems": 21,\n    "direct_canonical_observations": 1,\n    "no_direct_public_result": 20,', '"canonical_s5_positive_systems": 22,\n    "direct_canonical_observations": 1,\n    "no_direct_public_result": 21,')
          validator = validator.replace('"21-system canonical S5-positive cohort"', '"22-system canonical S5-positive cohort"')
          validator = validator.replace('full current 21-system canonical S5 cohort reconciled', 'full current 22-system canonical S5 cohort reconciled')
          validator_path.write_text(validator, encoding='utf-8')
          PY

      - name: Validate S5 reconciliation and repository state
        run: |
          python experiments/functional-capability-depth/s5-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s5-system-benchmarks/matched-cell/validate_s5_primary_search_closure.py
          python experiments/functional-capability-depth/s5-system-benchmarks/matched-cell/validate_second_canonical_search.py
          python experiments/functional-capability-depth/validate_synthesis.py
          python scripts/check_index.py
          python -m unittest discover -s tests -v

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/s5-surogates-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/functional-capability-depth/s5-system-benchmarks/coverage.json \
                  experiments/functional-capability-depth/s5-system-benchmarks/matched-cell/full-canonical-cohort-review.json \
                  experiments/functional-capability-depth/s5-system-benchmarks/matched-cell/s5-primary-search-closure.json \
                  experiments/functional-capability-depth/s5-system-benchmarks/matched-cell/validate_s5_primary_search_closure.py \
                  .github/workflows/s5-surogates-reconcile.yml
          git commit -m 'experiment: reconcile Surogates into S5 cohort'
          git push origin HEAD:experiment/s5-surogates-reconcile-621
