name: assemble-superharness-admission

on:
  push:
    branches:
      - index/superharness-admission-291
    paths:
      - .github/workflows/superharness-admission-assemble.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: index/superharness-admission-291
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply canonical admission inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/superharness.md')
          text = assessment.read_text(encoding='utf-8')
          old = 'status: proposed'
          new = 'status: included'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one {old!r}, got {text.count(old)}')
          assessment.write_text(text.replace(old, new, 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_text = catalog.read_text(encoding='utf-8')
          row = '291|superharness|superharness|https://github.com/artificemachine/superharness|2026-06-25T14:30:35Z|index-addition|8bd54bc1ea7db2391190de25087bc638d503e549|2026-09-28'
          if '|superharness|' in catalog_text:
              raise SystemExit('superharness already present in catalog')
          expected_tail = '290|hugagentos|HugAgentOS|https://github.com/ZJU-REAL/HugAgentOS|2026-07-19T08:41:07Z|index-addition|9436fcb77261bc995e6e7a45cdc5e192eae9bc74|2026-09-28'
          if not catalog_text.rstrip().endswith(expected_tail):
              raise SystemExit('catalog tail changed; fail closed')
          catalog.write_text(catalog_text.rstrip() + '\n' + row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signatures_text = signatures.read_text(encoding='utf-8')
          sig = ('291|superharness|superharness closes autonomous S1 through model-driven coding workers, '
                 'constructor-owned S2 through per-worker git-worktree isolation, constructor-owned S3 through '
                 'project-wide watcher control, autonomous S3* through a fresh swarm reviewer over collected git diffs, '
                 'and parent-owned S5 through durable owner rules and identity surfaces returned to later agent work; '
                 'historical distillation does not establish S4.')
          if '|superharness|' in signatures_text:
              raise SystemExit('superharness already present in signatures')
          signatures.write_text(signatures_text.rstrip() + '\n' + sig + '\n', encoding='utf-8')
          PY
      - name: Regenerate canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python -m unittest discover -s tests -v
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/superharness-admission-assemble.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "index: admit superharness"
          git push origin HEAD:index/superharness-admission-291
