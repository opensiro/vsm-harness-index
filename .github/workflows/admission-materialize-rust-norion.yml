name: admission-materialize-rust-norion

on:
  push:
    branches:
      - admission/rust-norion-1015

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical rust-norion admission sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/rust-norion.md')
          text = assessment.read_text(encoding='utf-8')
          expected = 'status: proposed\n'
          if text.count(expected) != 1:
              raise SystemExit('expected exactly one proposed rust-norion status')
          if 'review_ref: 386363fac8db39a40bd5940b2016aecf26c095d1\n' not in text:
              raise SystemExit('unexpected rust-norion review ref')
          assessment.write_text(text.replace(expected, 'status: included\n', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          rows = catalog.read_text(encoding='utf-8').splitlines()
          if any('|rust-norion|' in row or 'https://github.com/yanghao1143/rust-norion' in row for row in rows[1:]):
              raise SystemExit('rust-norion already present in catalog')
          positions = [int(row.split('|', 1)[0]) for row in rows[1:] if row.strip()]
          next_position = max(positions) + 1
          if next_position != 327:
              raise SystemExit(f'unexpected next catalog position: {next_position}')
          rows.append('327|rust-norion|rust-norion|https://github.com/yanghao1143/rust-norion|2026-06-20T10:51:04Z|index-addition|386363fac8db39a40bd5940b2016aecf26c095d1|2026-09-20')
          catalog.write_text('\n'.join(rows) + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          sig_rows = signatures.read_text(encoding='utf-8').splitlines()
          if any('|rust-norion|' in row for row in sig_rows[1:]):
              raise SystemExit('rust-norion signature already present')
          signature = (
              'rust-norion closes autonomous S1 through its model-backed inference loop, constructor-owned S2 through '
              'multi-window ownership/conflict repair, and constructor-owned S3 through integrated current inference '
              'control; no complementary whole-harness S3* or runtime S5 closure is established, while deterministic '
              'feedback closes constructor-owned S4 and a distinct user-approved genome-promotion mode adds parent S4.'
          )
          sig_rows.append(f'327|rust-norion|{signature}')
          signatures.write_text('\n'.join(sig_rows) + '\n', encoding='utf-8')
          PY
      - name: Render canonical projections
        shell: bash
        run: |
          python scripts/render_tldr.py
          python scripts/render_analytics.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
      - name: Verify generated tree
        shell: bash
        run: |
          python scripts/check_index.py
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_analytics.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/render_full_a.py --check
          python -m unittest discover -s tests -v
      - name: Commit materialized admission and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/admission-materialize-rust-norion.yml
          git add assessments/rust-norion.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics METRICS.md data/metrics.json README.md FULL_A.md 2>/dev/null || true
          git diff --cached --check
          git commit -m 'Index: admit rust-norion at catalog #327'
          git push origin HEAD:admission/rust-norion-1015
