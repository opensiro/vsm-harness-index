name: admission-materialize-zhizhi-agent-runtime

on:
  push:
    branches:
      - admission/zhizhi-agent-runtime-1015

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical Zhizhi admission sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/zhizhi-agent-runtime.md')
          text = assessment.read_text(encoding='utf-8')
          expected = 'status: proposed\n'
          if text.count(expected) != 1:
              raise SystemExit('expected exactly one proposed Zhizhi status')
          if 'review_ref: 02465df2afbe6d511d20fa275ccffe0c40b1b31c\n' not in text:
              raise SystemExit('unexpected Zhizhi review ref')
          assessment.write_text(text.replace(expected, 'status: included\n', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          rows = catalog.read_text(encoding='utf-8').splitlines()
          if any('|zhizhi-agent-runtime|' in row or 'https://github.com/cocoyes/zhizhi-agent-runtime' in row for row in rows[1:]):
              raise SystemExit('Zhizhi already present in catalog')
          positions = [int(row.split('|', 1)[0]) for row in rows[1:] if row.strip()]
          next_position = max(positions) + 1
          if next_position != 331:
              raise SystemExit(f'unexpected next catalog position: {next_position}')
          rows.append('331|zhizhi-agent-runtime|Zhizhi Agent Runtime|https://github.com/cocoyes/zhizhi-agent-runtime|2026-08-31T10:23:49Z|index-addition|02465df2afbe6d511d20fa275ccffe0c40b1b31c|2026-09-20')
          catalog.write_text('\n'.join(rows) + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          sig_rows = signatures.read_text(encoding='utf-8').splitlines()
          if any('|zhizhi-agent-runtime|' in row for row in sig_rows[1:]):
              raise SystemExit('Zhizhi signature already present')
          signature = (
              'Zhizhi Agent Runtime closes autonomous S1 through model-driven request-to-tool/evidence-to-model execution, including validated plan/replan and bounded agentic task cells; '
              'no qualifying S2 inter-S1 coordination, S3 metasystemic current control, independent S3* audit, prospective S4 adaptation, or S5 identity/ultimate-policy closure is established.'
          )
          sig_rows.append(f'331|zhizhi-agent-runtime|{signature}')
          signatures.write_text('\n'.join(sig_rows) + '\n', encoding='utf-8')
          PY
      - name: Render canonical projections
        shell: bash
        run: |
          python scripts/render_tldr.py
          python scripts/render_analytics.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
      - name: Verify generated tree
        shell: bash
        run: |
          python scripts/check_index.py
          python scripts/check_assessment_contract.py assessments/zhizhi-agent-runtime.md
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_analytics.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/render_full_a.py --check
          python -m unittest discover -s tests -v
      - name: Commit materialized admission and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/admission-materialize-zhizhi-agent-runtime.yml
          git add assessments/zhizhi-agent-runtime.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics METRICS.md data/metrics.json README.md FULL_A.md 2>/dev/null || true
          git diff --cached --check
          git commit -m 'Index: admit Zhizhi Agent Runtime at catalog #331'
          git push origin HEAD:admission/zhizhi-agent-runtime-1015
