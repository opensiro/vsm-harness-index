name: admission-materialize-rex-harness

on:
  push:
    branches:
      - admission/rex-harness-1009

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical rex-harness admission sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/rex-harness.md')
          text = assessment.read_text(encoding='utf-8')
          if text.count('status: proposed\n') != 1:
              raise SystemExit('expected exactly one proposed rex-harness status')
          if 'review_ref: beee2b4e1d25ef03a87b4b0d8b57c815ff6828b5\n' not in text:
              raise SystemExit('unexpected rex-harness review ref')
          assessment.write_text(text.replace('status: proposed\n', 'status: included\n', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          rows = catalog.read_text(encoding='utf-8').splitlines()
          parsed = [row.split('|') for row in rows[1:] if row.strip()]
          if any(len(p) >= 4 and (p[1] == 'rex-harness' or p[3] == 'https://github.com/rexleimo/rex-harness') for p in parsed):
              raise SystemExit('rex-harness already present in catalog')
          next_position = max(int(p[0]) for p in parsed) + 1
          if next_position != 342:
              raise SystemExit(f'unexpected next catalog position: {next_position}')
          rows.append('342|rex-harness|rex-harness|https://github.com/rexleimo/rex-harness|2026-07-16T02:49:30Z|index-addition|beee2b4e1d25ef03a87b4b0d8b57c815ff6828b5|2026-09-20')
          catalog.write_text('\n'.join(rows) + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          sig_rows = signatures.read_text(encoding='utf-8').splitlines()
          sig_parsed = [row.split('|', 2) for row in sig_rows[1:] if row.strip()]
          if any(len(p) >= 2 and p[1] == 'rex-harness' for p in sig_parsed):
              raise SystemExit('rex-harness signature already present')
          signature = (
              'rex-harness closes autonomous S1 by wiring a compatible coding-agent work cell into its first-party typed Command/Evidence workflow. '
              'Its standalone boundary serializes one current capability and does not close peer S2, whole-system S3, sufficiently independent S3*, prospective S4, or runtime identity/ultimate-policy S5; Team/Harness and AIOS governance remain external.'
          )
          sig_rows.append(f'342|rex-harness|{signature}')
          signatures.write_text('\n'.join(sig_rows) + '\n', encoding='utf-8')
          PY
      - name: Render canonical projections
        shell: bash
        run: |
          python scripts/render_tldr.py
          python scripts/render_analytics.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
      - name: Verify generated tree
        shell: bash
        run: |
          python scripts/check_index.py
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_analytics.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/render_full_a.py --check
          python -m unittest discover -s tests -v
      - name: Commit materialized admission and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/admission-materialize-rex-harness.yml
          git add assessments/rex-harness.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics METRICS.md data/metrics.json README.md FULL_A.md 2>/dev/null || true
          git diff --cached --check
          git commit -m 'Index: admit rex-harness at catalog #342'
          git push origin HEAD:admission/rex-harness-1009
