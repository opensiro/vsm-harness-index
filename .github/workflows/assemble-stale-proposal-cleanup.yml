name: assemble stale proposal cleanup

on:
  push:
    branches:
      - cleanup-stale-proposals

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-stale-proposals
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Append canonical AIOS provenance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          aios = Path('assessments/aios.md').read_text(encoding='utf-8')
          if 'status: excluded-no-agentic-vsm' not in aios:
              raise SystemExit('AIOS is not terminalized')
          if Path('assessments/openharness.md').exists():
              raise SystemExit('superseded OpenHarness proposal still exists')

          catalog = Path('data/catalog.psv')
          text = catalog.read_text(encoding='utf-8')
          if '|aios|' in text:
              raise SystemExit('AIOS already has a catalog row')
          rows = [line for line in text.splitlines() if line.strip()]
          if not rows[-1].startswith('175|'):
              raise SystemExit(f'Expected catalog position 175 before cleanup, got: {rows[-1]}')
          row = '176|aios|AIOS|https://github.com/agiresearch/AIOS|2024-01-15T03:52:41Z|index-addition|292d98f78c835499df18cdb6de6325bba1895862|2026-09-16'
          catalog.write_text(text.rstrip('\n') + '\n' + row + '\n', encoding='utf-8')
          PY

      - name: Regenerate canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Validate cleanup
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v

      - name: Commit canonical cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.psv TLDR.md RANKINGS.md analytics/temporal.md FULL_A.md METRICS.md data/metrics.json README.md
          git commit -m 'index: canonicalize resolved proposal state'
          git push origin HEAD:cleanup-stale-proposals

      - name: Remove temporary assembler
        run: |
          rm .github/workflows/assemble-stale-proposal-cleanup.yml
          git add .github/workflows/assemble-stale-proposal-cleanup.yml
          git commit -m 'chore: remove stale-proposal cleanup assembler'
          git push origin HEAD:cleanup-stale-proposals
