name: admission-materialize-beagle

on:
  push:
    branches:
      - admission/beagle-934

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical Beagle admission sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/beagle.md')
          text = assessment.read_text(encoding='utf-8')
          expected = 'status: proposed\n'
          if text.count(expected) != 1:
              raise SystemExit('expected exactly one proposed Beagle status')
          if 'review_ref: 165343b46a85b5d28c6370e6197ac665c7eda871\n' not in text:
              raise SystemExit('unexpected Beagle review ref')
          assessment.write_text(text.replace(expected, 'status: included\n', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          rows = catalog.read_text(encoding='utf-8').splitlines()
          if any('|beagle|' in row or 'https://github.com/SalesforceAIResearch/Beagle' in row for row in rows[1:]):
              raise SystemExit('Beagle already present in catalog')
          positions = [int(row.split('|', 1)[0]) for row in rows[1:] if row.strip()]
          next_position = max(positions) + 1
          if next_position != 333:
              raise SystemExit(f'unexpected next catalog position: {next_position}')
          rows.append('333|beagle|Beagle|https://github.com/SalesforceAIResearch/Beagle|2026-08-20T22:15:18Z|index-addition|165343b46a85b5d28c6370e6197ac665c7eda871|2026-09-29')
          catalog.write_text('\n'.join(rows) + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          sig_rows = signatures.read_text(encoding='utf-8').splitlines()
          if any('|beagle|' in row for row in sig_rows[1:]):
              raise SystemExit('Beagle signature already present')
          signature = (
              "Beagle closes autonomous S1 through supported model-driven harness rollouts and S4 through DarwinX's "
              "benchmark-evidence-driven model-backed persistent harness evolution; its scope/anti-cheat/verifier/canary/transfer gates "
              "expose constructor S3*, while parallel search/lifecycle control do not establish S2/S3 and no S5 identity-policy closure is established."
          )
          sig_rows.append(f'333|beagle|{signature}')
          signatures.write_text('\n'.join(sig_rows) + '\n', encoding='utf-8')
          PY
      - name: Render canonical projections
        shell: bash
        run: |
          python scripts/render_tldr.py
          python scripts/render_analytics.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
      - name: Verify generated tree
        shell: bash
        run: |
          python scripts/check_index.py
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_analytics.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/render_full_a.py --check
          python -m unittest discover -s tests -v
      - name: Commit materialized admission and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/admission-materialize-beagle.yml
          git add assessments/beagle.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics METRICS.md data/metrics.json README.md FULL_A.md 2>/dev/null || true
          git diff --cached --check
          git commit -m 'Index: admit Beagle at catalog #333'
          git push origin HEAD:admission/beagle-934
