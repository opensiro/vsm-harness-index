name: render-temporal-semantics

on:
  push:
    branches:
      - analytics-temporal-semantics

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/render_tldr.py
      - run: python scripts/render_metrics.py
      - name: Commit generated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TLDR.md RANKINGS.md analytics/temporal.md METRICS.md data/metrics.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: regenerate temporal artifacts"
          git push
