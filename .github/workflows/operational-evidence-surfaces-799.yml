name: Assemble operational evidence-surface migration

on:
  push:
    branches:
      - experiment/operational-evidence-surfaces-799

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/operational-evidence-surfaces-799
          fetch-depth: 0

      - name: Generalize registry and migrate operational witnesses
        run: python .github/scripts/operational_evidence_surfaces_799.py

      - name: Regenerate neutral registry
        run: python experiments/functional-capability-depth/system-observations/render_registry.py

      - name: Validate migration
        run: |
          python experiments/functional-capability-depth/system-observations/validate.py
          python experiments/functional-capability-depth/system-observations/render_registry.py --check
          python experiments/functional-capability-depth/s2-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s2-system-benchmarks/matched-cell/validate_s2_primary_search_closure.py
          python experiments/functional-capability-depth/s2-system-benchmarks/matched-cell/validate_s2_matched_canonical_search.py
          python experiments/functional-capability-depth/validate_synthesis.py
          python scripts/check_index.py
          python -m unittest discover -s tests -v

      - name: Remove one-shot assembler and commit
        shell: bash
        run: |
          rm .github/workflows/operational-evidence-surfaces-799.yml
          rm .github/scripts/operational_evidence_surfaces_799.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            experiments/functional-capability-depth/BENCHMARK-SYSTEM-REGISTRY.md \
            experiments/functional-capability-depth/PUBLIC-EVIDENCE.md \
            experiments/functional-capability-depth/system-observations/README.md \
            experiments/functional-capability-depth/system-observations/render_registry.py \
            experiments/functional-capability-depth/system-observations/validate.py \
            experiments/functional-capability-depth/system-observations/REGISTRY.md \
            experiments/functional-capability-depth/system-observations/registry.psv \
            experiments/functional-capability-depth/system-observations/squad-operational-history.json \
            experiments/functional-capability-depth/system-observations/thclaws-operational-history.json \
            experiments/functional-capability-depth/s2-system-benchmarks/observations.json \
            tests/test_system_observation_registry.py \
            tests/test_s2_neutral_registry_migration_797.py \
            tests/test_operational_evidence_surfaces_799.py \
            .github/workflows/operational-evidence-surfaces-799.yml \
            .github/scripts/operational_evidence_surfaces_799.py
          git commit -m 'experiment: generalize neutral registry to operational evidence surfaces'
          git push origin HEAD:experiment/operational-evidence-surfaces-799
