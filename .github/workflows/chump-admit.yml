name: Assemble Chump admission

on:
  push:
    branches:
      - index/chump-admission

permissions:
  contents: write

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: index/chump-admission
          fetch-depth: 0

      - name: Canonicalize assessment sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/chump.md')
          text = assessment.read_text(encoding='utf-8')
          assert text.count('status: proposed') == 1
          assessment.write_text(text.replace('status: proposed', 'status: included', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_text = catalog.read_text(encoding='utf-8')
          assert '|chump|' not in catalog_text
          rows = [line for line in catalog_text.splitlines() if line.strip()]
          assert rows[-1].startswith('282|surogates|'), f'unexpected catalog tail: {rows[-1]}'
          row = '283|chump|Chump|https://github.com/repairman29/chump|2026-03-10T20:57:54Z|index-addition|724c8ebe1911e986cc8af6883b6f05acd096d437|2026-09-27'
          catalog.write_text(catalog_text.rstrip('\n') + '\n' + row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signatures_text = signatures.read_text(encoding='utf-8')
          assert '|chump|' not in signatures_text
          signature = 'Chump closes autonomous S1 through native ChumpAgent software-work loops. It supplies constructor S2 through collision-aware leases/claims, constructor-plus-parent S3 through fleet admission/recovery plus operator whole-fleet control, and constructor S3* through fresh-eyes audits. No S4 closes; operator-owned active-mission selection closes parent S5.'
          assert len(signature) <= 360
          signatures.write_text(signatures_text.rstrip('\n') + '\n283|chump|' + signature + '\n', encoding='utf-8')
          PY

      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Validate canonical state
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/chump-admit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/chump.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md FULL_A.md METRICS.md data/metrics.json README.md .github/workflows/chump-admit.yml
          git commit -m 'index: canonicalize Chump admission'
          git push origin HEAD:index/chump-admission
