name: fix BitRouter assessment contract wording

on:
  push:
    branches:
      - assessment-bitrouter-pinned

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip contract fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply literal contract wording fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('assessments/bitrouter.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '| Constructor (`C`) |': '| Base (`C`) |',
              '- Future/prospective distinction:': '- Future / prospective distinction:',
              '- Path back into capability/S3:': '- Path back into current capability / S3:',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected token: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/fix-bitrouter-contract.yml
      - name: Commit fix and workflow cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assessments/bitrouter.md .github/workflows/fix-bitrouter-contract.yml
          git commit -m 'assessment: align BitRouter contract wording [skip contract fix]'
          git push
