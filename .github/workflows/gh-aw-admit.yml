name: Assemble gh-aw admission

on:
  push:
    branches:
      - index/gh-aw-admission

permissions:
  contents: write

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: index/gh-aw-admission
          fetch-depth: 0

      - name: Canonicalize assessment sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/gh-aw.md')
          text = assessment.read_text(encoding='utf-8')
          assert text.count('status: proposed') == 1
          assessment.write_text(text.replace('status: proposed', 'status: included', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_text = catalog.read_text(encoding='utf-8')
          assert '|gh-aw|' not in catalog_text
          rows = [line for line in catalog_text.splitlines() if line.strip()]
          assert rows[-1].startswith('284|tandem|'), f'unexpected catalog tail: {rows[-1]}'
          row = '285|gh-aw|GitHub Agentic Workflows|https://github.com/github/gh-aw|2025-08-12T17:40:41Z|index-addition|ff2eccd10a30d6a7bfaf0da449194e907a206555|2026-09-27'
          catalog.write_text(catalog_text.rstrip('\n') + '\n' + row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signatures_text = signatures.read_text(encoding='utf-8')
          assert '|gh-aw|' not in signatures_text
          signature = 'GitHub Agentic Workflows runs autonomous model-driven repository work, constructor-owned concurrency/resource regulation, and independent threat-detection audit before guarded writes. No S4 closes; repository owners retain S5 through authoritative runtime-loaded workflow instructions.'
          assert len(signature) <= 360
          signatures.write_text(signatures_text.rstrip('\n') + '\n285|gh-aw|' + signature + '\n', encoding='utf-8')
          PY

      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Validate canonical state
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/gh-aw-admit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/gh-aw.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md FULL_A.md METRICS.md data/metrics.json README.md .github/workflows/gh-aw-admit.yml
          git commit -m 'index: canonicalize GitHub Agentic Workflows admission'
          git push origin HEAD:index/gh-aw-admission
