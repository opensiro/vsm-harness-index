name: temporary HumanLayer ACP admission renderer

on:
  push:
    branches:
      - admit-humanlayer-agent-control-plane-228

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply canonical admission inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path("assessments/humanlayer-agent-control-plane.md")
          text = assessment.read_text(encoding="utf-8")
          old = "status: proposed\n"
          new = "status: included\n"
          if old in text:
              text = text.replace(old, new, 1)
              assessment.write_text(text, encoding="utf-8")
          elif new not in text:
              raise SystemExit("HumanLayer ACP assessment has neither proposed nor included status")

          catalog = Path("data/catalog.psv")
          catalog_text = catalog.read_text(encoding="utf-8")
          catalog_row = "228|humanlayer-agent-control-plane|Agent Control Plane|https://github.com/humanlayer/agentcontrolplane|2024-10-17T04:04:29Z|index-addition|eaa2a7ed1d9cb4e13dc53defaf420e36f481dcad|2026-09-24"
          if "|humanlayer-agent-control-plane|" not in catalog_text:
              catalog.write_text(catalog_text.rstrip("\n") + "\n" + catalog_row + "\n", encoding="utf-8")

          signatures = Path("data/signatures.psv")
          signatures_text = signatures.read_text(encoding="utf-8")
          signature_row = "228|humanlayer-agent-control-plane|HumanLayer Agent Control Plane closes autonomous durable S1 through first-party Task and ToolCall controllers that return asynchronous tool results into subsequent model turns; sub-agent delegation, per-Task locking, approvals and telemetry do not by themselves establish S2-S5."
          if "|humanlayer-agent-control-plane|" not in signatures_text:
              signatures.write_text(signatures_text.rstrip("\n") + "\n" + signature_row + "\n", encoding="utf-8")
          PY

      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py

      - name: Validate rendered state
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/render_full_a.py --check
          python -m unittest discover -s tests -v

      - name: Commit rendered admission
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No render changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assessments/humanlayer-agent-control-plane.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md METRICS.md data/metrics.json README.md
          git commit -m "admit: render HumanLayer Agent Control Plane inclusion"
          git push origin HEAD:${GITHUB_REF_NAME}
