name: assemble TinyAGI exclusion current
on:
  push:
    branches: [exclude-tinyagi-159-current]
permissions:
  contents: write
jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exclude-tinyagi-159-current
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exclusion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assessments/tinyagi.md'); s=p.read_text()
          s=s.replace('status: proposed','status: excluded-no-agentic-vsm',1)
          if 'assessment_changed_at:' not in s:
              s=s.replace('assessment_procedure_version: 0.3.5\n','assessment_procedure_version: 0.3.5\nassessment_changed_at: 2026-09-21\n',1)
          p.write_text(s)
          c=Path('data/catalog.psv'); t=c.read_text()
          row='174|tinyagi|TinyAGI|https://github.com/TinyAGI/tinyagi|2026-02-09T00:34:11Z|index-addition|2db3a03a891b302c460f624d6c5a0523b8aa3528|2026-09-21'
          if '|tinyagi|' not in t: c.write_text(t.rstrip('\n')+'\n'+row+'\n')
          PY
      - name: Generate and validate
        run: |
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/tinyagi.md data/catalog.psv METRICS.md data/metrics.json README.md
          git diff --cached --quiet || (git commit -m 'assessment: canonically exclude TinyAGI' && git push origin HEAD:exclude-tinyagi-159-current)
