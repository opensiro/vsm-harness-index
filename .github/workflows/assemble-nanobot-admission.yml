name: assemble nanobot admission

on:
  push:
    branches:
      - admit-nanobot

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote nanobot and append canonical provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assessments/nanobot.md')
          text = p.read_text()
          needle = 'assessment_procedure_version: 0.3.5\nstatus: proposed\n'
          repl = 'assessment_procedure_version: 0.3.5\nassessment_changed_at: 2026-09-21\nstatus: included\n'
          if needle not in text:
              raise SystemExit('unexpected nanobot frontmatter state')
          p.write_text(text.replace(needle, repl, 1))

          catalog = Path('data/catalog.psv')
          c = catalog.read_text()
          expected = '178|agent-s|Agent S|https://github.com/simular-ai/Agent-S|2024-10-09T15:43:12Z|index-addition|3aa272d23d2994c7bbde1acbbe0ef8e8d06b8693|2026-09-21'
          if not c.rstrip().endswith(expected):
              raise SystemExit('catalog tail changed; rebuild on current main')
          catalog.write_text(c.rstrip('\n') + '\n179|nanobot|nanobot|https://github.com/HKUDS/nanobot|2026-02-01T07:16:15Z|index-addition|24c41a6af0736330cd9c67b3c9d1ec9adeefdf5f|2026-09-21\n')

          sig = Path('data/signatures.psv')
          s = sig.read_text()
          if '\n179|nanobot|' in s or s.startswith('179|nanobot|'):
              raise SystemExit('nanobot signature already present')
          sig.write_text(s.rstrip('\n') + '\n179|nanobot|nanobot owns an autonomous first-party model/tool operation loop and exposes constructor-enabled runtime-wide current-control mutation through MyTool; delegation does not establish S2, ordinary feedback is not independent S3*, Dream is retrospective consolidation rather than prospective S4, and editable profile/configuration surfaces do not close S5.\n')
          PY
      - name: Regenerate canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
      - name: Validate assembled admission
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v
      - name: Commit canonical admission
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'admit: add nanobot from reviewed standalone assessment'
          git push
      - name: Remove temporary assembler
        run: |
          git rm .github/workflows/assemble-nanobot-admission.yml
          git commit -m 'chore: remove nanobot admission assembler'
          git push
