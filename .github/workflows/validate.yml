name: render-hypha-admission

on:
  push:
    branches:
      - admit-hypha

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply canonical Hypha admission inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path("assessments/hypha.md")
          text = assessment.read_text(encoding="utf-8")
          old = "status: proposed"
          if old not in text:
              raise SystemExit("Hypha assessment is not proposed")
          assessment.write_text(text.replace(old, "status: included", 1), encoding="utf-8")

          catalog = Path("data/catalog.psv")
          catalog_line = "253|hypha|Hypha|https://github.com/CodeSoul-co/Hypha|2026-07-01T06:51:59Z|index-addition|ac77fa9b4a1b1da2815adf7d5582dbc27cd9373f|2026-09-25"
          catalog_text = catalog.read_text(encoding="utf-8").rstrip("\n")
          if "|hypha|" not in catalog_text:
              catalog.write_text(catalog_text + "\n" + catalog_line + "\n", encoding="utf-8")

          signatures = Path("data/signatures.psv")
          signature_line = "253|hypha|Hypha closes autonomous S1 through its production ReAct model-tool-observation loop. Event-backed FSM, recovery, replay, coordination and evaluation primitives strongly govern execution but do not establish current S2, whole-system S3, independent complementary S3*, external-and-prospective S4, or identity/ultimate-policy S5 closure at the frozen deployment boundary."
          signatures_text = signatures.read_text(encoding="utf-8").rstrip("\n")
          if not any(line.startswith("253|hypha|") for line in signatures_text.splitlines()):
              signatures.write_text(signatures_text + "\n" + signature_line + "\n", encoding="utf-8")
          PY
      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
      - name: Commit rendered admission
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "assessment: admit Hypha"
          git push
