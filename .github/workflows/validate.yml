name: render Mingbird admission

on:
  push:
    branches:
      - admit-mingbird-257

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply admission inputs and render canonical views
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path("assessments/mingbird.md")
          text = assessment.read_text(encoding="utf-8")
          old = "status: proposed"
          if old not in text:
              raise SystemExit("Mingbird assessment is not proposed")
          assessment.write_text(text.replace(old, "status: included", 1), encoding="utf-8")

          catalog = Path("data/catalog.psv")
          row = "257|mingbird|Mingbird|https://github.com/Mingbird/Mingbird-agent|2026-09-17T12:00:14Z|index-addition|2e62a735b212aee3c72bce83134042c9ca885237|2026-09-26"
          catalog_text = catalog.read_text(encoding="utf-8").rstrip("\n")
          if "|mingbird|Mingbird|https://github.com/Mingbird/Mingbird-agent|" in catalog_text:
              raise SystemExit("Mingbird already exists in catalog")
          catalog.write_text(catalog_text + "\n" + row + "\n", encoding="utf-8")

          signatures = Path("data/signatures.psv")
          signature = "257|mingbird|Mingbird closes autonomous S1 through its local model/tool loop and exposes an S2 constructor path through deterministic eligibility, isolated child partitions, conflict-safe acceptance/integration and serial fallback. Fixed batch supervision is not whole-system S3, and in-band acceptance/finish checks are not complementary S3*; no S4 or S5 closure is established."
          sig_text = signatures.read_text(encoding="utf-8").rstrip("\n")
          if "|mingbird|" in sig_text:
              raise SystemExit("Mingbird already exists in signatures")
          signatures.write_text(sig_text + "\n" + signature + "\n", encoding="utf-8")
          PY

          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py

          git fetch origin main
          git checkout origin/main -- .github/workflows/validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "assessment: admit Mingbird"
          git push
