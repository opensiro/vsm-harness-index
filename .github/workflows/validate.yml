name: validate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve active semantic contract
        id: active_contract
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import csv
          from pathlib import Path

          path = Path("data/active-contract.psv")
          with path.open(encoding="utf-8", newline="") as handle:
              rows = list(csv.DictReader(handle, delimiter="|"))
          if len(rows) != 1:
              raise SystemExit("active-contract.psv must contain exactly one row")
          row = rows[0]
          print(f"profile={row['profile_version']}")
          print(f"methodology={row['methodology_version']}")
          PY

      - name: Checkout active VSM Harness Methodology release
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/vsm-harness-skills
          ref: v${{ steps.active_contract.outputs.methodology }}
          path: .methodology
          fetch-depth: 1

      - name: Check active-version assessment structural contract
        shell: bash
        env:
          ACTIVE_METHODOLOGY: ${{ steps.active_contract.outputs.methodology }}
        run: |
          python - <<'PY' > /tmp/active-assessments.txt
          import os
          import re
          from pathlib import Path

          target = os.environ["ACTIVE_METHODOLOGY"]
          methodology_pattern = re.compile(
              r"^assessment_procedure_version:\s*(\S+)\s*$", re.MULTILINE
          )
          status_pattern = re.compile(r"^status:\s*(\S+)\s*$", re.MULTILINE)
          proposed_dir = Path("/tmp/proposed-assessment-contract")
          proposed_dir.mkdir(parents=True, exist_ok=True)

          for path in sorted(Path("assessments").glob("*.md")):
              text = path.read_text(encoding="utf-8")
              methodology_match = methodology_pattern.search(text)
              if not methodology_match or methodology_match.group(1) != target:
                  continue

              status_match = status_pattern.search(text)
              if status_match and status_match.group(1) == "proposed":
                  # `proposed` is an Index-local pre-admission lifecycle state,
                  # not a canonical Methodology state. Validate the prospective
                  # canonical artifact by normalizing only that lifecycle field
                  # in a temporary copy; the repository file remains proposed
                  # and check_index.py keeps it outside the canonical corpus.
                  normalized = status_pattern.sub("status: included", text, count=1)
                  tmp_path = proposed_dir / path.name
                  tmp_path.write_text(normalized, encoding="utf-8")
                  print(tmp_path)
              else:
                  print(path)
          PY
          mapfile -t active_assessments < /tmp/active-assessments.txt
          if (( ${#active_assessments[@]} == 0 )); then
            echo "No assessments currently use active Methodology ${ACTIVE_METHODOLOGY}; structural gate ready for new work."
          else
            python .methodology/scripts/check_assessment_contract.py "${active_assessments[@]}"
          fi

      - run: python scripts/check_index.py
      - run: python scripts/render_full_a.py --check
      - run: python scripts/render_metrics.py --check
      - run: python scripts/sync_metrics_readme.py --check
      - run: python experiments/functional-capability-depth/render_function_baselines.py --check
      - run: python experiments/functional-capability-depth/render_evidence_frontier.py --check
      - run: python experiments/functional-capability-depth/render_s1_baseline.py --check
      - run: python experiments/functional-capability-depth/s2-system-benchmarks/validate.py
      - run: python experiments/functional-capability-depth/s2-system-benchmarks/matched-cell/validate_s2_primary_search_closure.py
      - run: python experiments/functional-capability-depth/s3-system-benchmarks/validate.py
      - run: python experiments/functional-capability-depth/s3-system-benchmarks/matched-cell/validate_s3_primary_search_closure.py
      - run: python experiments/functional-capability-depth/s3star-system-benchmarks/validate.py
      - run: python experiments/functional-capability-depth/s3star-system-benchmarks/matched-cell/validate_s3star_primary_search_closure.py
      - run: python experiments/functional-capability-depth/s4-system-benchmarks/validate.py
      - run: python experiments/functional-capability-depth/s4-system-benchmarks/matched-cell/validate.py
      - run: python experiments/functional-capability-depth/s4-system-benchmarks/matched-cell/validate_public_polybench.py
      - run: python experiments/functional-capability-depth/s4-system-benchmarks/matched-cell/validate_public_polybench_paper_controls.py
      - run: python experiments/functional-capability-depth/s4-system-benchmarks/matched-cell/validate_public_polybench_continual_linkage.py
      - run: python experiments/functional-capability-depth/s4-system-benchmarks/matched-cell/validate_public_polybench_gepa_linkage.py
      - run: python experiments/functional-capability-depth/s4-system-benchmarks/matched-cell/validate_public_polybench_meta_harness_linkage.py
      - run: python experiments/functional-capability-depth/s4-system-benchmarks/matched-cell/validate_public_polybench_skillos_linkage.py
      - run: python experiments/functional-capability-depth/s4-system-benchmarks/matched-cell/validate_s4_primary_search_closure.py
      - run: python experiments/functional-capability-depth/s5-system-benchmarks/validate.py
      - run: python experiments/functional-capability-depth/s5-system-benchmarks/matched-cell/validate_s5_primary_search_closure.py
      - run: python experiments/functional-capability-depth/s5-system-benchmarks/matched-cell/validate_second_canonical_search.py
      - run: python experiments/functional-capability-depth/validate_synthesis.py
      - run: python -m unittest discover -s tests -v
      - name: Check immutable generation provenance against PR base
        if: github.event_name == 'pull_request'
        run: python scripts/check_generation_provenance.py --base-ref "${{ github.event.pull_request.base.sha }}"
      - name: Check immutable generation provenance against previous push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python scripts/check_generation_provenance.py --base-ref "${{ github.event.before }}"