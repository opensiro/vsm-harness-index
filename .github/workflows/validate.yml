name: build-openclaw-admission

on:
  push:
    branches:
      - admission/openclaw-dotnet-322

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build canonical admission
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN="$(git rev-parse origin/main)"
          test "$MAIN" = "df11581535def99a6e98e01789a002c89de8f455"
          git show "${MAIN}:assessments/openclaw-dotnet.md" | grep -q '^status: proposed$'
          test "$(git show "${MAIN}:data/catalog.psv" | tail -1 | cut -d'|' -f1)" = "321"
          ! git show "${MAIN}:data/catalog.psv" | grep -q '|openclaw-dotnet|'
          ! git show "${MAIN}:data/signatures.psv" | grep -q '|openclaw-dotnet|'

          python - <<'PY'
          from pathlib import Path

          assessment = Path("assessments/openclaw-dotnet.md")
          text = assessment.read_text(encoding="utf-8")
          old = "status: proposed\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected one proposed status, found {text.count(old)}")
          assessment.write_text(text.replace(old, "status: included\n", 1), encoding="utf-8")

          catalog = Path("data/catalog.psv")
          rows = catalog.read_text(encoding="utf-8").rstrip("\n").splitlines()
          if int(rows[-1].split("|", 1)[0]) != 321:
              raise SystemExit("catalog tail moved from 321")
          if any("|openclaw-dotnet|" in row for row in rows):
              raise SystemExit("OpenClaw.NET already present in catalog")
          rows.append("322|openclaw-dotnet|OpenClaw.NET|https://github.com/clawdotnet/openclaw.net|2026-02-22T03:21:36Z|index-addition|a5d1b7ee689967baf4097c5bf8b578f00e2da87e|2026-09-20")
          catalog.write_text("\n".join(rows) + "\n", encoding="utf-8")

          signatures = Path("data/signatures.psv")
          rows = signatures.read_text(encoding="utf-8").rstrip("\n").splitlines()
          if int(rows[-1].split("|", 1)[0]) != 321:
              raise SystemExit("signature tail moved from 321")
          if any("|openclaw-dotnet|" in row for row in rows):
              raise SystemExit("OpenClaw.NET already present in signatures")
          rows.append("322|openclaw-dotnet|OpenClaw.NET closes autonomous S1 through its shipped model/tool feedback loop; delegated child sessions, passive shared-state conflict detection, in-path Plan-Execute-Verify checks, Runtime Pulse, and review-first learning/governance surfaces do not establish S2, whole-system S3, independent S3*, prospective S4, or runtime S5 closure.")
          signatures.write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY

          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_analytics.py

          python scripts/validate_tldr.py
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/render_analytics.py --check
          python -m unittest discover -s tests -v
          python scripts/check_generation_provenance.py --base-ref "$MAIN"

          rm -rf /tmp/vsm-harness-skills
          git clone --depth 1 --branch v0.3.6 https://github.com/opensiro/vsm-harness-skills.git /tmp/vsm-harness-skills
          python /tmp/vsm-harness-skills/scripts/check_assessment_contract.py assessments/openclaw-dotnet.md

          git checkout origin/main -- .github/workflows/validate.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "index: admit OpenClaw.NET at catalog #322"
          git push origin HEAD:admission/openclaw-dotnet-322
