name: validate

on:
  pull_request:
  push:

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render generated views
        run: python scripts/render_tldr.py
      - name: Upload generated views
        uses: actions/upload-artifact@v4
        with:
          name: generated-views
          path: |
            TLDR.md
            RANKINGS.md
      - run: python scripts/check_index.py
