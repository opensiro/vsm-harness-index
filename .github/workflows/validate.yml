name: validate

on:
  push:
    branches:
      - admit-san-251

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply canonical admission inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path("assessments/san.md")
          text = assessment.read_text(encoding="utf-8")
          old = "status: proposed"
          new = "status: included"
          if old not in text:
              raise SystemExit("expected proposed San assessment state")
          assessment.write_text(text.replace(old, new, 1), encoding="utf-8")

          catalog = Path("data/catalog.psv")
          catalog_text = catalog.read_text(encoding="utf-8")
          if "|san|" not in catalog_text:
              if not catalog_text.endswith("\n"):
                  catalog_text += "\n"
              catalog_text += "251|san|San|https://github.com/genai-io/san|2024-09-05T16:16:25Z|index-addition|dd1b41882472fb76ce38dc3f88107deffc2e73bc|2026-09-25\n"
              catalog.write_text(catalog_text, encoding="utf-8")

          signatures = Path("data/signatures.psv")
          signatures_text = signatures.read_text(encoding="utf-8")
          if "|san|" not in signatures_text:
              if not signatures_text.endswith("\n"):
                  signatures_text += "\n"
              signatures_text += (
                  "251|san|San closes autonomous S1 through its production reason-act-observe tool loop and S3 through a separate AutoPilot LLM controller that decides continue/done/hand-back and returns the next instruction to operation; one-shot subagents do not establish S2, read-only inspector/replay lacks an autonomous corrective audit judgment for S3*, retrospective self-learning does not close S4, and persona/policy/permissions do not close S5.\n"
              )
              signatures.write_text(signatures_text, encoding="utf-8")
          PY
      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
      - name: Commit rendered admission transaction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "index: admit San at catalog #251"
          git push
