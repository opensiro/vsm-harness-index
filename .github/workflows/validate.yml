name: render Soothe admission

on:
  push:
    branches:
      - admit-soothe-258

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply admission inputs and render canonical views
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path("assessments/soothe.md")
          text = assessment.read_text(encoding="utf-8")
          old = "status: proposed"
          if old not in text:
              raise SystemExit("Soothe assessment is not proposed")
          assessment.write_text(text.replace(old, "status: included", 1), encoding="utf-8")

          catalog = Path("data/catalog.psv")
          row = "258|soothe|Soothe|https://github.com/mirasoth/soothe|2026-03-12T03:52:53Z|index-addition|be4fa14c0aa53203b8861dbff367eccb0df77668|2026-09-26"
          catalog_text = catalog.read_text(encoding="utf-8").rstrip("\n")
          if "|soothe|Soothe|https://github.com/mirasoth/soothe|" in catalog_text:
              raise SystemExit("Soothe already exists in catalog")
          catalog.write_text(catalog_text + "\n" + row + "\n", encoding="utf-8")

          signatures = Path("data/signatures.psv")
          signature = "258|soothe|Soothe closes autonomous S1 through its StrangeLoop/CoreAgent model-tool loop and exposes constructor paths for S2 through rail-governed maker isolation and merge/retry feedback, for S3 through job-wide guard evaluation plus ContextEngine current-control actions, and for S3* through fresh-identity diff review with corrective replant. The frozen standard StrangeLoop wiring does not attach the shipped GuardEvaluator, so those higher organizational paths remain constructor-owned rather than autonomous; no S4 adaptation closure or S5 identity-policy closure is established."
          sig_text = signatures.read_text(encoding="utf-8").rstrip("\n")
          if "|soothe|" in sig_text:
              raise SystemExit("Soothe already exists in signatures")
          signatures.write_text(sig_text + "\n" + signature + "\n", encoding="utf-8")
          PY

          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py

          git fetch origin main
          git checkout origin/main -- .github/workflows/validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "assessment: admit Soothe"
          git push
