name: render Jazz admission

on:
  push:
    branches:
      - admit-jazz-255

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply admission inputs and render canonical views
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path("assessments/jazz.md")
          text = assessment.read_text(encoding="utf-8")
          old = "status: proposed"
          if old not in text:
              raise SystemExit("Jazz assessment is not proposed")
          assessment.write_text(text.replace(old, "status: included", 1), encoding="utf-8")

          catalog = Path("data/catalog.psv")
          row = "255|jazz|Jazz|https://github.com/lvndry/jazz|2025-09-13T20:50:28Z|index-addition|957ad8ef522f9137f690c8acc319553f56e5bdb9|2026-09-25"
          catalog_text = catalog.read_text(encoding="utf-8").rstrip("\n")
          if "|jazz|Jazz|https://github.com/lvndry/jazz|" in catalog_text:
              raise SystemExit("Jazz already exists in catalog")
          catalog.write_text(catalog_text + "\n" + row + "\n", encoding="utf-8")

          signatures = Path("data/signatures.psv")
          signature = "255|jazz|Jazz closes autonomous S1 through its production model/tool feedback loop, including bounded recursive child-agent execution. Recursive delegation, generic tool concurrency, shell-job fan-out and peer/workflow transport do not establish S2 or whole-system S3; review/eval/observability surfaces do not close S3*, while research/memory and persona/permission configuration do not close S4 or S5."
          sig_text = signatures.read_text(encoding="utf-8").rstrip("\n")
          if "|jazz|" in sig_text:
              raise SystemExit("Jazz already exists in signatures")
          signatures.write_text(sig_text + "\n" + signature + "\n", encoding="utf-8")
          PY

          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py

          git fetch origin main
          git checkout origin/main -- .github/workflows/validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "assessment: admit Jazz"
          git push
