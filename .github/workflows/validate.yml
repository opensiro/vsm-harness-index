name: render-lime-admission

on:
  push:
    branches:
      - admit-lime

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply canonical Lime admission inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path("assessments/lime.md")
          text = assessment.read_text(encoding="utf-8")
          if "status: proposed" not in text:
              raise SystemExit("Lime assessment is not proposed")
          assessment.write_text(text.replace("status: proposed", "status: included", 1), encoding="utf-8")

          catalog = Path("data/catalog.psv")
          catalog_line = "254|lime|Lime|https://github.com/limecloud/lime|2025-12-13T17:23:15Z|index-addition|3823e9092d4106c877ae08a1d19d593b647cf27d|2026-09-25"
          catalog_text = catalog.read_text(encoding="utf-8").rstrip("\n")
          if "|lime|" not in catalog_text:
              catalog.write_text(catalog_text + "\n" + catalog_line + "\n", encoding="utf-8")

          signatures = Path("data/signatures.psv")
          signature_line = "254|lime|Lime closes autonomous S1 through its durable provider/tool feedback loop and autonomous S3 through a root agent that oversees and intervenes across its durable child-agent tree. Root-scoped execution admission supplies a concrete deterministic S2 coordination path (C), while generic reviewer children, Skills/extensibility and operational policy/configuration do not establish S3*, S4 or S5 closure at the frozen boundary."
          signatures_text = signatures.read_text(encoding="utf-8").rstrip("\n")
          if not any(line.startswith("254|lime|") for line in signatures_text.splitlines()):
              signatures.write_text(signatures_text + "\n" + signature_line + "\n", encoding="utf-8")
          PY
      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
      - name: Commit rendered admission
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "assessment: admit Lime"
          git push
