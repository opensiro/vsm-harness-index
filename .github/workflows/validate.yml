name: patch-oh-my-agent-contract

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add explicit S2 and S3-star contract fields
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assessments/oh-my-agent.md')
          t = p.read_text(encoding='utf-8')
          s2_anchor = '- Caveats: ordinary parallel dispatch is not the witness; S2 rests on the explicit conflict modes plus corrective feedback to the affected S1s.\n'
          s2_extra = '''- Distinct S1 units: backend, frontend, mobile and other specialist implementation agents dispatched as separate task/workspace units under one OMA session.\n- Inter-S1 disturbance: shared API/data contracts can diverge across specialists and overlapping workspace ownership can cause conflicting mutations or downstream work against an unstable upstream contract.\n- Attenuating coordination relation: the root coordinator monitors contract alignment, pauses dependent downstream work until reconciliation, and splits/reassigns ownership boundaries when workspaces conflict.\n- Feedback into subsequent S1 behaviour: reconciled contracts, revised ownership and re-dispatch instructions are supplied back to affected specialist agents before they resume or retry work.\n- Why this is S2-specific rather than generic communication / routing / sequencing / shared state / delegation: the credited path is tied to named cross-S1 interference modes and changes the affected units specifically to damp those disturbances; task routing and parallel spawning alone are excluded.\n'''
          if '- Distinct S1 units:' not in t:
              t = t.replace(s2_anchor, s2_anchor + s2_extra)
          s3_anchor = '- Caveats: repository benchmark scorers are excluded; the positive witness is the deployed workflow\'s structurally independent reviewer/judge path and corrective return.\n'
          s3_extra = '''- Claim being audited: implementation agents and the ordinary OMA coordinator claim that planned work/phases satisfy acceptance criteria and are ready to advance or complete.\n- Ordinary reporting path: implementation agent result/progress artifacts plus the coordinator\'s normal task-board, phase and completion state.\n- Complementary access path: fresh-context reviewer/JUDGE agents independently read raw diff, changed files, plan, checks, acceptance evidence and required phase artifacts while excluding implementer narration and reasoning.\n- Independence boundary: reviewer agents are separately spawned in fresh isolated contexts; Ralph explicitly forbids the orchestrator from self-judging except a recorded downgraded fallback.\n- Who acts on findings: the OMA coordinator changes criterion/task state and returns FAIL/REGRESSED findings to REPLAN or the responsible implementation agent for corrective work and re-verification.\n'''
          if '- Claim being audited:' not in t:
              t = t.replace(s3_anchor, s3_anchor + s3_extra)
          p.write_text(t, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assessments/oh-my-agent.md
          git commit -m "Complete oh-my-agent Methodology 0.3.5 evidence contract"
          git push
