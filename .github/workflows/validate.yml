name: validate

on:
  pull_request:
  push:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render generated views
        run: python scripts/render_tldr.py
      - name: Commit generated views on feature branch
        if: github.event_name == 'push' && github.ref_name == 'stable-harness-anchors'
        run: |
          if git diff --quiet -- TLDR.md RANKINGS.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TLDR.md RANKINGS.md
          git commit -m "Regenerate views with stable harness anchors"
          git push
      - run: python scripts/check_index.py
