name: admission-render

on:
  push:
    branches:
      - admit-hx-252

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply hx admission inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path("assessments/hx.md")
          text = assessment.read_text(encoding="utf-8")
          if "status: proposed" in text:
              text = text.replace("status: proposed", "status: included", 1)
              assessment.write_text(text, encoding="utf-8")
          elif "status: included" not in text:
              raise SystemExit("hx assessment has neither proposed nor included status")

          catalog = Path("data/catalog.psv")
          catalog_text = catalog.read_text(encoding="utf-8")
          row = "252|hx|hx|https://github.com/phantomic12/hx-harness|2026-09-15T04:03:15Z|index-addition|6afe2291a5bc750903eae1e9266ace8cdeb2eaef|2026-09-25"
          if not any(line.startswith("252|hx|") for line in catalog_text.splitlines()):
              catalog.write_text(catalog_text.rstrip("\n") + "\n" + row + "\n", encoding="utf-8")

          signatures = Path("data/signatures.psv")
          sig_text = signatures.read_text(encoding="utf-8")
          signature = (
              "252|hx|Concurrent durable chat sessions share quota-bearing model pools as constructor-owned S2; "
              "daemon-wide status and live provider management expose constructor plus parent-governed S3, while "
              "event-chain verification exposes composable S3*. Research and policy controls do not close S4 or S5."
          )
          if not any(line.startswith("252|hx|") for line in sig_text.splitlines()):
              signatures.write_text(sig_text.rstrip("\n") + "\n" + signature + "\n", encoding="utf-8")
          PY
      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
      - name: Commit rendered admission
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "index: render hx admission at catalog #252"
          git push
