name: generate-oh-my-agent-assessment

on:
  push:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add corpus rows and regenerate projections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          catalog = Path("data/catalog.psv")
          catalog_text = catalog.read_text(encoding="utf-8")
          catalog_row = "136|oh-my-agent|oh-my-agent|https://github.com/first-fluke/oh-my-agent|2026-01-30T11:29:46Z|index-addition|428e80e93fa9e4e6e9776e755ee57af4ba5cd929|2026-09-18"
          if "|oh-my-agent|" not in catalog_text:
              catalog.write_text(catalog_text.rstrip("\n") + "\n" + catalog_row + "\n", encoding="utf-8")

          signatures = Path("data/signatures.psv")
          signatures_text = signatures.read_text(encoding="utf-8")
          signature_row = "136|oh-my-agent|oh-my-agent combines autonomous specialist work cells with explicit contract/workspace conflict attenuation, whole-session task/run control, structurally independent artifact-based judges that return failures into rework, and an opt-in scheduled failure-evidence → regression-fixture → gated skill-overlay evolution loop; ordinary user authorization remains below S5 identity/ultimate-policy closure."
          if "|oh-my-agent|" not in signatures_text:
              signatures.write_text(signatures_text.rstrip("\n") + "\n" + signature_row + "\n", encoding="utf-8")
          PY

          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md METRICS.md data/metrics.json README.md
            git commit -m "Generate oh-my-agent index projections"
            git push
          fi
