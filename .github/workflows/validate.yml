name: generate-deepagentsjs-assessment

on:
  push:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add corpus rows and regenerate projections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          catalog = Path("data/catalog.psv")
          catalog_text = catalog.read_text(encoding="utf-8")
          catalog_row = "135|deepagentsjs|Deep Agents JS|https://github.com/langchain-ai/deepagentsjs|2025-08-04T15:23:17Z|index-addition|39b85021d5c64d14539999490610970f76da0b47|2026-09-18"
          if "|deepagentsjs|" not in catalog_text:
              catalog.write_text(catalog_text.rstrip("\n") + "\n" + catalog_row + "\n", encoding="utf-8")

          signatures = Path("data/signatures.psv")
          signatures_text = signatures.read_text(encoding="utf-8")
          signature_row = "135|deepagentsjs|Deep Agents JS combines an autonomous model/tool agent with model-facing current control over a persisted set of remote async-subagent commitments: the root can inspect live status and autonomously start, redirect/interrupt or cancel work; delegation lacks a qualifying S2 interference loop, while evals, memory/skills and HITL remain mechanisms rather than S3*/S4/S5 ownership."
          if "|deepagentsjs|" not in signatures_text:
              signatures.write_text(signatures_text.rstrip("\n") + "\n" + signature_row + "\n", encoding="utf-8")
          PY

          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md METRICS.md data/metrics.json README.md
            git commit -m "Generate Deep Agents JS index projections"
            git push
          fi
