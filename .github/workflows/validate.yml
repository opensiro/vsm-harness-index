name: render Abhed admission

on:
  push:
    branches:
      - admit-abhed-256

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply admission inputs and render canonical views
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path("assessments/abhed.md")
          text = assessment.read_text(encoding="utf-8")
          old = "status: proposed"
          if old not in text:
              raise SystemExit("Abhed assessment is not proposed")
          assessment.write_text(text.replace(old, "status: included", 1), encoding="utf-8")

          catalog = Path("data/catalog.psv")
          row = "256|abhed|Abhed|https://github.com/zybuu-ai/abhed|2026-09-14T11:14:09Z|index-addition|151b8ddceee7ae232e526b3c237356151dde780e|2026-09-26"
          catalog_text = catalog.read_text(encoding="utf-8").rstrip("\n")
          if "|abhed|Abhed|https://github.com/zybuu-ai/abhed|" in catalog_text:
              raise SystemExit("Abhed already exists in catalog")
          catalog.write_text(catalog_text + "\n" + row + "\n", encoding="utf-8")

          signatures = Path("data/signatures.psv")
          signature = "256|abhed|Abhed closes autonomous S1 through its event-sourced model/tool loop, S2 through model-selected git-worktree isolation for explicit concurrent-write interference, and S3* through a fresh-context read-only review agent that directly inspects repository state. Batch launch, budgets and fan-in do not close whole-system S3; retrieval/research and policy/approval machinery do not close S4 or S5."
          sig_text = signatures.read_text(encoding="utf-8").rstrip("\n")
          if "|abhed|" in sig_text:
              raise SystemExit("Abhed already exists in signatures")
          signatures.write_text(sig_text + "\n" + signature + "\n", encoding="utf-8")
          PY

          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py

          git fetch origin main
          git checkout origin/main -- .github/workflows/validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "assessment: admit Abhed"
          git push
