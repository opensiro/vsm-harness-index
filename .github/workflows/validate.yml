name: validate

on:
  pull_request:
  push:

permissions:
  contents: write
  issues: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add tRPC-Agent-Go canonical inputs
        if: github.event_name == 'push'
        shell: bash
        run: |
          grep -q '^134|trpc-agent-go|' data/catalog.psv || printf '%s\n' '134|trpc-agent-go|tRPC-Agent-Go|https://github.com/trpc-group/trpc-agent-go|2025-05-14T13:51:35Z|index-addition|28cb50c1d927a586521de028aed95bde2a018144|2026-09-18' >> data/catalog.psv
          grep -q '^134|trpc-agent-go|' data/signatures.psv || printf '%s\n' '134|trpc-agent-go|tRPC-Agent-Go combines autonomous LLMAgent execution with constructor-style coordinator teams and an autonomous Evolution loop that converts completed-session corrections, recoveries and multi-step tool experience into gated managed skills reused by later tasks; runner lifecycle and evaluation remain mechanisms rather than S3/S3* ownership.' >> data/signatures.psv
      - name: Render and validate generated views
        if: github.event_name == 'push'
        shell: bash
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v
      - name: Commit generated tRPC-Agent-Go corpus
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md FULL_A.md METRICS.md data/metrics.json README.md assessments/trpc-agent-go.md
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
          else
            git commit -m 'Generate tRPC-Agent-Go index projections'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Pull-request placeholder
        if: github.event_name == 'pull_request'
        run: echo 'Temporary generator workflow; restored before PR.'
