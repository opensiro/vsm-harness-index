name: validate

on:
  pull_request:
  push:

permissions:
  contents: write
  issues: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap Buzz admission artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/assess-buzz'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path("assessments/buzz.md")
          text = assessment.read_text(encoding="utf-8")
          for state in ("A", "C", "P", "—"):
              text = text.replace(f"- State: `{state}`.", f"- State: {state}")
          assessment.write_text(text, encoding="utf-8")

          catalog = Path("data/catalog.psv")
          catalog_text = catalog.read_text(encoding="utf-8")
          catalog_row = "130|buzz|Buzz|https://github.com/block/buzz|2026-03-06T21:00:56Z|index-addition|8953cbfff58ed768d996677fed3af0e3bac64a20|2026-09-18"
          if "|buzz|Buzz|https://github.com/block/buzz|" not in catalog_text:
              catalog.write_text(catalog_text.rstrip("\n") + "\n" + catalog_row + "\n", encoding="utf-8")

          signatures = Path("data/signatures.psv")
          signatures_text = signatures.read_text(encoding="utf-8")
          signature_row = "130|buzz|Buzz combines an autonomous first-party agent loop with deterministic per-channel serialization across parallel managed-agent workers as constructor-owned S2; owner-reviewed agent and project-channel changes close parent-governed S3, while audit logs, memory and policy surfaces do not establish S3*/S4/S5."
          if "|buzz|" not in signatures_text:
              signatures.write_text(signatures_text.rstrip("\n") + "\n" + signature_row + "\n", encoding="utf-8")
          PY
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assessments/buzz.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md FULL_A.md METRICS.md data/metrics.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "Normalize Buzz assessment and projections"
            git push origin HEAD:assess-buzz
          fi

      - name: Resolve active semantic contract
        id: active_contract
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import csv
          from pathlib import Path

          path = Path("data/active-contract.psv")
          with path.open(encoding="utf-8", newline="") as handle:
              rows = list(csv.DictReader(handle, delimiter="|"))
          if len(rows) != 1:
              raise SystemExit("active-contract.psv must contain exactly one row")
          row = rows[0]
          print(f"profile={row['profile_version']}")
          print(f"methodology={row['methodology_version']}")
          PY

      - name: Checkout active VSM Harness Methodology release
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/vsm-harness-skills
          ref: v${{ steps.active_contract.outputs.methodology }}
          path: .methodology
          fetch-depth: 1

      - name: Check active-version assessment structural contract
        shell: bash
        env:
          ACTIVE_METHODOLOGY: ${{ steps.active_contract.outputs.methodology }}
        run: |
          python - <<'PY' > /tmp/active-assessments.txt
          import re
          import os
          from pathlib import Path

          target = os.environ["ACTIVE_METHODOLOGY"]
          pattern = re.compile(r"^assessment_procedure_version:\s*(\S+)\s*$", re.MULTILINE)
          for path in sorted(Path("assessments").glob("*.md")):
              match = pattern.search(path.read_text(encoding="utf-8"))
              if match and match.group(1) == target:
                  print(path)
          PY
          mapfile -t active_assessments < /tmp/active-assessments.txt
          if (( ${#active_assessments[@]} == 0 )); then
            echo "No assessments currently use active Methodology ${ACTIVE_METHODOLOGY}; structural gate ready for new work."
          else
            python .methodology/scripts/check_assessment_contract.py "${active_assessments[@]}"
          fi

      - run: python scripts/check_index.py
      - run: python scripts/render_full_a.py --check
      - run: python scripts/render_metrics.py --check
      - run: python scripts/sync_metrics_readme.py --check
      - name: Check live discovery queue deduplication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_discovery_queues.py
      - run: python -m unittest discover -s tests -v
      - name: Check immutable generation provenance against PR base
        if: github.event_name == 'pull_request'
        run: python scripts/check_generation_provenance.py --base-ref "${{ github.event.pull_request.base.sha }}"
      - name: Check immutable generation provenance against previous push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python scripts/check_generation_provenance.py --base-ref "${{ github.event.before }}"
