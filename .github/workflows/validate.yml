name: validate

on:
  push:
  pull_request:

permissions:
  contents: write
  issues: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add Scion canonical inputs
        if: github.event_name == 'push'
        shell: bash
        run: |
          grep -q '^133|scion|' data/catalog.psv || printf '%s\n' '133|scion|Scion|https://github.com/annex-ai/scion|2026-02-24T07:10:25Z|index-addition|8a3e21f7d624e13eb5f14a18728c6f98172a5c55|2026-09-18' >> data/catalog.psv
          grep -q '^133|scion|' data/signatures.psv || printf '%s\n' "133|scion|Scion combines autonomous agent-team coordination and heartbeat current control with an autonomous Observe → Reflect → Coach S4 loop that returns user corrections and workflow friction as future guidance; direct-transcript Observer/Reflector access exposes S3* as a constructor path because independently controlled audit triggering still requires deployment composition." >> data/signatures.psv
      - name: Render Scion corpus projections
        if: github.event_name == 'push'
        shell: bash
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v
      - name: Commit generated Scion corpus
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md FULL_A.md METRICS.md data/metrics.json README.md assessments/scion.md
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
          else
            git commit -m 'Generate Scion index projections'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Pull-request placeholder
        if: github.event_name == 'pull_request'
        run: echo 'Temporary generator workflow; restored before PR.'
