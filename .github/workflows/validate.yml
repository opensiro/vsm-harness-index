name: validate

on:
  pull_request:
  push:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Temporary sync generated views
        if: github.event_name == 'pull_request'
        run: |
          python scripts/render_tldr.py
          if ! git diff --quiet -- TLDR.md RANKINGS.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add TLDR.md RANKINGS.md
            git commit -m "Regenerate derived views for Agency Swarm admission"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: python scripts/check_index.py
      - run: python -m unittest discover -s tests -v
      - name: Check immutable generation provenance against PR base
        if: github.event_name == 'pull_request'
        run: python scripts/check_generation_provenance.py --base-ref "${{ github.event.pull_request.base.sha }}"
      - name: Check immutable generation provenance against previous push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python scripts/check_generation_provenance.py --base-ref "${{ github.event.before }}"
