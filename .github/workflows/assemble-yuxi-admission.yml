name: assemble Yuxi admission

on:
  push:
    branches:
      - admit-yuxi-159

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admit-yuxi-159
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote reviewed Yuxi and append canonical provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv

          assessment = Path('assessments/yuxi.md')
          text = assessment.read_text(encoding='utf-8')
          if 'status: proposed' in text:
              marker = 'assessment_procedure_version: 0.3.5\nstatus: proposed'
              replacement = 'assessment_procedure_version: 0.3.5\nassessment_changed_at: 2026-09-21\nstatus: included'
              if marker not in text:
                  raise SystemExit('Yuxi proposed frontmatter marker missing')
              assessment.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          elif 'status: included' not in text:
              raise SystemExit('Yuxi assessment has unexpected status')

          catalog = Path('data/catalog.psv')
          rows = list(csv.DictReader(catalog.open(encoding='utf-8', newline=''), delimiter='|'))
          existing = [r for r in rows if r['harness_id'] == 'yuxi' or r['repository'].lower() == 'https://github.com/xerrors/yuxi']
          if not existing:
              position = max(int(r['catalog_position']) for r in rows) + 1
              if position != 186:
                  raise SystemExit(f'expected catalog position 186 on this fresh branch, got {position}')
              row = f'{position}|yuxi|Yuxi|https://github.com/xerrors/Yuxi|2024-07-05T10:57:35Z|index-addition|86c67dc41249c3c9cad9e976fd8a006194d39a76|2026-09-21'
              catalog.write_text(catalog.read_text(encoding='utf-8').rstrip('\n') + '\n' + row + '\n', encoding='utf-8')
          else:
              position = int(existing[0]['catalog_position'])
              if position != 186:
                  raise SystemExit(f'Yuxi already cataloged at unexpected position {position}')

          signatures = Path('data/signatures.psv')
          sig_text = signatures.read_text(encoding='utf-8')
          if '|yuxi|' not in sig_text:
              signature = ('Yuxi closes autonomous first-party S1 and root-owned S3 through durable child-run lifecycle rights and live returned subordinate state; FIFO/leases and shared workspaces do not establish S2, telemetry/evaluation/approval do not close independent S3*, Memory/Skills/RAG do not form prospective S4, and configuration does not close S5.')
              signatures.write_text(sig_text.rstrip('\n') + f'\n{position}|yuxi|{signature}\n', encoding='utf-8')
          PY
      - name: Regenerate canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
      - name: Validate canonical tree
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v
      - name: Commit canonical artifacts and remove assembler
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/assemble-yuxi-admission.yml
          git add -A
          git commit -m 'admit: add Yuxi from reviewed standalone assessment'
          git push origin HEAD:admit-yuxi-159
