name: discovery queue dedupe

on:
  push:
    branches:
      - main
    paths:
      - scripts/check_discovery_queues.py
      - .github/workflows/discovery-queue-dedupe.yml
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: discovery-queue-dedupe
  cancel-in-progress: true

jobs:
  live-dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check live discovery queue deduplication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_discovery_queues.py
