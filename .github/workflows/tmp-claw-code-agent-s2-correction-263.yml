name: tmp claw-code-agent S2 correction 263

on:
  push:
    branches:
      - assessment/claw-code-agent-s2-correction-263

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply reassessment provenance and signature
        run: |
          python - <<'PY'
          from pathlib import Path

          history = Path("data/reassessment-history.psv")
          text = history.read_text(encoding="utf-8")
          row = "R3|claw-code-agent|167571da895b2a1a9e36ecfae2876984cef65e0d|167571da895b2a1a9e36ecfae2876984cef65e0d|167571da895b2a1a9e36ecfae2876984cef65e0d|2026-09-28|0.2.4|0.3.6|same-ref-correction|S2|https://github.com/HarnessLab/claw-code-agent/blob/167571da895b2a1a9e36ecfae2876984cef65e0d/src/team_runtime.py ; https://github.com/HarnessLab/claw-code-agent/blob/167571da895b2a1a9e36ecfae2876984cef65e0d/src/plan_runtime.py ; https://github.com/HarnessLab/claw-code-agent/blob/167571da895b2a1a9e36ecfae2876984cef65e0d/PARITY_CHECKLIST.md"
          if "|claw-code-agent|167571da895b2a1a9e36ecfae2876984cef65e0d|167571da895b2a1a9e36ecfae2876984cef65e0d|167571da895b2a1a9e36ecfae2876984cef65e0d|2026-09-28|" in text:
              raise SystemExit("claw-code-agent R3 row already present")
          history.write_text(text.rstrip("\n") + "\n" + row + "\n", encoding="utf-8")

          signatures = Path("data/signatures.psv")
          lines = signatures.read_text(encoding="utf-8").splitlines()
          matches = [i for i, line in enumerate(lines) if "|claw-code-agent|" in line]
          if len(matches) != 1:
              raise SystemExit(f"expected one claw-code-agent signature row, found {len(matches)}")
          i = matches[0]
          ordinal = lines[i].split("|", 1)[0]
          lines[i] = ordinal + "|claw-code-agent|claw-code-agent autonomously performs coding work and nested delegation, but its team messages and dependency-aware task ordering remain generic transport/sequencing rather than a concrete inter-S1 disturbance-attenuation loop."
          signatures.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Regenerate derived views
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
      - name: Validate
        run: |
          git clone --depth 1 --branch v0.3.6 https://github.com/opensiro/vsm-harness-skills.git /tmp/methodology
          python /tmp/methodology/scripts/check_assessment_contract.py assessments/claw-code-agent.md
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v
      - name: Remove assembler workflow
        run: rm .github/workflows/tmp-claw-code-agent-s2-correction-263.yml
      - name: Commit assembled correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "assessment: assemble claw-code-agent S2 correction"
          git push origin HEAD:assessment/claw-code-agent-s2-correction-263
