name: render BossConsole admission

on:
  push:
    branches:
      - admit-bossconsole-200

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Admit BossConsole sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path("assessments/bossconsole.md")
          text = assessment.read_text(encoding="utf-8")
          if "status: proposed" not in text:
              raise SystemExit("BossConsole assessment is not proposed")
          assessment.write_text(text.replace("status: proposed", "status: included", 1), encoding="utf-8")

          catalog = Path("data/catalog.psv")
          catalog_text = catalog.read_text(encoding="utf-8")
          row = "200|bossconsole|BossConsole|https://github.com/risa-labs-inc/BossConsole|2026-07-21T01:01:05Z|index-addition|d4db04882425327915e0520a366eac2da8af01f3|2026-09-22"
          if "|bossconsole|" in catalog_text:
              raise SystemExit("BossConsole already present in catalog")
          catalog.write_text(catalog_text.rstrip() + "\n\n" + row + "\n", encoding="utf-8")

          signatures = Path("data/signatures.psv")
          signatures_text = signatures.read_text(encoding="utf-8")
          signature = "200|bossconsole|BossConsole runs autonomous external coding-agent S1 units, exposes a Tool Evolver worktree constructor path that attenuates same-plugin parallel-agent clobbering for S2, and provides constructor plus parent-governed whole-installation current control for S3; no material S3* path is established, while agent-initiated and operator-initiated live Tool Evolver loops close S4 adaptation into the running toolbox, with no material S5 closure."
          if "|bossconsole|" in signatures_text:
              raise SystemExit("BossConsole already present in signatures")
          signatures.write_text(signatures_text.rstrip() + "\n\n" + signature + "\n", encoding="utf-8")
          PY
      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
      - name: Commit admission
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "admit: add BossConsole to canonical index"
          git push origin HEAD:${GITHUB_REF_NAME}
