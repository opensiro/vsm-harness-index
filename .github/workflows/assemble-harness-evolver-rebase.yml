name: reassemble Harness Evolver correction

on:
  push:
    branches:
      - fix/harness-evolver-s3star-294

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/harness-evolver-s3star-294
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore reviewed correction source
        shell: bash
        run: |
          git fetch origin tmp/harness-evolver-correction-source:refs/remotes/origin/tmp/harness-evolver-correction-source
          git show origin/tmp/harness-evolver-correction-source:assessments/harness-evolver.md > assessments/harness-evolver.md

      - name: Record same-ref correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          history = Path('data/reassessment-history.psv')
          text = history.read_text(encoding='utf-8')
          row = ('R3|harness-evolver|87fa7612358acccb01d34abf72426a7e47329642|'
                 '87fa7612358acccb01d34abf72426a7e47329642|87fa7612358acccb01d34abf72426a7e47329642|'
                 '2026-09-21|0.2.3|0.3.5|same-ref-correction|S3*|'
                 'https://github.com/raphaelchristi/harness-evolver/blob/87fa7612358acccb01d34abf72426a7e47329642/agents/harness-critic.md ; '
                 'https://github.com/raphaelchristi/harness-evolver/blob/87fa7612358acccb01d34abf72426a7e47329642/tools/add_evaluator.py ; '
                 'https://github.com/raphaelchristi/harness-evolver/blob/87fa7612358acccb01d34abf72426a7e47329642/tools/run_eval.py ; '
                 'https://github.com/raphaelchristi/harness-evolver/blob/87fa7612358acccb01d34abf72426a7e47329642/agents/harness-evaluator.md')
          if '|harness-evolver|' in text:
              raise SystemExit('unexpected pre-existing harness-evolver reassessment event on current main')
          history.write_text(text.rstrip('\n') + '\n' + row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          lines = signatures.read_text(encoding='utf-8').splitlines()
          replacement = ('111|harness-evolver|Harness Evolver runs an autonomous harness-evolution operation and supplies an independent anti-gaming Critic plus evaluator-construction path; S3* remains constructor-owned because the pinned runtime does not execute arbitrary Critic-added evaluator definitions into later scoring.')
          matches = [i for i, line in enumerate(lines) if line.startswith('111|harness-evolver|')]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one Harness Evolver signature row, found {len(matches)}')
          lines[matches[0]] = replacement
          signatures.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Regenerate projections
        shell: bash
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Checkout active Methodology
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/vsm-harness-skills
          ref: v0.3.5
          path: .methodology
          fetch-depth: 1

      - name: Validate
        shell: bash
        run: |
          python .methodology/scripts/check_assessment_contract.py assessments/harness-evolver.md
          rm -rf .methodology
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v
          python scripts/check_generation_provenance.py --base-ref c1c45bce85ab8b47a7fc8759bf897b9ed789c098

      - name: Commit and remove assembler
        shell: bash
        run: |
          rm -f .github/workflows/assemble-harness-evolver-rebase.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: correct Harness Evolver S3* closure'
          git push origin HEAD:fix/harness-evolver-s3star-294
