name: aesop-review-assemble

on:
  push:
    branches:
      - assessment/aesop-review

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment/aesop-review
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Render generated metrics
        run: |
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
      - name: Remove one-shot workflow and commit generated outputs
        run: |
          rm .github/workflows/aesop-review-assemble.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
            exit 0
          fi
          git commit -m 'chore: render Aesop review metrics'
          git push origin HEAD:assessment/aesop-review
