name: temporary Shep admission generator

on:
  push:
    branches:
      - admit-shep-248

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical admission inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/shep.md')
          text = assessment.read_text(encoding='utf-8')
          old = '\nstatus: proposed\n'
          if old not in text:
              raise SystemExit('Shep proposal status not found')
          assessment.write_text(text.replace(old, '\nstatus: included\n', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_text = catalog.read_text(encoding='utf-8')
          row = '248|shep|Shep|https://github.com/shep-ai/shep|2026-02-01T22:23:54Z|index-addition|a874b3238fd01ebdbafc11015cccd9a63ed6e2f2|2026-09-25'
          if '|shep|' in catalog_text:
              raise SystemExit('Shep already present in catalog')
          catalog.write_text(catalog_text.rstrip('\n') + '\n' + row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          sig_text = signatures.read_text(encoding='utf-8')
          sig = '248|shep|Shep closes autonomous S1 through its production FeatureAgent coding loop, constructor S2 through dependency blocking and rebase-before-spawn for concrete integration interference, S3=C(P) through first-party fleet current-control seams plus operator fleet approval/capacity control, and parent-governed S5 through the user-final supervisor authority rule; routine validation/CI do not establish S3*, while current-feature research/project memory do not establish S4.'
          if '|shep|' in sig_text:
              raise SystemExit('Shep already present in signatures')
          signatures.write_text(sig_text.rstrip('\n') + '\n' + sig + '\n', encoding='utf-8')
          PY
      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
      - name: Validate generated state
        run: |
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/check_index.py
          python -m unittest discover -s tests -v
      - name: Commit generated admission
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/shep.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md FULL_A.md METRICS.md data/metrics.json README.md
          git commit -m 'index: admit Shep [admission-generated]'
          git push
