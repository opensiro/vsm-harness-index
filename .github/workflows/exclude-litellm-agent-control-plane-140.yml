name: exclude-litellm-agent-control-plane-140

on:
  push:
    branches:
      - exclude-litellm-agent-control-plane-140

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exclude-litellm-agent-control-plane-140
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply LiteLLM ACP exclusion and regenerate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/litellm-agent-control-plane.md')
          text = assessment.read_text(encoding='utf-8')
          if 'status: proposed' not in text:
              raise SystemExit('expected proposed assessment')
          text = text.replace(
              'assessment_procedure_version: 0.3.5\nstatus: proposed\n',
              'assessment_procedure_version: 0.3.5\nassessment_changed_at: 2026-09-20\nstatus: excluded-no-agentic-vsm\n',
              1,
          )
          assessment.write_text(text, encoding='utf-8')

          catalog = Path('data/catalog.psv')
          row = '162|litellm-agent-control-plane|LiteLLM Agent Control Plane|https://github.com/LiteLLM-Labs/litellm-agent-control-plane|2026-05-07T21:35:39Z|index-addition|53bfd20e2fec51fc8f665fb614512c6b138367da|2026-09-20'
          catalog_text = catalog.read_text(encoding='utf-8').rstrip('\n')
          if '|litellm-agent-control-plane|' in catalog_text:
              raise SystemExit('litellm-agent-control-plane already present in catalog')
          catalog.write_text(catalog_text + '\n' + row + '\n', encoding='utf-8')
          PY

          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python -m unittest discover -s tests -v

          git rm .github/workflows/exclude-litellm-agent-control-plane-140.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assessments/litellm-agent-control-plane.md data/catalog.psv TLDR.md RANKINGS.md FULL_A.md METRICS.md data/metrics.json README.md
          git commit -m "assessment: assemble LiteLLM ACP exclusion"
          git push origin HEAD:exclude-litellm-agent-control-plane-140
