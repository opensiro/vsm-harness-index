name: Render S5 reconciliation projections

on:
  push:
    branches:
      - experiment/s5-surogates-reconcile-621

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/s5-surogates-reconcile-621
          fetch-depth: 0

      - name: Render experiment projections
        run: |
          python experiments/functional-capability-depth/render_function_baselines.py
          python experiments/functional-capability-depth/render_evidence_frontier.py
          python experiments/functional-capability-depth/render_function_baselines.py --check
          python experiments/functional-capability-depth/render_evidence_frontier.py --check

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/render-s5-reconcile-projections.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/functional-capability-depth/FUNCTION-BASELINES.md \
                  experiments/functional-capability-depth/EVIDENCE-FRONTIER.md \
                  .github/workflows/render-s5-reconcile-projections.yml
          if git diff --cached --quiet; then
            echo 'No projection changes to commit.'
          else
            git commit -m 'experiment: render S5 reconciliation projections'
            git push origin HEAD:experiment/s5-surogates-reconcile-621
          fi
