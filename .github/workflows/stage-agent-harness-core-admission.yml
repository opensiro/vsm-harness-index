name: stage-agent-harness-core-admission

on:
  push:
    branches:
      - admission/agent-harness-core-1009

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admission/agent-harness-core-1009
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fail-closed source admission
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment_path = Path('assessments/agent-harness-core.md')
          text = assessment_path.read_text(encoding='utf-8')
          required = {
              'harness_id': 'agent-harness-core',
              'project_name': 'Agent Harness Core',
              'repository': 'https://github.com/phenomenoner/agent-harness-core',
              'review_ref': '1e247e064061e4427f4b78e8afd8671e6e7f06f0',
              'status': 'proposed',
              'autonomy_s1': 'A',
              'autonomy_s2': 'C',
              'autonomy_s3': 'A',
              'autonomy_s3_star': '—',
              'autonomy_s4': '—',
              'autonomy_s5': '—',
          }
          for key, value in required.items():
              needle = f'{key}: {value}'
              if needle not in text:
                  raise SystemExit(f'assessment gate failed: missing {needle!r}')
          if text.count('status: proposed') != 1:
              raise SystemExit('assessment gate failed: expected exactly one proposed status')
          assessment_path.write_text(text.replace('status: proposed', 'status: included', 1), encoding='utf-8')

          catalog_path = Path('data/catalog.psv')
          catalog = catalog_path.read_text(encoding='utf-8')
          rows = [line for line in catalog.splitlines() if line.strip()]
          if any('|agent-harness-core|' in line for line in rows[1:]):
              raise SystemExit('catalog gate failed: agent-harness-core already present')
          last_position = int(rows[-1].split('|', 1)[0])
          if last_position != 346:
              raise SystemExit(f'catalog gate failed: expected tail 346, found {last_position}')
          row = '347|agent-harness-core|Agent Harness Core|https://github.com/phenomenoner/agent-harness-core|2026-06-10T09:48:39Z|index-addition|1e247e064061e4427f4b78e8afd8671e6e7f06f0|2026-09-20'
          catalog_path.write_text(catalog.rstrip('\n') + '\n' + row + '\n', encoding='utf-8')

          signatures_path = Path('data/signatures.psv')
          signatures = signatures_path.read_text(encoding='utf-8')
          if any('|agent-harness-core|' in line for line in signatures.splitlines()[1:]):
              raise SystemExit('signature gate failed: agent-harness-core already present')
          signature = ('347|agent-harness-core|Agent Harness Core closes autonomous S1 through exact-lane model-backed task cells, '
                       'constructor S2 through class/group/channel capacity attenuation, and autonomous S3 through a master that sets child execution policy '
                       'and resumes on exact group results; receipts/supervision, retrospective skill mutation, and operator config do not establish S3*, S4, or S5.')
          signatures_path.write_text(signatures.rstrip('\n') + '\n' + signature + '\n', encoding='utf-8')
          PY

      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_analytics.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Verify rendered tree
        run: |
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_analytics.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/check_index.py
          python -m unittest discover -s tests -v

      - name: Commit staged admission
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && { echo 'expected admission changes but tree is clean'; exit 1; } || true
          git commit -m 'Index: stage Agent Harness Core admission at #347'
          git push origin HEAD:admission/agent-harness-core-1009
