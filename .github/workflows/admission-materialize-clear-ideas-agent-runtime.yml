name: admission-materialize-clear-ideas-agent-runtime

on:
  push:
    branches:
      - admission/clear-ideas-agent-runtime-1015

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical Clear Ideas Agent Runtime admission sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/clear-ideas-agent-runtime.md')
          text = assessment.read_text(encoding='utf-8')
          expected = 'status: proposed\n'
          if text.count(expected) != 1:
              raise SystemExit('expected exactly one proposed Clear Ideas Agent Runtime status')
          if 'review_ref: 6abb6fa1ae2455dfe3eb86414b617e1fa84a47b1\n' not in text:
              raise SystemExit('unexpected Clear Ideas Agent Runtime review ref')
          assessment.write_text(text.replace(expected, 'status: included\n', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          rows = catalog.read_text(encoding='utf-8').splitlines()
          if any('|clear-ideas-agent-runtime|' in row or 'https://github.com/clearideas/agent-runtime' in row for row in rows[1:]):
              raise SystemExit('Clear Ideas Agent Runtime already present in catalog')
          positions = [int(row.split('|', 1)[0]) for row in rows[1:] if row.strip()]
          next_position = max(positions) + 1
          if next_position != 328:
              raise SystemExit(f'unexpected next catalog position: {next_position}')
          rows.append('328|clear-ideas-agent-runtime|Clear Ideas Agent Runtime|https://github.com/clearideas/agent-runtime|2026-07-27T14:49:17Z|index-addition|6abb6fa1ae2455dfe3eb86414b617e1fa84a47b1|2026-09-20')
          catalog.write_text('\n'.join(rows) + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          sig_rows = signatures.read_text(encoding='utf-8').splitlines()
          if any('|clear-ideas-agent-runtime|' in row for row in sig_rows[1:]):
              raise SystemExit('Clear Ideas Agent Runtime signature already present')
          signature = (
              'Clear Ideas Agent Runtime closes autonomous S1 through model-backed prompt execution, constructor-owned S2 '
              'through dependency-safe parallel state isolation and ordered wave commits, and constructor-owned S3 through '
              'integrated run scheduling, budget, suspension, checkpoint and attempt control; no complementary whole-runtime '
              'S3*, prospective S4 adaptation, or runtime identity/ultimate-policy S5 loop is established.'
          )
          sig_rows.append(f'328|clear-ideas-agent-runtime|{signature}')
          signatures.write_text('\n'.join(sig_rows) + '\n', encoding='utf-8')
          PY
      - name: Render canonical projections
        shell: bash
        run: |
          python scripts/render_tldr.py
          python scripts/render_analytics.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
      - name: Verify generated tree
        shell: bash
        run: |
          python scripts/check_index.py
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_analytics.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/render_full_a.py --check
          python -m unittest discover -s tests -v
      - name: Commit materialized admission and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/admission-materialize-clear-ideas-agent-runtime.yml
          git add assessments/clear-ideas-agent-runtime.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics METRICS.md data/metrics.json README.md FULL_A.md 2>/dev/null || true
          git diff --cached --check
          git commit -m 'Index: admit Clear Ideas Agent Runtime at catalog #328'
          git push origin HEAD:admission/clear-ideas-agent-runtime-1015
