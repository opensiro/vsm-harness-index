name: render SWARM admission

on:
  push:
    branches: [admit-swarm-210]
    paths:
      - '.github/workflows/admit-swarm-render.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admit-swarm-210
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit SWARM canonical row
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/swarm.md')
          text = assessment.read_text(encoding='utf-8')
          old = 'status: proposed'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one proposed status, found {text.count(old)}')
          assessment.write_text(text.replace(old, 'status: included', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_row = '210|swarm|SWARM|https://github.com/KhanUzeb/SWARM|2026-08-13T10:28:13Z|index-addition|5234bed4e889b13f1343833382a7e13a782a5ee7|2026-09-23'
          catalog_text = catalog.read_text(encoding='utf-8').rstrip('\n')
          if '|swarm|' in catalog_text:
              raise SystemExit('SWARM already exists in catalog')
          if not catalog_text.splitlines()[-1].startswith('209|temporal-agent-harness|'):
              raise SystemExit('catalog slot 210 is no longer safely appendable')
          catalog.write_text(catalog_text + '\n' + catalog_row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signature_row = '210|swarm|SWARM runs autonomous named-bot S1 units, exposes constructor S2 through deterministic anti-race shared-channel sequencing that feeds each prior teammate reply into the next responder, and provides constructor plus parent-governed whole-current work control through normalized work, approval and cancellation surfaces; review/eval primitives do not close S3*, persistent skills/knowledge/bot provisioning do not form S4, and no material S5 identity closure is established.'
          signatures_text = signatures.read_text(encoding='utf-8').rstrip('\n')
          if '|swarm|' in signatures_text:
              raise SystemExit('SWARM already exists in signatures')
          if not signatures_text.splitlines()[-1].startswith('209|temporal-agent-harness|'):
              raise SystemExit('signature slot 210 is no longer safely appendable')
          signatures.write_text(signatures_text + '\n' + signature_row + '\n', encoding='utf-8')
          PY
      - name: Render and validate canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python experiments/functional-capability-depth/render_function_baselines.py --check
          python experiments/functional-capability-depth/render_s1_baseline.py --check
      - name: Commit rendered admission
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/swarm.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md METRICS.md README.md analytics/temporal.md data/metrics.json
          git commit -m 'admit: render SWARM canonical inclusion'
          git push origin HEAD:admit-swarm-210
