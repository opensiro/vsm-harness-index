name: stage KADATH canonical S4
on:
  push:
    branches:
      - experiment/kadath-canonical-s4-520
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit KADATH canonical S4 observation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('experiments/functional-capability-depth/s4-system-benchmarks')
          canonical_path = root / 'canonical_observations.json'
          coverage_path = root / 'coverage.json'
          readme_path = root / 'README.md'
          validator_path = root / 'validate.py'
          baselines_path = Path('experiments/functional-capability-depth/primary-baselines.json')

          canonical = json.loads(canonical_path.read_text(encoding='utf-8'))
          if [x.get('observation_id') for x in canonical] != ['a-evolve-harness-updating-2026']:
              raise SystemExit('unexpected pre-KADATH canonical S4 registry')
          canonical.append({
              'observation_id': 'kadath-ten-epoch-native-evolution-2026',
              'function': 'S4',
              'benchmark_id': 'kadath-native-evolution',
              'benchmark_fit': 'direct',
              'evidence_source_class': 'first-party-reported',
              'boundary_class': 'canonical-native-system',
              'canonical_harness_id': 'kadath',
              'canonical_assessment_ref': 'assessments/kadath.md',
              'canonical_system_eligible': True,
              'system_compatibility': 'native-system',
              'canonical_review_revision': 'db7a6438d98c18d590b78b2146dc3bcd2c4ea0ef',
              'source_artifact_revision': 'db7a6438d98c18d590b78b2146dc3bcd2c4ea0ef',
              'comparison_class': 'within-system-longitudinal-population-evolution',
              'epochs': 10,
              'benchmark_scope': 'one operator-approved run-specific locked fitness benchmark',
              'ordinary_s4_boundary': 'The non-evolving kernel, approved benchmark and objective hashes, grading/evidence pipeline, scoring formulas, selection controls and lineage machinery remain outside the evolvable organism genome. Organism frameworks mutate only after grading; accepted changed genomes are activated for later epochs under the same locked fitness definition.',
              'adaptation_loop': [
                  'organisms execute under the current genome against the locked environment/fitness definition',
                  'the kernel freezes attempts and an independent Grader extracts benchmark evidence',
                  'verified scores, population evidence and elite evidence enter model-driven reflection, Tweaker and Birther adaptation paths',
                  'valid prompt/source/dependency/file genome mutations are committed after grading',
                  'the changed population is activated and later epochs execute the changed capabilities'
              ],
              'reported_population_metrics': {
                  'best_fitness_epoch_1': 18,
                  'best_fitness_epoch_10': 91,
                  'best_fitness_improvement': 73,
                  'top5_median_epoch_1': 8,
                  'top5_median_epoch_10': 77,
                  'top5_median_improvement': 69,
                  'top5_floor_epoch_1': 1,
                  'top5_floor_epoch_10': 71,
                  'top5_floor_improvement': 70
              },
              'metric_note': 'The first-party README reports a ten-epoch upward shift in the leading cohort. Each epoch point may represent a different top-performing agent, so these metrics describe population-level evolutionary improvement rather than one individual trajectory.',
              'comparability_limitation': 'The fitness benchmark is generated from the user goal and explicitly approved and locked per run. The published proof does not expose enough run metadata to reconstruct a common model/goal/population/configuration cell with A-Evolve or another canonical S4 system. Preserve this as a heterogeneous within-system observation, not a matched cross-harness score.',
              'vsm_interpretation': 'The canonical assessment independently establishes KADATH S4=A. The published proof exercises that same native path: independently graded current performance feeds model-driven mutation and reproduction of persistent organism frameworks, and changed genomes execute in later epochs while the S4 control boundary remains fixed. This supplies a second canonical native direct S4 observation but does not close the matched primary-baseline gap.',
              'primary_sources': [
                  'https://github.com/i3T4AN/KADATH/blob/db7a6438d98c18d590b78b2146dc3bcd2c4ea0ef/README.md',
                  'https://github.com/i3T4AN/KADATH/blob/db7a6438d98c18d590b78b2146dc3bcd2c4ea0ef/kadath/engine.py'
              ]
          })
          canonical_path.write_text(json.dumps(canonical, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          coverage = json.loads(coverage_path.read_text(encoding='utf-8'))
          if coverage.get('canonical_direct_observation_count') != 1:
              raise SystemExit('unexpected pre-KADATH canonical_direct_observation_count')
          coverage['canonical_direct_observation_count'] = 2
          classes = coverage['coverage_classes']
          if 'canonical-native-direct' not in classes:
              classes.insert(1, 'canonical-native-direct')
          for case in coverage['cases']:
              if case.get('case_id') == 'kadath-native-s4-no-standardized-results':
                  case['benchmark_fit'] = 'direct'
                  case['coverage_class'] = 'canonical-native-direct'
                  case['finding'] = ('KADATH publishes a native ten-epoch evolutionary run under one locked fitness benchmark at the same revision as its canonical assessment: best fitness rises 18→91, top-five median 8→77, and the top-five floor 1→71. The result directly exercises the canonical S4=A path because independently graded evidence feeds model-driven mutation/reproduction, valid changed genomes are activated, and later epochs execute them while the benchmark/kernel/grading boundary stays fixed. The run-specific generated benchmark and undisclosed full run configuration prevent a matched cross-harness comparison.')
                  case['admitted_to_canonical_registry'] = True
                  case['canonical_observation_id'] = 'kadath-ten-epoch-native-evolution-2026'
                  break
          else:
              raise SystemExit('KADATH coverage case missing')
          coverage_path.write_text(json.dumps(coverage, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          baselines = json.loads(baselines_path.read_text(encoding='utf-8'))
          s4 = baselines['functions']['S4']
          old_reason = 'Direct S4 evidence now includes one canonical native A-Evolve harness-updating observation, but public evidence still does not provide a matched comparison of native S4 implementations across multiple canonical harnesses under one common benchmark/model/configuration cell.'
          if s4.get('blocking_reason') != old_reason:
              raise SystemExit('S4 blocking reason drift')
          s4['blocking_reason'] = ('Direct S4 evidence now includes two canonical native systems: A-Evolve publishes harness-updating measurements across SWE-bench Verified, MCP-Atlas and SkillsBench, while KADATH publishes a ten-epoch locked-benchmark population-improvement run. Their tasks, benchmark definitions, models/configurations and result surfaces are not matched, so public evidence still does not provide a common cross-harness S4 comparison cell.')
          baselines_path.write_text(json.dumps(baselines, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('canonical native/adapter-preserved direct-S4 observations: 1', 'canonical native/adapter-preserved direct-S4 observations: 2', 1)
          old_boundary = '''`canonical_observations.json` now contains one native direct observation: A-Evolve. Canonical assessment #512 independently established `a-evolve` as `S4=A`; canonical admission #515 then made that ownership claim eligible for capability linkage. The paper's Exp0 protocol directly exercises A-Evolve's first-party evolver over persistent harness state, and the canonical review ref contains the corresponding harness-disentangling artifact and UnifiedEngine port.\n\nPublished harness-updating results are preserved without collapsing them into a scalar: the best-vs-worst evolver spread is at most 3.1 percentage points on any benchmark; Qwen3-235B reports +8.2 pp on SWE and +0.6 pp on MCP; on SkillsBench Qwen3.5-9B reports +3.8 pp versus Opus 4.6 +2.3 pp and Qwen3-235B +1.5 pp. These are first-party-reported historical results, not reproduction at the canonical review commit.\n\nThe general system-linkage rule remains unchanged. A direct S4 benchmark can use a canonical harness as its S1 task solver while replacing S4 with a benchmark-owned evolver; that is evidence for the composed benchmark system, not for the task solver. SkillEvolBench's Codex integration remains the key negative control.\n\nOne native A-Evolve observation also does **not** create a matched cross-harness primary. A primary still requires at least two canonical systems exercising their own S4 paths under a common evaluation membrane.'''
          new_boundary = '''`canonical_observations.json` now contains two native direct observations: A-Evolve and KADATH. Their canonical assessments independently establish `S4=A`; capability evidence is linked only after that ownership decision.\n\nA-Evolve preserves published harness-updating measurements without collapsing them into a scalar: the best-vs-worst evolver spread is at most 3.1 percentage points on any benchmark; Qwen3-235B reports +8.2 pp on SWE and +0.6 pp on MCP; on SkillsBench Qwen3.5-9B reports +3.8 pp versus Opus 4.6 +2.3 pp and Qwen3-235B +1.5 pp. These are first-party-reported historical results from a divergent release lineage, not reproduction at the canonical review commit.\n\nKADATH's pinned canonical README publishes a ten-epoch native run under one locked fitness benchmark: best fitness 18→91, top-five median 8→77, and the top-five floor 1→71. Each point may be a different leading organism, so this is a population-shift measurement rather than one individual trajectory.\n\nThe general system-linkage rule remains unchanged. A direct S4 benchmark can use a canonical harness as its S1 task solver while replacing S4 with a benchmark-owned evolver; that is evidence for the composed benchmark system, not for the task solver. SkillEvolBench's Codex integration remains the key negative control.\n\nTwo native observations still do **not** create a matched cross-harness primary. A-Evolve uses published task suites and a controlled harness-evolution protocol; KADATH generates and operator-approves a run-specific fitness benchmark. Their evaluation membranes are heterogeneous, so no shared comparison cell exists.'''
          if old_boundary not in readme:
              raise SystemExit('canonical boundary README block drift')
          readme = readme.replace(old_boundary, new_boundary, 1)

          old_kadath = '''### KADATH — strongest native capability-adaptation candidate\n\nCanonical KADATH has `S4=A`.\n\nIts shipped evolutionary loop closes:\n\n```text\nverified benchmark/environment evidence\n        ↓\nmodel-driven mutation / reproduction\n        ↓\nchanged organism genome\n        ↓\nnext epoch executes changed capability\n```\n\nThis is a genuine native S4 path. It also demonstrates a clean ordinary-S4 boundary: the organism genome can change while the non-evolving kernel, locked benchmark, evidence/grading machinery and selection controls remain outside the evolvable genome during the run.\n\nThe blocker is measurement comparability, not missing S4. The benchmark/fitness definition is generated and operator-approved per run, and the reviewed repository does not publish a reusable matched cross-harness results corpus for this native S4 path.'''
          new_kadath = '''### KADATH — canonical native direct observation\n\nCanonical KADATH has `S4=A`, and the same pinned revision publishes a ten-epoch native evolutionary proof under one locked fitness benchmark:\n\n| Top-five measurement | Epoch 1 | Epoch 10 | Improvement |\n| --- | ---: | ---: | ---: |\n| Best fitness | 18 | 91 | +73 |\n| Median fitness | 8 | 77 | +69 |\n| Lowest fitness | 1 | 71 | +70 |\n\nThe repository states that each epoch point can be a different top-performing organism, so the observation measures an upward shift across the competitive population rather than a cherry-picked individual trajectory. The ordinary-S4 boundary is clean: organism genomes change only after grading, while the non-evolving kernel, locked benchmark, grading/evidence machinery and selection controls remain outside the evolvable genome.\n\nThis closes KADATH's native quantitative-observation gap, not the general matched-primary gap. The fitness benchmark is generated and operator-approved per run, and the published proof does not expose a common goal/model/population/configuration cell shared with A-Evolve or another canonical harness.'''
          if old_kadath not in readme:
              raise SystemExit('KADATH README block drift')
          readme = readme.replace(old_kadath, new_kadath, 1)
          readme_path.write_text(readme, encoding='utf-8')

          validator = validator_path.read_text(encoding='utf-8')
          validator = validator.replace('    "candidate-native-no-direct-results",\n', '    "candidate-native-no-direct-results",\n    "canonical-native-direct",\n', 1)
          validator = validator.replace('    if len(canonical_observations) != 1:\n        fail("expected exactly one canonical direct S4 observation")\n', '    if len(canonical_observations) != 2:\n        fail("expected exactly two canonical direct S4 observations")\n', 1)
          anchor = '''    if a_evolve_fields.get("review_ref") != expected_review_ref:\n        fail("canonical A-Evolve assessment review_ref drift")\n\n'''
          kadath_validation = '''    if len({obs.get("observation_id") for obs in canonical_observations}) != 2:\n        fail("canonical S4 observation IDs must be unique")\n    kadath_obs = canonical_observations[1]\n    if kadath_obs.get("observation_id") != "kadath-ten-epoch-native-evolution-2026":\n        fail("unexpected KADATH canonical S4 observation_id")\n    if kadath_obs.get("function") != "S4" or kadath_obs.get("benchmark_id") != "kadath-native-evolution":\n        fail("KADATH canonical observation function/benchmark drift")\n    if kadath_obs.get("benchmark_fit") != "direct":\n        fail("KADATH canonical benchmark_fit must be direct")\n    if kadath_obs.get("evidence_source_class") != "first-party-reported":\n        fail("KADATH evidence source must remain first-party-reported")\n    if kadath_obs.get("boundary_class") != "canonical-native-system":\n        fail("KADATH canonical boundary_class drift")\n    if kadath_obs.get("canonical_harness_id") != "kadath" or kadath_obs.get("canonical_assessment_ref") != "assessments/kadath.md":\n        fail("KADATH canonical linkage drift")\n    if kadath_obs.get("canonical_system_eligible") is not True or kadath_obs.get("system_compatibility") != "native-system":\n        fail("KADATH canonical eligibility/compatibility drift")\n    kadath_ref = "db7a6438d98c18d590b78b2146dc3bcd2c4ea0ef"\n    if kadath_obs.get("canonical_review_revision") != kadath_ref or kadath_obs.get("source_artifact_revision") != kadath_ref:\n        fail("KADATH canonical/source revision drift")\n    if kadath_obs.get("comparison_class") != "within-system-longitudinal-population-evolution":\n        fail("KADATH comparison class drift")\n    if kadath_obs.get("epochs") != 10:\n        fail("KADATH epoch count drift")\n    expected_kadath_metrics = {\n        "best_fitness_epoch_1": 18,\n        "best_fitness_epoch_10": 91,\n        "best_fitness_improvement": 73,\n        "top5_median_epoch_1": 8,\n        "top5_median_epoch_10": 77,\n        "top5_median_improvement": 69,\n        "top5_floor_epoch_1": 1,\n        "top5_floor_epoch_10": 71,\n        "top5_floor_improvement": 70,\n    }\n    if kadath_obs.get("reported_population_metrics") != expected_kadath_metrics:\n        fail("KADATH reported population metrics drift")\n    if not isinstance(kadath_obs.get("ordinary_s4_boundary"), str) or len(kadath_obs["ordinary_s4_boundary"].strip()) < 100:\n        fail("KADATH ordinary-S4 boundary required")\n    if not isinstance(kadath_obs.get("adaptation_loop"), list) or len(kadath_obs["adaptation_loop"]) < 5:\n        fail("KADATH adaptation loop incomplete")\n    if not isinstance(kadath_obs.get("comparability_limitation"), str) or len(kadath_obs["comparability_limitation"].strip()) < 120:\n        fail("KADATH comparability limitation required")\n    kadath_sources = kadath_obs.get("primary_sources")\n    if not isinstance(kadath_sources, list) or len(kadath_sources) < 2 or any(not valid_https(s) for s in kadath_sources):\n        fail("KADATH primary_sources invalid")\n    kadath_fields = assessment_fields("kadath")\n    if kadath_fields.get("status") != "included" or kadath_fields.get("autonomy_s4") != "A":\n        fail("canonical KADATH no longer establishes included S4=A")\n    if kadath_fields.get("review_ref") != kadath_ref:\n        fail("canonical KADATH assessment review_ref drift")\n\n'''
          if anchor not in validator:
              raise SystemExit('validator A-Evolve anchor drift')
          validator = validator.replace(anchor, anchor + kadath_validation, 1)
          validator_path.write_text(validator, encoding='utf-8')
          PY
      - name: Regenerate cross-function baseline view
        run: python experiments/functional-capability-depth/render_function_baselines.py
      - name: Validate
        run: |
          python experiments/functional-capability-depth/s4-system-benchmarks/validate.py
          python experiments/functional-capability-depth/render_function_baselines.py --check
          python experiments/functional-capability-depth/render_s1_baseline.py --check
          python experiments/functional-capability-depth/s2-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s3-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s3star-system-benchmarks/validate.py
          python experiments/functional-capability-depth/s5-system-benchmarks/validate.py
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v
      - name: Commit experiment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/functional-capability-depth/primary-baselines.json experiments/functional-capability-depth/FUNCTION-BASELINES.md experiments/functional-capability-depth/s4-system-benchmarks
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'experiment: admit KADATH canonical direct S4 observation'
          git push
