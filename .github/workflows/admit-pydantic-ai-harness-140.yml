name: admit-pydantic-ai-harness-140

on:
  push:
    branches:
      - admit-pydantic-ai-harness-140
    paths:
      - .github/workflows/admit-pydantic-ai-harness-140.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admit-pydantic-ai-harness-140
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble canonical admission
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/pydantic-ai-harness.md')
          text = assessment.read_text()
          if 'status: proposed' not in text:
              raise SystemExit('expected proposed Pydantic AI Harness assessment')
          text = text.replace('assessment_procedure_version: 0.3.5\nstatus: proposed', 'assessment_procedure_version: 0.3.5\nassessment_changed_at: 2026-09-20\nstatus: included', 1)
          assessment.write_text(text)

          catalog = Path('data/catalog.psv')
          row = '163|pydantic-ai-harness|Pydantic AI Harness|https://github.com/pydantic/pydantic-ai-harness|2026-03-20T19:58:53Z|index-addition|434649f87d34aa7e5d48c7bd26ad33c50d57cf10|2026-09-20'
          ctext = catalog.read_text().rstrip('\n')
          if '|pydantic-ai-harness|' in ctext:
              raise SystemExit('catalog already contains pydantic-ai-harness')
          catalog.write_text(ctext + '\n' + row + '\n')

          signatures = Path('data/signatures.psv')
          sig = "163|pydantic-ai-harness|Pydantic AI Harness combines an autonomous packaged Coder/Researcher S1 with model-authored DynamicWorkflow whole-team current control and a separate TrajectoryJudge that steers the live run; CapabilityCreation exposes a constructor S4 path for agent-authored future capabilities, while delegation alone does not establish S2 and operational instructions/limits do not close S5."
          stext = signatures.read_text().rstrip('\n')
          if '|pydantic-ai-harness|' in stext:
              raise SystemExit('signature already contains pydantic-ai-harness')
          signatures.write_text(stext + '\n' + sig + '\n')
          PY

          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v

          git rm .github/workflows/admit-pydantic-ai-harness-140.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'assessment: assemble Pydantic AI Harness admission'
          git push origin HEAD:admit-pydantic-ai-harness-140
