name: tmp-generate-ag2

on:
  push:
    branches:
      - batch-125-ag2-assessment

permissions:
  contents: write
  issues: read

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add AG2 corpus rows
        run: |
          python - <<'PY'
          from pathlib import Path

          catalog = Path('data/catalog.psv')
          catalog_row = '110|ag2|AG2|https://github.com/ag2ai/ag2|2024-11-11T20:43:34Z|adapted-source|3211bb19832049e7abe1a5742b6d177274bff723|2026-09-18'
          text = catalog.read_text(encoding='utf-8')
          if not any(line.split('|')[1:2] == ['ag2'] for line in text.splitlines() if '|' in line):
              catalog.write_text(text.rstrip('\n') + '\n' + catalog_row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signature_row = "110|ag2|AG2's model/tool Agent loop owns autonomous S1, while the built-in multi-party discussion protocol provides constructor-owned S2 through enforced round-robin turn regulation; Hub governance, audit, knowledge and HITL do not establish S3, S3*, S4 or S5 closure."
          text = signatures.read_text(encoding='utf-8')
          if not any(line.split('|')[1:2] == ['ag2'] for line in text.splitlines() if '|' in line):
              signatures.write_text(text.rstrip('\n') + '\n' + signature_row + '\n', encoding='utf-8')
          PY
      - name: Render cohort views
        run: python scripts/render_tldr.py
      - name: Validate index
        run: python scripts/check_index.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Commit generated corpus changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md
          if git diff --cached --quiet; then
            echo 'No corpus changes to commit.'
            exit 0
          fi
          git commit -m 'Admit AG2 corpus artifacts'
          git push origin HEAD:batch-125-ag2-assessment
