name: prepare-headcount-history

on:
  push:
    branches:
      - fix-headcount-s3star-boundary

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record same-ref correction provenance
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/headcount.md')
          text = assessment.read_text(encoding='utf-8')
          anchor = 'assessment_changed_at: 2026-09-19\nstatus: included\n'
          replacement = 'assessment_changed_at: 2026-09-19\nlast_checked_ref: 9cbf34005e3e8a980a6af9b55eb226bd926a62b3\nlast_checked_at: 2026-09-19\nlast_reassessment_round: R3\nstatus: included\n'
          if text.count(anchor) != 1:
              raise SystemExit('Headcount metadata anchor mismatch')
          assessment.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          history = Path('data/reassessment-history.psv')
          row = 'R3|headcount|9cbf34005e3e8a980a6af9b55eb226bd926a62b3|9cbf34005e3e8a980a6af9b55eb226bd926a62b3|9cbf34005e3e8a980a6af9b55eb226bd926a62b3|2026-09-19|0.2.2|0.3.4|same-ref-correction|S3*|https://github.com/cbrock84/headcount/blob/9cbf34005e3e8a980a6af9b55eb226bd926a62b3/plugins/security/.claude-plugin/plugin.json ; https://github.com/cbrock84/headcount/blob/9cbf34005e3e8a980a6af9b55eb226bd926a62b3/.claude/agents/security-review.md ; https://github.com/cbrock84/headcount/blob/9cbf34005e3e8a980a6af9b55eb226bd926a62b3/docs/AGENT-SURFACES.md'
          current = history.read_text(encoding='utf-8')
          if '|headcount|' in current:
              raise SystemExit('Headcount already present in reassessment history')
          history.write_text(current.rstrip('\n') + '\n' + row + '\n', encoding='utf-8')
          PY
      - name: Validate correction provenance
        run: |
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python -m unittest discover -s tests -v
      - name: Remove preparation workflow and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-headcount-history.yml
          git add assessments/headcount.md data/reassessment-history.psv
          git commit -m 'Record Headcount same-ref correction provenance'
          git push
