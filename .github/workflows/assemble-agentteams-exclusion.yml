name: assemble AgentTeams exclusion

on:
  push:
    branches:
      - exclude-agentteams-159

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exclude-agentteams-159
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Canonically exclude AgentTeams
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/agentteams.md')
          text = assessment.read_text(encoding='utf-8')
          if 'status: proposed' in text:
              text = text.replace('status: proposed', 'status: excluded-no-agentic-vsm', 1)
          elif 'status: excluded-no-agentic-vsm' not in text:
              raise SystemExit('unexpected AgentTeams assessment status')
          if 'assessment_changed_at:' not in text:
              text = text.replace(
                  'assessment_procedure_version: 0.3.5\n',
                  'assessment_procedure_version: 0.3.5\nassessment_changed_at: 2026-09-21\n',
                  1,
              )
          assessment.write_text(text, encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_text = catalog.read_text(encoding='utf-8')
          row = '172|agentteams|AgentTeams|https://github.com/agentscope-ai/AgentTeams|2026-02-21T14:07:55Z|index-addition|88b9f3abbb4aa91d030adfb6d41dbd10d5eda255|2026-09-21'
          if '|agentteams|' not in catalog_text:
              catalog.write_text(catalog_text.rstrip('\n') + '\n' + row + '\n', encoding='utf-8')
          PY

      - name: Regenerate canonical metrics
        shell: bash
        run: |
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Validate assembled exclusion
        shell: bash
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v

      - name: Commit assembled artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/agentteams.md data/catalog.psv METRICS.md data/metrics.json README.md
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'assessment: canonically exclude AgentTeams'
            git push origin HEAD:exclude-agentteams-159
          fi
