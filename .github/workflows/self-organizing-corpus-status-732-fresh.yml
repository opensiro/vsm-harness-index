name: Validate self-organizing corpus snapshot

on:
  push:
    branches:
      - experiment/self-organizing-corpus-status-732-fresh

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/self-organizing-corpus-status-732-fresh
          fetch-depth: 0
      - name: Validate frozen corpus snapshot
        run: python experiments/self-organizing-autonomy/validate_corpus_status.py
      - name: Remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/self-organizing-corpus-status-732-fresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/self-organizing-corpus-status-732-fresh.yml
          git commit -m 'ci: remove self-organizing snapshot validator'
          git push origin HEAD:experiment/self-organizing-corpus-status-732-fresh
