name: temporary Argus review fixer

on:
  push:
    branches:
      - assessment/argus-agent-review-189

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix composite mode label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assessments/argus-agent.md')
          text = p.read_text(encoding='utf-8')
          old = '| Autonomous (`A`) |'
          new = '| Base (`A`) |'
          if old not in text and new not in text:
              raise SystemExit('expected Argus mode row not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/argus-agent.md
          git commit -m 'fix: align Argus ownership mode label'
          git push origin HEAD:${GITHUB_REF_NAME}
