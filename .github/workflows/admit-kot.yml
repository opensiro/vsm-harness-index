name: admit-kot

on:
  push:
    branches:
      - assessment/kot-admit

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit assessment and render canonical views
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          assessment = Path('assessments/kot.md')
          text = assessment.read_text(encoding='utf-8')
          if 'status: proposed' not in text:
              raise SystemExit('KOT assessment is not proposed')
          assessment.write_text(text.replace('status: proposed', 'status: included', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          with catalog.open(encoding='utf-8', newline='') as handle:
              rows = list(csv.DictReader(handle, delimiter='|'))
          if any(row['harness_id'] == 'kot' for row in rows):
              raise SystemExit('catalog row already exists')
          position = len(rows) + 1
          with catalog.open('a', encoding='utf-8', newline='') as handle:
              handle.write(f"{position}|kot|KOT|https://github.com/Loqira-Labs/agentkot|2026-08-20T23:55:35Z|index-addition|7cf18c4b8389a81ea2f15ab70d1b0bb31b44b6ab|2026-09-26\n")

          signatures = Path('data/signatures.psv')
          with signatures.open(encoding='utf-8', newline='') as handle:
              signature_rows = list(csv.DictReader(handle, delimiter='|'))
          if any(row['harness_id'] == 'kot' for row in signature_rows):
              raise SystemExit('signature row already exists')
          signature = "KOT closes autonomous S1 through its model/tool loop, S2 through model-selected worktree isolation and task dependencies for concurrent children, S3 through live roster/steering/resource control, and S3* through direct worker checks plus an independent arbiter verdict loop. Memory and configuration do not close S4 or S5."
          if len(signature) > 360:
              raise SystemExit(f'signature too long: {len(signature)}')
          with signatures.open('a', encoding='utf-8', newline='') as handle:
              handle.write(f"{position}|kot|{signature}\n")
          PY
          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
          rm .github/workflows/admit-kot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'assessment: admit KOT'
          git push origin HEAD
