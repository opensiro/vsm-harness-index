name: admission-materialize-cgast-harness

on:
  push:
    branches:
      - admission/cgast-harness-1015

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical Harness admission sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/harness-cgast.md')
          text = assessment.read_text(encoding='utf-8')
          expected = 'status: proposed\n'
          if text.count(expected) != 1:
              raise SystemExit('expected exactly one proposed Harness status')
          if 'review_ref: b3a9edde79f332f86189da742c5313f25f210b79\n' not in text:
              raise SystemExit('unexpected Harness review ref')
          assessment.write_text(text.replace(expected, 'status: included\n', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          rows = catalog.read_text(encoding='utf-8').splitlines()
          if any('|harness-cgast|' in row or 'https://github.com/cgast/harness' in row for row in rows[1:]):
              raise SystemExit('Harness already present in catalog')
          positions = [int(row.split('|', 1)[0]) for row in rows[1:] if row.strip()]
          next_position = max(positions) + 1
          if next_position != 329:
              raise SystemExit(f'unexpected next catalog position: {next_position}')
          rows.append('329|harness-cgast|Harness|https://github.com/cgast/harness|2026-02-18T09:20:39Z|index-addition|b3a9edde79f332f86189da742c5313f25f210b79|2026-09-20')
          catalog.write_text('\n'.join(rows) + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          sig_rows = signatures.read_text(encoding='utf-8').splitlines()
          if any('|harness-cgast|' in row for row in sig_rows[1:]):
              raise SystemExit('Harness signature already present')
          signature = (
              'Harness closes autonomous S1 through its model-driven tool/observation loop; event hooks, persistence, local human feedback '
              'and host/session controls do not establish S2, whole-system S3 or complementary S3*, while cross-session memory remains '
              'context reuse rather than prospective S4 adaptation and static/selectable soul documents do not close runtime S5 identity/ultimate-policy authority.'
          )
          sig_rows.append(f'329|harness-cgast|{signature}')
          signatures.write_text('\n'.join(sig_rows) + '\n', encoding='utf-8')
          PY
      - name: Render canonical projections
        shell: bash
        run: |
          python scripts/render_tldr.py
          python scripts/render_analytics.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
      - name: Verify generated tree
        shell: bash
        run: |
          python scripts/check_index.py
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_analytics.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/render_full_a.py --check
          python -m unittest discover -s tests -v
      - name: Commit materialized admission and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/admission-materialize-cgast-harness.yml
          git add assessments/harness-cgast.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics METRICS.md data/metrics.json README.md FULL_A.md 2>/dev/null || true
          git diff --cached --check
          git commit -m 'Index: admit Harness at catalog #329'
          git push origin HEAD:admission/cgast-harness-1015
