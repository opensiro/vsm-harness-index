name: fix Utah contract fields

on:
  push:
    branches:
      - assessment/utah-159

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment/utah-159
          fetch-depth: 0
      - name: Add required S4 function-specific fields
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('assessments/utah.md')
          text = path.read_text(encoding='utf-8')
          needle = "- Caveats: memory distillation, self-editing and file writing are not credited alone. The positive mapping rests on the prospective adaptation loop that introduces durable reusable skills/functions into future execution.\n\n## S5 — Policy and identity"
          replacement = "- Caveats: memory distillation, self-editing and file writing are not credited alone. The positive mapping rests on the prospective adaptation loop that introduces durable reusable skills/functions into future execution.\n- External distinction: recurring environmental events, reusable workflow patterns, newly learned techniques and user-taught practices that matter beyond the present conversation.\n- Future / prospective distinction: the selected adaptation is encoded for later conversations, scheduled times or future events rather than only repairing the current turn.\n- Adaptation option generated: create or revise a persistent workspace skill and/or author a new durable Inngest cron/event/multi-step function.\n- Path back into current capability / S3: later prompt construction loads changed skills; the sidecar hot-loads changed functions, whose future execution can act directly or emit `agent.message.received` back into Utah's operational loop.\n\n## S5 — Policy and identity"
          if needle not in text:
              raise SystemExit('expected S4 insertion point not found')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
      - name: Commit fix and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-utah-contract.yml
          git add assessments/utah.md
          git commit -m 'assessment: complete Utah S4 structural fields'
          git push origin HEAD:assessment/utah-159
