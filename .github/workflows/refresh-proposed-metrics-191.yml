name: refresh proposed metrics 191

on:
  push:
    branches:
      - assessment-batch-191-proposed

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate deterministic metric projections
        run: |
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Verify assessment-only projections stay unchanged
        run: |
          python scripts/check_index.py
          python scripts/render_full_a.py --check

      - name: Commit generated metrics and remove helper
        run: |
          rm .github/workflows/refresh-proposed-metrics-191.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add METRICS.md data/metrics.json README.md .github/workflows/refresh-proposed-metrics-191.yml
          git diff --cached --quiet && exit 0
          git commit -m "docs: refresh proposed-assessment metrics"
          git push origin HEAD:assessment-batch-191-proposed
