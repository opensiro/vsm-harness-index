name: tmp-sync-raven-main

on:
  push:
    branches:
      - assess-raven-315

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assess-raven-315
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge current main and normalize Raven admission
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenSiro Automation'
          git config user.email 'founders@opensiro.com'
          git fetch origin main
          git merge --no-edit -X theirs origin/main
          python - <<'PY'
          from pathlib import Path

          catalog = Path('data/catalog.psv')
          rows = catalog.read_text(encoding='utf-8').splitlines()
          rows = [r for r in rows if '|raven|' not in r]
          rows.append('316|raven|Raven|https://github.com/EverMind-AI/Raven|2026-05-21T08:45:07Z|index-addition|e6c0344cb7ce00db25d554e4bb671ec1909a8f9f|2026-09-29')
          catalog.write_text('\n'.join(rows) + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          sigrows = signatures.read_text(encoding='utf-8').splitlines()
          sigrows = [r for r in sigrows if '|raven|' not in r]
          sigrows.append('316|raven|Raven combines autonomous Host Agent operations with constructor-owned stale-edit coordination and machine-read Git audit, autonomous current-control plus parent steering, a source-distribution experimental RSI loop that closes S4 through model-driven Analyst/Curator harness revision and installation, and operator-owned identity/permission policy at S5.')
          signatures.write_text('\n'.join(sigrows) + '\n', encoding='utf-8')
          PY
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
          python scripts/check_index.py
          python scripts/validate_tldr.py
          python -m unittest discover -s tests -v
          git diff --check
      - name: Commit synchronized Raven admission
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-sync-raven-main.yml
          git add -A
          git commit -m 'index: move Raven admission to catalog #316'
          git push origin HEAD:assess-raven-315
