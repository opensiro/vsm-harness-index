name: stage redteam review metrics
on:
  push:
    branches: [assessment/redteam-c2bedf14]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render review metrics
        shell: bash
        run: |
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add METRICS.md data/metrics.json README.md
          if ! git diff --cached --quiet; then
            git commit -m 'assessment: render redteam proposed metrics'
            git push
          fi
