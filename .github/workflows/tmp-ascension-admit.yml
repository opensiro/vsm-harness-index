name: tmp ascension admission assembler

on:
  push:
    branches:
      - index/ascension-admission-287

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: index/ascension-admission-287
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble admission
        run: python .github/tmp-ascension-admit.py
      - name: Remove temporary assembler
        run: rm .github/tmp-ascension-admit.py .github/workflows/tmp-ascension-admit.yml
      - name: Commit canonical admission
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "index: admit Ascension"
          git push origin HEAD:index/ascension-admission-287
