name: assemble ECC review

on:
  push:
    branches:
      - assessment-ecc-standalone

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment-ecc-standalone
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate review-layer metrics
        run: |
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Validate review state
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v

      - name: Commit review projections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add METRICS.md data/metrics.json README.md
          git commit -m 'metrics: count proposed ECC review'
          git push origin HEAD:assessment-ecc-standalone

      - name: Remove temporary assembler
        run: |
          rm .github/workflows/assemble-ecc-review.yml
          git add .github/workflows/assemble-ecc-review.yml
          git commit -m 'chore: remove ECC review assembler'
          git push origin HEAD:assessment-ecc-standalone
