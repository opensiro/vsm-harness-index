name: admit-agentharness-oklahomawhore

on:
  push:
    branches:
      - assessment/agentharness-oklahomawhore-admit

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit assessment and render canonical views
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          assessment = Path('assessments/agentharness-oklahomawhore.md')
          text = assessment.read_text(encoding='utf-8')
          if 'status: proposed' not in text:
              raise SystemExit('AgentHarness assessment is not proposed')
          assessment.write_text(text.replace('status: proposed', 'status: included', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          with catalog.open(encoding='utf-8', newline='') as handle:
              rows = list(csv.DictReader(handle, delimiter='|'))
          if any(row['harness_id'] == 'agentharness-oklahomawhore' for row in rows):
              raise SystemExit('catalog row already exists')
          position = len(rows) + 1
          with catalog.open('a', encoding='utf-8', newline='') as handle:
              handle.write(f"{position}|agentharness-oklahomawhore|AgentHarness|https://github.com/Oklahomawhore/AgentHarness|2026-09-23T08:52:11Z|index-addition|6bedcf45fad75e21df5e5cac827a898ef5c7d228|2026-09-26\n")

          signatures = Path('data/signatures.psv')
          with signatures.open(encoding='utf-8', newline='') as handle:
              signature_rows = list(csv.DictReader(handle, delimiter='|'))
          if any(row['harness_id'] == 'agentharness-oklahomawhore' for row in signature_rows):
              raise SystemExit('signature row already exists')
          signature = "AgentHarness closes autonomous S1 through its model/tool loop, S2 through parent-model independence decisions over concurrent shared-workspace children, and S3 through child creation, descendant-state observation, steering and interruption. In-band child/Task reporting does not close S3*; no prospective S4 or identity-policy S5 closure is established."
          with signatures.open('a', encoding='utf-8', newline='') as handle:
              handle.write(f"{position}|agentharness-oklahomawhore|{signature}\n")
          PY
          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py
          rm .github/workflows/admit-agentharness-oklahomawhore.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'assessment: admit AgentHarness'
          git push origin HEAD
