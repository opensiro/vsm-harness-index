name: temporary AgentYou admission renderer

on:
  push:
    branches:
      - admit/agentyou-20260922

permissions:
  contents: write

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Promote AgentYou sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/agentyou.md')
          text = assessment.read_text(encoding='utf-8')
          old = 'status: proposed\n'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one proposed AgentYou status')
          assessment.write_text(text.replace(old, 'status: included\n', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          ctext = catalog.read_text(encoding='utf-8').rstrip('\n')
          if '|agentyou|' in ctext:
              raise SystemExit('AgentYou already exists in catalog')
          ctext += '\n189|agentyou|AgentYou|https://github.com/shreyasic77/agentyou|2026-06-07T16:17:05Z|index-addition|a8289d95608aa974f2a51aba68af5374bfa71d01|2026-09-22\n'
          catalog.write_text(ctext, encoding='utf-8')

          signatures = Path('data/signatures.psv')
          stext = signatures.read_text(encoding='utf-8').rstrip('\n')
          if '|agentyou|' in stext:
              raise SystemExit('AgentYou already exists in signatures')
          signature = ('AgentYou provides autonomous personal-assistant S1 over routed specialist reasoning; routing, parallel fan-out and shared state do not establish S2/S3, no independent S3* path is supplied, and its longitudinal routine-adaptation engine exposes an S4 constructor path because recommendations are not automatically applied to persistent routine state.')
          stext += f'\n189|agentyou|{signature}\n'
          signatures.write_text(stext, encoding='utf-8')
          PY
      - name: Regenerate deterministic views
        shell: bash
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
      - name: Validate generated state
        shell: bash
        run: |
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/check_index.py
          python -m unittest discover -s tests -v
      - name: Commit admission
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/agentyou.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md FULL_A.md METRICS.md data/metrics.json README.md
          git commit -m 'admit: add AgentYou from reviewed standalone assessment'
          git push origin HEAD:admit/agentyou-20260922
