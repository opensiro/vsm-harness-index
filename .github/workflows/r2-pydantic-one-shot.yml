name: R2 Pydantic AI one-shot updater

on:
  push:
    branches:
      - r2-pydantic-ai-deep-104

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record Pydantic AI R2 outcome
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old_ref = '5cbacfc8f86d653baa0ca2e31970cbf4f0fcec95'
          checked_ref = '532fb9b98092664c0d59a825de5d986783cae036'
          checked_at = '2026-09-17'

          assessment = Path('assessments/pydantic-ai.md').read_text(encoding='utf-8')
          required = [
              f'review_ref: {old_ref}',
              'profile_version: 0.2.1',
              'assessment_procedure_version: 0.3.1',
              f'last_checked_ref: {checked_ref}',
              f'last_checked_at: {checked_at}',
              'last_reassessment_round: R2',
              'autonomy_s1: A',
              'autonomy_s2: —',
              'autonomy_s3: —',
              'autonomy_s3_star: —',
              'autonomy_s4: —',
              'autonomy_s5: —',
          ]
          for item in required:
              assert item in assessment, f'missing assessment field: {item}'

          history_path = Path('data/reassessment-history.psv')
          history = history_path.read_text(encoding='utf-8')
          assert 'R2|pydantic-ai|' not in history, 'Pydantic AI already recorded in R2 history'
          evidence = ' ; '.join([
              f'https://github.com/pydantic/pydantic-ai/compare/{old_ref}...{checked_ref}',
              f'https://github.com/pydantic/pydantic-ai/blob/{checked_ref}/docs/multi-agent-applications.md',
              f'https://github.com/pydantic/pydantic-ai/blob/{checked_ref}/pydantic_ai_slim/pydantic_ai/_enqueue.py',
              f'https://github.com/pydantic/pydantic-ai/blob/{checked_ref}/docs/extensibility.md',
          ])
          history_row = '|'.join([
              'R2', 'pydantic-ai', old_ref, checked_ref, old_ref, checked_at,
              '0.2.1', '0.3.1', 'no-material-change', '—', evidence,
          ])
          history_path.write_text(history.rstrip('\n') + '\n' + history_row + '\n', encoding='utf-8')

          round_path = Path('reassessments/R2-2026-09-16.md')
          round_text = round_path.read_text(encoding='utf-8')
          assert '| `pydantic-ai` |' not in round_text, 'Pydantic AI already recorded in R2 round'
          round_row = (
              f'| `pydantic-ai` | `{old_ref}` | `{checked_ref}` | {checked_at} | 0.2.1 | 0.3.1 | '
              f'no-material-change | — | '
              f'[upstream delta](https://github.com/pydantic/pydantic-ai/compare/{old_ref}...{checked_ref}), '
              f'[multi-agent boundary](https://github.com/pydantic/pydantic-ai/blob/{checked_ref}/docs/multi-agent-applications.md), '
              f'[single-run enqueue](https://github.com/pydantic/pydantic-ai/blob/{checked_ref}/pydantic_ai_slim/pydantic_ai/_enqueue.py), '
              f'[separate Harness boundary](https://github.com/pydantic/pydantic-ai/blob/{checked_ref}/docs/extensibility.md) |'
          )
          marker = '\n## Completion\n'
          assert round_text.count(marker) == 1, 'unexpected R2 completion marker'
          round_path.write_text(round_text.replace(marker, '\n' + round_row + '\n' + marker, 1), encoding='utf-8')
          PY
          python scripts/render_tldr.py --check
          python scripts/check_index.py
          python scripts/check_generation_provenance.py --base-ref origin/main
          git diff --check
      - name: Commit canonical result and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r2-pydantic-one-shot.yml
          git add assessments/pydantic-ai.md data/reassessment-history.psv reassessments/R2-2026-09-16.md
          git commit -m "R2: record Pydantic AI no-material-change"
          git push origin HEAD:r2-pydantic-ai-deep-104
