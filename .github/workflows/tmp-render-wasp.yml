name: temporary WASP admission renderer

on:
  push:
    branches:
      - admit-wasp-234

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply canonical admission inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path("assessments/wasp.md")
          text = assessment.read_text(encoding="utf-8")
          old = "status: proposed\n"
          new = "status: included\n"
          if old in text:
              assessment.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("WASP assessment has neither proposed nor included status")

          catalog = Path("data/catalog.psv")
          catalog_text = catalog.read_text(encoding="utf-8")
          catalog_row = "234|wasp|WASP|https://github.com/agentwasp/agentwasp|2026-03-11T13:20:53Z|index-addition|8282a76f57aa4d0b7f2071321f064b26be942024|2026-09-24"
          if "|wasp|" not in catalog_text:
              catalog.write_text(catalog_text.rstrip("\n") + "\n" + catalog_row + "\n", encoding="utf-8")

          signatures = Path("data/signatures.psv")
          signatures_text = signatures.read_text(encoding="utf-8")
          signature_row = "234|wasp|WASP closes autonomous S1 through its model/skill/goal loop and S4 through correction-driven behavioral learning; shared multi-agent throttles and complementary integrity audit remain constructor-owned S2/S3*, while current-control and identity each expose constructor plus operator-governed parent modes as S3=C(P) and S5=C(P)."
          if "|wasp|" not in signatures_text:
              signatures.write_text(signatures_text.rstrip("\n") + "\n" + signature_row + "\n", encoding="utf-8")
          PY

      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/render_full_a.py

      - name: Validate rendered state
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/render_full_a.py --check
          python -m unittest discover -s tests -v

      - name: Commit rendered admission
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No render changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assessments/wasp.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md METRICS.md data/metrics.json README.md
          git commit -m "admit: render WASP canonical inclusion"
          git push origin HEAD:${GITHUB_REF_NAME}
