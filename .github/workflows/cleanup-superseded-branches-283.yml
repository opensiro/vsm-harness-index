name: Cleanup superseded branches #283

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-superseded-branches-283.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-audited-refs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only refs approved by issue #283
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          targets = [
              "assessment-agent-laboratory-191",
              "assessment-ai-scientist-191",
              "assessment-ai-scientist-v2-191",
              "assessment-cais-191",
              "assessment-data-to-paper-191",
              "assessment-kadath-191",
              "assessment-omniscientist-191",
              "assessment-openags-191",
              "assessment-veritas-191",
              "assessment-xcientist-191",
              "admit-trueforge-140-check",
              "exclude-tinyagi-159",
              "admit-dexto-159",
              "reassess/harness-evolver-s3star-294",
              "tmp/harness-evolver-correction-source",
              "assessment/qwenpaw-8af8b6e",
              "assessment/qwenpaw-8af8b6e-v2",
              "assessment-masters-ai-harness-pinned",
              "assessment-pi-harness-pinned",
              "assessment-unreal-agent-pinned",
              "experiment/megaagent-s-packet-306",
              "experiment/pawbench-adapter-boundary-413",
              "experiment/pawbench-compat-correction-413",
              "experiment/s1-capability-batch-02-design-351",
              "experiment/system-benchmark-links-371",
              "noop-test",
              "experiment/claw-swe-s1-observations-417",
              "experiment/frontierharness-observations-421",
              "experiment/s3-primary-search-427",
              "research-harness-candidates-2026-09-20",
          ]

          protected = {"main", "experiment/s1-escalation-shift-311"}
          assert len(targets) == 30
          assert len(set(targets)) == 30
          assert not protected.intersection(targets)

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "opensiro-branch-cleanup-283",
          }

          deleted = []
          already_absent = []

          for branch in targets:
              encoded = urllib.parse.quote(branch, safe="/")
              url = f"https://api.github.com/repos/{repo}/git/refs/heads/{encoded}"
              request = urllib.request.Request(url, headers=headers, method="DELETE")
              try:
                  with urllib.request.urlopen(request) as response:
                      if response.status != 204:
                          raise RuntimeError(f"unexpected status {response.status} deleting {branch}")
                  deleted.append(branch)
                  print(f"deleted: {branch}")
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      already_absent.append(branch)
                      print(f"already absent: {branch}")
                      continue
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"failed deleting {branch}: HTTP {exc.code}: {detail}") from exc

          print(json.dumps({"deleted": deleted, "already_absent": already_absent}, indent=2))
          PY
