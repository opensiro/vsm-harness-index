name: assemble AutoAgents admission

on:
  push:
    branches:
      - admit-autoagents-140

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admit-autoagents-140
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Promote AutoAgents and append canonical provenance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/autoagents.md')
          text = assessment.read_text(encoding='utf-8')
          needle = 'assessment_procedure_version: 0.3.5\nstatus: proposed\n'
          replacement = 'assessment_procedure_version: 0.3.5\nassessment_changed_at: 2026-09-21\nstatus: included\n'
          if needle not in text:
              raise SystemExit('AutoAgents assessment is not in expected proposed state')
          assessment.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_text = catalog.read_text(encoding='utf-8')
          if '|autoagents|' in catalog_text:
              raise SystemExit('AutoAgents already present in catalog')
          rows = [line for line in catalog_text.splitlines() if line.strip()]
          if not rows[-1].startswith('166|'):
              raise SystemExit(f'Expected catalog position 166 before admission, got: {rows[-1]}')
          catalog_row = '167|autoagents|AutoAgents|https://github.com/OWD-AI/AutoAgents|2023-08-21T12:19:36Z|index-addition|223ad991988d752c446d25a0381e647f6e71c92c|2026-09-21'
          catalog.write_text(catalog_text.rstrip('\n') + '\n' + catalog_row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          sig_text = signatures.read_text(encoding='utf-8')
          if '|autoagents|' in sig_text:
              raise SystemExit('AutoAgents already present in signatures')
          signature = ('167|autoagents|AutoAgents autonomously executes generated expert actions inside a first-party Group model/tool loop; its generated personas do not establish S2, the Manager performs pre-operation design rather than live S3 control, advertised Observer code is not wired into the standard runtime for S3*, per-task role generation is not prospective S4 adaptation, and task/configuration/budget constraints do not close S5.')
          signatures.write_text(sig_text.rstrip('\n') + '\n' + signature + '\n', encoding='utf-8')
          PY

      - name: Regenerate canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Validate assembled admission
        run: |
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v

      - name: Commit canonical admission
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/autoagents.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md FULL_A.md METRICS.md data/metrics.json README.md
          git commit -m 'admit: assemble AutoAgents canonical artifacts'
          git push origin HEAD:admit-autoagents-140

      - name: Remove temporary assembler
        run: |
          rm .github/workflows/assemble-autoagents-admission.yml
          git add .github/workflows/assemble-autoagents-admission.yml
          git commit -m 'chore: remove AutoAgents admission assembler'
          git push origin HEAD:admit-autoagents-140
