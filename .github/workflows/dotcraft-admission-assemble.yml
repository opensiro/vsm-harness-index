name: assemble-dotcraft-admission

on:
  push:
    branches:
      - index/dotcraft-admission-293
    paths:
      - .github/workflows/dotcraft-admission-assemble.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: index/dotcraft-admission-293
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply canonical admission inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/dotcraft.md')
          text = assessment.read_text(encoding='utf-8')
          old = 'status: proposed'
          new = 'status: included'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one {old!r}, got {text.count(old)}')
          assessment.write_text(text.replace(old, new, 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_text = catalog.read_text(encoding='utf-8')
          row = '293|dotcraft|DotCraft|https://github.com/DotHarness/dotcraft|2026-05-28T12:24:06Z|index-addition|a08c8b35497f6ba9148f6ede80839835dcc8812a|2026-09-28'
          if '|dotcraft|' in catalog_text:
              raise SystemExit('dotcraft already present in catalog')
          expected_tail = '292|waku-agent|Waku Agent|https://github.com/ShenSeanChen/waku-agent|2026-07-10T12:20:50Z|index-addition|b8310c08029732475b68076df02a6cc44e3e41e7|2026-09-28'
          if not catalog_text.rstrip().endswith(expected_tail):
              raise SystemExit('catalog tail changed; fail closed')
          catalog.write_text(catalog_text.rstrip() + '\n' + row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signatures_text = signatures.read_text(encoding='utf-8')
          sig = ('293|dotcraft|DotCraft closes autonomous S1 through model-driven workspace agents, '
                 'constructor-owned S2 through bounded subagent concurrency against provider rate-limit interference, '
                 'constructor-owned S3 through Oratorio deployment-wide run scheduling and recovery, autonomous S3* '
                 'through separate read-only review-analysis runs over pinned PR/MR heads, and parent-owned S5 through '
                 'saved Agent Profiles returned to later work; Dreams and internal-history adaptation do not establish S4.')
          if '|dotcraft|' in signatures_text:
              raise SystemExit('dotcraft already present in signatures')
          signatures.write_text(signatures_text.rstrip() + '\n' + sig + '\n', encoding='utf-8')
          PY
      - name: Regenerate canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python -m unittest discover -s tests -v
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/dotcraft-admission-assemble.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "index: admit DotCraft"
          git push origin HEAD:index/dotcraft-admission-293
