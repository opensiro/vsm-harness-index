name: R2 Kilo one-shot updater

on:
  push:
    branches:
      - r2-kilo-code-deep-102

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[r2-kilo-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Kilo reassessment and regenerate projections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old_ref = "c36e22634860e06e0aa63234fae37bbd83d3b182"
          new_ref = "a1d4d665c8dfcbb1fc70bc1e49ca4e8ca9f16a51"
          checked_at = "2026-09-17"

          assessment = f'''---
          harness_id: kilo-code
          project_name: Kilo Code
          repository: https://github.com/Kilo-Org/kilocode
          review_ref: {new_ref}
          reviewed_at: {checked_at}
          profile_version: 0.2.1
          assessment_procedure_version: 0.3.1
          last_checked_ref: {new_ref}
          last_checked_at: {checked_at}
          assessment_changed_at: {checked_at}
          last_reassessment_round: R2
          status: included
          autonomy_s1: A
          autonomy_s2: A
          autonomy_s3: C(P)
          autonomy_s3_star: C
          autonomy_s4: —
          autonomy_s5: —
          ---

          # Kilo Code

          ## Review boundary
          Deep reassessment of Kilo Code at pinned upstream `main` `{new_ref}` across the standard coding runtime, default-on background task subagents and Kilo Swarm, the VS Code Agent Manager control surface, and the first-party `/review` workflow. Component names such as manager, swarm, and reviewer are not mapped by vocabulary; each positive state below is based on the organizational function, decisive right, owner, supporting machinery, and closure at the declared boundary.

          ## Repository architecture
          Kilo Code provides autonomous coding agents with terminal, repository, browser/MCP, memory and other tools. The `task` tool can create foreground or background child sessions; background subagents are enabled by default. Kilo Swarm is also enabled by default and gives the main session and its task descendants a persistent shared board for material coordination messages.

          In the VS Code distribution, Agent Manager runs multiple independent top-level sessions in local workspaces or isolated worktrees. A model-visible `agent_manager` tool can inspect the whole managed-session overview and, subject to granular permissions, start sessions, prompt existing sessions, stop them, move worktrees between sections, and answer questions that block a session. The same first-party subsystem exposes a human Agent Manager panel for supervising current sessions/worktrees and applying lifecycle changes through the embedded runtime.

          Separately, `/review` creates a review-only phase over current diffs/branches/commits/PRs. Medium, large, or explicitly deep reviews spawn dedicated research-only review subagents across selected audit tracks; the main reviewer filters those findings against primary diff/context evidence and returns a structured recommendation before any fix may be applied.

          ## Primary evidence
          - [`packages/opencode/src/effect/runtime-flags.ts`](https://github.com/Kilo-Org/kilocode/blob/{new_ref}/packages/opencode/src/effect/runtime-flags.ts): background subagents and the shared agent board both use default-true runtime flags with opt-out switches.
          - [`packages/opencode/src/tool/task.ts`](https://github.com/Kilo-Org/kilocode/blob/{new_ref}/packages/opencode/src/tool/task.ts): background children run concurrently; parent guidance forbids duplicating their work or touching the same files/topics and directs the parent toward non-overlapping work.
          - [`packages/opencode/src/kilocode/tool/board.ts`](https://github.com/Kilo-Org/kilocode/blob/{new_ref}/packages/opencode/src/kilocode/tool/board.ts) and [`packages/opencode/src/kilocode/board/context.ts`](https://github.com/Kilo-Org/kilocode/blob/{new_ref}/packages/opencode/src/kilocode/board/context.ts): agents exchange INFO/ASK/RESULT/HOLD/VETO coordination facts, surface blockers affecting dependent work/integration, and are instructed to read relevant updates before continuing affected decisions or integration.
          - [`packages/opencode/src/kilocode/tool/agent-manager.txt`](https://github.com/Kilo-Org/kilocode/blob/{new_ref}/packages/opencode/src/kilocode/tool/agent-manager.txt): exposes whole Agent Manager overview plus start/prompt/stop/move/answer operations over managed top-level sessions.
          - [`packages/opencode/src/kilocode/permission/agent-manager.ts`](https://github.com/Kilo-Org/kilocode/blob/{new_ref}/packages/opencode/src/kilocode/permission/agent-manager.ts): targeted side-effect capabilities require their own authority; exact capability rules can allow them while broad legacy approval is hardened back to ask.
          - [`packages/kilo-vscode/src/agent-manager/provider-lifecycle.ts`](https://github.com/Kilo-Org/kilocode/blob/{new_ref}/packages/kilo-vscode/src/agent-manager/provider-lifecycle.ts): the human-facing Agent Manager lifecycle creates sessions/worktrees and can abort session processes, detach/delete a worktree, re-home its conversations, and publish the changed manager state.
          - [`packages/opencode/src/kilocode/review/review.txt`](https://github.com/Kilo-Org/kilocode/blob/{new_ref}/packages/opencode/src/kilocode/review/review.txt): defines complementary code review from primary diff/artifact evidence, requires independent research-only subagents for sufficiently large/deep reviews, filters candidate findings, and returns APPROVE / APPROVE WITH SUGGESTIONS / NEEDS CHANGES before any separately authorized fix path.

          ## Operational model
          A normal Kilo coding session is an operational S1. At the task-team recursion, independently executing background child sessions are additional bounded S1 work cells. Their shared repository creates a structurally explicit interference mode: concurrent work can overlap on the same files/topics or invalidate dependent integration assumptions. Kilo's default-on Swarm channel lets the agents themselves exchange blockers, holds, results, questions and corrective updates, while runtime notices transport the facts into later agent decisions.

          At the broader VS Code Agent Manager boundary, several independent top-level sessions can execute concurrently. The Agent Manager overview supplies current whole-set state and its control API can change session commitments/lifecycle. The agent-side path is a constructor because decisive side-effect authority must still be explicitly granted/composed. The human panel is a distinct parent-governed mode over the same current-control function: the operator sees the managed set, creates or removes work cells and the runtime applies those decisions to subsequent operation.

          ## S1 — Operations
          `A`: coding agents autonomously inspect repository state, select tools/actions, modify artifacts, run commands/checks and react to execution feedback toward bounded outcomes. Background child sessions similarly own their delegated operational outcomes. Confidence: high.

          ## S2 — Coordination
          `A`: the default-on background-task + Kilo Swarm path establishes a concrete inter-S1 coordination loop rather than generic messaging. The disturbance is concurrent overlap and dependency/integration conflict among independently executing task cells. Agents are explicitly told not to duplicate the same files/topics, can post blockers/HOLD/VETO/results/questions to affected peers, and must read relevant pending updates before dependent decisions or integration. The decisive mutual-adjustment judgment therefore belongs to the agents; the board store, activity notices and availability metadata transport/persist that judgment without owning it. Feedback closes when a participant reads the update and changes what work it continues, defers, or integrates. Confidence: high.

          ## S3 — Inside-and-now control
          `C(P)`: Agent Manager establishes a first-party whole-system current-control path over independent top-level sessions. The model-visible tool can inspect the complete current overview and can start, prompt, stop, move and unblock specific sessions, which are real commitment/lifecycle decisions rather than mere child delegation. However, sensitive side-effect capabilities are intentionally permission-scoped and the documented top-level fan-out path is user-requested, so stock autonomous ownership is not closed without composing explicit authority; this is `C`, not `A`.

          A distinct parent-governed mode is also closed by the first-party Agent Manager panel. The human operator supervises the managed session/worktree set, starts work cells and can remove worktrees/sessions; provider lifecycle code aborts associated execution, updates worktree/session state and returns the change into the running manager. This is whole-system current-control closure, not a generic approval hook, so the constructor state carries `(P)`. Confidence: high.

          ## S3* — Complementary audit
          `C`: `/review` supplies a material complementary-audit path over primary operational artifacts. For medium/large/deep reviews it creates dedicated research-only review subagents, separates the initial audit phase from editing, requires evidence on exact changed lines, filters weak/duplicate findings, and produces a structured verdict that can lead to a separately authorized corrective path. This is materially different access from ordinary production self-checking. The audit is invoked/configured as a review workflow and fixes still require a separate user decision, so the first-party path is composable rather than an out-of-box autonomous closed audit owner. Confidence: medium-high.

          ## S4 — Outside-and-then intelligence
          `—`: memory, planning, model choice, schedules, web access and review concern current task execution or configured capability. No distinct first-party function was established that models external/future change, develops adaptation options and closes them back into present organizational capability. Confidence: high.

          ## S5 — Policy and identity
          `—`: permissions, modes, provider/model settings, user approvals and Agent Manager policy constrain operation but remain operator/developer-authored. No runtime identity- or ultimate-policy issue/decision loop with legitimate S5 closure was established. Confidence: high.

          ## Recursion, variety, escalation
          Task descendants form a bounded operational team with default-on S2 coordination, but spawning alone is not recursive viability. Agent Manager adds a higher-level set of independent top-level work cells and exposes current-control rights over that set; the assessment does not infer full recursive viability from worktrees or sessions. HOLD/VETO board messages are advisory coordination signals rather than command authority, while permission/question blockers explicitly escalate actions that exceed an agent's granted authority.

          ## R2 deep-review conclusion
          Since the accepted `{old_ref}` boundary, Kilo Code has added organizationally material first-party multi-agent surfaces. The canonical vector changes from `A — — — — —` to `A A C(P) C — —`: S2 is now closed by default-on agent-owned overlap/blocker coordination; S3 is exposed as an agent-side constructor with a distinct human parent-control mode; and `/review` exposes a complementary-audit constructor path. S4 and S5 remain unestablished.
          '''
          assessment = "\n".join(line[10:] if line.startswith("          ") else line for line in assessment.splitlines()) + "\n"
          Path("assessments/kilo-code.md").write_text(assessment, encoding="utf-8")

          catalog_path = Path("data/catalog.psv")
          catalog = catalog_path.read_text(encoding="utf-8")
          old_catalog = f"49|kilo-code|Kilo Code|https://github.com/Kilo-Org/kilocode|2025-03-10T15:34:26Z|adapted-source|{old_ref}|2026-09-13"
          new_catalog = f"49|kilo-code|Kilo Code|https://github.com/Kilo-Org/kilocode|2025-03-10T15:34:26Z|adapted-source|{new_ref}|{checked_at}"
          assert catalog.count(old_catalog) == 1, "unexpected Kilo catalog row"
          catalog_path.write_text(catalog.replace(old_catalog, new_catalog), encoding="utf-8")

          signature_path = Path("data/signatures.psv")
          signatures = signature_path.read_text(encoding="utf-8")
          old_signature = "49|kilo-code|Fully autonomous CLI execution combines coding, terminal, browser, MCP, and self-checking modes without turning mode selection or review into separate VSM functions."
          new_signature = "49|kilo-code|Default-on background subagents and Kilo Swarm close agent-owned S2 over overlap and blocker coordination; Agent Manager exposes composable S3 with a distinct human parent-control mode, while /review exposes composable S3* through dedicated review subagents."
          assert signatures.count(old_signature) == 1, "unexpected Kilo signature row"
          signature_path.write_text(signatures.replace(old_signature, new_signature), encoding="utf-8")

          history_path = Path("data/reassessment-history.psv")
          history = history_path.read_text(encoding="utf-8")
          assert "R2|kilo-code|" not in history, "Kilo R2 history already exists"
          history_row = (
              f"R2|kilo-code|{old_ref}|{new_ref}|{new_ref}|{checked_at}|0.2.1|0.3.1|reassessed-changed|S2, S3, S3*|"
              f"https://github.com/Kilo-Org/kilocode/compare/{old_ref}...{new_ref} ; "
              f"https://github.com/Kilo-Org/kilocode/blob/{new_ref}/packages/opencode/src/kilocode/tool/board.ts ; "
              f"https://github.com/Kilo-Org/kilocode/blob/{new_ref}/packages/opencode/src/kilocode/tool/agent-manager.txt ; "
              f"https://github.com/Kilo-Org/kilocode/blob/{new_ref}/packages/opencode/src/kilocode/review/review.txt"
          )
          history_path.write_text(history.rstrip("\n") + "\n" + history_row + "\n", encoding="utf-8")

          round_path = Path("reassessments/R2-2026-09-16.md")
          round_text = round_path.read_text(encoding="utf-8")
          assert "| `kilo-code` |" not in round_text, "Kilo R2 round row already exists"
          round_row = (
              f"| `kilo-code` | `{old_ref}` | `{new_ref}` | {checked_at} | 0.2.1 | 0.3.1 | reassessed-changed | S2, S3, S3* | "
              f"[upstream delta](https://github.com/Kilo-Org/kilocode/compare/{old_ref}...{new_ref}), "
              f"[Swarm coordination](https://github.com/Kilo-Org/kilocode/blob/{new_ref}/packages/opencode/src/kilocode/tool/board.ts), "
              f"[Agent Manager control](https://github.com/Kilo-Org/kilocode/blob/{new_ref}/packages/opencode/src/kilocode/tool/agent-manager.txt), "
              f"[/review audit](https://github.com/Kilo-Org/kilocode/blob/{new_ref}/packages/opencode/src/kilocode/review/review.txt) |"
          )
          round_path.write_text(round_text.rstrip("\n") + "\n" + round_row + "\n", encoding="utf-8")
          PY
          python scripts/render_tldr.py
          python scripts/check_index.py
          python scripts/check_generation_provenance.py --base-ref origin/main
      - name: Commit generated result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assessments/kilo-code.md data/catalog.psv data/signatures.psv data/reassessment-history.psv reassessments/R2-2026-09-16.md TLDR.md RANKINGS.md
          git diff --cached --check
          git commit -m "[r2-kilo-autofix] Reassess Kilo Code under Methodology 0.3.1"
          git push origin HEAD:r2-kilo-code-deep-102
