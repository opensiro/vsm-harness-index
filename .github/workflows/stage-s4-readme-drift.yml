name: stage S4 README registry drift
on:
  push:
    branches:
      - docs/s4-canonical-registry-drift
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix stale canonical registry note
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('experiments/functional-capability-depth/s4-system-benchmarks/README.md')
          text = path.read_text(encoding='utf-8')
          old = '`canonical_observations.json` — direct canonical native/adapter-preserved observations; currently `[]`;'
          new = '`canonical_observations.json` — direct canonical native/adapter-preserved observations; currently 2 (`a-evolve`, `kadath`);'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('unexpected S4 source-of-truth note')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/functional-capability-depth/s4-system-benchmarks/README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: sync S4 canonical observation count'
          git push
