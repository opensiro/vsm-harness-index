name: proposal-metrics-carbon
on:
  push:
    branches:
      - assessment/carbon-review-970
permissions:
  contents: write
jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment/carbon-review-970
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record and verify base
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          BASE=$(git rev-parse origin/main)
          echo "$BASE" > /tmp/base_sha
          test "$(git merge-base HEAD origin/main)" = "$BASE"
      - name: Verify proposal scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assessments/carbon.md')
          t=p.read_text(encoding='utf-8')
          required=[
            'harness_id: carbon',
            'repository: https://github.com/thecarbonlayer/carbon',
            'review_ref: 8fafacd56f10a6eeb6f3b095fa6af3dfb5681aaf',
            'status: proposed',
            'autonomy_s1: A',
            'autonomy_s2: —',
            'autonomy_s3: —',
            'autonomy_s3_star: C',
            'autonomy_s4: —',
            'autonomy_s5: —',
          ]
          missing=[x for x in required if x not in t]
          if missing: raise SystemExit(f'proposal precondition failed: {missing}')
          PY
      - name: Render proposal metrics
        run: |
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
      - name: Verify repository
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_analytics.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v
      - name: Verify main did not move
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(cat /tmp/base_sha)"
      - name: Commit proposal metrics
        run: |
          git rm .github/workflows/proposal-metrics-carbon.yml
          git add METRICS.md data/metrics.json README.md
          git commit -m "Metrics: render proposed Carbon count"
          git push origin HEAD:assessment/carbon-review-970
