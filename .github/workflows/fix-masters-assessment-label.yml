name: fix-masters-assessment-label

on:
  push:
    branches:
      - assessment-masters-ai-harness-pinned

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment-masters-ai-harness-pinned
          fetch-depth: 0
      - name: Fix exact S5 contract label and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^- Return-to-operation:/- Return-to-operation path:/' assessments/masters-of-ai-harness.md
          git rm .github/workflows/fix-masters-assessment-label.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/masters-of-ai-harness.md
          git commit -m 'fix: align Masters S5 return label with methodology contract'
          git push origin HEAD:assessment-masters-ai-harness-pinned
