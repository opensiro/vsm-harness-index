name: Prepare Easy Agent admission
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  prepare:
    if: github.head_ref == 'admission/easy-agent-975'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply canonical admission and render projections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("assessments/easy-agent.md"); t=p.read_text(); assert "status: proposed" in t; p.write_text(t.replace("status: proposed","status: included",1))
          p=Path("data/catalog.psv"); t=p.read_text().rstrip("\n"); assert "|easy-agent|" not in t
          p.write_text(t+"\n383|easy-agent|Easy Agent|https://github.com/vietor/easy-agent|2026-06-24T14:35:41Z|index-addition|f13207671ad142fb89d1c36d413f7e42d60b18a6|2026-09-29\n")
          p=Path("data/signatures.psv"); t=p.read_text().rstrip("\n"); assert "|easy-agent|" not in t
          p.write_text(t+"\n383|easy-agent|Easy Agent closes agent-owned S1 and agent-owned S2 through parent-selected disjoint scopes for parallel writable subagents; its todo/budget/stall machinery does not establish whole-system S3, parent self-verification lacks S3* independence, and persistence/skills/configuration do not establish S4 or S5.\n")
          PY
          python scripts/render_tldr.py
          python scripts/render_analytics.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_analytics.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v
          rm .github/workflows/prepare-easy-agent-admission.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Easy Agent admission"
          git push origin HEAD:admission/easy-agent-975
