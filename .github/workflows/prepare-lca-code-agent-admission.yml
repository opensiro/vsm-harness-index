name: Prepare LCA Code Agent admission

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'admission/lca-code-agent-975'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply canonical admission and render projections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path("assessments/lca-code-agent.md")
          t=p.read_text(encoding="utf-8")
          assert "status: proposed" in t
          p.write_text(t.replace("status: proposed","status: included",1),encoding="utf-8")

          p=Path("data/catalog.psv")
          t=p.read_text(encoding="utf-8").rstrip("\n")
          assert "|lca-code-agent|" not in t
          p.write_text(t+"\n385|lca-code-agent|LCA Code Agent|https://github.com/Kandog/lca-code-agent|2026-09-17T22:42:25Z|index-addition|3049426ad46a0a4eab2ed896a8f87160f76689e4|2026-09-29\n",encoding="utf-8")

          p=Path("data/signatures.psv")
          t=p.read_text(encoding="utf-8").rstrip("\n")
          assert "|lca-code-agent|" not in t
          p.write_text(t+"\n385|lca-code-agent|LCA Code Agent closes autonomous S1 through its first-party VS Code model/tool loop and retains project-recursion S5 under parent governance through project-wide AGENTS.md standing instructions automatically reloaded into later system prompts; its single-agent planning, approval, self-validation, sessions, skills and MCP mechanisms do not establish S2, S3, independent S3*, or prospective S4.\n",encoding="utf-8")
          PY

          python scripts/render_tldr.py
          python scripts/render_analytics.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_analytics.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v

          rm .github/workflows/prepare-lca-code-agent-admission.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "LCA Code Agent admission"
          git push origin HEAD:admission/lca-code-agent-975
