name: temporary S18Share admission generator

on:
  push:
    branches:
      - admit-s18share-245

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical admission inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/s18share.md')
          text = assessment.read_text(encoding='utf-8')
          old = '\nstatus: proposed\n'
          if old not in text:
              raise SystemExit('S18Share proposal status not found')
          assessment.write_text(text.replace(old, '\nstatus: included\n', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_text = catalog.read_text(encoding='utf-8')
          row = '245|s18share|S18Share|https://github.com/riteshverma/s18|2026-02-10T18:36:30Z|index-addition|139495d15f237dc819265cac913c12ff5cdbeab7|2026-09-25'
          if '|s18share|' in catalog_text:
              raise SystemExit('S18Share already present in catalog')
          catalog.write_text(catalog_text.rstrip('\n') + '\n' + row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          sig_text = signatures.read_text(encoding='utf-8')
          sig = '245|s18share|S18Share closes autonomous S1 through planner-generated specialist DAG execution; whole-run budget regulation plus authenticated stop/resume expose S3=C(P), while graph parallelism, routine verification, split-path REMME adaptation and user soft-identity do not establish S2/S3*/S4/S5.'
          if '|s18share|' in sig_text:
              raise SystemExit('S18Share already present in signatures')
          signatures.write_text(sig_text.rstrip('\n') + '\n' + sig + '\n', encoding='utf-8')
          PY
      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
      - name: Validate generated state
        run: |
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/check_index.py
          python -m unittest discover -s tests -v
      - name: Commit generated admission
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/s18share.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md FULL_A.md METRICS.md data/metrics.json README.md
          git commit -m 'index: admit S18Share [admission-generated]'
          git push
