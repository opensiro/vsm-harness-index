name: Assemble AutoResearchClaw admission

on:
  push:
    branches:
      - index/autoresearchclaw-admission

permissions:
  contents: write

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: index/autoresearchclaw-admission
          fetch-depth: 0

      - name: Canonicalize assessment sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/autoresearchclaw.md')
          text = assessment.read_text(encoding='utf-8')
          assert text.count('status: proposed') == 1, 'expected exactly one proposed lifecycle status'
          assessment.write_text(text.replace('status: proposed', 'status: included', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_text = catalog.read_text(encoding='utf-8')
          assert '|autoresearchclaw|' not in catalog_text, 'autoresearchclaw already in catalog'
          rows = [line for line in catalog_text.splitlines() if line.strip()]
          assert rows[-1].startswith('270|scion-gcp|'), f'unexpected catalog tail: {rows[-1]}'
          catalog_row = '271|autoresearchclaw|AutoResearchClaw|https://github.com/aiming-lab/AutoResearchClaw|2026-03-15T03:38:49Z|index-addition|be4ba4755bf1b52220f25e13b2293b5956590070|2026-09-26'
          catalog.write_text(catalog_text.rstrip('\n') + '\n' + catalog_row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signatures_text = signatures.read_text(encoding='utf-8')
          assert '|autoresearchclaw|' not in signatures_text, 'autoresearchclaw already in signatures'
          signature = 'AutoResearchClaw closes S1 through executable model-driven research, S3 through agent-owned proceed/pivot/refine rollback, S3* through an independent reviewer-to-revision loop, and S4 through literature-to-hypothesis-to-experiment adaptation; no first-party S2 interference-regulation path or S5 identity-policy closure is established.'
          assert len(signature) <= 360
          signatures.write_text(signatures_text.rstrip('\n') + '\n271|autoresearchclaw|' + signature + '\n', encoding='utf-8')
          PY

      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

      - name: Validate canonical state
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/autoresearchclaw-admit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/autoresearchclaw.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md FULL_A.md METRICS.md data/metrics.json README.md .github/workflows/autoresearchclaw-admit.yml
          git commit -m 'index: canonicalize AutoResearchClaw admission'
          git push origin HEAD:index/autoresearchclaw-admission
