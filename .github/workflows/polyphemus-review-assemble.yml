name: assemble-polyphemus-review

on:
  push:
    branches:
      - assessment/polyphemus-review
    paths:
      - .github/workflows/polyphemus-review-assemble.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment/polyphemus-review
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render derived metrics
        run: |
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/polyphemus-review-assemble.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assessments/polyphemus.md data/metrics.json METRICS.md README.md .github/workflows/polyphemus-review-assemble.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "assessment: assemble Polyphemus review"
          git push origin HEAD:assessment/polyphemus-review
