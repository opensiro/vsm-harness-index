name: stage harness-bench S3star evidence
on:
  push:
    branches: [experiment/harness-bench-s3star-485]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage harness-bench S3star evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('experiments/functional-capability-depth')
          revision = 'f2fb12cc28ac90dce6eba873788b5632d6fc5431'
          benchmark_id = 'harness-bench-adversarial-review'
          observation_id = 'harness-bench-pilot4-review-revise-reverify-2026-07'

          # Preserve compact one-entry-per-line formatting in the benchmark map.
          path = root / 'vsm-benchmark-family-map' / 'map.json'
          text = path.read_text()
          if benchmark_id not in text:
              marker = '    {"function":"S4","benchmark_id":"a-evolve-harness-evolution"'
              if marker not in text:
                  raise SystemExit('S4 insertion marker missing from benchmark map')
              entry = (
                  '    {"function":"S3*","benchmark_id":"harness-bench-adversarial-review",'
                  '"benchmark_name":"harness-bench adversarial review-revision evaluation",'
                  '"fit":"direct",'
                  '"primary_source":"https://github.com/tdrml/harness-bench/blob/' + revision + '/runner/run-pilot4.mjs",'
                  '"evaluated_object":"benchmark-defined coding organization in which a separate adversarial reviewer inspects the candidate diff and repository, returns REQUEST_CHANGES findings to the original executor session, the producer revises, and build, visible tests and held-out verification re-check the revised state",'
                  '"evaluation_mode":"execution-grounded",'
                  '"system_linkage":"benchmark-scaffolded",'
                  '"non_claim":"The benchmark authors state that this reviewer/harness is a clean-room benchmark implementation of production patterns rather than production Telos code; the result is direct composed S3* evidence and must not be attributed as native S3* capability of Telos, Claude Code, or another canonical harness."},\n'
              )
              text = text.replace(marker, entry + marker, 1)
              path.write_text(text)

          # Reviewed-family inventory stays synchronized with the map.
          path = root / 'primary-baselines.json'
          data = json.loads(path.read_text())
          reviewed = data['functions']['S3*']['reviewed_direct_families']
          if not any(e.get('benchmark_id') == benchmark_id for e in reviewed):
              reviewed.append({
                  'benchmark_id': benchmark_id,
                  'benchmark_name': 'harness-bench adversarial review-revision evaluation',
                  'primary_source': f'https://github.com/tdrml/harness-bench/tree/{revision}'
              })
          data['functions']['S3*']['blocking_reason'] = (
              'Reviewed direct S3* families close complementary audit and corrective-return loops at composed or benchmark-defined boundaries, '
              'including controlled reviewer-to-revision-to-reverification evidence, but public evidence does not yet provide a matched comparison '
              'of native S3* implementations across canonical harnesses.'
          )
          path.write_text(json.dumps(data, indent=2) + '\n')

          # Raw composed observation: store the published metrics/closure once.
          path = root / 's3star-system-benchmarks' / 'benchmark_observations.json'
          observations = json.loads(path.read_text())
          if not any(o.get('observation_id') == observation_id for o in observations):
              observations.append({
                  'observation_id': observation_id,
                  'function': 'S3*',
                  'benchmark_id': benchmark_id,
                  'benchmark_fit': 'direct',
                  'evidence_source_class': 'first-party-reported',
                  'boundary_class': 'composed-system',
                  'canonical_harness_id': None,
                  'canonical_system_eligible': False,
                  'system_compatibility': 'benchmark-scaffolded',
                  'reviewed_system_revision': revision,
                  'benchmark': 'harness-bench Pilot 4 planning-tier ablation',
                  'target_repository': 'tdrml/telos',
                  'target_repository_revision': 'c62bcf6420c24c7e43c078d72aade6afcf25a765',
                  'executor_model': 'claude-haiku-4-5-20251001',
                  'planner_model': 'claude-sonnet-5',
                  'task': 'L2',
                  'arm': 'FULL',
                  'reported_reviewed_runs': 2,
                  'reported_request_changes_runs': 2,
                  'reported_revision_runs': 2,
                  'post_revision_build_green_runs': 2,
                  'post_revision_visible_green_runs': 2,
                  'post_revision_holdout_pass_runs': 2,
                  'post_revision_success_runs': 2,
                  'audit_loop': [
                      'executor produces a candidate repository change and completion contract',
                      'a separate adversarial reviewer inspects the diff and repository against the task',
                      'reviewer emits REQUEST_CHANGES plus concrete discrepancy findings',
                      'the runner returns those findings to the original executor session',
                      'the executor performs one revision round',
                      'the benchmark independently reruns build, visible tests and held-out verification on the revised state'
                  ],
                  'comparison_scope_note': 'FULL also contains a deterministic done-gate and schema-forced result contract. The two L2 records establish operation and closure of the complementary review-revision-reverification loop; they are not an isolated causal estimate of reviewer contribution to overall task success.',
                  'publisher_boundary_note': 'The README describes the benchmark reviewer/harness as a minimal clean-room implementation of production patterns rather than production Telos code. No native Telos or Claude Code S3* ownership is inferred.',
                  'vsm_interpretation': 'The observation directly exercises a materially distinct complementary reviewer, discrepancy feedback returned to the producing executor for correction, and independent post-revision verification. The benchmark-defined composed organization owns this S3* loop; no target repository, model, execution substrate, or canonical harness inherits native S3* ownership by association.',
                  'primary_sources': [
                      f'https://github.com/tdrml/harness-bench/blob/{revision}/README.md',
                      f'https://github.com/tdrml/harness-bench/blob/{revision}/runner/run-pilot4.mjs',
                      f'https://github.com/tdrml/harness-bench/blob/{revision}/results/pilot4.jsonl'
                  ]
              })
          path.write_text(json.dumps(observations, indent=2) + '\n')

          # Coverage case and counts.
          path = root / 's3star-system-benchmarks' / 'coverage.json'
          data = json.loads(path.read_text())
          data['direct_benchmark_family_count'] = 3
          data['composed_direct_observation_count'] = 3
          if data.get('canonical_direct_observation_count') != 0:
              raise SystemExit('canonical direct S3* registry unexpectedly non-empty')
          case_id = 'harness-bench-adversarial-review-direct-composed'
          if not any(c.get('case_id') == case_id for c in data['cases']):
              insert_at = next(i for i, c in enumerate(data['cases']) if c.get('case_id') == 'swe-agent-swebench-native-proxy-s3star')
              data['cases'].insert(insert_at, {
                  'case_id': case_id,
                  'benchmark': 'harness-bench adversarial review-revision evaluation',
                  'benchmark_fit': 'direct',
                  'coverage_class': 'direct-composed',
                  'system_compatibility': 'benchmark-scaffolded',
                  'canonical_harness_id': None,
                  'primary_sources': [
                      f'https://github.com/tdrml/harness-bench/blob/{revision}/README.md',
                      f'https://github.com/tdrml/harness-bench/blob/{revision}/runner/run-pilot4.mjs',
                      f'https://github.com/tdrml/harness-bench/blob/{revision}/results/pilot4.jsonl'
                  ],
                  'finding': 'harness-bench Pilot 4 directly closes a benchmark-defined complementary audit loop: an adversarial reviewer independently challenges the producer diff, two published L2 FULL runs return REQUEST_CHANGES findings into the original executor session, both execute a revision, and build plus visible and held-out verification pass afterward. The benchmark explicitly uses a clean-room harness rather than production Telos code, so this is composed direct S3* evidence and not native evidence for Telos, Claude Code, or another canonical harness.',
                  'admitted_to_canonical_registry': False
              })
          path.write_text(json.dumps(data, indent=2) + '\n')

          # Extend the fail-closed S3* validator.
          path = root / 's3star-system-benchmarks' / 'validate.py'
          s = path.read_text()
          s = s.replace(
              'DIRECT_S3STAR = {"truecall-runtime-verification", "swe-review"}',
              'DIRECT_S3STAR = {"truecall-runtime-verification", "swe-review", "harness-bench-adversarial-review"}'
          )
          s = s.replace(
              '    "swe-review-generate-review-revise-2026-07",\n}',
              '    "swe-review-generate-review-revise-2026-07",\n    "harness-bench-pilot4-review-revise-reverify-2026-07",\n}'
          )
          s = s.replace(
              '    "swe-review-direct-composed",\n    "swe-agent-swebench-native-proxy-s3star",',
              '    "swe-review-direct-composed",\n    "harness-bench-adversarial-review-direct-composed",\n    "swe-agent-swebench-native-proxy-s3star",'
          )
          anchor = '''    if "SWE-bench" not in str(swe_review.get("reverification_surface")):\n        fail("SWE-Review observation must preserve independent SWE-bench re-verification")\n'''
          addition = '''\n    harness_bench = observations_by_id["harness-bench-pilot4-review-revise-reverify-2026-07"]\n    if harness_bench.get("benchmark_id") != "harness-bench-adversarial-review":\n        fail("harness-bench observation benchmark linkage drift")\n    if harness_bench.get("reviewed_system_revision") != "f2fb12cc28ac90dce6eba873788b5632d6fc5431":\n        fail("harness-bench reviewed revision drift")\n    for field in (\n        "reported_reviewed_runs",\n        "reported_request_changes_runs",\n        "reported_revision_runs",\n        "post_revision_build_green_runs",\n        "post_revision_visible_green_runs",\n        "post_revision_holdout_pass_runs",\n        "post_revision_success_runs",\n    ):\n        if harness_bench.get(field) != 2:\n            fail(f"harness-bench Pilot 4 closure count drift: {field}")\n    harness_loop = harness_bench.get("audit_loop")\n    if not isinstance(harness_loop, list) or len(harness_loop) < 6:\n        fail("harness-bench observation must preserve review-revise-reverify loop")\n    if "held-out verification" not in " ".join(harness_loop):\n        fail("harness-bench observation must preserve independent held-out re-verification")\n    if "clean-room" not in str(harness_bench.get("publisher_boundary_note")):\n        fail("harness-bench must preserve clean-room/non-Telos-native boundary")\n'''
          if addition.strip() not in s:
              if anchor not in s:
                  raise SystemExit('validator SWE-Review anchor missing')
              s = s.replace(anchor, anchor + addition, 1)
          s = s.replace(
              'for case_id in ("truecall-tau2-direct-composed", "swe-review-direct-composed"):',
              'for case_id in ("truecall-tau2-direct-composed", "swe-review-direct-composed", "harness-bench-adversarial-review-direct-composed"):'
          )
          path.write_text(s)
          PY

          python experiments/functional-capability-depth/render_function_baselines.py
          python experiments/functional-capability-depth/s3star-system-benchmarks/validate.py
          python experiments/functional-capability-depth/render_function_baselines.py --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/functional-capability-depth/vsm-benchmark-family-map/map.json \
                  experiments/functional-capability-depth/primary-baselines.json \
                  experiments/functional-capability-depth/s3star-system-benchmarks/benchmark_observations.json \
                  experiments/functional-capability-depth/s3star-system-benchmarks/coverage.json \
                  experiments/functional-capability-depth/s3star-system-benchmarks/validate.py \
                  experiments/functional-capability-depth/FUNCTION-BASELINES.md
          if ! git diff --cached --quiet; then
            git commit -m 'experiment: add harness-bench direct S3star evidence'
            git push
          fi
