name: assemble-grit-exclusion

on:
  push:
    branches:
      - admission/grit-exclusion

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admission/grit-exclusion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble canonical exclusion
        shell: bash
        run: |
          set -euo pipefail
          row='285|grit|Grit|https://github.com/rtk-ai/grit|2026-03-17T13:29:09Z|index-addition|0f3c9d04abe9525b1884f3a0ade890e54a6d9ffe|2026-09-27'
          if ! grep -Fqx "$row" data/catalog.psv; then
            printf '%s\n' "$row" >> data/catalog.psv
          fi

          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python experiments/functional-capability-depth/render_function_baselines.py --check
          python experiments/functional-capability-depth/render_evidence_frontier.py --check
          python experiments/functional-capability-depth/s2-system-benchmarks/validate.py

          rm .github/workflows/grit-exclusion-assemble.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/grit.md data/catalog.psv METRICS.md data/metrics.json README.md .github/workflows/grit-exclusion-assemble.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'index: assemble Grit canonical exclusion'
          git push origin HEAD:admission/grit-exclusion
