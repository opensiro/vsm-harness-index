name: Regenerate Henterprise correction views

on:
  push:
    branches:
      - assessment/henterprise-same-ref-correction

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment/henterprise-same-ref-correction
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update cohort signature and generated views
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("data/signatures.psv")
          lines = path.read_text(encoding="utf-8").splitlines()
          replacement = (
              "129|henterprise|Henterprise's supported single-profile mode lets one autonomous Hermes actor "
              "close portfolio/current control, external/future adaptation and executive identity/policy across "
              "the full skill tree; dependency coordination and independent reviewer audit remain constructor "
              "paths because they require distinct departmental/reviewer actors and cross-profile closure."
          )
          matches = [i for i, line in enumerate(lines) if line.startswith("129|henterprise|")]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one Henterprise signature row, found {len(matches)}")
          lines[matches[0]] = replacement
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
      - name: Commit regenerated corpus views
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signatures.psv TLDR.md RANKINGS.md FULL_A.md METRICS.md data/metrics.json README.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Regenerate views for Henterprise correction"
          git push origin HEAD:assessment/henterprise-same-ref-correction
