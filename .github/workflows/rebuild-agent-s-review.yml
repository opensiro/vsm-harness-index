name: rebuild Agent S review

on:
  push:
    branches:
      - assess-agent-s-126-20260919

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate review projections
        run: |
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
      - name: Validate review tree
        run: |
          python scripts/check_index.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python -m unittest discover -s tests -v
      - name: Commit regenerated review artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add METRICS.md README.md
          git diff --cached --quiet || git commit -m 'chore: refresh Agent S review projections'
          git push
      - name: Remove temporary assembler
        run: |
          git rm .github/workflows/rebuild-agent-s-review.yml
          git commit -m 'chore: remove Agent S review assembler'
          git push
