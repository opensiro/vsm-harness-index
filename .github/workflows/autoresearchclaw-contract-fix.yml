name: Fix AutoResearchClaw S3 contract shape

on:
  push:
    branches:
      - assessment/autoresearchclaw-review

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assessment/autoresearchclaw-review
          fetch-depth: 0

      - name: Add required positive-S3 witness labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assessments/autoresearchclaw.md')
          text = path.read_text(encoding='utf-8')
          needle = """- Decision owner: the model-driven Stage 15 research-decision actor (or the model-driven requirements gate in maintained domain-agent modes).\n- Supporting / enforcement mechanisms: result analysis, experiment diagnosis, quality/ablation hints, decision parsing/structured artifacts, deterministic rollback map, versioned rollback state, pivot budget and recursive pipeline re-entry.\n"""
          replacement = """- Decision owner: the model-driven Stage 15 research-decision actor (or the model-driven requirements gate in maintained domain-agent modes).\n- Whole-system current view: Stage 15 receives the active project's result analysis together with experiment-diagnosis findings, refine-cycle state, requirements verdicts where applicable and ablation/quality signals, giving the decision actor a current view of whether the research project is ready to proceed or requires intervention.\n- Current-control decision scope: decide whether the active project keeps its current commitment and proceeds to paper production, reopens experiment execution/refinement, or pivots to earlier research work; `runner.py` maps the selected decision to continuation or a concrete rollback target that changes subsequent current operation.\n- Supporting / enforcement mechanisms: result analysis, experiment diagnosis, quality/ablation hints, decision parsing/structured artifacts, deterministic rollback map, versioned rollback state, pivot budget and recursive pipeline re-entry.\n"""
          if needle not in text:
              raise SystemExit('expected S3 insertion point not found')
          if 'Whole-system current view:' in text or 'Current-control decision scope:' in text:
              raise SystemExit('required S3 fields already present')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/autoresearchclaw-contract-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/autoresearchclaw.md .github/workflows/autoresearchclaw-contract-fix.yml
          git commit -m 'assessment: complete AutoResearchClaw S3 witness'
          git push origin HEAD:assessment/autoresearchclaw-review
