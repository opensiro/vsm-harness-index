name: temporary NanoHarness admission generator

on:
  push:
    branches:
      - admit-nanoharness-242

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical admission inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/nanoharness.md')
          text = assessment.read_text(encoding='utf-8')
          old = '\nstatus: proposed\n'
          if old not in text:
              raise SystemExit('NanoHarness proposal status not found')
          assessment.write_text(text.replace(old, '\nstatus: included\n', 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_text = catalog.read_text(encoding='utf-8')
          row = '242|nanoharness|NanoHarness|https://github.com/semi-hollow/NanoHarness|2026-04-29T08:59:15Z|index-addition|70a0285383630e78c31ea65023fe5e1e48b6f7dd|2026-09-25'
          if '|nanoharness|' in catalog_text:
              raise SystemExit('NanoHarness already present in catalog')
          catalog.write_text(catalog_text.rstrip('\n') + '\n' + row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          sig_text = signatures.read_text(encoding='utf-8')
          sig = '242|nanoharness|NanoHarness closes autonomous S1 through its canonical model/tool AgentLoop, S2 through model-authored LIVE semantic handoffs between isolated workers, and S3* through a separate read-only Finalizer over the integrated candidate; deterministic fanout scheduling/integration provides S3=C, while memory/evaluation and policy surfaces do not establish S4/S5.'
          if '|nanoharness|' in sig_text:
              raise SystemExit('NanoHarness already present in signatures')
          signatures.write_text(sig_text.rstrip('\n') + '\n' + sig + '\n', encoding='utf-8')
          PY
      - name: Render canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
      - name: Validate generated state
        run: |
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/check_index.py
          python -m unittest discover -s tests -v
      - name: Commit generated admission
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/nanoharness.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md FULL_A.md METRICS.md data/metrics.json README.md
          git commit -m 'index: admit NanoHarness [admission-generated]'
          git push
