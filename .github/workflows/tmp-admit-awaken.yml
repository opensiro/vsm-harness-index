name: temporary Awaken admission generator

on:
  push:
    branches:
      - admit-awaken-240

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical admission and render
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/awaken.md')
          text = assessment.read_text(encoding='utf-8')
          if 'status: proposed\n' in text:
              text = text.replace('status: proposed\n', 'status: included\n', 1)
              assessment.write_text(text, encoding='utf-8')
          elif 'status: included\n' not in text:
              raise SystemExit('unexpected Awaken assessment status')

          catalog = Path('data/catalog.psv')
          catalog_row = '240|awaken|Awaken|https://github.com/awakenworks/awaken|2026-02-04T09:29:19Z|index-addition|2b0d375004ec8723cf40d8a59c0bb486ebce57e0|2026-09-25'
          catalog_text = catalog.read_text(encoding='utf-8').rstrip('\n')
          if '|awaken|' not in catalog_text:
              catalog.write_text(catalog_text + '\n' + catalog_row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signature_row = "240|awaken|Awaken closes autonomous S1 through its model/tool/observation loop; durable mailbox scheduling, recovery and interrupt control provide S3=C(P) with a shipped operator current-control mode, while messaging/handoff, eval/replay, configuration and prompt/policy surfaces do not establish S2/S3*/S4/S5."
          sig_text = signatures.read_text(encoding='utf-8').rstrip('\n')
          if '|awaken|' not in sig_text:
              signatures.write_text(sig_text + '\n' + signature_row + '\n', encoding='utf-8')
          PY

          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py

          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/check_index.py
          python -m unittest discover -s tests -v

      - name: Commit generated admission
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assessments/awaken.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md analytics/temporal.md METRICS.md data/metrics.json README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'index: admit Awaken canonical assessment'
          git push
