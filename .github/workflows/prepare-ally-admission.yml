name: Prepare Ally admission

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'admission/ally-975'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply canonical admission and render projections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path("assessments/ally.md")
          text = assessment.read_text(encoding="utf-8")
          assert "status: proposed" in text
          assessment.write_text(text.replace("status: proposed", "status: included", 1), encoding="utf-8")

          catalog = Path("data/catalog.psv")
          c = catalog.read_text(encoding="utf-8").rstrip("\n")
          row = "377|ally|Ally|https://github.com/Bronya0/ally-agent|2026-07-12T07:12:31Z|index-addition|dafc35cdc2ff1bae6b89b0f9398448f752fc418d|2026-09-29"
          assert "|ally|" not in c
          catalog.write_text(c + "\n" + row + "\n", encoding="utf-8")

          signatures = Path("data/signatures.psv")
          s = signatures.read_text(encoding="utf-8").rstrip("\n")
          signature = "377|ally|Ally closes autonomous coding S1 through its shipped model/tool loop and constructor-owned S2 through shared-workspace write serialization plus stale-snapshot rejection returned to concurrent sub-agent loops; delegation/status/budgets do not establish S3, ordinary validation and generic sub-agents do not establish complementary S3*, memory/web/scheduling do not close prospective S4, and authored safety/tool policy does not establish S5."
          assert "|ally|" not in s
          signatures.write_text(s + "\n" + signature + "\n", encoding="utf-8")
          PY

          python scripts/render_tldr.py
          python scripts/render_analytics.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          rm .github/workflows/prepare-ally-admission.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ally admission"
          git push origin HEAD:admission/ally-975
