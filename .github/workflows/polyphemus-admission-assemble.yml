name: assemble-polyphemus-admission

on:
  push:
    branches:
      - index/polyphemus-admission-289
    paths:
      - .github/workflows/polyphemus-admission-assemble.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: index/polyphemus-admission-289
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply canonical admission inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path('assessments/polyphemus.md')
          text = assessment.read_text(encoding='utf-8')
          old = 'status: proposed'
          new = 'status: included'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one {old!r}, got {text.count(old)}')
          assessment.write_text(text.replace(old, new, 1), encoding='utf-8')

          catalog = Path('data/catalog.psv')
          catalog_text = catalog.read_text(encoding='utf-8')
          row = '289|polyphemus|Polyphemus|https://github.com/polyphemus-ai/release-rehearsal|2026-09-24T00:04:36Z|index-addition|02020f3bc2829c350fd726273a7721254068925f|2026-09-28'
          if '|polyphemus|' in catalog_text:
              raise SystemExit('polyphemus already present in catalog')
          if not catalog_text.rstrip().endswith('288|openrig|OpenRig|https://github.com/mvschwarz/openrig|2026-04-01T06:22:40Z|index-addition|c8fca9d5c436e5357807e05254bf6735613eea3f|2026-09-28'):
              raise SystemExit('catalog tail changed; fail closed')
          catalog.write_text(catalog_text.rstrip() + '\n' + row + '\n', encoding='utf-8')

          signatures = Path('data/signatures.psv')
          signatures_text = signatures.read_text(encoding='utf-8')
          sig = ('289|polyphemus|Polyphemus closes autonomous S1 through model-driven sessions, '
                 'constructor-owned S2 through shared-thread history repair, autonomous S3* through '
                 'an independent exact-head reviewer with corrective return, and parent-governed S5 '
                 'through operator-approved project rules; no whole-project S3 or external-prospective '
                 'S4 loop is established.')
          if '|polyphemus|' in signatures_text:
              raise SystemExit('polyphemus already present in signatures')
          signatures.write_text(signatures_text.rstrip() + '\n' + sig + '\n', encoding='utf-8')
          PY
      - name: Regenerate canonical projections
        run: |
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python -m unittest discover -s tests -v
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/polyphemus-admission-assemble.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "index: admit Polyphemus"
          git push origin HEAD:index/polyphemus-admission-289
