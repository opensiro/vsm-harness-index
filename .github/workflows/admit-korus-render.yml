name: admit korus render
on:
  push:
    branches: [admit-korus-216]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit and render
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('assessments/korus.md')
          s = p.read_text()
          if 'status: proposed' not in s:
              raise SystemExit('assessment is not proposed')
          s = s.replace('status: proposed', 'status: included', 1)
          s = s.replace('## Proposed standalone result', '## Standalone result', 1)
          p.write_text(s)

          cat = Path('data/catalog.psv')
          text = cat.read_text()
          row = '216|korus|Korus|https://github.com/surefire-ai/korus|2026-04-16T09:21:59Z|index-addition|ed5ea6a9fca86f43df161a100e913c29fa9b40c9|2026-09-24'
          if row not in text:
              cat.write_text(text.rstrip() + '\n' + row + '\n')

          sig = Path('data/signatures.psv')
          text = sig.read_text()
          row = '216|korus|Korus runs autonomous first-party Eino model/tool S1 loops and exposes a shipped AgentEvaluation S3* constructor that independently exercises target revisions against datasets, evaluators, thresholds and optional baselines and returns gate/report feedback; SubAgent routing and workflow sequencing do not establish S2, deterministic reconcile/retry/cancel lifecycle does not establish S3, task-local reflection and evaluation evidence do not close S4, and externally authored policy constraints do not establish S5.'
          if row not in text:
              sig.write_text(text.rstrip() + '\n' + row + '\n')
          PY
          python scripts/render_tldr.py
          python scripts/render_full_a.py
          python scripts/render_metrics.py
          python scripts/sync_metrics_readme.py
          python scripts/check_index.py
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assessments/korus.md data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md METRICS.md README.md analytics/temporal.md data/metrics.json
          git commit -m 'admit: render Korus canonical inclusion'
          git push
