name: prepare-batch-28-tranche-b

on:
  push:
    branches:
      - batch-28-tranche-b-assessments
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare corpus inputs
        run: python .tmp_prepare_batch_28_tranche_b.py
      - name: Fetch released Methodology 0.3.4
        run: git clone --depth 1 --branch v0.3.4 https://github.com/opensiro/vsm-harness-skills.git /tmp/vsm-harness-skills
      - name: Check assessment structural contract
        run: >-
          python /tmp/vsm-harness-skills/scripts/check_assessment_contract.py
          assessments/chief.md
          assessments/paperclip.md
          assessments/lobehub.md
          assessments/parlant.md
          assessments/maestro.md
      - name: Render deterministic cohort views
        run: python scripts/render_tldr.py
      - name: Check index
        run: python scripts/check_index.py
      - name: Check live discovery queue deduplication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_discovery_queues.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check generated views
        run: python scripts/render_tldr.py --check
      - name: Check immutable generation provenance
        run: python scripts/check_generation_provenance.py --base-ref e7e949d44dbe4f440ff6ff73d380893b661b9351
      - name: Commit prepared corpus
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assessments data/catalog.psv data/signatures.psv TLDR.md RANKINGS.md
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Prepare tranche B assessments from batch #28"
            git push
          fi
