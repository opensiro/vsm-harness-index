name: Agentlas review materializer

on:
  push:
    branches:
      - assessment/agentlas-os-review-1015

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated review patch
        env:
          PATCH_GZ_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, os, pathlib
          data = gzip.decompress(base64.b64decode(os.environ['PATCH_GZ_B64']))
          pathlib.Path('/tmp/agentlas-review.patch').write_bytes(data)
          PY
          git apply /tmp/agentlas-review.patch
          rm .github/workflows/agentlas-review-materialize.yml
      - name: Validate repository state
        run: |
          python scripts/validate_tldr.py
          python scripts/render_tldr.py --check
          python scripts/render_full_a.py --check
          python scripts/render_metrics.py --check
          python scripts/sync_metrics_readme.py --check
          python scripts/render_analytics.py --check
          python scripts/check_index.py
          python -m unittest discover -s tests
          git diff --check
      - name: Commit materialized review
        run: |
          git config user.name "xLagerFeuer"
          git config user.email "41616537+xLagerFeuer@users.noreply.github.com"
          git add -A
          git commit -m "assessment: add Agentlas OS review"
          git push origin HEAD
