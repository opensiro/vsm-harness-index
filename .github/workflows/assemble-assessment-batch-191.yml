name: assemble assessment batch 191

on:
  push:
    branches:
      - assessment-batch-191-proposed

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import reviewed assessment artifacts
        shell: bash
        run: |
          set -euo pipefail
          declare -A sources=(
            [xcientist.md]=assessment-xcientist-191
            [data-to-paper.md]=assessment-data-to-paper-191
            [ai-scientist-v2.md]=assessment-ai-scientist-v2-191
            [ai-scientist.md]=assessment-ai-scientist-191
            [agent-laboratory.md]=assessment-agent-laboratory-191
            [kadath.md]=assessment-kadath-191
            [omniscientist.md]=assessment-omniscientist-191
            [cais.md]=assessment-cais-191
            [openags.md]=assessment-openags-191
            [veritas.md]=assessment-veritas-191
          )

          for file in "${!sources[@]}"; do
            branch="${sources[$file]}"
            git fetch --no-tags origin "$branch:refs/remotes/origin/$branch"
            git show "refs/remotes/origin/$branch:assessments/$file" > "assessments/$file"
            python - "$file" <<'PY'
          from pathlib import Path
          import sys

          path = Path("assessments") / sys.argv[1]
          text = path.read_text(encoding="utf-8")
          old = "status: included\n"
          if text.count(old) != 1:
              raise SystemExit(f"{path}: expected exactly one {old.strip()!r}, found {text.count(old)}")
          path.write_text(text.replace(old, "status: proposed\n", 1), encoding="utf-8")
          PY
          done

      - name: Verify only lifecycle status changed from reviewed PR blobs
        shell: bash
        run: |
          set -euo pipefail
          declare -A sources=(
            [xcientist.md]=assessment-xcientist-191
            [data-to-paper.md]=assessment-data-to-paper-191
            [ai-scientist-v2.md]=assessment-ai-scientist-v2-191
            [ai-scientist.md]=assessment-ai-scientist-191
            [agent-laboratory.md]=assessment-agent-laboratory-191
            [kadath.md]=assessment-kadath-191
            [omniscientist.md]=assessment-omniscientist-191
            [cais.md]=assessment-cais-191
            [openags.md]=assessment-openags-191
            [veritas.md]=assessment-veritas-191
          )
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for file in "${!sources[@]}"; do
            branch="${sources[$file]}"
            git show "refs/remotes/origin/$branch:assessments/$file" \
              | sed '0,/^status: included$/s//status: proposed/' \
              > "$tmp/$file"
            diff -u "$tmp/$file" "assessments/$file"
          done

      - name: Commit assembled review batch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/assemble-assessment-batch-191.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assessments .github/workflows/assemble-assessment-batch-191.yml
          git commit -m "assessment: stage research batch 191 for review"
          git push origin HEAD:assessment-batch-191-proposed
